# Build viu as its own package.
#
# viu renders images inline in a session (sixel). It was installed once by hand
# with `cargo install`, which is the kind of knowledge this pipeline is meant to
# stop keeping in someone's memory. The sixel feature is not on by default.
name: viu

on:
  workflow_dispatch:
    inputs:
      crate_version:
        description: 'viu crate version to build'
        required: true
        default: '1.6.1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: build
        run: |
          set -euo pipefail
          # 1.5.1 has no icy_sixel feature -- it arrived later, and the version
          # running on the devvm today (1.6.1) carries icy_sixel 0.1.3. --locked
          # is deliberately absent: a yanked transitive crate would fail the
          # build for no benefit, and nothing here pins versions.
          cargo install viu --version "${{ inputs.crate_version }}" --features icy_sixel --root "$PWD/viu-root"

      # Sixel is the entire reason this package exists (ADR-0004): without it a
      # session renders images as nothing. The feature is off by default
      # upstream, so a silent flag change would otherwise ship a viu that cannot
      # draw, and nothing downstream would notice.
      - name: prove sixel is compiled in
        run: |
          set -euo pipefail
          if ! strings viu-root/bin/viu | grep -qi 'icy_sixel'; then
            echo "the built viu has no sixel encoder; images would not render" >&2
            exit 1
          fi
          echo "sixel encoder present"

      - name: package
        run: |
          set -euo pipefail
          VERSION="${{ inputs.crate_version }}"
          TREE=out/viu-pkg
          mkdir -p "$TREE/usr/local/bin" "$TREE/DEBIAN"
          install -m 0755 viu-root/bin/viu "$TREE/usr/local/bin/viu"
          {
            printf 'Package: viu\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Architecture: amd64\n'
            printf 'Maintainer: Viktor Barzin <me@viktorbarzin.me>\n'
            printf 'Description: Terminal image viewer with sixel support\n'
            printf ' Built with the icy_sixel feature, which is off by default upstream and\n'
            printf ' is what makes images render inline in a session.\n'
          } > "$TREE/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$TREE" "out/viu_${VERSION}_amd64.deb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: publish
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_DEB_UPLOAD_URL: ${{ secrets.FORGEJO_DEB_UPLOAD_URL }}
        run: |
          # A version here is derived from its inputs (upstream tag + commit, or
          # the crate version), so re-running on an unchanged commit re-uploads
          # an identical artefact and the registry answers 409. That is "already
          # published", not a failure. Any OTHER status still fails the job.
          code=$(curl -s -o /dev/null -w '%{http_code}' --user "${FORGEJO_USER}:${FORGEJO_GIT_TOKEN}" \
            --upload-file "out/viu_${VERSION}_amd64.deb" \
            "${FORGEJO_DEB_UPLOAD_URL}")
          case "$code" in
            2*)  echo "published ($code)" ;;
            409) echo "already published at this version ($code)" ;;
            *)   echo "upload failed with $code" >&2; exit 1 ;;
          esac
