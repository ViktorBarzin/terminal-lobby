name: container

# The single-user image, for anyone running terminal-lobby who is not this
# homelab. The .deb is the path for a real machine; this is the path for
# "let me see what it does".
#
# Built here rather than in-cluster: CI compute is external by ADR-0002, and
# Woodpecker is deploy-only.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label. Woodpecker's ci-route sets it (infra ci/route).
        type: string
        default: ubuntu-latest

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The smoke test runs against the image BEFORE it is pushed, so a broken
      # one is never published. It is the only automated check on the container,
      # and it exists for the tmux systemd-scope fallback in particular.
      - name: build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: terminal-lobby:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: IMAGE=terminal-lobby:ci ./docker/smoke.sh --no-build

      # ghcr rejects a tag with any uppercase in it, and github.repository_owner
      # keeps the account's real casing. There is no lowercase function in
      # workflow expressions, so it is computed here.
      - name: lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit as well as latest, so a report of "the container
      # is broken" can name a build.
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/terminal-lobby:latest
            ghcr.io/${{ steps.owner.outputs.name }}/terminal-lobby:${{ github.sha }}
          cache-from: type=gha
