# Build the patched terminal server as its own package.
#
# It is slow to build and almost never changes, so it is separate: the lobby's
# hot path should not rebuild a C program on every commit. This runs only when
# its own inputs move.
name: ttyd-devvm

on:
  push:
    branches: [master]
    paths:
      - 'devvm/ttyd-local.patch'
      - 'scripts/build-ttyd.sh'
      - '.github/workflows/ttyd.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake git libwebsockets-dev libjson-c-dev

      # The upstream pin stays. ttyd is not a dependency, it is a PATCH TARGET:
      # the local patch is written against specific lines of src/pty.c and
      # src/http.c, so tracking latest means the patch fails to apply -- or
      # applies with fuzz, which is worse.
      - name: build
        run: ./scripts/build-ttyd.sh --force

      - name: package
        run: |
          set -euo pipefail
          # A bare short sha does not sort, so "1.7.7+$(git rev-parse --short
          # HEAD)" was silently a one-way door. dpkg splits a version into
          # alternating non-digit and digit runs and compares the non-digit run
          # first, where end-of-string sorts below a letter: 1.7.7+02cbf4b is
          # therefore BELOW 1.7.7+c76b116. Measured 2026-09-04 -- four
          # published builds (0dd30bc, 8cb00b1, 67c3beb, 02cbf4b) sat
          # unreachable behind c76b116, apt-cache policy named c76b116 as the
          # candidate, and the box was still running the binary installed on
          # 2026-08-29.
          #
          # +git<date>.<sha> is Debian's snapshot convention and fixes both
          # ends: "git" beats every hex lead on the first non-digit run, and the
          # date that follows is compared numerically, so a commit from a later
          # minute sorts higher whatever its sha is.
          # An epoch was the other candidate and is worse -- 1:1.7.7+<sha>
          # clears today's ceiling and leaves the ordering INSIDE the epoch just
          # as broken, so it would still need a sortable suffix, and then the
          # epoch is only a wart every later version has to carry.
          #
          # The date is the COMMIT's, not the clock's, so re-running this on an
          # unchanged commit publishes the same version and the 409 below stays
          # true. --date=format renders in the offset stored in the commit
          # object, so the string does not depend on the builder's timezone.
          VERSION="1.7.7+git$(git show -s --format=%cd --date=format:%Y%m%d%H%M).$(git rev-parse --short HEAD)"
          TREE=out/ttyd-pkg
          mkdir -p "$TREE/usr/local/bin" "$TREE/DEBIAN"
          install -m 0755 out/ttyd "$TREE/usr/local/bin/ttyd"
          # printf, not a heredoc: inside an indented YAML block the terminator
          # would be indented too, which <<EOF never matches -- and Debian
          # control fields must start at column 0, since an indented line is a
          # field continuation.
          {
            printf 'Package: ttyd-devvm\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Architecture: amd64\n'
            printf 'Maintainer: Viktor Barzin <me@viktorbarzin.me>\n'
            # evlib-uv is a SEPARATE package and ttyd cannot create a
            # libwebsockets context without it. The devvm only has it because
            # ttyd was built there and libwebsockets-dev pulled it in; a clean
            # machine installs the runtime lib alone and ttyd dies at startup
            # with "failed to load evlib_uv". Found on a fresh VM, 2026-08-29.
            printf 'Depends: libwebsockets19t64 | libwebsockets19, libwebsockets-evlib-uv, libjson-c5 | libjson-c\n'
            printf 'Description: ttyd 1.7.7 with the devvm patches\n'
            printf ' Honours the client PAUSE opcode so flow control works, and serves the\n'
            printf ' custom index with an ETag so boots revalidate instead of re-downloading.\n'
            # Worth saying in the package itself: this is the upgrade after
            # which sixel stops rendering, and dpkg is where someone will look.
            printf ' The pixel-size forwarding that let tmux re-emit sixel was removed on\n'
            printf ' 2026-09-04 when the sixel flow was deprecated (ADR-0004); images are\n'
            printf ' viewed in the session library instead.\n'
          } > "$TREE/DEBIAN/control"
          # A ttyd upgrade must restart what runs it; the lobby package does not
          # own this binary and cannot notice it moved.
          {
            printf '#!/bin/sh\n'
            printf 'set -e\n'
            printf '[ "$1" = "configure" ] || exit 0\n'
            printf 'systemctl is-active --quiet ttyd && systemctl restart ttyd || true\n'
          } > "$TREE/DEBIAN/postinst"
          chmod 0755 "$TREE/DEBIAN/postinst"
          dpkg-deb --root-owner-group --build "$TREE" "out/ttyd-devvm_${VERSION}_amd64.deb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: publish
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_DEB_UPLOAD_URL: ${{ secrets.FORGEJO_DEB_UPLOAD_URL }}
        run: |
          # A version here is derived from its inputs (upstream tag + commit, or
          # the crate version), so re-running on an unchanged commit re-uploads
          # an identical artefact and the registry answers 409. That is "already
          # published", not a failure. Any OTHER status still fails the job.
          code=$(curl -s -o /dev/null -w '%{http_code}' --user "${FORGEJO_USER}:${FORGEJO_GIT_TOKEN}" \
            --upload-file "out/ttyd-devvm_${VERSION}_amd64.deb" \
            "${FORGEJO_DEB_UPLOAD_URL}")
          case "$code" in
            2*)  echo "published ($code)" ;;
            409) echo "already published at this version ($code)" ;;
            *)   echo "upload failed with $code" >&2; exit 1 ;;
          esac
