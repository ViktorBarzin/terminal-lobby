# Build and publish the terminal-lobby package.
#
# Builds happen here, off-infra, per infra ADR-0002. Toolchains install at
# latest rather than pinned: artefacts are versioned and immutable, so a version
# is never rebuilt -- 1.4.2 is not rebuilt, 1.4.3 is built. Each package records
# the commit and the toolchains it happened to build with, for forensics.
name: release

on:
  push:
    branches: [master]
    # Skipping paths that cannot change the artefact avoids releasing a version
    # for a typo fix. Anything that reaches this workflow is a code change and
    # gets a version, since the version step passes --always.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/ttyd.yml'
      - '.github/workflows/viu.yml'
      # The container image is built by container.yml out of its own inputs,
      # and packaging/build-deb.sh reads none of them. A push touching only
      # these was cutting a .deb version whose contents had not moved.
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/container.yml'
      - 'scripts/devserve/**'
  workflow_dispatch: {}

permissions:
  contents: write

# Two merges landing close together otherwise resolve the SAME next version,
# both build, and the loser fails at the tag push having consumed a build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # svu needs the whole history and every tag to compute the next version.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }

      # A NUL byte anywhere in a source file makes git call the whole file
      # binary, so `git grep` skips it and says nothing. One file had been
      # invisible to every grep-driven refactor that way. Biome does not see it
      # either, because a NUL in a string is legal JS, so the instrument that
      # catches this is git's own heuristic.
      - name: no binary source files
        run: |
          set -euo pipefail
          binary=$(comm -23 \
            <(git ls-files '*.ts' '*.tsx' '*.js' '*.go' '*.css' | sort) \
            <(git grep -Il '' -- '*.ts' '*.tsx' '*.js' '*.go' '*.css' | sort))
          if [ -n "$binary" ]; then
            echo "git reads these tracked sources as binary, so git grep skips them:"
            echo "$binary"
            exit 1
          fi

      # The tests that exist today start gating releases. They have never run in
      # CI, because there has never been CI. All of them, not only the Go ones:
      # the frontend is where a regression is most likely and least visible, and
      # the backend HTTP probes on the box cannot see it.
      - name: test (go)
        run: |
          set -euo pipefail
          # Derived, not typed. What this replaces was 14 hand-written names
          # guarded by `[ -f "$mod/go.mod" ] || continue`, which skips a name
          # with no module and says nothing about a module with no name. So the
          # guard was loud in the harmless direction and silent in the other:
          # tl-session-watch/go.mod was added 2026-09-01, reached the list
          # 2026-09-04, and four commits landed on the module in between with
          # nothing here compiling or testing it.
          mods=$(git ls-files '*/go.mod' | xargs -n1 dirname | sort)
          # A derivation that returns nothing would pass this job in silence,
          # which is the same hole as the typed list with none of its noise.
          # The floor sits well under 14, so adding or dropping a module needs
          # no edit here, and well over zero, so a broken derivation stops.
          if [ "$(printf '%s\n' "$mods" | grep -c .)" -lt 10 ]; then
            echo "expected at least 10 Go modules, the derivation found:"
            printf '%s\n' "$mods"
            exit 1
          fi
          for mod in $mods; do
            echo "==> $mod"
            (
              cd "$mod"
              # gofmt comes with the toolchain setup-go already installs, so
              # the gate costs no new dependency. Drift is otherwise invisible
              # until it turns up as noise in somebody else's diff.
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then
                echo "not gofmt-clean, fix with: (cd $mod && gofmt -w .)"
                printf '%s\n' "$unformatted"
                exit 1
              fi
              go vet ./...
              # -race, not a bare run. The detector was red in tmux-api for a
              # warmer goroutine that outlived its request, and it stayed
              # quiet about a rate limiter no test had exercised from two
              # goroutines. Both are fixed, so the flag turns on here with
              # them. It costs about 17s on the biggest module against a few
              # seconds without.
              go test -race ./...
            )
          done

      - name: test (frontend)
        run: |
          set -euo pipefail
          cd frontend-v2
          npm ci --include=dev --no-audit --no-fund
          # src AND test. This used to run a src-only config because test/ held
          # 45 errors that would have blocked every release; they were cleared
          # 2026-09-02 and the second config went with them, so there is one
          # answer to "does this typecheck" again.
          npm run typecheck
          # The repo's first linter, added 2026-09-06. It is curated, not
          # recommended: six rules that all measured zero before they were
          # switched on, so this gate arrives green and stays cheap. The full
          # reasoning and the counts for the rules left off are in
          # frontend-v2/biome.jsonc.
          npm run lint
          # Unused value exports. Neither biome nor eslint does this analysis,
          # which is why knip is a second tool rather than a biome rule.
          npm run lint:exports
          # No formatting gate here, on purpose. `npm run format:changed` is a
          # ratchet: it compares against a base ref and checks only the files a
          # branch changed. This workflow runs on pushes to master and nothing
          # else, so its base would be the commit being built and the check
          # would have nothing to compare. Running it here would report a pass
          # on every push while catching nothing, which is a worse signal than
          # no step. It stays a local check contributors run before opening a
          # PR (CONTRIBUTING.md). Wiring it up for real means a workflow that
          # can name the base of the change it is building -- a pull_request
          # trigger, or a push event's `before` sha -- passed as
          # TL_FORMAT_SINCE. That gate is red until the files this repo has
          # already drifted on are formatted, so it lands with that work, not
          # before it.
          npm run test

      - name: test (python)
        run: |
          set -euo pipefail
          # aiohttp because test_qa_harness stubs its own server with it, and
          # pytest-asyncio because five of its cases are async and carry
          # @pytest.mark.asyncio. The 84 cases are self-contained and need no
          # devvm. pytest is also what the build step's baseline gate runs on.
          python3 -m pip install --quiet pytest pytest-asyncio aiohttp
          python3 -m pytest scripts/test_qa_harness.py -q

      # A real browser taps a real notification, and the app has to land on the
      # session the banner named.
      #
      # This gate exists because the cheap version of it does not work.
      # Notification tap routing has been fixed six times since 2026-07-17 and
      # regressed after every one; each fix was verified against a mocked
      # navigator.serviceWorker and a stubbed shade, and that suite stayed green
      # through all six, because what broke was the handshake between a real
      # service worker, a real notification and a real page. So this one serves
      # the built bundle with the shipped public/sw.js, delivers a push through
      # the browser's own plumbing, and dispatches a real NotificationEvent at
      # the shipped handler.
      #
      # It runs after `test (frontend)` because that step's npm ci is what the
      # bundle build here needs; the suite builds frontend-v2/dist itself.
      #
      # `--with-deps` because a bare runner is missing the shared libraries
      # Chromium links against. The suite drives the FULL Chromium in new
      # headless mode, not chromium-headless-shell: measured 2026-09-06, the
      # shell refuses the notifications permission outright, reading "denied" in
      # both page and worker after a grant, so `playwright install chromium` is
      # doing more here than fetching a browser.
      - name: test (notification tap, real browser)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest playwright
          python3 -m playwright install --with-deps chromium
          python3 -m pytest scripts/test_notification_tap_e2e.py -q

      - name: version
        id: version
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/caarlos0/svu/releases/download/v3.4.1/svu_3.4.1_linux_amd64.tar.gz \
            | tar xz svu
          # --tag.pattern because this repo carries one pre-existing tag,
          # v-vanilla-final, which is not semver. svu does not skip it: without
          # the pattern it stops with "invalid semantic version".
          #
          # With the pattern and no semver tags yet it has no baseline to count
          # from, so the first release is named here rather than guessed. The
          # branch is explicit, not an error swallowed with `|| true`: falling
          # back on ANY svu failure could quietly re-release v0.1.0 over a much
          # later version.
          #
          # --always because svu only bumps on feat: and fix:. A push of
          # refactor: or perf: commits otherwise resolves to the tag that is
          # already there, and the tag push below fails with "already exists"
          # -- after the tests, the build and the verify have all passed, and
          # before the deploy. The work then sits on master, built and unshipped,
          # until somebody happens to land a feat: or a fix:. Measured
          # 2026-08-30 on the cleanup that prompted this: svu next said v0.10.0
          # against an existing v0.10.0, and with --always says v0.10.1.
          #
          # Anything reaching this workflow changed a file that can alter the
          # artefact (paths-ignore keeps docs and markdown out), so a version
          # for every run is what we want.
          if git tag --list 'v[0-9]*' | grep -q .; then
            NEXT="$(./svu next --always --tag.pattern 'v[0-9]*')"
          else
            NEXT="v0.1.0"
            echo "no semver tag yet — first release"
          fi
          rm -f svu
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"
          echo "next version: $NEXT"

      - name: build the package
        run: ./packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: verify the package
        run: ./packaging/verify-deb.sh "out/terminal-lobby_${{ steps.version.outputs.version }}_amd64.deb"

      # Forgejo is canonical (ADR-0003); this repo is a one-way mirror, so the
      # tag is pushed back to the forge the code actually lives on.
      - name: tag on the canonical forge
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
          FORGEJO_REPO_PATH: ${{ secrets.FORGEJO_REPO_PATH }}
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push "https://x-access-token:${FORGEJO_GIT_TOKEN}@${FORGEJO_REPO_PATH}" \
            "${{ steps.version.outputs.tag }}"

      - name: publish to the Debian registry
        env:
          FORGEJO_GIT_TOKEN: ${{ secrets.FORGEJO_GIT_TOKEN }}
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_DEB_UPLOAD_URL: ${{ secrets.FORGEJO_DEB_UPLOAD_URL }}
        run: |
          set -euo pipefail
          curl -sSf --user "${FORGEJO_USER}:${FORGEJO_GIT_TOKEN}" \
            --upload-file "out/terminal-lobby_${{ steps.version.outputs.version }}_amd64.deb" \
            "${FORGEJO_DEB_UPLOAD_URL}"

      # THE DEPLOY GOES HERE, directly after the registry the box installs from
      # and BEFORE the off-site copy. Order is the whole point: the box has
      # everything it needs the moment the package is published, and nothing
      # after this step is on the path to shipping.
      #
      # It used to run last, after the GitHub release. On 2026-09-06 that cost
      # a deploy: `gh release create` failed with "tag v0.42.3 exists locally
      # but has not been pushed to ViktorBarzin/terminal-lobby" — the tag goes
      # to Forgejo above, and reaches this mirror only when Forgejo's push
      # mirror syncs, so the two race. The package was already in the Debian
      # registry; the job went red on a backup copy and the box stayed on
      # 0.42.2 until someone ran tl-reconcile by hand. docs/deployment.md's
      # sequence diagram has shown this order since it was drawn.
      #
      # Runners cannot route to the devvm, so the trigger goes through Woodpecker,
      # which is deploy-only by ADR-0002 and already activated on the infra repo.
      #
      # OPT-IN, and it has to stay that way. An inverted default (run unless
      # explicitly false) meant two things went wrong the first time this ran:
      # a fork of this now-public repo would attempt a deploy it holds no
      # secrets for, and master went red here because the trigger fired before
      # anything could answer it.
      #
      # Three things must exist before switching it on, and only the first is a
      # repository change:
      #   1. a WOODPECKER_TOKEN secret (this is what 401'd on 2026-08-29)
      #   2. tl-reconcile installed as a forced command in root's
      #      authorized_keys on the box
      #   3. the apt source on the box
      # See docs/deployment.md. Then:
      #   gh variable set TL_DEPLOY_ENABLED --body true
      - name: trigger the deploy
        if: vars.TL_DEPLOY_ENABLED == 'true'
        env:
          WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
          WOODPECKER_PIPELINE_URL: ${{ secrets.WOODPECKER_PIPELINE_URL }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${WOODPECKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"master","variables":{"PIPELINE":"terminal-lobby-deploy","VERSION":"${{ steps.version.outputs.version }}"}}' \
            "${WOODPECKER_PIPELINE_URL}"

      # Off-site copy, so a cluster outage cannot block repairing the
      # workstation. Last on purpose: it is a backup, and the deploy above must
      # not wait on it. It can still go red on its own — the tag it names
      # arrives here by mirror — but a red step here now costs the release
      # assets and nothing else.
      - name: attach to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two copies of one file. The versioned name is what the registry and
          # a human looking at the release want; the unversioned one is what
          # makes /releases/latest/download/terminal-lobby_amd64.deb resolve,
          # which is the install command the README gives. Without it that URL
          # 404s, because the asset name carries the version.
          cp "out/terminal-lobby_${{ steps.version.outputs.version }}_amd64.deb" \
             "out/terminal-lobby_amd64.deb"
          gh release create "${{ steps.version.outputs.tag }}" \
            "out/terminal-lobby_${{ steps.version.outputs.version }}_amd64.deb" \
            "out/terminal-lobby_amd64.deb" \
            --title "${{ steps.version.outputs.tag }}" --generate-notes
