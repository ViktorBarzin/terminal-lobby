            const noop = () => {};
            return {
                add(r) {
                    recognizers.push({
                        start: r.start || noop,
                        move: r.move || noop,
                        end: r.end || noop,
                        reset: r.reset || noop
                    });
                }
            };
        })();

        if (isCoarsePointer) {
            // Touch behaviour on the terminal canvas:
            //   tap  → focus helper textarea → soft keyboard appears
            //   swipe → dispatch synthetic wheel events on the xterm root.
            //           xterm forwards them to the PTY (tmux has `mouse on`
            //           globally) which scrolls copy-mode. Without this,
            //           there's no way to see scrollback on touch.
            //
            // We defer the focus call to touchend with a movement-threshold
            // check so a swipe never accidentally summons the keyboard.
            (() => {
                let startY = null, lastY = null, moved = false;
                const SWIPE_THRESHOLD = 6;  // px — tap vs. swipe
                terminalEl.addEventListener('touchstart', (e) => {
                    // Momentum (additive, NOT classification): a new touch is a
                    // hard-cancel for any in-flight coast, and resets flick
                    // velocity. The three CLASSIFICATION lines below are
                    // byte-identical to the pre-momentum recognizer.
                    cancelScrollMomentum();
                    scrollAccumPx = 0; scrollSamples = []; scrollEmittedGesture = false;
                    if (e.touches.length !== 1) { startY = lastY = null; return; }
                    startY = lastY = e.touches[0].clientY;
                    moved = false;
                }, { passive: true });
                terminalEl.addEventListener('touchmove', (e) => {
                    if (e.touches.length !== 1 || lastY === null) return;
                    const y = e.touches[0].clientY;
                    const delta = lastY - y;
                    lastY = y;
                    if (!moved && Math.abs(startY - y) > SWIPE_THRESHOLD) moved = true;
                    if (!moved || delta === 0 || !term.element) return;
                    // EMISSION (v2): accumulate finger px → discrete one-row LINE
                    // wheels via feedScroll, and sample (y,t) for the ring-buffer
                    // release velocity. The classification gate above is unchanged
                    // — this only runs once motion is a swipe.
                    // Two clocks per sample: e.timeStamp (event CREATION — true
                    // finger timing, survives coalesced/late delivery on real
                    // iOS) and performance.now() at handling (sane for synthetic
                    // CDP events whose creation stamps batch unreliably). The
                    // touchend stationary-gap takes the MIN of the two — the
                    // flick-favorable reading in both worlds, while a genuine
                    // hold is large on BOTH clocks.
                    scrollSamples.push({ y, t: e.timeStamp, th: performance.now() });
                    if (scrollSamples.length > 24) scrollSamples.shift();
                    scrollLastEmitY = y;
                    scrollEmittedGesture = true;
                    feedScroll(delta);
                }, { passive: true });
                terminalEl.addEventListener('touchend', (e) => {
                    if (!moved && startY !== null) tapFocus();
                    startY = lastY = null;
                    moved = false;
                    // Momentum kickoff (additive): ring-buffer release velocity →
                    // coast. Stationary-lift handling CANNOT rely on "clustered
                    // slow samples": browsers DEDUPE identical-coordinate
                    // touchmoves, so a finger held still produces NO samples and
                    // the buffer ends at the last MOVING sample (measured: the
                    // decel-then-hold leg coasted 4 rows). Use EVENT time
                    // instead: the gap between the newest sample and this
                    // touchend. A real WKWebView flick lifts within ~120ms of
                    // the last (possibly coalesced) move; a deliberate hold is
                    // longer. ≤ GAP_STILL_MS the velocity is only attenuated
                    // smoothly (exp(−gap/τ)) so delivery latency trims a fast
                    // flick but never kills it — v1's binary 80ms trap stays
                    // dead. > GAP_STILL_MS = held still → no coast.
                    if (scrollEmittedGesture && scrollMomentumOn()) {
                        const last = scrollSamples[scrollSamples.length - 1];
                        const gap = last ? Math.max(0, Math.min(
                            e.timeStamp - last.t,
                            performance.now() - last.th)) : Infinity;
                        let v0 = releaseVelocity();
                        if (gap > GAP_STILL_MS) v0 = 0;
                        else v0 *= Math.exp(-gap / GAP_ATTEN_TAU_MS);
                        if (Math.abs(v0) * 1000 / xtermCellH() >= MOMENTUM_MIN_START_ROWS_PER_S)
                            startScrollMomentum(v0);
                    }
                    scrollEmittedGesture = false;
                }, { passive: true });
            })();

            softMods = { ctrl: 'idle', alt: 'idle' };
            const modTimers = { ctrl: null, alt: null };
            const DOUBLE_TAP_MS = 400;

            // Build the toolbar first so paintMod can find buttons by data-mod.
            const toolbar = document.createElement('div');
            toolbar.id = 'soft-keys';
            toolbar.setAttribute('role', 'toolbar');
            toolbar.setAttribute('aria-label', 'Terminal keys');
            // Task IR.3 (Viktor: "way too many buttons"): two-tier layout.
            // DOM order [.sk-row.sk-extra, .sk-line] + the column flex =
            // the overflow tier stacks ABOVE the always-visible line.
            // `row` (the primary tier) keeps its name — Esc ⇧Tab and the
            // arrows live there; everything else moves to `extraRow`,
            // revealed by the pinned ⋯ toggle.
            const extraRow = document.createElement('div');
            extraRow.className = 'sk-row sk-extra';
            const line = document.createElement('div');
            line.className = 'sk-line';
            const row = document.createElement('div');
            row.className = 'sk-row sk-primary';
            toolbar.appendChild(extraRow);
            toolbar.appendChild(line);
            line.appendChild(row);
            // Group/separator chrome (IR.3): .sk-group batches related
            // keys (6px in-group gap); .sk-sep is the hairline between
            // row-2 groups; sk-narrow shaves single-glyph keys so the
            // primary line fits 390px-class screens without scrolling.
            function skGroup(parent) {
                const g = document.createElement('div');
                g.className = 'sk-group';
                parent.appendChild(g);
                return g;
            }
            function skSep(parent) {
                const s = document.createElement('div');
                s.className = 'sk-sep';
                parent.appendChild(s);
            }
            function skNarrow(b) {
                b.classList.add('sk-narrow');
                return b;
            }

            function paintMod(name) {
                const btn = toolbar.querySelector('[data-mod="' + name + '"]');
                if (!btn) return;
                btn.classList.remove('armed', 'latched');
                if (softMods[name] === 'armed')   btn.classList.add('armed');
                if (softMods[name] === 'latched') btn.classList.add('latched');
            }
            function tapMod(name) {
                clearTimeout(modTimers[name]);
                const cur = softMods[name];
                if (cur === 'idle') {
                    // First tap arms; a second tap within DOUBLE_TAP_MS latches.
                    softMods[name] = 'armed';
                    modTimers[name] = setTimeout(() => {
                        if (softMods[name] === 'armed') {
                            softMods[name] = 'idle';
                            paintMod(name);
                        }
                    }, DOUBLE_TAP_MS);
                } else if (cur === 'armed') {
                    softMods[name] = 'latched';
                } else {
                    softMods[name] = 'idle';
                }
                paintMod(name);
            }
            consumeSoftMods = function() {
                // Drop armed → idle, leave latched. Called after every normal key.
                for (const name of ['ctrl', 'alt']) {
                    if (softMods[name] === 'armed') {
                        softMods[name] = 'idle';
                        paintMod(name);
                    }
                }
            };

            // Task M.1 hold-to-repeat engine — a single slot: at most one
            // key repeats at a time (pressing another repeat key takes the
            // slot over). The initial send fires on pointerdown like any
            // key; REPEAT_DELAY_MS later the action re-fires every
            // REPEAT_INTERVAL_MS with a haptic('selection') tick until the
            // hold ends. Opt-outs, both read per press (no reload needed):
            // tl:prefs:v1 gestures.keyRepeat (roamed, settings panel) and
            // the tl-gestures master kill.
            const REPEAT_DELAY_MS = 500, REPEAT_INTERVAL_MS = 60;
            let repeatDelayTimer = null, repeatTicker = null;
            function stopRepeat() {
                clearTimeout(repeatDelayTimer);
                clearInterval(repeatTicker);
                repeatDelayTimer = repeatTicker = null;
            }
            function startRepeat(fire) {
                stopRepeat();
                if (!(gesturesEnabled() && getPrefs().gestures.keyRepeat)) return;
                repeatDelayTimer = setTimeout(() => {
                    repeatTicker = setInterval(() => {
                        try { fire(); } catch (err) { console.error(err); }
                        haptic('selection');   // Task M.7 vocabulary
                    }, REPEAT_INTERVAL_MS);
                }, REPEAT_DELAY_MS);
            }

            // MF-3 (Viktor complaint 1): soft keys fire on TAP-COMMIT, not
            // touch-down. Two wiring disciplines, split on opts.repeat:
            //
            //  - repeat keys (the M.1 arrows + Tab) keep the original
            //    down-fire path byte-for-byte — haptic + onTap + startRepeat
            //    at pointerdown; pointerup/pointercancel/pointerleave
            //    stopRepeat — because hold-to-repeat NEEDS the initial send
            //    at finger-down.
            //  - every OTHER key records {pointerId, clientX, clientY} at
            //    pointerdown and commits at pointerup ONLY if the SAME
            //    pointer travelled < 10px: a horizontal row-scroll swipe
            //    that happens to start on ‹/› must scroll the row, never
            //    switch sessions (probe P3 reproduced the hash flipping
            //    mid-swipe on iPhone-class AND Android emulation; the same
            //    defect class fired Tab/Esc/Paste mid-scroll). A row-scroll
            //    takeover delivers pointercancel, which clears the pending
            //    tap; the pointerleave clear is belt-and-braces for engines
            //    that don't. haptic + the focus re-arm move WITH the action
            //    to the commit point, so an aborted swipe produces no tick
            //    and no keyboard summon. pointerup is still a
            //    user-activation context, so clipboard read (Paste),
            //    term.focus() (Kbd) and compose focus keep working on iOS.
            //
            // BOTH paths preventDefault() at pointerdown: stop the button
            // from taking focus away from the helper textarea (which would
            // collapse the soft keyboard between keystrokes) — the M.10
            // focus-preservation contract, unchanged for ALL keys.
            const TAP_COMMIT_MAX_TRAVEL_PX = 10;

            // MF-2 fix (round 2): a committed tap whose action synchronously
            // opens a full-viewport overlay (🖼 → #img-gallery) mutates the
            // hit-test tree UNDER the still-lifting finger. pointerdown's
            // preventDefault suppresses the compat mousedown/mouseup but NOT
            // the tap-synthesized TRUSTED click, which the browser then
            // targets at the just-opened backdrop — whose click handler
            // closes it. Net effect on real phone taps: the gallery opened
            // for ~3ms and vanished (programmatic .click() drives don't
            // synthesize the trailing click, which false-greened round 1).
            // Overlay-opening keys therefore pass opts.swallowClick, and the
            // commit arms a ONE-SHOT window-capture click swallower — the
            // M.4 armSwallowers precedent — with two deliberate deviations:
            //  - discriminate on e.isTrusted, NOT M.4's detail===0 skip:
            //    the tap-synthesized trusted click measures detail 0 here
            //    (instrumented under CDP touch), so a detail gate would
            //    pass the very click we must swallow. Untrusted clicks
            //    (the row delegates' .click(), dispatched MouseEvents)
            //    always pass through.
            //  - a 700ms safety timeout bounds the armed window: engines
            //    may skip the synthesized click entirely when the content
            //    under the finger changed, and a stale armed flag must
            //    never outlive the tap that armed it (the measured gap is
            //    ~4ms; legacy iOS click delay was 300ms — 700 is margin).
            // The next pointerdown also disarms (M.4 parity), so the
            // backdrop tap that CLOSES the gallery is never affected.
            let skSwallowClick = null, skSwallowDisarm = null, skSwallowTimer = null;
            function disarmTrailingClickSwallow() {
                if (skSwallowClick)  { window.removeEventListener('click', skSwallowClick, true); skSwallowClick = null; }
                if (skSwallowDisarm) { window.removeEventListener('pointerdown', skSwallowDisarm, true); skSwallowDisarm = null; }
                if (skSwallowTimer)  { clearTimeout(skSwallowTimer); skSwallowTimer = null; }
            }
            function armTrailingClickSwallow() {
                disarmTrailingClickSwallow();
                skSwallowClick = (e) => {
                    if (!e.isTrusted) return;   // delegate/battery clicks pass
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    disarmTrailingClickSwallow();
                };
                window.addEventListener('click', skSwallowClick, true);
                skSwallowDisarm = () => disarmTrailingClickSwallow();
                window.addEventListener('pointerdown', skSwallowDisarm, true);
                skSwallowTimer = setTimeout(disarmTrailingClickSwallow, 700);
            }

            function makeBtn(label, onTap, opts) {
                const b = document.createElement('button');
                b.type = 'button';
                // Icon fix: opts.icon renders a Lucide svg INSTEAD of the
                // text label (label may be null then) — purely the face of
                // the key; bytes/aria/tap wiring below are untouched.
                if (opts && opts.icon) {
                    b.classList.add('sk-icon');
                    b.replaceChildren(iconNode(opts.icon, opts.iconPx || 18));
                } else {
                    b.textContent = label;
                }
                if (opts && opts.cls)     b.classList.add(opts.cls);
                if (opts && opts.dataMod) b.setAttribute('data-mod', opts.dataMod);
                if (opts && opts.ariaLabel) b.setAttribute('aria-label', opts.ariaLabel);
                if (opts && opts.repeat) {
                    b.addEventListener('pointerdown', (ev) => {
                        ev.preventDefault();
                        haptic('selection');   // Task M.7: every soft-key tap
                        try { onTap(); } catch (err) { console.error(err); }
                        // Task M.1: arm hold-to-repeat (arrows + Tab) after
                        // the initial send above.
                        startRepeat(onTap);
                        // Re-arm the active input for the next physical
                        // keystroke — but skip on arrows (noFocus) so
                        // tapping a navigation key doesn't summon the
                        // keyboard if it wasn't already up.
                        const skipFocus = b.classList.contains('sk-mod')
                                       || (opts && opts.noFocus);
                        if (!skipFocus) focusActiveInput();
                    });
                    // BOTH cancel events are wired: an OS gesture interrupt
                    // (notification shade, app switch) delivers pointercancel
                    // with NO pointerup — missing either would leave the key
                    // machine-gunning. pointerleave covers mouse holds
                    // dragged off the button (touch pointers are implicitly
                    // captured, so their hold always ends in up/cancel on
                    // the button itself).
                    b.addEventListener('pointerup', stopRepeat);
                    b.addEventListener('pointercancel', stopRepeat);
                    b.addEventListener('pointerleave', stopRepeat);
                } else {
                    // Tap-commit path (see the block comment above).
                    let pending = null;   // {pointerId, clientX, clientY}
                    b.addEventListener('pointerdown', (ev) => {
                        ev.preventDefault();
                        pending = { pointerId: ev.pointerId,
                                    clientX: ev.clientX, clientY: ev.clientY };
                    });
                    b.addEventListener('pointerup', (ev) => {
                        if (!pending || ev.pointerId !== pending.pointerId) return;
                        const travel = Math.hypot(ev.clientX - pending.clientX,
                                                  ev.clientY - pending.clientY);
                        pending = null;
                        if (travel >= TAP_COMMIT_MAX_TRAVEL_PX) return;   // a swipe, not a tap
                        haptic('selection');   // Task M.7: every soft-key tap
                        try { onTap(); } catch (err) { console.error(err); }
                        // Armed AFTER onTap so the delegate's programmatic
                        // .click() inside it never races the swallower (it
                        // would pass the isTrusted gate anyway; see the
                        // helper's block comment).
                        if (opts && opts.swallowClick) armTrailingClickSwallow();
                        // Re-arm the active input for the next physical
                        // keystroke — the compose field while the user was
                        // composing (Task M.10; byte-equivalent term.focus()
                        // otherwise) — but skip on modifiers and arrows so
                        // tapping a navigation key doesn't summon the
                        // keyboard if it wasn't already up.
                        const skipFocus = b.classList.contains('sk-mod')
                                       || (opts && opts.noFocus);
                        if (!skipFocus) focusActiveInput();
                    });
                    const clearPending = () => { pending = null; };
                    b.addEventListener('pointercancel', clearPending);
                    b.addEventListener('pointerleave', clearPending);
                }
                return b;
            }

            // A normal toolbar key — pre-baked bytes (escape sequences for
            // Esc/Tab/arrows, literal '|' / '`'). Always consume armed
            // modifiers; the bytes themselves are sent as-is (no Ctrl-byte
            // transform on toolbar keys — that only makes sense for letters
            // typed on the system soft keyboard).
            function sendKey(bytes) {
                cancelScrollMomentum();   // any soft key (Esc/arrows/…) hard-cancels a flick coast
                // IR.1: pre-baked key bytes go straight to sendInput and
                // never pass term.onData — reset the compose-mirror
                // baseline here or a soft arrow/Esc would silently desync
                // the field from the pty line it claims to mirror.
                mirrorLineReset();
                sendInput(bytes);
                consumeSoftMods();
            }

            // ---- Row 1 (.sk-primary, always visible): the essentials —
            // Esc + ⇧Tab, then the four arrows. Every makeBtn call in
            // both tiers is byte-carried from the flat M.1 row: same
            // labels, bytes and opts (repeat 500ms/60ms on Tab+arrows,
            // noFocus, aria) — IR.3 only re-parents the buttons.
            const grpEsc = skGroup(row);
            grpEsc.appendChild(makeBtn('Esc',  () => sendKey('\x1b')));
            // Task M.1: back-tab (CSI Z) — Claude Code's mode cycle; mobile
            // soft keyboards have no way at all to send Shift+Tab.
            grpEsc.appendChild(makeBtn('⇧Tab', () => sendKey('\x1b[Z'),
                { ariaLabel: 'Shift+Tab (back-tab)' }));
            const grpArrows = skGroup(row);
            grpArrows.appendChild(skNarrow(makeBtn('↑', () => sendKey('\x1b[A'), { ariaLabel: 'Up arrow',    noFocus: true, repeat: true })));
            grpArrows.appendChild(skNarrow(makeBtn('↓', () => sendKey('\x1b[B'), { ariaLabel: 'Down arrow',  noFocus: true, repeat: true })));
            grpArrows.appendChild(skNarrow(makeBtn('←', () => sendKey('\x1b[D'), { ariaLabel: 'Left arrow',  noFocus: true, repeat: true })));
            grpArrows.appendChild(skNarrow(makeBtn('→', () => sendKey('\x1b[C'), { ariaLabel: 'Right arrow', noFocus: true, repeat: true })));

            // ---- Row 2 (.sk-extra, ⋯-toggled overflow): six hairline-
            // separated groups. Group 1: Tab + the modifiers — arm/latch
            // is page-global state, so arming Ctrl here and collapsing
            // the row still remaps the next raw keystroke (paintMod and
            // consumeSoftMods find the buttons by data-mod from either
            // row).
            const grpTabMods = skGroup(extraRow);
            grpTabMods.appendChild(makeBtn('Tab',  () => sendKey('\t'), { repeat: true }));
            grpTabMods.appendChild(makeBtn('Ctrl', () => tapMod('ctrl'),
                { cls: 'sk-mod', dataMod: 'ctrl', ariaLabel: 'Ctrl modifier' }));
            grpTabMods.appendChild(makeBtn('Alt',  () => tapMod('alt'),
                { cls: 'sk-mod', dataMod: 'alt',  ariaLabel: 'Alt modifier' }));
            skSep(extraRow);
            // Groups 2-6 are created upfront IN DISPLAY ORDER (a skGroup
            // call appends its group immediately), so the code blocks
            // below keep their historical order while the rendered row
            // reads: [Tab·Ctrl·Alt] [Copy·Paste] [slash minus pipe
            // backtick] [Sel·Mark·Yank] [‹·›] [🖼·📷·⌨].
            const grpCopyPaste = skGroup(extraRow);
            skSep(extraRow);
            const grpGlyphs = skGroup(extraRow);
            skSep(extraRow);
            const grpCopyMode = skGroup(extraRow);
            skSep(extraRow);
            const grpCycle = skGroup(extraRow);
            skSep(extraRow);
            const grpMedia = skGroup(extraRow);

            // Task M.1: slash-commands and CLI flags, plus shell glyphs.
            grpGlyphs.appendChild(skNarrow(makeBtn('/',  () => sendKey('/'))));
            grpGlyphs.appendChild(skNarrow(makeBtn('-',  () => sendKey('-'))));
            grpGlyphs.appendChild(skNarrow(makeBtn('|',  () => sendKey('|'))));
            grpGlyphs.appendChild(skNarrow(makeBtn('`',  () => sendKey('`'))));

            // Task M.2: touch copy — server-side tmux copy-mode. A touch
            // drag deliberately scrolls instead of selecting (red line), so
            // touch users select IN tmux: Sel enters copy-mode (the soft
            // arrows then move the copy cursor), Mark starts the selection,
            // Yank copies it and leaves copy-mode — tmux (set-clipboard on)
            // then emits OSC52 and the clipboard provider lands it on the
            // browser clipboard with the 'Copied' toast. All three run via
            // tmux-api because the server commands are binding-table-
            // independent: synthesizing the prefix key client-side breaks
            // under prefix remaps (wizard's own prefix is M-x, not C-b).
            function postCopyMode(command) {
                const url = SESSIONS_API + '/'
                    + encodeURIComponent(validArg) + '/copy-mode';
                return fetch(url, command ? {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                } : { method: 'POST', credentials: 'same-origin' });
            }
            function copyModeKey(label, command, ariaLabel) {
                // noFocus: selecting is an arrows workflow — never summon
                // the keyboard on these taps (same posture as the arrows).
                return makeBtn(label, async () => {
                    try {
                        const resp = await postCopyMode(command);
                        if (resp.status === 409) {
                            showToast('Tap Sel first', 'error', 2000);
                        } else if (!resp.ok) {
                            showToast(label + ' failed: HTTP ' + resp.status, 'error', 2500);
                        } else {
                            haptic('selection');   // Task M.7: Sel/Mark/Yank landed
                        }
                    } catch (err) {
                        showToast(label + ' error: ' + err.message, 'error', 2500);
                    }
                }, { ariaLabel: ariaLabel, noFocus: true });
            }
            grpCopyMode.appendChild(copyModeKey('Sel', null,
                'Enter tmux copy mode (select with arrows)'));
            grpCopyMode.appendChild(copyModeKey('Mark', 'begin-selection',
                'Start selection at the copy cursor'));
            grpCopyMode.appendChild(copyModeKey('Yank', 'copy-selection-and-cancel',
                'Copy selection and leave copy mode'));

            grpCopyPaste.appendChild(makeBtn('Copy', async () => {
                const sel = term.getSelection();
                if (!sel) {
                    // Task M.2: no xterm selection — on touch there never is
                    // one (drag scrolls by design) — so copy the visible
                    // screen via GET /capture. clipboard.write() is called
                    // SYNCHRONOUSLY in the tap gesture and handed the fetch
                    // as a ClipboardItem PROMISE: iOS Safari only honors
                    // writes inside the gesture's transient activation,
                    // which an awaited fetch hop would void.
                    const captured = fetch(SESSIONS_API + '/'
                            + encodeURIComponent(validArg) + '/capture',
                            { credentials: 'same-origin' })
                        .then((resp) => {
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            return resp.text();
                        });
                    try {
                        if (navigator.clipboard.write
                                && typeof ClipboardItem !== 'undefined') {
                            await navigator.clipboard.write([new ClipboardItem({
                                'text/plain': captured.then((t) =>
                                    new Blob([t], { type: 'text/plain' }))
                            })]);
                        } else {
                            await navigator.clipboard.writeText(await captured);
                        }
                        showToast('Screen copied', 'success', 1500);
                        haptic('selection');   // Task M.7: copy success
                    } catch (err) {
                        showToast('Copy failed', 'error', 2500);
                    }
                    return;
                }
                try {
                    await navigator.clipboard.writeText(sel);
                    showToast('Copied', 'success', 1500);
                    haptic('selection');   // Task M.7: copy success
                } catch (err) {
                    showToast('Copy failed', 'error', 2500);
                }
            }));
            // MF-2: the row's Paste delegates to #paste-btn (display:none
            // on coarse — the element stays the function owner): the full
            // IMAGE-aware routine — image on the clipboard →
            // /clipboard/upload → path sendInput; text → term.paste with
            // soft-mod disarm. The old readText()-only body here would
            // have silently dropped image paste on phones once the
            // floating cluster stopped rendering there.
            grpCopyPaste.appendChild(makeBtn('Paste',
                () => document.getElementById('paste-btn').click()));

            // Task M.6: session prev/next. The buttons are the PRIMARY
            // affordance — they work on iOS (where the OS reserves every
            // 3-finger shape), on Android, and under TalkBack (plain
            // buttons with aria-labels); the 3-finger swipe below is only
            // an Android accelerator onto the same path. Framed (the
            // normal case) the request goes UP over the NEW tl-gesture
            // postMessage — the lobby owns the sidebar order and the
            // iframe swap, and shows the 220ms pill naming the target. A
            // deep-linked top-level tab (?arg= with no lobby) falls back
            // to the Task 4.1 unframed jump (real navigation). noFocus:
            // switching sessions must not summon the keyboard.
            function postSessionCycle(dir) {
                if (window.parent !== window) {
                    try {
                        window.parent.postMessage(
                            { type: 'tl-gesture', gesture: 'cycle-session', dir: dir },
                            location.origin);
                    } catch (e) {}
                    return;
                }
                runAppCommand(dir > 0 ? 'session.next' : 'session.prev');
            }
            grpCycle.appendChild(skNarrow(makeBtn('‹', () => postSessionCycle(-1),
                { ariaLabel: 'Previous session', noFocus: true })));
            grpCycle.appendChild(skNarrow(makeBtn('›', () => postSessionCycle(1),
                { ariaLabel: 'Next session', noFocus: true })));

            // MF-2: the floating action buttons are display:none on
            // coarse pointers (they shadowed Claude Code's input rows),
            // so their functions fold into the row as thin delegates
            // onto the SAME hidden elements — .click() fires a
            // display:none button's handler fine (the palette /
            // runAppCommand precedent). Paste already delegates above;
            // noFocus: none of these should summon the keyboard.
            // IR.3: A−/A+ left the toolbar ENTIRELY (Viktor: "way too
            // many buttons") — font size lives in the ⚙ settings panel,
            // which writes the SAME roamed pref; the hidden
            // #font-dec-btn/#font-inc-btn elements stay as the desktop
            // floating cluster.
            grpMedia.appendChild(skNarrow(makeBtn(null,
                () => document.getElementById('gallery-btn').click(),
                // swallowClick: the gallery overlay opens under the lifting
                // finger — without it the tap's trailing trusted click lands
                // on the backdrop and instantly closes it (MF-2 round 2).
                { icon: 'image',
                  ariaLabel: 'Session images', noFocus: true, swallowClick: true })));
            grpMedia.appendChild(skNarrow(makeBtn(null,
                () => document.getElementById('img-btn').click(),
                { icon: 'camera', ariaLabel: 'Upload image', noFocus: true })));
            // IR.3: ⌨ — ONE input-mode toggle, replacing BOTH the M.11
            // 'Kbd' raw-keyboard key and the M.10 '✎' bar toggle. It
            // flips the input bar via toggleInputBar() (IR.2: the
            // device-local tl:input.barHidden:v1 override + focus
            // handoff): bar visible = the native mirror field is the
            // typing surface; bar hidden = a terminal tap already
            // summons the RAW keyboard (tapFocus routes to the terminal
            // whenever the bar is away), so Kbd's one-shot raw excursion
            // collapses into ⌨-off + tap. noFocus: toggleInputBar does
            // its own focus handling.
            const inputToggleBtn = skNarrow(makeBtn(null, () => toggleInputBar(),
                { icon: 'keyboard',
                  ariaLabel: 'Switch between input field and raw keyboard',
                  noFocus: true }));
            inputToggleBtn.id = 'sk-input-toggle';
            inputToggleBtn.title = 'Switch between input field and raw keyboard';
            grpMedia.appendChild(inputToggleBtn);

            // Task IR.3: ⋯ — the overflow-row toggle, pinned on the
            // bottom line next to ⌄. A PLAIN tap-commit button in the
            // row's own territory (swipe-paging was rejected: the P3
            // mid-swipe-fire class — no new gestures), never repeats,
            // noFocus (a chrome toggle must not summon the keyboard).
            // aria-pressed + the sk-mod 'armed' paint carry the expanded
            // state (the button has NO data-mod, so the Ctrl/Alt state
            // machinery never sees it — sk-mod is borrowed purely for
            // the armed styling vocabulary). The expanded bit is
            // DEVICE-LOCAL: tl:input.keyRowExpanded:v1, '1'/'0'; absent
            // or garbage boots collapsed. The height change rides the
            // SAME measured-offsetHeight geometry as the M.6 toolbar
            // toggle and the compose bar — syncViewport re-measures
            // #soft-keys into --sk-h + the terminal pixel height, refit
            // debounces the actual tmux resize (one resize per toggle,
            // and the bar/terminal move in the same frame).
            const KEY_ROW_EXPANDED_KEY = 'tl:input.keyRowExpanded:v1';
            let keyRowExpanded = false;
            try { keyRowExpanded = localStorage.getItem(KEY_ROW_EXPANDED_KEY) === '1'; } catch (e) {}
            const moreBtn = skNarrow(makeBtn(null, () => setKeyRowExpanded(!keyRowExpanded),
                { icon: 'ellipsis', cls: 'sk-mod', ariaLabel: 'More keys', noFocus: true }));
            moreBtn.classList.add('sk-more');
            moreBtn.title = 'More keys';
            function paintKeyRowExpanded() {
                toolbar.classList.toggle('expanded', keyRowExpanded);
                moreBtn.classList.toggle('armed', keyRowExpanded);
                moreBtn.setAttribute('aria-pressed', keyRowExpanded ? 'true' : 'false');
            }
            function setKeyRowExpanded(want) {
                keyRowExpanded = want;
                paintKeyRowExpanded();
                try { localStorage.setItem(KEY_ROW_EXPANDED_KEY, want ? '1' : '0'); } catch (e) {}
                // Tap-time only — never called at build: refit reads
                // let-bindings that initialize after this block (the M.6
                // TDZ posture). A boot-expanded toolbar is measured by
                // the boot-end syncViewport instead; until then the
                // static 50px CSS fallback covers the collapsed shape.
                syncViewport();
                refit();
            }
            paintKeyRowExpanded();   // boot state from the persisted bit
            line.appendChild(moreBtn);

            // Task M.1: keyboard DISMISS — right-pinned OUTSIDE the
            // scrolling row (since IR.3 a direct child of the bottom
            // .sk-line, so it can never scroll out of reach). Blurring
            // the helper textarea collapses the soft keyboard; noFocus
            // keeps makeBtn from immediately re-summoning it. The way
            // back is a terminal tap (raw keyboard or mirror field, per
            // input.tapFocus).
            line.appendChild(skNarrow(makeBtn(null, () => {
                // M.11 fix (pre-existing bug, default-path now): in compose
                // mode the active input is #compose-input, not the helper —
                // blur whichever input actually holds the keyboard. Lazy
                // activeElement lookup: this key is built BEFORE the
                // compose block, so composeInput is not in scope here. Bar
                // VISIBILITY is untouched by dismiss (⌄ here drops the
                // keyboard; the bar's own ⌄ now does the same since the
                // bar-trap fix — hiding the bar is the ⌨ key + settings).
                const ae = document.activeElement;
                if (ae === helperTextarea || (ae && ae.id === 'compose-input')) ae.blur();
                else if (helperTextarea) helperTextarea.blur();
            }, { icon: 'chevron-down',
                 ariaLabel: 'Hide keyboard', noFocus: true, cls: 'sk-dismiss' })));

            document.body.appendChild(toolbar);
            document.body.classList.add('has-soft-keys');

            // ---- Task M.10/IR.1: native compose bar = live pty mirror ---
            // Full-fidelity mobile text input. The hidden xterm helper
            // textarea is deliberately SUPPRESSED (type=password — Gboard
            // predictive text corrupted terminal input: xterm #2403,
            // composition #3600/#675) and that block stays byte-untouched;
            // autocorrect / swipe typing / dictation therefore need this
            // separate, VISIBLE field. Since IR.1 the field is a
            // TRANSPARENT MIRROR of the pty input line, not a staged
            // composer (Viktor: a second composer in front of Claude
            // Code's own input box is bad UX — "we either mirror the
            // terminal … or dont at all"): every field edit streams to the
            // pty immediately, so the TUI's own input box always shows
            // exactly what the field holds. Emission goes EXCLUSIVELY
            // through term.input() → the EXISTING onData wrapper
            // (soft-mod remap) → sendInput → ws — zero new socket paths;
            // term.paste survives only for multiline pastes (bracketed,
            // §A.6 shape).
            const composeBar = document.createElement('div');
            composeBar.id = 'compose-bar';
            const composeInput = document.createElement('textarea');
            composeInput.id = 'compose-input';
            composeInput.rows = 1;
            // The OPPOSITE of the helper-textarea suppression set — and
            // never a `type` attribute (textareas have none; the helper's
            // type=password trick would kill the suggestion/composition UI
            // this field exists for). autocorrect='on' + spellcheck='true'
            // are the real QuickType controls; the `autocomplete` attribute is
            // deliberately OMITTED (not 'off'): on iOS — pronounced in the
            // installed PWA's WKWebView — autocomplete='off' ALSO suppresses
            // the QuickType predictive/autocorrect bar (a WebKit coupling, not
            // just form-autofill), so 'off' silently killed suggestions in
            // this very field (2026-07-12). Omitting it restores the
            // spec-neutral default; a nameless, form-less textarea has ~nil
            // autofill risk, so 'off' bought nothing. IR.1 deltas:
            // autocapitalize off (sentence-caps corrupt shell commands now
            // that keystrokes stream raw) and enterkeyhint FIXED 'send' (Enter
            // always streams the line + \r — no more compose.enterKey
            // arbitration). Inline 16px blocks iOS Safari's focus auto-zoom.
            composeInput.setAttribute('autocapitalize', 'off');
            composeInput.setAttribute('autocorrect', 'on');
            composeInput.setAttribute('spellcheck', 'true');
            composeInput.setAttribute('inputmode', 'text');
            composeInput.setAttribute('enterkeyhint', 'send');
            composeInput.setAttribute('aria-label', 'Compose text to send to the terminal');
            composeInput.placeholder = 'Compose…';
            composeInput.style.fontSize = '16px';
            const composeHide = document.createElement('button');
            composeHide.type = 'button';
            composeHide.id = 'compose-hide';
            composeHide.replaceChildren(iconNode('chevron-down', 16));
            composeHide.setAttribute('aria-label', 'Dismiss keyboard');
            composeBar.appendChild(composeInput);
            composeBar.appendChild(composeHide);
            document.body.appendChild(composeBar);

            let composeVisible = false;
            // (IR.2: the old page-life composeUserToggled flag is gone —
            // a manual ⌨ hide now persists as the DEVICE-LOCAL
            // suppression key instead, because visibility reconciles
            // against prefs both directions on every apply. Since the
            // bar-trap fix the bar's own ⌄ no longer hides — it dismisses
            // the keyboard — so ⌨ + settings are the only writers.)

            // Auto-grow to 5 lines (scrollHeight clamp), internal scroll
            // past that. All heights derive from the computed style so a
            // CSS tweak cannot desync the clamp.
            function autoGrowCompose() {
                const cs = getComputedStyle(composeInput);
                const border = (parseFloat(cs.borderTopWidth) || 0)
                             + (parseFloat(cs.borderBottomWidth) || 0);
                const pad = (parseFloat(cs.paddingTop) || 0)
                          + (parseFloat(cs.paddingBottom) || 0);
                const line = parseFloat(cs.lineHeight) || 21;
                const maxH = Math.ceil(5 * line + pad + border);
                composeInput.style.height = 'auto';
                const want = composeInput.scrollHeight + border;   // border-box height
                composeInput.style.height = Math.min(want, maxH) + 'px';
                composeInput.style.overflowY = want > maxH ? 'auto' : 'hidden';
            }
            // Bar height changed (line added/removed) → the terminal gives
            // the pixels back: syncViewport subtracts the bar's live
            // offsetHeight and refit() debounces the actual tmux resize, so
            // a typing burst costs ONE fit — never one per keystroke.
            function growAndRefit() {
                const h0 = composeBar.offsetHeight;
                autoGrowCompose();
                if (composeBar.offsetHeight !== h0) refit();
            }
            composeInput.addEventListener('input', growAndRefit);

            // ---- IR.1 mirror engine -------------------------------------
            // lastValue is the pty input line as this mirror shaped it;
            // reconcile() diffs field.value against it after every input
            // event and emits the byte delta. The DOM fires 'input' AFTER
            // the mutation regardless of HOW the text changed (typing,
            // composition updates, autocorrect replaces, suggestion taps,
            // dictation bursts, select-all overwrites, shake-to-undo), so
            // the differ is event-shape-agnostic — the Gboard
            // event-interpretation failure class that killed helper-
            // textarea typing (xterm #2403/#3600/#675) cannot reach it,
            // and an unchanged value diffs to nothing (double-sends are
            // impossible by construction). V1 constraints (E2E-decided, do
            // not re-litigate without new evidence): no pty cursor
            // tracking / no arrow repositioning — mid-string edits are
            // backspace-to-common-prefix + tail retype; composition
            // streams through (holding to compositionend would lag the
            // TUI one word behind on every Gboard commit); Enter always
            // submits (multiline authoring = bracketed paste or Claude
            // Code backslash-continuation); the field never contains \n;
            // ONE line mirrored — no draft persistence, no history.
            let lastValue = '';        // pty-mirrored line
            let suppress = false;      // marks programmatic field mutations

            // Delete units differ per receiver: Claude Code's composer
            // deletes one GRAPHEME per DEL, readline / kernel canonical
            // mode delete one CODEPOINT (both measured through the real
            // ws→ttyd→tmux stack). They only disagree when a grapheme
            // spans >1 codepoint (emoji/ZWJ/combining) — the three-branch
            // rule in reconcile() keys on exactly that. Intl.Segmenter is
            // the grapheme authority; Array.from (codepoints) is the
            // fallback where it is absent.
            const graphemeSeg = (typeof Intl !== 'undefined' && Intl.Segmenter)
                ? new Intl.Segmenter(undefined, { granularity: 'grapheme' })
                : null;
            const codepointCount = (s) => Array.from(s).length;
            const graphemeCount = (s) => graphemeSeg
                ? [...graphemeSeg.segment(s)].length
                : codepointCount(s);
            // Common code-unit prefix, snapped out of a split surrogate
            // pair and back onto a grapheme boundary of `a` (= lastValue)
            // so the deletion suffix is countable in whole units.
            function mirrorCommonPrefix(a, b) {
                let p = 0;
                const m = Math.min(a.length, b.length);
                while (p < m && a.charCodeAt(p) === b.charCodeAt(p)) p++;
                if (p > 0) {
                    const c = a.charCodeAt(p - 1);
                    if (c >= 0xD800 && c <= 0xDBFF) p--;   // split surrogate pair
                }
                if (p > 0 && p < a.length && graphemeSeg) {
                    let floor = 0;                          // grapheme floor of p
                    for (const seg of graphemeSeg.segment(a)) {
                        const end = seg.index + seg.segment.length;
                        if (end > p) break;
                        floor = end;
                    }
                    p = floor;
                }
                return p;
            }
            // Every mirror byte leaves through term.input() (xterm 6.0.0
            // public API): onData → soft-mod wrapper → sendInput → ws —
            // the EXISTING socket path, nothing new. mirrorEmitting marks
            // our own traffic so the onData out-of-band reset hook
            // ignores it.
            function emit(bytes) {
                if (!bytes) return;
                mirrorEmitting = true;
                try { term.input(bytes, true); } finally { mirrorEmitting = false; }
            }
            // Three-branch differ (receiver-agnostic delete rule):
            //   1. nothing deleted → stream the insertion;
            //   2. deletion counts agree in graphemes and codepoints
            //      (plain text) → one DEL per unit + retype the tail;
            //   3. counts disagree (emoji/ZWJ/combining) → NUKE: DEL past
            //      empty — a verified no-op on both receiver classes —
            //      and retype the whole line. Over-deleting from a KNOWN
            //      state (empty) sidesteps the receivers' delete-unit
            //      disagreement entirely.
            function reconcile(cur) {
                if (cur === lastValue) return;
                const p = mirrorCommonPrefix(lastValue, cur);
                const del = lastValue.slice(p);
                const ins = cur.slice(p);
                if (!del) {
                    emit(ins);
                } else if (graphemeCount(del) === codepointCount(del)) {
                    emit('\x7f'.repeat(codepointCount(del)) + ins);
                } else {
                    emit('\x7f'.repeat(codepointCount(lastValue)) + cur);
                }
                lastValue = cur;
            }
            // Out-of-band reset (assigned onto the top-level seam): bytes
            // reaching the pty from ANY non-mirror path — soft keys,
            // Paste, raw Kbd typing, upload path-sends, a fresh ws attach
            // — invalidate the baseline: drop field + baseline with NO
            // emission. The early-out keeps raw-typing bursts (Kbd
            // excursion fires this once per keystroke via onData) at zero
            // layout cost.
            mirrorLineReset = function () {
                if (!composeInput.value && !lastValue) return;
                suppress = true;
                composeInput.value = '';
                suppress = false;
                lastValue = '';
                growAndRefit();
            };

            composeInput.addEventListener('input', () => {
                if (suppress) return;
                const v = composeInput.value;
                if (v.includes('\n')) {
                    // Enter (the soft keyboard's 'send' key inserts \n):
                    // terminal semantics — reconcile and submit the WHOLE
                    // value regardless of caret position (E2E-proven
                    // necessary: a mid-string Enter must not split the
                    // line), the \r as its own sendInput frame, then clear
                    // — the pty line restarts empty.
                    reconcile(v.replace(/\n/g, ''));
                    emit('\r');
                    mirrorLineReset();
                    return;
                }
                reconcile(v);
            });
            // Multiline paste keeps the proven bracketed-paste path (§A.6
            // shape): preventDefault (the block never enters the one-line
            // field), disarm soft-mods (they would remap the paste's
            // first char), term.paste — the resulting onData traffic is
            // out-of-band and resets the baseline. Single-line pastes
            // fall through, insert natively, and stream like typing (the
            // document-level capture paste handler defers text pastes
            // targeting this field — see its IR.1 guard).
            composeInput.addEventListener('beforeinput', (e) => {
                if (e.inputType === 'insertFromPaste' && e.data && e.data.includes('\n')) {
                    e.preventDefault();
                    consumeSoftMods();
                    term.paste(e.data);
                }
            });
            // Backspace past an empty field erases pty-side text the
            // mirror does not hold (leftovers after an out-of-band reset)
            // — transparent erase. e.isComposing: an IME owns its own
            // backspaces mid-composition.
            composeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && composeInput.value === '' && !e.isComposing) emit('\x7f');
            });

            composeHide.addEventListener('pointerdown', (ev) => {
                ev.preventDefault();
                haptic('selection');
                // bar-trap fix: the bar's ⌄ now DISMISSES THE KEYBOARD and
                // leaves the bar VISIBLE — it no longer writes barHidden or
                // collapses the bar. Tapping it expecting a keyboard-dismiss
                // used to strand the whole bar with no restore hint (the same
                // reversibility trap the toolbar-hide ⌄ carried). The
                // ev.preventDefault above keeps this button from taking focus,
                // so blurring the focused input drops the soft keyboard and
                // nothing re-summons it. Hiding the bar is now EXCLUSIVE to
                // the ⌨ soft key (under ⋯) and the settings 'Input bar' row,
                // both of which name the way back. Blur whichever of our
                // inputs holds the keyboard; neither focused = harmless no-op.
                const ae = document.activeElement;
                if (ae === composeInput || ae === helperTextarea) ae.blur();
            });

            // Show/hide. Showing re-measures the field (it may carry kept
            // text); hiding with focus=true hands the keyboard back to
            // the terminal (the Task 2.3 focus-return posture — the user
            // is returning to raw typing, not leaving), while prefs-driven
            // hides pass focus=false (IR.2: a settings change made in the
            // lobby sheet must not summon the raw keyboard here). Never
            // called before refit()'s timer bindings exist: tap-time, or
            // applyInputPrefs via the boot applyTermPrefs one-shot (same
            // TDZ posture as applyToolbarPrefs).
            // GHOST: composeVisible means "the field is ENGAGED" (in
            // layout, focusable, the tapFocus target) — true for BOTH the
            // ghost (invisible) and 'on' (visible bar) postures, which is
            // what keeps tapFocus/focusActiveInput/toggleInputBar
            // byte-identical. The visible-vs-ghost RENDER split is the
            // .ghost class, derived here from the roamed posture: 'auto'
            // paints the invisible ghost, 'on' the full bar. (Only reached
            // on coarse pointers, where the bar DOM exists; fine pointers
            // keep the applyInputPrefs stub, so 'auto' never ghosts there.)
            function setComposeVisible(show, focus) {
                composeVisible = show;
                const ghost = show && getPrefs().input.bar === 'auto';
                composeBar.classList.toggle('visible', show);
                composeBar.classList.toggle('ghost', ghost);
                if (show) autoGrowCompose();
                refit();
                if (show && focus) composeInput.focus();
                if (!show && focus) term.focus();
            }
            // Task IR.2 quick toggle (the ⌨ soft key since IR.3; was ✎):
            // flips the DEVICE-LOCAL
            // suppression override and reconciles through the same
            // effective-visibility rule as applyInputPrefs. The roamed
            // input.bar posture is never written here (that is the
            // settings checkbox's job), so the toggle survives reloads
            // per-device without roaming to other devices. Consequence,
            // accepted: under a roamed input.bar:'off' the toggle cannot
            // force the bar on — 'off' is itself an explicit settings
            // act, and the settings row is the way back.
            function setInputBarHidden(hidden) {
                try {
                    if (hidden) localStorage.setItem(INPUT_BAR_HIDDEN_KEY, '1');
                    else localStorage.removeItem(INPUT_BAR_HIDDEN_KEY);
                } catch (e) {}
            }
            function toggleInputBar() {
                const hiding = composeVisible;
                setInputBarHidden(hiding);
                const want = !hiding && getPrefs().input.bar !== 'off';
                if (want !== composeVisible) setComposeVisible(want, true);
                if (hiding) noteComposeCollapse();
            }
            // Restore coach for a ⌨-hidden bar — DEVICE-LOCAL one-shot
            // (TOOLBAR_HINT_KEY precedent, bar-trap fix). Only the ⌨ soft key
            // reaches here now: the bar's own ⌄ dismisses the keyboard and no
            // longer collapses the bar. It names the way back at most ONCE per
            // device (⌨ hides on its second tap, so a per-page-life toast
            // would nag every reload). The page-life bool still guards a
            // double-toast within one life before the marker read settles
            // (e.g. private-mode storage throwing on get).
            let composeReopenHintShown = false;
            function noteComposeCollapse() {
                if (composeReopenHintShown) return;
                composeReopenHintShown = true;
                let seen = null;
                try { seen = localStorage.getItem(BAR_HINT_KEY); } catch (e) {}
                if (seen !== null) return;
                try { localStorage.setItem(BAR_HINT_KEY, '1'); } catch (e) {}
                showToast('Input bar hidden — tap ⌨ (under ⋯) to bring it back', 'info', 3500);
            }

            // Focus routing (guarded — byte-equivalent while the field is
            // not in use): a soft-key tap re-arms the COMPOSE field only
            // when it was the focused input (makeBtn's pointerdown
            // preventDefault keeps activeElement stable through the tap),
            // else the helper textarea exactly as before. Soft keys keep
            // reaching the pty while the field is focused — sendInput
            // writes to the socket regardless of DOM focus. Documented
            // limitation: armed-Ctrl/Alt + typed-letter chords need
            // terminal focus (compose is for prose, not chords).
            function focusActiveInput() {
                if (composeVisible && document.activeElement === composeInput) {
                    composeInput.focus();
                } else {
                    term.focus();
                }
            }

            // M.11 terminal-tap routing (complaint 2; pref READ re-keyed
            // by IR.2, routing byte-identical): while the bar is visible,
            // a tap on the terminal puts the cursor in the mirror field —
            // the native keyboard with autocorrect/dictation is the
            // default phone experience, not a hidden mode. Reassigned ONLY
            // here (coarse block): fine pointers keep the boot arrow
            // byte-equivalent. Stateless + deterministic — the touchend tap
            // branch AND the synthesized-mousedown interceptor path both
            // land here, so the double-fire is a harmless double .focus()
            // on the same element. input.tapFocus:'terminal' (settings
            // 'Terminal tap' → Keyboard) or a hidden bar = shipped raw-tap
            // behavior. IR.3: the M.11 'Kbd' one-shot excursion key is
            // gone — the deliberate raw keyboard is ⌨-off (bar hidden)
            // + terminal tap, which lands in the helper textarea here.
            tapFocus = () => {
                if (composeVisible && getPrefs().input.tapFocus === 'field') composeInput.focus();
                else term.focus();
            };

            // Prefs reconciliation — called from applyTermPrefs (panel
            // changes arriving over tl-prefs, roamed-doc adoption, and
            // the boot one-shot, which is also what first applies
            // input.bar). Effective engagement is a PURE function —
            // (input.bar==='on' || input.bar==='auto') && no device-local
            // suppression — on this coarse-only block (fine pointers keep
            // the inert stub, which is what makes 'auto' resolve
            // per-device), and the reconcile runs BOTH directions, so the
            // settings 'Input mode' control switches live.
            // GHOST: 'auto'⇄'on' both keep the field ENGAGED (want stays
            // true) but must FLIP the render (ghost⇄visible bar), so the
            // reconcile also fires when the ghost-ness diverges from what
            // is painted — not just on an engage/disengage edge. Never
            // steals focus in either direction (a lobby-sheet settings
            // change or a boot must not summon a keyboard).
            // IR.1: enterkeyhint is not reconciled here — it is FIXED
            // 'send' at creation (Enter always submits).
            let ghostHintShown = false;   // coach toast once per page-life
            applyInputPrefs = function () {
                const bar = getPrefs().input.bar;
                const want = bar !== 'off' && !inputBarHiddenHere();
                const ghost = want && bar === 'auto';
                if (want !== composeVisible ||
                        ghost !== composeBar.classList.contains('ghost')) {
                    setComposeVisible(want, false);
                }
                // One-time GHOST coach toast — only under the 'auto'
                // (never-configured) posture while the field is actually
                // engaged (= ghost), gated by the device-local
                // GHOST_HINT_KEY (fresh key: ghost earns one fresh hint
                // even where the old visible-bar hint was seen). A user who
                // SET bar:'on' chose the visible bar and needs no coach.
                // Names the way back (Settings → Input mode) because the
                // field is now invisible — the reversibility rule for a
                // change that hides UI. Toasts render top-of-viewport.
                if (ghost && !ghostHintShown) {
                    ghostHintShown = true;
                    let seen = null;
                    try { seen = localStorage.getItem(GHOST_HINT_KEY); } catch (e) {}
                    if (seen === null) {
                        try { localStorage.setItem(GHOST_HINT_KEY, '1'); } catch (e) {}
                        showToast('Typing now goes through an invisible composer — autocorrect still works. Settings → Input mode brings the visible bar back.', 'info', 6000);
                    }
                }
            };

            // ---- Task M.6: 2-finger tap → toolbar toggle ----------------
            // Reclaims the toolbar's ~50px for the terminal. Persisted
            // DEVICE-LOCAL (tl:input.toolbarHidden:v1, toolbar-fix): the
            // hidden-state was roamed (gestures.toolbarHidden) until an
            // accidental tap on one device stranded the soft-key row hidden
            // on ALL of them with no restore hint — re-keyed device-local so
            // a hide never leaves its own device. The device-local master
            // kill still reverts to plain chrome; the 'Show key row' settings
            // row is the always-available restore path.
            let toolbarHidden = false;
            let toolbarHintShown = false;   // one restore-hint per page-life (gesture hide + boot hint share it)
            let toolbarBootApplied = false; // first applyToolbarPrefs = boot; gates the boot restore-hint
            function setToolbarHidden(hidden, persist) {
                toolbarHidden = hidden;

                // has-soft-keys drops with it so the CSS height fallback
                // reverts to 100% and syncViewport sees offsetHeight 0.
                toolbar.style.display = hidden ? 'none' : '';
                document.body.classList.toggle('has-soft-keys', !hidden);
                syncViewport();
                refit();

                // force-show the row on every device. The device-local
                // master kill still reverts to plain chrome, and the 'Show
                // key row' settings row is the always-available restore path,
                // so a hidden row can never strand this device.

                // (the device-local one-shot precedent) and only while that gesture is
                // enabled (else the hint would lie — the settings row is the
                // way back there). A live settings/gesture hide is NOT
                // coached here (the gesture hide has its own page-life hint;
                // the settings row is self-evident), which is why the check
                // is boot-scoped. Shares toolbarHintShown so a session toasts
                // the restore hint at most once.

                    toolbarBootApplied = true;

                            getPrefs().gestures.twoFingerTap) {
                        let seen = null;
                        try { seen = localStorage.getItem(TOOLBAR_HINT_KEY); } catch (e) {}

            // arrives as a storage event; reconcile visibility then. Same for

            // reaches this iframe only as a storage event (toolbar-fix).

            // and it only ever observes: no preventDefault anywhere, so
            // native 2-finger pinch-zoom is untouched). Sequential lifts
            // within the window still count (real fingers rarely lift in
            // one event). NEVER bound to 2-finger double-tap (Safari smart
            // zoom owns that shape). iPadOS caveat (manual checklist): OS
            // word-select may co-fire over the helper textarea — UX-only,
            // xterm's insertText filter keeps the pty clean.
            const TAP_MAX_MS = 220, TAP_MAX_TRAVEL_PX = 10, TAP_MAX_SPAN_DELTA = 0.08;
            let tap = null;   // {start: Map(id→{x,y}), t0, span0, dead}

                    if (!(terminalEl.contains(a.target) && terminalEl.contains(b.target))) return;
                    tap = {
                        start: new Map([
                            [a.identifier, { x: a.clientX, y: a.clientY }],
                            [b.identifier, { x: b.clientX, y: b.clientY }]
                        ]),
                        t0: performance.now(),
                        span0: Math.max(1, tapSpan(a, b)),
                        dead: false
                    };
                },
                move(e) {
                    if (!tap || tap.dead) return;
                    for (const t of e.touches) {
                        const s = tap.start.get(t.identifier);
                        if (!s) { tap.dead = true; return; }   // finger substituted
                        if (Math.hypot(t.clientX - s.x, t.clientY - s.y) > TAP_MAX_TRAVEL_PX) {
                            tap.dead = true;
                            return;
                        }
                    }
                    if (e.touches.length === 2 &&
                            Math.abs(tapSpan(e.touches[0], e.touches[1]) / tap.span0 - 1)
                                >= TAP_MAX_SPAN_DELTA) {

                    }
                },
                end(e) {
                    if (!tap) return;
                    if (e.touches.length > 0) return;   // first of two lifts
                    const ok = !tap.dead &&
                        performance.now() - tap.t0 <= TAP_MAX_MS;
                    tap = null;
                    if (!ok) return;
                    setToolbarHidden(!toolbarHidden, true);
                    haptic('impact');   // Task M.7 vocabulary (toolbar toggle)
                    if (toolbarHidden && !toolbarHintShown) {
                        toolbarHintShown = true;
                        showToast('Two-finger tap to restore keys', 'info', 2500);
                    }
                },
                reset() { tap = null; }
            });

            // ---- Task M.6: 3-finger horizontal swipe → session cycle ----
            // ANDROID COARSE ONLY. iOS reserves the entire 3-finger
            // vocabulary (undo/redo/HUD/copy/paste) whenever a text input
            // is focused — and the helper textarea almost always is — so
            // the recognizer must NEVER register there (analysis exclusion
            // #1; the ‹/› soft keys are the iOS affordance). Arm at
            // exactly 3 touches inside terminalEl, none within 32px of the
            // screen's side edges (the OS back-gesture zones stay
            // unfought). Commit inside 600ms at mean dx ≥80px with
            // |dx|>2|dy|, all fingers moving the SAME direction and under
            // 24px of cumulative vertical wiggle; resting >350ms aborts
            // (that shape is the OEM partial-screenshot hold). While armed
            // every 3-finger touchmove is consumed via the module's lazy
            // non-passive listener — the probe-derived claim model (a
            // classify-then-claim always loses to the native gesture
            // pipeline); 3-finger motion has no in-page meaning here, and
            // 1/2-finger sequences are never touched. Swipe LEFT → next
            // session, RIGHT → previous (content follows the finger).
            if (/android/i.test(navigator.userAgent)) {
                const SWIPE_EDGE_PX = 32, SWIPE_COMMIT_PX = 80;
                const SWIPE_MAX_CUM_DY = 24, SWIPE_MAX_MS = 600, SWIPE_REST_MS = 350;
                let sw = null;   // {start: Map(id→{x,y}), t0, lastMeanX/Y, cumDY, lastProgressT, dead, committed}
                multiTouch.add({
                    start(e) {
                        if (sw) {   // 4th finger (or any re-add mid-gesture): abort
                            if (!sw.committed) sw.dead = true;
                            return;
                        }
                        if (e.touches.length !== 3) return;
                        if (!getPrefs().gestures.swipeSessionOptIn) return;   // per-press (OPT-IN, default false)
                        const pts = new Map();
                        let meanX = 0, meanY = 0;
                        for (const t of e.touches) {
                            if (!terminalEl.contains(t.target) ||
                                    t.clientX < SWIPE_EDGE_PX ||
                                    t.clientX > window.innerWidth - SWIPE_EDGE_PX) {
                                return;   // outside the terminal / in an edge dead-zone
                            }
                            pts.set(t.identifier, { x: t.clientX, y: t.clientY });
                            meanX += t.clientX / 3;
                            meanY += t.clientY / 3;
                        }
                        const now = performance.now();
                        sw = {
                            start: pts, t0: now,
                            lastMeanX: meanX, lastMeanY: meanY,
                            cumDY: 0, lastProgressT: now,
                            dead: false, committed: false
                        };
                    },
                    move(e) {
                        if (!sw || sw.dead || sw.committed) return;
                        if (e.touches.length !== 3) { sw.dead = true; return; }
                        let meanX = 0, meanY = 0, dxSum = 0, dySum = 0;
                        let pos = 0, neg = 0;
                        for (const t of e.touches) {
                            const s = sw.start.get(t.identifier);
                            if (!s) { sw.dead = true; return; }   // finger substituted
                            const dx = t.clientX - s.x;
                            if (dx > 0) pos++; else if (dx < 0) neg++;
                            dxSum += dx;
                            dySum += t.clientY - s.y;
                            meanX += t.clientX / 3;
                            meanY += t.clientY / 3;
                        }
                        // Claim: consume every armed 3-finger move (no-op on
                        // cancelable=false moves — the declared platform leak).
                        e.preventDefault();
                        const now = performance.now();
                        const stepX = meanX - sw.lastMeanX;
                        const stepY = meanY - sw.lastMeanY;

                                sw.dead = true;   // rested, then moved: OEM-hold abort
                                return;
                            }
                            sw.lastProgressT = now;
                        }
                        sw.lastMeanX = meanX;
                        sw.lastMeanY = meanY;

                            return;
                        }

                                Math.abs(meanDx) >= SWIPE_COMMIT_PX &&

                            // impact (supersedes M.6's ad-hoc [10,10]).

                        }
                    },
                    end(e) {
                        if (!sw) return;

                    },
                    reset() { sw = null; }

            }

            // ---- Task M.8: 2-finger pinch → font size (DEFAULT ON) ----
            // Two front-ends over ONE commit vocabulary, chosen by engine
            // (isChromiumFamily / hasGestureEvent, defined above); at most
            // one arms. The COMMIT path is shared: a cumulative span ratio
            // (1.0 at gesture start) maps to a clamped font step via the SAME
            // clampFontSize(base + trunc((ratio−1)/7%)) formula through the
            // shared applyFontSize (which carries the M.7 selection haptic
            // per committed step), with the 'Aa NNpx' #font-pill readout.
            // Shared gates: tl:gesture-pinch-font:v1 (DEFAULT ON, read per
            // gesture) + the tl-gestures master kill; armed only OVER THE
            // TERMINAL and only while pageScale() ≤ 1.001 — an already-zoomed
            // page keeps native pinch as its only way back out (the standing
            // regression guard); a 3rd finger aborts and never resumes mid-
            // gesture. #terminal's touch-action (pan-x pan-y pinch-zoom)
            // stays untouched, so native zoom is intact whenever no front-end
            // claims (flag off / zoomed / off-terminal / no front-end) — the
            // flag-'off' battery leg (native zoom must still reach scale>1)
            // is that standing guard.
            //
            // Front-end A — CHROMIUM (touch-span claim). Probe-derived, do
            // NOT simplify back (2026-07-11: BOTH naive models were falsified
            // on the production surface — Chrome's cancelable-touchmove window
            // is ~1-3 moves, so classify-THEN-claim never lands, and a one-
            // shot first-move preventDefault doesn't hold). A claim means
            // CONTINUOUS consumption of EVERY 2-finger touchmove from move 1
            // (the module's lazily-attached non-passive listener), classify
            // deferred to 2f-move 3: |span/span0−1| ≥ 0.05 → CLAIMED (keep
            // consuming, step the font); else RELEASE (native resumes, losing
            // ~7.5px of centroid travel). Mid-scroll finger-joins arrive
            // cancelable=false → RELEASE on the first (panic-zoom mid-scroll
            // stays native — the DECLARED platform leak).
            //
            // Front-end B — WEBKIT (iOS/iPadOS, GestureEvent). WebKit
            // schedules touchmove cancelability differently, so the touch-
            // span claim isn't portable; instead the proprietary GestureEvent
            // IS the pinch signal (a plain 2-finger pan/scroll never fires it,
            // so there's no pan-vs-pinch classification to do). preventDefault
            // at gesturestart suppresses native pinch-zoom; e.scale is the
            // cumulative span ratio, driving the same step formula. A claimed
            // WebKit gesture can't be released mid-flight without a native-
            // zoom pop, so the 3rd-finger abort FREEZES stepping through
            // gestureend rather than half-claiming. Listeners are
            // {passive:false} and guard e.cancelable. Real-device suppression
            // (especially in the standalone PWA) is validated by Viktor live
            // (scripts/devserve/pinch-probe.html); the CDP battery proves the
            // Chromium model and the WebKit handler wiring.

            // Shared commit plumbing (both front-ends). Defined on any coarse

            // mobile) — this whole block is coarse-pointer-only already.
            const PINCH_CLASSIFY_MOVE = 3;     // Chromium: classify at 2f-move 3

                    start(e) {

                        }

                        if (!(terminalEl.contains(a.target) && terminalEl.contains(b.target))) return;

                            ids: [a.identifier, b.identifier],
                            span0: pinchSpan(e.touches),
                            moves: 0, claimed: false, dead: false,
                            baseFont: getPrefs().fontSize,
                            lastTarget: null
                        };

                    move(e) {
                        if (!pz || pz.dead) return;

                                e.touches[0].identifier !== pz.ids[0] ||
                                e.touches[1].identifier !== pz.ids[1]) {
                            pz.dead = true;   // finger substituted
                            return;

                        // never preventDefault a non-cancelable event

                            if (pz.moves < PINCH_CLASSIFY_MOVE) return;
                            if (Math.abs(ratio - 1) < PINCH_CLASSIFY_RATIO) {
                                pz.dead = true;   // RELEASE: span-constant = 2f pan
                                return;
                            }
                            pz.claimed = true;
                            showFontPill(getPrefs().fontSize);   // readout from claim
                        }

                            pz.baseFont + Math.trunc((ratio - 1) / PINCH_STEP_RATIO));
                        if (target !== pz.lastTarget) {
                            pz.lastTarget = target;
                            if (target !== getPrefs().fontSize) applyFontSize(target);
                            showFontPill(target);
                        }
                    },
                    end(e) {
                        if (!pz) return;
                        if (e.touches.length < 2) {   // pinch needs both fingers
                            pz = null;
                            hideFontPillSoon();
                        }
                    },
                    reset() {
                        pz = null;
                        hideFontPillSoon();
                    }
                });
            }
