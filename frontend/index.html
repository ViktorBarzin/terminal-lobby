    <script>
    (async function() {
        // Stamped by deploy.sh at install time; 'dev' when served from a checkout.
        const TL_BUILD = '__TL_BUILD__';
        console.log('terminal-lobby build:', TL_BUILD);
        try { document.documentElement.dataset.tlBuild = TL_BUILD; } catch (e) {}
        const NAME_RE = /^[a-zA-Z0-9_-]{1,32}$/;
        const SESSIONS_API = '/api/sessions/sessions';
        const RESTORE_API  = '/api/sessions/restore';
        const WHOAMI_API   = '/api/sessions/whoami';
        const LAYOUT_API   = '/api/sessions/layout';
        const params = new URLSearchParams(location.search);
        const rawArg = params.get('arg');
        const validArg = rawArg && NAME_RE.test(rawArg) ? rawArg : null;

        // Theme — shared by lobby + terminal-mode iframe (same-origin
        // localStorage). The canonical name list ('system' included) and the
        // class+meta applier live in the pre-paint boot script at the top of
        // <body>, which already painted the first frame before this ran.
        const THEMES = window.__tlThemes;
        const THEME_KEY = 'tmux-theme';
        function getTheme() {
            try {
                const t = localStorage.getItem(THEME_KEY);
                return THEMES.includes(t) ? t : 'slate';
            } catch (e) { return 'slate'; }
        }
        const applyTheme = window.__tlApplyTheme;
        function readTerminalTheme() {
            const cs = getComputedStyle(document.body);
            const v = k => cs.getPropertyValue(k).trim();
            // Full ITheme: the original four keys keep their hard fallbacks
            // (slate), cursorAccent inverts to the theme bg, and the 16 ANSI
            // slots come from the per-theme --terminal-ansi-* vars (fallbacks
            // = the T3-seeded dark set, matching the slate default).
            return {
                background: v('--terminal-bg') || '#0d1117',
                foreground: v('--terminal-fg') || '#e6e8eb',
                cursor: v('--terminal-cursor') || '#4493f8',
                cursorAccent: v('--terminal-cursor-accent') || v('--terminal-bg') || '#0d1117',
                selectionBackground: v('--terminal-selection') || 'rgba(68,147,248,0.22)',
                black: v('--terminal-ansi-black') || '#161b22',
                red: v('--terminal-ansi-red') || '#ff7a8e',
                green: v('--terminal-ansi-green') || '#86e795',
                yellow: v('--terminal-ansi-yellow') || '#f4cd72',
                blue: v('--terminal-ansi-blue') || '#89beff',
                magenta: v('--terminal-ansi-magenta') || '#d0b0ff',
                cyan: v('--terminal-ansi-cyan') || '#7ce8ed',
                white: v('--terminal-ansi-white') || '#d2dae6',
                brightBlack: v('--terminal-ansi-bright-black') || '#6e7888',
                brightRed: v('--terminal-ansi-bright-red') || '#ffa8b4',
                brightGreen: v('--terminal-ansi-bright-green') || '#b0f5ba',
                brightYellow: v('--terminal-ansi-bright-yellow') || '#ffe095',
                brightBlue: v('--terminal-ansi-bright-blue') || '#aed2ff',
                brightMagenta: v('--terminal-ansi-bright-magenta') || '#e5cbff',
                brightCyan: v('--terminal-ansi-bright-cyan') || '#a7f4f7',
                brightWhite: v('--terminal-ansi-bright-white') || '#f4f7fc',
                // Scrollbar slider colors (Task 1.10). INERT on the pinned
                // xterm 5.5.0 — its ITheme has no scrollbarSlider* keys
                // (verified against the published typings); unknown keys are
                // simply never read. The names match the 6.x ITheme exactly,
                // so the deferred xterm-6 upgrade gets themed scrollbars for
                // free. Values track the lobby scrollbar tokens.
                scrollbarSliderBackground:
                    v('--scrollbar-thumb') || 'rgba(255,255,255,0.1)',
                scrollbarSliderHoverBackground:
                    v('--scrollbar-thumb-hover') || 'rgba(255,255,255,0.18)',
                scrollbarSliderActiveBackground:
                    v('--scrollbar-thumb-active') || 'rgba(255,255,255,0.22)'
            };
        }
        applyTheme(getTheme());

        // Terminal font size (Task 1.8) — persisted and clamped, shared by
        // the lobby's A−/A+ stepper, the terminal-mode floating stepper and
        // the xterm constructor (15 was the historical hardcoded value).
        const FONT_SIZE_KEY = 'tl-font-size';
        const FONT_SIZE_MIN = 10, FONT_SIZE_MAX = 22, FONT_SIZE_DEFAULT = 15;
        function clampFontSize(n) {
            n = Math.round(Number(n));
            if (!Number.isFinite(n)) return FONT_SIZE_DEFAULT;
            return Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, n));
        }
        function getFontSize() {
            try {
                const v = localStorage.getItem(FONT_SIZE_KEY);
                return v === null ? FONT_SIZE_DEFAULT : clampFontSize(v);
            } catch (e) { return FONT_SIZE_DEFAULT; }
        }
        function setFontSize(n) {
            try { localStorage.setItem(FONT_SIZE_KEY, String(n)); } catch (e) {}
        }

        // ---- roaming terminal prefs (Task 2.6) -------------------------
        // tl:prefs:v1 — the settings-panel document: fontSize, lineHeight,
        // letterSpacing, cursorStyle, cursorBlink, fontWeightBold. Every
        // read passes the validate-or-default wrapper (normalizePrefs), so
        // garbage in localStorage — or roamed from the server — degrades
        // per-field to defaults, never a crash. Deliberately ABSENT (red
        // line): smoothScrollDuration, renderer toggles, and every mouse/
        // wheel/scroll option.
        //
        // fontSize is shared with the Task 1.8 stepper: every change
        // writes the legacy tl-font-size key too (stale builds and the
        // 1.8 plumbing read it at boot), and that key seeds the doc while
        // it has no valid fontSize of its own.
        //
        // Roaming: mirrored to tmux-api /prefs per OS user (same whole-
        // document, last-writer-wins shape as /layout). Boot order:
        // localStorage applies immediately (the constructor can't wait on
        // the network); one GET then adopts the server copy — unless the
        // user already changed something (prefsDirty in this frame, the
        // tl:prefs-dirty:v1 marker across frames), in which case the
        // local change wins and is pushed up instead. Every change PUTs
        // (debounced); a failed PUT just leaves localStorage ahead —
        // marker uncleared — until a later PUT lands.
        const PREFS_KEY = 'tl:prefs:v1';
        const PREFS_API = '/api/sessions/prefs';
        const PREF_DEFAULTS = Object.freeze({
            fontSize: FONT_SIZE_DEFAULT,
            lineHeight: 1,          // xterm default
            letterSpacing: 0,       // px; fractional ok (device-pixel rounding)
            cursorStyle: 'block',
            cursorBlink: true,      // the historical constructor value
            fontWeightBold: '700'   // Task 1.3 pinned the real JBM 700 face
        });
        const PREF_VALID = {
            fontSize: v => Number.isInteger(v) && v >= FONT_SIZE_MIN && v <= FONT_SIZE_MAX,
            lineHeight: v => Number.isFinite(v) && v >= 1 && v <= 1.4,
            letterSpacing: v => Number.isFinite(v) && v >= 0 && v <= 1,
            cursorStyle: v => v === 'block' || v === 'bar' || v === 'underline',
            cursorBlink: v => typeof v === 'boolean',
            fontWeightBold: v => v === '600' || v === '700'
        };
        function readRawPrefs() {
            try {
                const raw = JSON.parse(localStorage.getItem(PREFS_KEY));
                return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : null;
            } catch (e) { return null; }
        }
        // validate-or-default: unknown keys dropped, invalid values → default.
        function normalizePrefs(raw) {
            const out = Object.assign({}, PREF_DEFAULTS);
            if (raw && typeof raw === 'object') {
                for (const k of Object.keys(PREF_VALID)) {
                    if (PREF_VALID[k](raw[k])) out[k] = raw[k];
                }
            }
            return out;
        }
        function getPrefs() {
            const raw = readRawPrefs();
            const p = normalizePrefs(raw);
            // Doc carries no usable fontSize → the Task 1.8 key seeds it.
            if (!(raw && PREF_VALID.fontSize(raw.fontSize))) p.fontSize = getFontSize();
            return p;
        }
        let prefsDirty = false;    // a local change happened this page-life
        // prefsDirty is PER-FRAME, but the lobby and the terminal iframe
        // each run their own bootSyncPrefs against the SAME localStorage:
        // a change made in one frame must also stop the OTHER frame's
        // in-flight boot GET from adopting the stale server doc over it
        // (2026-07-11 battery fail: panel change during the iframe's GET
        // snapped back). setPrefs stamps this marker; a PUT that acks
        // while the stamp is unchanged retires it — so an UNACKED change
        // (failed PUT, closed tab) survives reloads and keeps winning
        // until some frame pushes it up.
        const PREFS_DIRTY_KEY = 'tl:prefs-dirty:v1';
        function prefsDirtyMark() {
            try { return localStorage.getItem(PREFS_DIRTY_KEY); } catch (e) { return null; }
        }
        let prefsPutTimer = null;
        function schedulePrefsPut() {
            clearTimeout(prefsPutTimer);
            prefsPutTimer = setTimeout(() => {
                prefsPutTimer = null;
                const sentMark = prefsDirtyMark();
                fetch(PREFS_API, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(getPrefs())
                }).then((resp) => {
                    // Server holds this doc now: retire the dirty marker —
                    // unless a NEWER change re-stamped it mid-flight (its
                    // own debounced PUT is coming).
                    if (resp.ok && sentMark !== null && prefsDirtyMark() === sentMark) {
                        try { localStorage.removeItem(PREFS_DIRTY_KEY); } catch (e) {}
                    }
                }).catch(() => { /* offline/api down: localStorage still holds it */ });
            }, 400);
        }
        // Merge a patch in, persist both keys, notify this window (same-tab
        // CustomEvent — localStorage 'storage' events only fire in OTHER
        // windows), and sync up. Returns the resulting doc.
        function setPrefs(patch) {
            const cur = getPrefs();
            const next = normalizePrefs(Object.assign({}, cur, patch));
            if (JSON.stringify(next) === JSON.stringify(cur)) return cur;
            prefsDirty = true;
            try { localStorage.setItem(PREFS_DIRTY_KEY, String(Date.now())); } catch (e) {}
            try { localStorage.setItem(PREFS_KEY, JSON.stringify(next)); } catch (e) {}
            if (next.fontSize !== cur.fontSize) setFontSize(next.fontSize);
            try { window.dispatchEvent(new CustomEvent('tl-prefs-change', { detail: next })); } catch (e) {}
            schedulePrefsPut();
            return next;
        }
        // Server copy → local. No PUT-back: adoption is not a user change.
        // Server fields win; fields the server never saw fall back to the
        // local doc, then defaults (a partial server doc must not reset
        // local choices).
        function adoptPrefs(serverDoc) {
            const before = JSON.stringify(getPrefs());
            const remote = (serverDoc && typeof serverDoc === 'object' && !Array.isArray(serverDoc)) ? serverDoc : {};
            const merged = Object.assign({}, readRawPrefs() || {}, remote);
            const next = normalizePrefs(merged);
            if (!PREF_VALID.fontSize(merged.fontSize)) next.fontSize = getFontSize();
            try { localStorage.setItem(PREFS_KEY, JSON.stringify(next)); } catch (e) {}
            setFontSize(next.fontSize);   // keep the legacy key in step
            if (JSON.stringify(next) !== before) {
                try { window.dispatchEvent(new CustomEvent('tl-prefs-change', { detail: next })); } catch (e) {}
            }
        }
        // Boot fetch — fire-and-forget; localStorage wins until the first
        // successful GET lands. Runs in BOTH modes: the lobby forwards
        // adopted changes into an open iframe, and a deep-linked terminal
        // page (?arg= opened directly) still roams on its own.
        (async function bootSyncPrefs() {
            let doc = null;
            try {
                const resp = await fetch(PREFS_API, { credentials: 'same-origin' });
                if (!resp.ok) return;              // keep local; next boot retries
                doc = await resp.json();
            } catch (e) { return; }
            // User moved first — local wins. prefsDirty covers changes made
            // in THIS frame; the marker covers the sibling frame (its own
            // PUT is pending) and unacked changes from a previous page-life.
            if (prefsDirty || prefsDirtyMark() !== null) { schedulePrefsPut(); return; }
            const hasAny = doc && typeof doc === 'object' && !Array.isArray(doc) &&
                Object.keys(PREF_VALID).some(k => PREF_VALID[k](doc[k]));
            if (hasAny) adoptPrefs(doc);
            else if (readRawPrefs()) schedulePrefsPut();     // seed a fresh server doc
        })();

        // ---- typed toast manager (Task 2.7) ---------------------------
        // T3's toast surface (apps/web ui/toast.tsx) reduced to vanilla
        // DOM: five types with icons, id-based update-in-place + close,
        // long descriptions clamp to 4 lines with a Copy button, optional
        // expandable detail rows. The old single-element #toast div is now
        // the stack viewport (see the CSS block).
        const tlToast = (() => {
            const stack = document.getElementById('toast');
            const ICONS = { error: '✕', warning: '⚠', success: '✓', info: 'ℹ', loading: '' };
            const CLAMP_MIN_CHARS = 180; // T3: shorten long bodies visually; Copy keeps the full string
            const MAX_STACK = 6;
            const toasts = new Map(); // id → {id, el, opts, timer, expanded}
            let seq = 0;
            // "has any toast" marker — battery A.3 asserts #toast.visible.
            function syncVisible() { stack.classList.toggle('visible', toasts.size > 0); }
            function render(t) {
                const o = t.opts;
                clearChildren(t.el);
                const type = ICONS.hasOwnProperty(o.type) ? o.type : 'info';
                t.el.className = 'toast-card t-' + type;
                const icon = document.createElement('span');
                icon.className = 't-icon';
                icon.textContent = ICONS[type];
                t.el.appendChild(icon);
                const body = document.createElement('div');
                body.className = 't-body';
                const title = document.createElement('div');
                title.className = 't-title';
                title.textContent = o.title || '';
                body.appendChild(title);
                const desc = typeof o.description === 'string' ? o.description : '';
                if (desc) {
                    const d = document.createElement('div');
                    d.className = 't-desc' + (desc.length >= CLAMP_MIN_CHARS ? ' t-clamp' : '');
                    d.textContent = desc;
                    body.appendChild(d);
                }
                if (Array.isArray(o.detail) && o.detail.length) {
                    const labels = o.expandLabels || {};
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 't-expand';
                    const panel = document.createElement('div');
                    panel.className = 't-detail';
                    const paintExpand = () => {
                        btn.textContent = t.expanded
                            ? (labels.collapse || 'Hide details') + ' ▴'
                            : (labels.expand || 'Show details') + ' ▾';
                        panel.classList.toggle('hidden', !t.expanded);
                    };
                    btn.addEventListener('click', () => { t.expanded = !t.expanded; paintExpand(); });
                    for (const row of o.detail) {
                        const r = document.createElement('div');
                        r.className = 't-detail-row';
                        const main = document.createElement('div');
                        main.textContent = row.text || '';
                        r.appendChild(main);
                        if (row.sub) {
                            const sub = document.createElement('div');
                            sub.className = 't-detail-sub';
                            sub.textContent = row.sub;
                            r.appendChild(sub);
                        }
                        panel.appendChild(r);
                    }
                    paintExpand();
                    body.appendChild(btn);
                    body.appendChild(panel);
                }
                t.el.appendChild(body);
                if (desc && (type === 'error' || desc.length >= CLAMP_MIN_CHARS)) {
                    const copy = document.createElement('button');
                    copy.type = 'button';
                    copy.className = 't-copy';
                    copy.title = 'Copy message';
                    copy.textContent = '⧉';
                    copy.addEventListener('click', () => {
                        (navigator.clipboard
                            ? navigator.clipboard.writeText(desc)
                            : Promise.reject()
                        ).then(() => {
                            copy.textContent = '✓';
                            setTimeout(() => { copy.textContent = '⧉'; }, 1200);
                        }).catch(() => {});
                    });
                    t.el.appendChild(copy);
                }
                const x = document.createElement('button');
                x.type = 'button';
                x.className = 't-x';
                x.title = 'Dismiss';
                x.textContent = '×';
                x.addEventListener('click', () => close(t.id));
                t.el.appendChild(x);
            }
            function arm(t) {
                clearTimeout(t.timer);
                const ms = t.opts.timeout === undefined ? 3000 : t.opts.timeout;
                if (ms > 0) t.timer = setTimeout(() => close(t.id), ms); // 0 = sticky
            }
            function add(opts) {
                // Cap the stack: drop the oldest auto-dismiss card first so
                // a burst can never bury a sticky health toast (the old
                // single-element toast simply replaced itself).
                if (toasts.size >= MAX_STACK) {
                    let victim = null;
                    for (const t of toasts.values()) { if (t.timer) { victim = t; break; } }
                    close((victim || toasts.values().next().value).id);
                }
                const id = ++seq;
                const t = { id, el: document.createElement('div'),
                            opts: opts || {}, timer: null, expanded: false };
                toasts.set(id, t);
                render(t);
                arm(t);
                stack.appendChild(t.el);
                syncVisible();
                return id;
            }
            function update(id, opts) {
                const t = toasts.get(id);
                if (!t) return;
                Object.assign(t.opts, opts || {});
                render(t); // t.expanded survives the re-render
                arm(t);
            }
            function close(id) {
                const t = toasts.get(id);
                if (!t) return;
                clearTimeout(t.timer);
                toasts.delete(id);
                t.el.remove();
                syncVisible();
            }
            return { add, update, close };
        })();
        window.__tlToast = tlToast; // battery hook

        // Legacy signature kept as a thin wrapper — every pre-existing call
        // site works unchanged: ''/undefined type → info, `duration || 3000`
        // matches the old timer default exactly.
        function showToast(msg, type, duration) {
            tlToast.add({
                type: type === 'error' || type === 'success' ? type : 'info',
                title: msg,
                timeout: duration || 3000
            });
        }

        // ---- slow-request health toast (Task 2.7) ---------------------
        // Port of T3's requestLatencyState + SlowRpcRequestToastCoordinator:
        // every tmux-api/clipboard-upload fetch (and the terminal WS connect,
        // tracked from the connect path) is "pending" until acknowledged;
        // anything pending >15s joins ONE self-updating sticky warning toast,
        // which closes when the last slow item acks. Failures ack too — the
        // caller's own error handling owns that messaging.
        const SLOW_ACK_MS = 15000;
        const slowRequests = (() => {
            const MAX_TRACKED = 64; // hard cap — a leak must not grow unbounded
            const pending = new Map(); // id → {tag, startedAtMs, timer}
            const slow = new Map();    // id → {tag, startedAtMs}
            let seq = 0;
            let toastId = null;
            function repaint() {
                if (!slow.size) {
                    if (toastId !== null) { tlToast.close(toastId); toastId = null; }
                    return;
                }
                const list = Array.from(slow.values());
                const opts = {
                    type: 'warning',
                    title: 'Some requests are slow',
                    description: list.length + ' request' + (list.length === 1 ? '' : 's')
                        + ' waiting longer than ' + Math.round(SLOW_ACK_MS / 1000) + 's.',
                    detail: list.map(r => ({
                        text: r.tag,
                        sub: 'Started ' + new Date(r.startedAtMs).toLocaleTimeString()
                    })),
                    expandLabels: { expand: 'Show requests', collapse: 'Hide requests' },
                    timeout: 0
                };
                if (toastId === null) toastId = tlToast.add(opts);
                else tlToast.update(toastId, opts);
            }
            function track(tag) {
                if (pending.size + slow.size >= MAX_TRACKED) return 0;
                const id = ++seq;
                const startedAtMs = Date.now();
                pending.set(id, {
                    tag, startedAtMs,
                    timer: setTimeout(() => {
                        pending.delete(id);
                        slow.set(id, { tag, startedAtMs });
                        repaint();
                    }, SLOW_ACK_MS)
                });
                return id;
            }
            function ack(id) {
                if (!id) return;
                const p = pending.get(id);
                if (p) { clearTimeout(p.timer); pending.delete(id); return; }
                if (slow.delete(id)) repaint();
            }
            return { track, ack };
        })();
        window.__tlSlowRequests = slowRequests; // battery hook

        // Wrap fetch so every tmux-api/clipboard-upload call site (present
        // and future) is tracked without touching the call sites. Anything
        // else — the stale-tab healer's self-fetch, ttyd's /token, CDN
        // assets — passes straight through.
        const tlRealFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            let u = null;
            try {
                u = new URL(
                    typeof input === 'string' ? input
                        : (input instanceof URL ? input.href : input.url),
                    location.href
                );
            } catch (e) { /* unparseable → untracked */ }
            if (!u || u.origin !== location.origin
                   || !/^\/(api\/sessions|clipboard)\//.test(u.pathname)) {
                return tlRealFetch(input, init);
            }
            const method = ((init && init.method)
                || (input && typeof input === 'object' && input.method) || 'GET').toUpperCase();
            const id = slowRequests.track(method + ' ' + u.pathname);
            const p = tlRealFetch(input, init);
            // Ack on headers-arrived or failure; return the ORIGINAL promise
            // so caller semantics (incl. rejection) are untouched.
            p.then(() => slowRequests.ack(id), () => slowRequests.ack(id));
            return p;
        };

        function clearChildren(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function emptyState(text) {
            const e = document.createElement('div');
            e.className = 'empty';
            e.textContent = text;
            return e;
        }

        // ---- right-click context menu (Task 2.5) -----------------------
        // Promise-based DOM menu, ported from T3's contextMenuFallback.ts
        // (rAF first-frame dismissal guard + 4px viewport clamping;
        // submenus dropped — flat items only). Shares the .popup-menu
        // visual language and item shape ({label, onClick, danger?,
        // disabled?} / {labelHeading}); resolves with the PICKED ITEM (the
        // caller runs its onClick), or null on dismissal. Callers attach
        // `contextmenu` ONLY to lobby session cards and gallery thumbs —
        // NEVER the xterm surface, which keeps its native browser menu
        // (red line: no mouse-semantics changes). Dismissal listeners ride
        // window-capture so they run before any document-level Escape
        // handlers (gallery/lightbox) — one Escape closes one layer.
        function showContextMenu(x, y, items) {
            return new Promise((resolve) => {
                const menu = document.createElement('div');
                menu.className = 'popup-menu';
                let disposed = false;
                // T3's canDismissFromPointer: the pointer gesture that
                // OPENED the menu is still dispatching — outside-dismissal
                // arms one frame later or the menu dies as it is born.
                let canDismiss = false;
                const cleanup = (result) => {
                    if (disposed) return;
                    disposed = true;
                    window.removeEventListener('keydown', onKey, true);
                    window.removeEventListener('pointerdown', onPointer, true);
                    window.removeEventListener('contextmenu', onCtx, true);
                    menu.remove();
                    resolve(result);
                };
                const onKey = (e) => {
                    if (e.key !== 'Escape') return;
                    e.preventDefault();
                    e.stopPropagation();
                    cleanup(null);
                };
                const onPointer = (e) => {
                    if (!canDismiss || menu.contains(e.target)) return;
                    cleanup(null);
                };
                const onCtx = (e) => {
                    if (!canDismiss || menu.contains(e.target)) return;
                    e.preventDefault();   // this right-click dismisses, it doesn't browse
                    cleanup(null);
                };
                for (const it of items) {
                    if (it.labelHeading) {
                        const l = document.createElement('div');
                        l.className = 'menu-label';
                        l.textContent = it.labelHeading;
                        menu.appendChild(l);
                        continue;
                    }
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = it.label;
                    if (it.danger) b.classList.add('danger');
                    if (it.disabled) b.disabled = true;
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        cleanup(it);
                    });
                    menu.appendChild(b);
                }
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                document.body.appendChild(menu);
                requestAnimationFrame(() => {
                    // 4px viewport clamp (T3's clampMenuPosition), after
                    // layout so the measured size is real.
                    const r = menu.getBoundingClientRect();
                    menu.style.left = Math.min(Math.max(4, x),
                        Math.max(4, window.innerWidth - r.width - 4)) + 'px';
                    menu.style.top = Math.min(Math.max(4, y),
                        Math.max(4, window.innerHeight - r.height - 4)) + 'px';
                    canDismiss = true;
                });
                window.addEventListener('keydown', onKey, true);
                window.addEventListener('pointerdown', onPointer, true);
                window.addEventListener('contextmenu', onCtx, true);
            });
        }

        function showAccessDenied(detail) {
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            document.getElementById('font-inc-btn').classList.add('hidden');
            document.getElementById('font-dec-btn').classList.add('hidden');
            const lobby = document.getElementById('lobby');
            clearChildren(lobby);
            const h = document.createElement('h1');
            h.className = 'lobby-header';
            h.textContent = 'Access denied';
            lobby.appendChild(h);
            const p = document.createElement('p');
            p.className = 'lobby-sub';
            p.textContent = detail || 'You do not have a terminal account on this server.';
            lobby.appendChild(p);
            const p2 = document.createElement('p');
            p2.className = 'lobby-sub';
            p2.textContent = 'Authentik logs you in; access here requires an OS-user mapping in /etc/ttyd-user-map. Ask Viktor to add one.';
            lobby.appendChild(p2);
            lobby.classList.add('visible', 'access-denied');

            if (resp.status === 401 || resp.status === 403) {
                showAccessDenied((await resp.text()).trim());
                return;
            }
            if (!resp.ok) {
                showAccessDenied('Preflight failed: HTTP ' + resp.status);
                return;
            }
            whoami = await resp.json();
        } catch (err) {
            showAccessDenied('Preflight failed: ' + err.message);
            return;
        }

        if (!validArg) {
            // ============================================================
            // LOBBY MODE — no valid ?arg=, render sidebar + iframe shell
            // ============================================================
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            document.getElementById('font-inc-btn').classList.add('hidden');
            document.getElementById('font-dec-btn').classList.add('hidden');
            document.getElementById('lobby').classList.add('visible');
            // Lobby-scoped styling hook (Task 1.11): drives the film-grain
            // overlay (body.lobby::after). Never set in terminal mode, so
            // the inner iframe document stays grain-free; applyTheme only
            // strips theme-* classes, so this survives theme switches.
            document.body.classList.add('lobby');
            const baseTitle = 'tmux sessions (' + whoami.osUser + ')';
            document.title = baseTitle;
            document.querySelector('#lobby .lobby-sub').textContent =
                'Logged in as ' + whoami.osUser + ' (' + whoami.authentik + '). Sessions are kernel-isolated per Unix user; you only see your own.';

            const listEl    = document.getElementById('session-list');
            const newNameEl = document.getElementById('new-name');
            const newBtnEl  = document.getElementById('new-btn');
            const newProjectBtnEl = document.getElementById('new-project-btn');
            const restoreBtnEl = document.getElementById('restore-btn');
            const frameEl   = document.getElementById('session-frame');
            const emptyEl   = document.getElementById('lobby-empty');

            // Loading skeletons (Task 1.11d): three shimmer cards fill
            // #session-list until the first /sessions response — paint()
            // and both renderLobby error paths start with
            // clearChildren(listEl), which removes them.
            for (let i = 0; i < 3; i++) {
                const sk = document.createElement('div');
                sk.className = 'session-skeleton';
                sk.setAttribute('aria-hidden', 'true');
                listEl.appendChild(sk);
            }

            let currentActive = null;
            // A session is "confirmed" once a /sessions poll has actually listed
            // it. Only a confirmed-then-vanished session means it was killed
            // elsewhere (→ deactivate). A freshly-activated session that has
            // never appeared yet is still being CREATED — its tmux session is
            // born only after the iframe's WebSocket reaches ttyd (whoami →
            // token → ws). Tearing the iframe down before then aborts that very
            // chain ("Token fetch failed: TypeError: Failed to fetch"), so the
            // session never gets created. Gate deactivation on this flag.
            let activeConfirmed = false;
            let dragSrcCard = null;
            // Dragging a project header reorders whole groups; mutually
            // exclusive with dragSrcCard (a drag is one or the other).
            let dragSrcGroup = null;
            let isDragging = false;
            // Legacy per-browser drag-order; used once to seed the server-side
            // layout, then left alone.
            const ORDER_KEY = 'tmux-session-order-' + whoami.osUser;

            // The user's sidebar layout: ordered projects (may reference dead
            // sessions — kept so restores regroup, see ADR-0002) + ungrouped
            // order. Server-side so it roams across devices.
            let layout = { version: 1, projects: [], ungrouped: [], ungroupedIndex: 0 };
            let layoutLoaded = false;
            // Last /sessions payload — lets layout mutations repaint instantly
            // without waiting for the next poll.
            let lastSessions = [];

            function relativeTime(epochSec) {
                if (!epochSec) return '';
                const diff = Math.floor(Date.now() / 1000) - epochSec;
                if (diff < 60)    return diff + 's ago';
                if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            }

            function getSavedOrder() {
                try {
                    const raw = localStorage.getItem(ORDER_KEY);
                    if (!raw) return [];
                    const arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string') : [];
                } catch (e) { return []; }
            }

            // --- layout store client -----------------------------------------

            async function fetchLayout() {
                const resp = await fetch(LAYOUT_API, { credentials: 'same-origin' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const l = await resp.json();
                l.projects  = Array.isArray(l.projects)  ? l.projects  : [];
                l.ungrouped = Array.isArray(l.ungrouped) ? l.ungrouped : [];
                l.ungroupedIndex = Number.isInteger(l.ungroupedIndex)
                    ? Math.max(0, Math.min(l.ungroupedIndex, l.projects.length))
                    : 0;
                return l;
            }

            // The sidebar is one ordered sequence of groups: the Ungrouped
            // section (sentinel) sitting at ungroupedIndex among the projects.
            // All reordering goes through this sequence so moving anything
            // past anything else — including Ungrouped itself — is one code
            // path.
            function groupSeq() {
                const seq = layout.projects.slice();
                seq.splice(Math.min(layout.ungroupedIndex, seq.length), 0, UNGROUPED_COLLAPSE_ID);
                return seq;
            }
            function applyGroupSeq(seq) {
                layout.ungroupedIndex = seq.indexOf(UNGROUPED_COLLAPSE_ID);
                layout.projects = seq.filter(x => x !== UNGROUPED_COLLAPSE_ID);
            }

            async function putLayout() {
                const resp = await fetch(LAYOUT_API, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(layout)
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
            }

            // Mutate-then-save: repaint optimistically, then persist; on failure
            // re-fetch so the sidebar snaps back to the server's truth.
            async function saveLayout() {
                paint();
                try {
                    await putLayout();
                } catch (err) {
                    showToast('Saving layout failed: ' + err.message, 'error', 4000);
                    try { layout = await fetchLayout(); } catch (e) { /* next poll */ }
                    paint();
                }
            }

            function projectOfSession(name) {
                for (const p of layout.projects) {
                    if (p.sessions.includes(name)) return p.name;
                }
                return '';
            }

            // Remove a session from every layout list (before re-inserting it
            // somewhere else). Returns true when something was removed.
            function pullFromLayout(name) {
                let removed = false;
                for (const p of layout.projects) {
                    const i = p.sessions.indexOf(name);
                    if (i >= 0) { p.sessions.splice(i, 1); removed = true; }
                }
                const i = layout.ungrouped.indexOf(name);
                if (i >= 0) { layout.ungrouped.splice(i, 1); removed = true; }
                return removed;
            }

            function moveSessionTo(name, projectName) {
                pullFromLayout(name);
                if (projectName === '') {
                    layout.ungrouped.push(name);
                } else {
                    const p = layout.projects.find(p => p.name === projectName);
                    if (!p) return;
                    p.sessions.push(name);
                }
                saveLayout();
            }

            // Rebuild ordering from the rendered cards after a drag. Live-card
            // order comes from the DOM; dead members (not rendered) are
            // re-appended to their project so a drag never drops the
            // assignments that make OOM restores regroup.
            function captureLayoutFromDom() {
                const deadByProject = new Map();
                const liveNames = new Set(lastSessions.map(s => s.name));
                for (const p of layout.projects) {
                    deadByProject.set(p.name, p.sessions.filter(n => !liveNames.has(n)));
                }
                const deadUngrouped = layout.ungrouped.filter(n => !liveNames.has(n));

                const projects = [];
                let ungrouped = [];
                let ungroupedIndex = -1;
                listEl.querySelectorAll('.project-group').forEach(group => {
                    const name = group.dataset.project;
                    const members = Array.from(group.querySelectorAll('.session-card')).map(c => c.dataset.name);
                    if (name === '') {
                        ungrouped = members.concat(deadUngrouped);
                        ungroupedIndex = projects.length;
                    } else {
                        projects.push({ name, sessions: members.concat(deadByProject.get(name) || []) });
                    }
                });
                // The ungrouped group isn't rendered while empty — keep its
                // dead entries and its stored slot anyway.
                if (ungroupedIndex < 0) {
                    ungrouped = deadUngrouped;
                    ungroupedIndex = Math.min(layout.ungroupedIndex, projects.length);
                }
                layout = { version: 1, projects, ungrouped, ungroupedIndex };
            }

            // --- collapse state (per-browser view preference) ----------------

            const COLLAPSE_KEY = 'tmux-collapsed-' + whoami.osUser;
            const UNGROUPED_COLLAPSE_ID = '__ungrouped__';
            function getCollapsed() {
                try {
                    const raw = localStorage.getItem(COLLAPSE_KEY);
                    const obj = raw ? JSON.parse(raw) : {};
                    return (obj && typeof obj === 'object') ? obj : {};
                } catch (e) { return {}; }
            }
            function setCollapsed(id, collapsed) {
                const all = getCollapsed();
                if (collapsed) all[id] = 1; else delete all[id];
                try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(all)); } catch (e) {}
            }
            // Activating a session hidden inside a collapsed project would
            // highlight nothing — auto-expand its group.
            function ensureSessionVisible(name) {
                const proj = projectOfSession(name);
                const id = proj === '' ? UNGROUPED_COLLAPSE_ID : proj;
                if (getCollapsed()[id]) {
                    setCollapsed(id, false);
                    paint();
                }
            }

            function updateActiveCard() {
                listEl.querySelectorAll('.session-card').forEach(c => {
                    if (c.dataset.name === currentActive) c.classList.add('active');
                    else c.classList.remove('active');
                });
            }

            // On touch + small screen, the first session activation collapses
            // the sidebar so the terminal gets the full viewport. We stamp a
            // localStorage flag so we don't fight users who manually re-open it.
            const MOBILE_AUTO_COLLAPSE_KEY = 'tmux-mobile-auto-collapsed';
            const mobileQuery = matchMedia('(pointer: coarse) and (max-width: 720px)');
            function maybeAutoCollapseSidebar() {
                if (!mobileQuery.matches) return;
                try {
                    if (localStorage.getItem(MOBILE_AUTO_COLLAPSE_KEY) === 'done') return;
                    localStorage.setItem(MOBILE_AUTO_COLLAPSE_KEY, 'done');
                } catch (e) { /* localStorage disabled — best-effort */ }
                setSidebarCollapsed(true);
            }

            // --- status pills v2 (Task 2.4) -----------------------------
            // "Unseen done" bookkeeping, T3's hasUnseenCompletion shape: a
            // done state stays emerald only while stateChangedAt > the
            // user's last visit. The hooks don't timestamp transitions, so
            // stateChangedAt is OUR first observation of each state —
            // persisted per-browser so reloads keep both the emerald latch
            // and the working timer's start:
            //   tl:session-visits:v1  name → epoch-ms of the last attach
            //   tl:session-states:v1  name → {state, at} as of the last poll
            const VISITS_KEY = 'tl:session-visits:v1';
            const STATES_KEY = 'tl:session-states:v1';
            function readStore(key) {
                try {
                    const obj = JSON.parse(localStorage.getItem(key));
                    return (obj && typeof obj === 'object') ? obj : {};
                } catch (e) { return {}; }
            }
            function writeStore(key, obj) {
                try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
            }
            function stampVisit(name) {
                const visits = readStore(VISITS_KEY);
                visits[name] = Date.now();
                writeStore(VISITS_KEY, visits);
            }
            // Every poll: timestamp state transitions, prune dead sessions
            // from both stores, and keep the attached session "seen" while
            // the tab is actually visible (attached-but-hidden completions
            // still earn the emerald).
            function trackStateChanges(sessions) {
                const states = readStore(STATES_KEY);
                const visits = readStore(VISITS_KEY);
                const live = new Set(sessions.map(s => s.name));
                let dirtyStates = false, dirtyVisits = false;
                for (const name of Object.keys(states)) {
                    if (!live.has(name)) { delete states[name]; dirtyStates = true; }
                }
                for (const name of Object.keys(visits)) {
                    if (!live.has(name)) { delete visits[name]; dirtyVisits = true; }
                }
                for (const s of sessions) {
                    const cur = s.state || '';
                    const rec = states[s.name];
                    if (!rec || rec.state !== cur) {
                        states[s.name] = { state: cur, at: Date.now() };
                        dirtyStates = true;
                    }
                }
                if (currentActive && live.has(currentActive) && !document.hidden) {
                    visits[currentActive] = Date.now();
                    dirtyVisits = true;
                }
                if (dirtyStates) writeStore(STATES_KEY, states);
                if (dirtyVisits) writeStore(VISITS_KEY, visits);
            }
            function stateChangedAt(name) {
                const rec = readStore(STATES_KEY)[name];
                return (rec && typeof rec.at === 'number') ? rec.at : 0;
            }
            function isUnseenDone(s) {
                if (s.state !== 'done') return false;
                return stateChangedAt(s.name) > (readStore(VISITS_KEY)[s.name] || 0);
            }
            // Elapsed-time formatting, ported from T3's formatWorkingTimer
            // (MessagesTimeline.tsx): "34s", "2m 10s", "1h 5m".
            function formatWorking(elapsedMs) {
                const sec = Math.max(0, Math.floor(elapsedMs / 1000));
                if (sec < 60) return sec + 's';
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                if (h > 0) return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
                return s > 0 ? m + 'm ' + s + 's' : m + 'm';
            }
            // One shared 1 Hz ticker drives every visible working timer —
            // span.textContent only, never a card re-render (plan/T3
            // requirement). Hidden tabs skip the work; the next poll's
            // paint refreshes anyway.
            setInterval(() => {
                if (document.hidden) return;
                listEl.querySelectorAll('.working-timer').forEach(el => {
                    el.textContent = formatWorking(Date.now() - Number(el.dataset.since));
                });
            }, 1000);

            // Tab title carries an attention badge for the MAX-priority
            // state across sessions (Task 2.4; priority order mirrors T3's
            // pill ranking): awaiting ● > running ⋯ > unseen-done ✓. The
            // awaiting shape (N●) predates this task — kept verbatim.
            function updateTitle() {
                const awaiting = lastSessions.filter(s => s.state === 'awaiting').length;
                const running  = lastSessions.filter(s => s.state === 'running').length;
                const unseen   = lastSessions.filter(isUnseenDone).length;
                const badge = awaiting > 0 ? '(' + awaiting + '●) '
                            : running  > 0 ? '(' + running + '⋯) '
                            : unseen   > 0 ? '(' + unseen + '✓) ' : '';
                // Bell/output attention (Task 2.1): '● <session>' leads while
                // latched; cleared the moment the user looks again.
                const attention = attentionSession ? '● ' + attentionSession + ' ' : '';
                // While attached, lead with the live command (Task 2.5,
                // T3's tab titles): "claude — worktree". Falls back to the
                // historic user/session shape until the poll knows one.
                const active = currentActive
                    && lastSessions.find(s => s.name === currentActive);
                const cmd = active && active.pane_current_command;
                document.title = attention + badge +
                    (currentActive
                        ? (cmd ? cmd + ' — ' + currentActive
                               : 'tmux: ' + whoami.osUser + '/' + currentActive)
                        : baseTitle);
            }

            // --- attention system (Task 2.1) -----------------------------
            // Three signals, one owner: this top-level lobby document owns
            // the tab's favicon and title (the terminal is an iframe INSIDE
            // it, so anything it did to its own icon/title would be
            // invisible). Signals:
            //   1. state=awaiting — from the ADR-0001 hooks via the same
            //      /sessions polling that paints the cards (no terminal
            //      output parsing anywhere): badges the favicon while ANY
            //      session awaits input, and fires the opt-in OS
            //      notification on each →awaiting transition while hidden.
            //   2. bell — the iframe forwards term.onBell (tl-attention).
            //   3. output-while-hidden — iframe-forwarded, title prefix.
            // Bell/output latch only while the tab is hidden or the window
            // unfocused (a visible focused tab already shows the terminal;
            // a badge set then could only clear on the NEXT focus event,
            // i.e. stick around) and clear on visibility/focus return.

            let attentionSession = null;  // '● <name>' title prefix latch
            let attentionBell = false;    // favicon badge latched by a bell
            function away() { return document.hidden || !document.hasFocus(); }

            // Favicon badge: the icon canvas-rendered with an amber dot
            // top-right (--state-awaiting; the plan's 8px dot scaled to the
            // 64px favicon raster). Rendered once and cached; while the
            // icon route 404s (PWA asset carve-out lands in Wave 3) a
            // theme-colored tile stands in so the dot still shows.
            const faviconEl = document.querySelector('link[rel="icon"]');
            const FAVICON_HREF = '/icon-192.png';
            let faviconBadged = false;
            let badgedFaviconUrl = null;
            let badgedFaviconPending = false;
            function renderBadgedFavicon(done) {
                const size = 64, r = 13, cx = size - r - 3, cy = r + 3;
                const css = getComputedStyle(document.body);
                const amber = css.getPropertyValue('--state-awaiting').trim() || '#f59e0b';
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const drawDot = () => {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fillStyle = amber;
                    ctx.fill();
                    done(canvas.toDataURL('image/png'));
                };
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0, size, size); drawDot(); };
                img.onerror = () => {
                    ctx.fillStyle = css.getPropertyValue('--bg-page').trim() || '#0d1117';
                    ctx.fillRect(0, 0, size, size);
                    drawDot();
                };
                img.src = FAVICON_HREF;
            }
            function updateFavicon() {
                if (!faviconEl) return;
                const want = attentionBell ||
                    lastSessions.some(s => s.state === 'awaiting');
                if (want === faviconBadged) return;
                faviconBadged = want;
                if (!want) { faviconEl.href = FAVICON_HREF; return; }
                if (badgedFaviconUrl) { faviconEl.href = badgedFaviconUrl; return; }
                if (badgedFaviconPending) return;  // applied when the render lands
                badgedFaviconPending = true;
                renderBadgedFavicon((url) => {
                    badgedFaviconPending = false;
                    badgedFaviconUrl = url;
                    if (faviconBadged) faviconEl.href = url;
                });
            }

            // Bell / output-while-hidden signals from the session iframe.
            // Only its window is trusted (source check) — same-origin pages
            // can't spoof attention into the title from elsewhere.
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-attention') return;
                if (e.source !== frameEl.contentWindow) return;
                if (!away()) return;
                const name = (typeof e.data.session === 'string' && NAME_RE.test(e.data.session))
                    ? e.data.session : currentActive;
                if (e.data.kind === 'bell') attentionBell = true;
                attentionSession = name;
                updateTitle();
                updateFavicon();
            });
            function clearAttention() {
                if (!attentionSession && !attentionBell) return;
                attentionSession = null;
                attentionBell = false;
                updateTitle();
                updateFavicon();
            }
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) clearAttention();
            });
            window.addEventListener('focus', clearAttention);

            // Opt-in OS notifications: fired on a session's transition INTO
            // awaiting (prev poll ≠ awaiting) while the tab is hidden. The
            // tag dedupes per session — a re-fire replaces, never stacks.
            // First poll seeds silently so a (re)loaded background tab
            // doesn't re-announce a long-standing awaiting state.
            const NOTIFY_KEY = 'tl:notify:v1';
            function notifyOptedIn() {
                try { return localStorage.getItem(NOTIFY_KEY) === '1'; }
                catch (e) { return false; }
            }
            let prevStates = null;  // name → state at the previous poll
            function notifyTransitions(sessions) {
                const prev = prevStates;
                prevStates = new Map(sessions.map(s => [s.name, s.state || '']));
                if (!prev) return;
                if (!notifyOptedIn() || typeof Notification === 'undefined' ||
                    Notification.permission !== 'granted' || !document.hidden) return;
                for (const s of sessions) {
                    if (s.state !== 'awaiting') continue;
                    if (!prev.has(s.name) || prev.get(s.name) === 'awaiting') continue;
                    try {
                        const n = new Notification(s.name + ' needs input', {
                            tag: 'tl-' + s.name,
                            body: 'Claude is awaiting your input.',
                            icon: FAVICON_HREF
                        });
                        n.onclick = () => {
                            try { window.focus(); } catch (err) {}
                            activateSession(s.name);
                            n.close();
                        };
                    } catch (err) { /* constructor can throw on odd platforms */ }
                }
            }

            // Bell toggle — the ONLY place notification permission is ever
            // requested (click = user gesture; never auto-request). Opt-in
            // is per-browser in localStorage; a browser-level "denied" wins
            // and is surfaced instead of silently doing nothing.
            const notifyToggleEl = document.getElementById('notify-toggle');
            function paintNotifyToggle() {
                const on = notifyOptedIn() &&
                    typeof Notification !== 'undefined' &&
                    Notification.permission === 'granted';
                notifyToggleEl.classList.toggle('on', on);
                notifyToggleEl.setAttribute('aria-pressed', on ? 'true' : 'false');
                notifyToggleEl.title = on
                    ? 'Notifying when a session needs input (click to disable)'
                    : 'Notify me when a session needs input';
            }
            if (typeof Notification === 'undefined') {
                // iOS Safari outside an installed PWA has no Notification.
                notifyToggleEl.style.display = 'none';
            } else {
                notifyToggleEl.addEventListener('click', async () => {
                    if (notifyOptedIn() && Notification.permission === 'granted') {
                        try { localStorage.setItem(NOTIFY_KEY, '0'); } catch (e) {}
                        paintNotifyToggle();
                        return;
                    }
                    let perm = Notification.permission;
                    if (perm === 'default') {
                        try { perm = await Notification.requestPermission(); }
                        catch (e) { perm = Notification.permission; }
                    }
                    if (perm !== 'granted') {
                        showToast('Notifications are blocked in the browser settings', 'error', 4000);
                        paintNotifyToggle();
                        return;
                    }
                    try { localStorage.setItem(NOTIFY_KEY, '1'); } catch (e) {}
                    paintNotifyToggle();
                    showToast('You will be notified when a session needs input', 'success', 3000);
                });
            }
            paintNotifyToggle();

            function activateSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (currentActive === name) { updateActiveCard(); return; }
                currentActive = name;
                activeConfirmed = false;
                emptyEl.classList.add('hidden');
                frameEl.classList.remove('hidden');
                frameEl.src = '/?arg=' + encodeURIComponent(name);
                if (location.hash.slice(1) !== name) {
                    history.replaceState(null, '', '#' + name);
                }
                // Attaching = seeing (Task 2.4): clears the unseen-done
                // emerald; paint() repaints the dot + title badge now
                // rather than on the next poll.
                stampVisit(name);
                updateTitle();
                ensureSessionVisible(name);
                updateActiveCard();
                maybeAutoCollapseSidebar();
                paint();
            }

            function deactivateSession() {
                if (!currentActive && frameEl.classList.contains('hidden')) return;
                currentActive = null;
                activeConfirmed = false;
                frameEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                frameEl.src = 'about:blank';
                if (location.hash) {
                    history.replaceState(null, '', location.pathname + location.search);
                }
                updateTitle();
                updateActiveCard();
            }

            async function killSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (!confirm('Kill tmux session "' + name + '"? Any running processes inside it will be terminated.')) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(name), {
                        method: 'DELETE', credentials: 'same-origin'
                    });
                    if (resp.ok) {
                        showToast('Killed ' + name, 'success');
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else {
                        showToast('Kill failed: HTTP ' + resp.status, 'error');
                    }
                    if (currentActive === name) deactivateSession();
                    renderLobby();
                } catch (err) {
                    showToast('Kill error: ' + err.message, 'error');
                }
            }

            // Restore the current user's saved-but-dead sessions (tmux-persist
            // manifest) on demand. Non-destructive: tmux-persist skips sessions
            // that are already live, so this only recreates missing ones and
            // resumes their Claude conversations. Useful after an OOM kills the
            // tmux server without a reboot (the boot-only restore never fires).
            async function restoreSessions(btn) {
                if (btn) btn.disabled = true;
                try {
                    const resp = await fetch(RESTORE_API, { method: 'POST', credentials: 'same-origin' });
                    if (resp.ok) {
                        showToast('Restoring your saved sessions…', 'success', 3500);
                        quickRefreshAfterCreate();
                    } else if (resp.status === 401 || resp.status === 403) {
                        showToast('Not authorized to restore', 'error', 4000);
                    } else {
                        showToast('Restore failed: HTTP ' + resp.status, 'error', 4000);
                    }
                } catch (err) {
                    showToast('Restore error: ' + err.message, 'error', 4000);
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            // performRename: the network + bookkeeping half, shared by the
            // prompt flow (⋯ menu / context menu on touch) and the inline
            // editor (Task 2.5). Returns true on success.
            async function performRename(oldName, newName) {
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(oldName) + '/rename', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    if (resp.status === 204) {
                        // The server renames the layout entry too — the next
                        // fetch reflects it; mirror locally for the instant
                        // repaint.
                        for (const p of layout.projects) {
                            const i = p.sessions.indexOf(oldName);
                            if (i >= 0) p.sessions[i] = newName;
                        }
                        const ui = layout.ungrouped.indexOf(oldName);
                        if (ui >= 0) layout.ungrouped[ui] = newName;
                        // Carry the pills-v2 bookkeeping (Task 2.4) to the
                        // new key or a done session re-latches as "unseen"
                        // right after its rename.
                        for (const key of [VISITS_KEY, STATES_KEY]) {
                            const store = readStore(key);
                            if (oldName in store) {
                                store[newName] = store[oldName];
                                delete store[oldName];
                                writeStore(key, store);
                            }
                        }
                        showToast('Renamed to ' + newName, 'success');
                        if (currentActive === oldName) {
                            currentActive = newName;
                            frameEl.src = '/?arg=' + encodeURIComponent(newName);
                            history.replaceState(null, '', '#' + newName);
                            updateTitle();
                        }
                        renderLobby();
                        return true;
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else if (resp.status === 409) {
                        showToast('Name "' + newName + '" already taken', 'error', 4000);
                    } else if (resp.status === 400) {
                        showToast('Invalid name', 'error');
                    } else {
                        showToast('Rename failed: HTTP ' + resp.status, 'error');
                    }
                } catch (err) {
                    showToast('Rename error: ' + err.message, 'error');
                }
                return false;
            }

            async function renameSession(oldName) {
                if (!NAME_RE.test(oldName)) { showToast('Invalid name', 'error'); return; }
                const input = prompt('Rename "' + oldName + '" to:', oldName);
                if (input === null) return;
                const newName = input.trim();
                if (!NAME_RE.test(newName)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (newName === oldName) return;
                await performRename(oldName, newName);
            }

            // Inline rename (Task 2.5): double-click a card title → the
            // name swaps for an input posting to the same rename endpoint.
            // Enter commits, Escape/blur cancels. The card's drag is
            // disarmed while editing so selecting text inside the input
            // can't start a card drag; every key/pointer event stops at
            // the input (the card beneath activates on click/Enter/Space).
            function startInlineRename(name) {
                const card = listEl.querySelector('.session-card[data-name="' + name + '"]');
                const nameEl = card && card.querySelector('.session-name');
                if (!nameEl || nameEl.querySelector('input')) return;
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'rename-input';
                input.value = name;
                input.maxLength = 32;
                input.setAttribute('aria-label', 'Rename session ' + name);
                const wasDraggable = card.draggable;
                card.draggable = false;
                clearChildren(nameEl);
                nameEl.appendChild(input);
                let settled = false;
                function finish() {
                    if (settled) return;
                    settled = true;
                    card.draggable = wasDraggable;
                    nameEl.textContent = name;   // renderLobby repaints after a commit
                }
                for (const type of ['pointerdown', 'mousedown', 'click', 'dblclick', 'contextmenu']) {
                    input.addEventListener(type, (e) => e.stopPropagation());
                }
                input.addEventListener('keydown', async (e) => {
                    e.stopPropagation();
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        finish();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        const newName = input.value.trim();
                        if (newName === name) { finish(); return; }
                        if (!NAME_RE.test(newName)) {
                            showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                            return;   // editor stays open for correction
                        }
                        settled = true;   // block the blur-cancel during the await
                        card.draggable = wasDraggable;
                        const ok = await performRename(name, newName);
                        if (!ok) nameEl.textContent = name;
                    }
                });
                input.addEventListener('blur', finish);
                input.focus();
                input.select();
            }

            // --- focus return after overlays (Task 2.3), lobby flavor --------
            // Overlays here live OUTSIDE the terminal iframe, so "focus the
            // terminal" is a postMessage hop into it (the iframe's own
            // requestTerminalFocus rAF-focuses xterm; a stale build without
            // the tl-focus branch degrades to today's behavior). Future
            // lobby-side overlays (settings panel, Task 2.6) route their
            // dismissal through closeOverlay too.
            function requestTerminalFocus() {
                if (!currentActive || frameEl.classList.contains('hidden') ||
                    !frameEl.contentWindow) return;
                try {
                    frameEl.contentWindow.postMessage({ type: 'tl-focus' }, location.origin);
                } catch (e) {}
            }
            function closeOverlay(el) {
                if (el && el.parentNode) el.remove();
                requestTerminalFocus();
            }

            // --- popup menu (session ⋯ and project ⋯) -------------------------

            let openMenuEl = null;
            // >0 while a right-click context menu is up — pauses the poll
            // repaint exactly like openMenuEl (a 5s paint mid-aim would
            // swap the cards under the pointer).
            let ctxMenuOpen = 0;
            // refocus=true on user DISMISSALS (Escape, picking an item) —
            // the keyboard goes back to the terminal. Deliberately false
            // when replaced by another openMenu() and on outside-click
            // dismissal: the click chooses its own focus target (e.g. the
            // new-session input) and stealing it back would be worse.
            function closeMenu(refocus) {
                if (!openMenuEl) return;
                const el = openMenuEl;
                openMenuEl = null;
                if (refocus) closeOverlay(el);
                else el.remove();
            }
            // items: {label, onClick, danger?, disabled?} or {labelHeading}
            function openMenu(anchor, items) {
                closeMenu();
                const menu = document.createElement('div');
                menu.className = 'popup-menu';
                for (const it of items) {
                    if (it.labelHeading) {
                        const l = document.createElement('div');
                        l.className = 'menu-label';
                        l.textContent = it.labelHeading;
                        menu.appendChild(l);
                        continue;
                    }
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = it.label;
                    if (it.danger) b.classList.add('danger');
                    if (it.disabled) b.disabled = true;
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // refocus rides a rAF, so it lands AFTER any
                        // synchronous prompt()/confirm() the item opens —
                        // dialogs hand focus back to the terminal too.
                        closeMenu(true);
                        it.onClick();
                    });
                    menu.appendChild(b);
                }
                document.body.appendChild(menu);
                const r = anchor.getBoundingClientRect();
                const mw = menu.offsetWidth, mh = menu.offsetHeight;
                let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
                let top  = r.bottom + 4;
                if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
                menu.style.left = Math.max(8, left) + 'px';
                menu.style.top  = top + 'px';
                openMenuEl = menu;
            }
            document.addEventListener('pointerdown', (e) => {
                if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu(true);
            });

            // --- project CRUD --------------------------------------------------

            function promptProjectName(promptText, initial) {
                const input = prompt(promptText, initial || '');
                if (input === null) return null;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Project name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return null;
                }
                if (layout.projects.some(p => p.name === name)) {
                    showToast('Project "' + name + '" already exists', 'error', 4000);
                    return null;
                }
                return name;
            }

            function createProject() {
                const name = promptProjectName('New project name:');
                if (!name) return;
                layout.projects.push({ name, sessions: [] });
                saveLayout();
            }

            function renameProject(oldName) {
                const name = promptProjectName('Rename project "' + oldName + '" to:', oldName);
                if (!name || name === oldName) return;
                const p = layout.projects.find(p => p.name === oldName);
                if (!p) return;
                p.name = name;
                // Carry the per-browser collapse flag to the new name.
                const collapsed = getCollapsed()[oldName];
                setCollapsed(oldName, false);
                if (collapsed) setCollapsed(name, true);
                saveLayout();
            }

            // Deleting a project never touches tmux — members drop back to
            // Ungrouped.
            function deleteProject(name) {
                const p = layout.projects.find(p => p.name === name);
                if (!p) return;
                const liveNames = new Set(lastSessions.map(s => s.name));
                const liveMembers = p.sessions.filter(n => liveNames.has(n));
                const suffix = liveMembers.length
                    ? ' Its ' + liveMembers.length + ' session' + (liveMembers.length > 1 ? 's' : '') + ' move to Ungrouped.'
                    : '';
                if (!confirm('Delete project "' + name + '"?' + suffix + ' (Sessions are never killed by this.)')) return;
                layout.ungrouped.push(...p.sessions);
                layout.projects = layout.projects.filter(x => x !== p);
                layout.ungroupedIndex = Math.min(layout.ungroupedIndex, layout.projects.length);
                setCollapsed(name, false);
                saveLayout();
            }

            // Move a group one visual slot up/down — the touch-friendly
            // counterpart of dragging its header. Works on the combined
            // sequence, so projects and the Ungrouped section move past each
            // other symmetrically. groupId '' = Ungrouped.
            function moveGroup(groupId, delta) {
                const seq = groupSeq();
                const i = groupId === ''
                    ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                    : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === groupId);
                const j = i + delta;
                if (i < 0 || j < 0 || j >= seq.length) return;
                const [g] = seq.splice(i, 1);
                seq.splice(j, 0, g);
                applyGroupSeq(seq);
                saveLayout();
            }

            // Header "+" — create a session directly inside the project. The
            // assignment is recorded BEFORE the iframe spawn so the card never
            // flickers through Ungrouped.
            function createSessionInProject(projectName) {
                const input = prompt('New session in "' + projectName + '":');
                if (input === null) return;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                moveSessionTo(name, projectName);
                activateSession(name);
                quickRefreshAfterCreate();
            }

            function moveMenuItems(sessionName) {
                const current = projectOfSession(sessionName);
                const items = [{ labelHeading: 'Move to' }];
                if (current !== '') {
                    items.push({ label: 'Ungrouped', onClick: () => moveSessionTo(sessionName, '') });
                }
                for (const p of layout.projects) {
                    if (p.name === current) continue;
                    items.push({ label: p.name, onClick: () => moveSessionTo(sessionName, p.name) });
                }
                if (items.length === 1) {
                    items.push({ label: 'No projects yet', onClick: () => {}, disabled: true });
                }
                return items;
            }

            // --- rendering -----------------------------------------------------

            function stateDot(state, extraClass) {
                if (!state) return null;
                const dot = document.createElement('span');
                dot.className = 'state-dot ' + state + (extraClass ? ' ' + extraClass : '');
                dot.title = 'Claude: ' + (state === 'done' ? 'completed' :
                    state === 'awaiting' ? 'awaiting your input' : 'running');
