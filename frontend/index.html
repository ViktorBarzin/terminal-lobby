<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Terminal">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <!-- Tab icon; the lobby's attention system (Task 2.1) swaps this href to
         a canvas-rendered data: URL (icon + amber dot) while any session
         awaits input, and restores it on clear. 404s harmlessly until the
         PWA asset carve-out ships (the badge renderer has a tile fallback). -->
    <link rel="icon" type="image/png" href="/icon-192.png">
    <title>Terminal</title>
    <!-- Webfont preload: the boot sequence races document.fonts.load() for 2s
         before xterm measures cell metrics — preloading Regular/Bold makes the
         race a near-certain win. Same-origin /fonts/ is the primary source
         (404s harmlessly until the asset route lands; @font-face falls through
         to jsdelivr). crossorigin is mandatory even same-origin: font fetches
         are always CORS-anonymous, and a mismatch double-downloads. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/JetBrainsMono-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/JetBrainsMono-Bold.woff2">
    <!-- SRI (Task 1.13): published non-.min paths ONLY — jsdelivr-generated
         .min variants are re-minified over time and explicitly SRI-unsafe;
         the npm-published files are immutable for a pinned version. Hashes
         computed fresh at implementation time:
         curl -s <url> | openssl dgst -sha384 -binary | base64 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
          integrity="sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP"
          crossorigin="anonymous">
    <style>
        /* JetBrains Mono 2.304 (OFL-1.1) — vendored in frontend/fonts/, served
           same-origin at /fonts/ (clipboard-upload asset route + public ingress
           carve-out); jsdelivr second source is the fallback until that lands
           and thereafter (it is already a hard dependency of this page).
           font-display: block — a flash of mis-metric OS fallback is worse
           than a briefly invisible terminal (xterm paints its own canvas;
           block only affects lobby chrome text). */
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('/fonts/JetBrainsMono-Regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 700;
            font-display: block;
            src: url('/fonts/JetBrainsMono-Bold.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-Bold.woff2') format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: italic;
            font-weight: 400;
            font-display: block;
            src: url('/fonts/JetBrainsMono-Italic.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-Italic.woff2') format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: italic;
            font-weight: 700;
            font-display: block;
            src: url('/fonts/JetBrainsMono-BoldItalic.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/fonts/webfonts/JetBrainsMono-BoldItalic.woff2') format('woff2');
        }
        /* DM Sans Variable (OFL-1.1, @fontsource-variable latin subset) — the
           lobby-chrome UI face (T3 parity). Same two-source chain as JBM;
           swap (not block): chrome text may briefly show the system face.
           NEVER applied to the xterm element or anything rendering pty
           content — terminal text stays on the mono stack. */
        @font-face {
            font-family: 'DM Sans Variable';
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url('/fonts/dm-sans-latin-wght-normal.woff2') format('woff2-variations'),
                 url('https://cdn.jsdelivr.net/npm/@fontsource-variable/dm-sans@5.2.8/files/dm-sans-latin-wght-normal.woff2') format('woff2-variations');
            unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
        }

        :root {
            /* Single source of truth for chrome mono stacks. The xterm
               constructor keeps an explicit string (xterm doesn't resolve
               CSS vars). 'TL Symbols' (Iosevka subset, loaded post-boot as a
               data: FontFace) is terminal-only — chrome text never needs it. */
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace;
            /* Lobby chrome only (sidebar, cards, dialogs, toasts, buttons,
               headers). Weights in use: 400 body / 500 buttons / 600 headings. */
            --font-ui: 'DM Sans Variable', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            /* T3 radius scale (Task 1.11c): buttons/menus/inputs = --radius,
               cards/dialog panels = +8, toasts/menu items = −2. */
            --radius: 10px;
        }

        /* Themes — set on <body> as theme-{carbon,slate,mono,ink,t3-dark,
           t3-light,catppuccin-mocha,catppuccin-latte}. Slate is the default.
           'system' is a picker choice, not a class: the pre-paint boot
           script (top of <body>) resolves it to t3-dark/t3-light from the
           OS color scheme. */
        body.theme-carbon {
            --bg-page: #0c0c0a;
            --bg-sidebar: #131311;
            --bg-card: #1a1916;
            --bg-card-hover: #22211d;
            --text-primary: #e8e3d6;
            --text-muted: #8a8474;
            --border: #2a2826;
            --border-strong: #3a3733;
            --accent: #d4a574;
            --danger: #c47a5a;
            --success: #88a888;
            /* Claude state dots. Carbon's accent is itself amber, so
               "awaiting" leans hotter orange to stay distinguishable. */
            --state-running: #d4a574;
            --state-awaiting: #e06c3a;
            --state-done: #88a888;
            --terminal-bg: #0c0c0a;
            --terminal-fg: #e8e3d6;
            --terminal-cursor: #d4a574;
            --terminal-selection: rgba(212,165,116,0.22);
            /* Text under the block cursor renders in the theme bg (classic
               inverse); without this xterm defaults it to black, unreadable
               on light cursors. */
            --terminal-cursor-accent: #0c0c0a;
            /* ANSI 16 — T3's hand-tuned dark palette (ThreadTerminalDrawer);
               black = this theme's elevated card surface so \e[40m panels
               read as raised surfaces, not voids. */
            --terminal-ansi-black: #1a1916;
            --terminal-ansi-red: #ff7a8e;
            --terminal-ansi-green: #86e795;
            --terminal-ansi-yellow: #f4cd72;
            --terminal-ansi-blue: #89beff;
            --terminal-ansi-magenta: #d0b0ff;
            --terminal-ansi-cyan: #7ce8ed;
            --terminal-ansi-white: #d2dae6;
            --terminal-ansi-bright-black: #6e7888;
            --terminal-ansi-bright-red: #ffa8b4;
            --terminal-ansi-bright-green: #b0f5ba;
            --terminal-ansi-bright-yellow: #ffe095;
            --terminal-ansi-bright-blue: #aed2ff;
            --terminal-ansi-bright-magenta: #e5cbff;
            --terminal-ansi-bright-cyan: #a7f4f7;
            --terminal-ansi-bright-white: #f4f7fc;
        }
        body.theme-slate {
            --bg-page: #0d1117;
            --bg-sidebar: #11151c;
            --bg-card: #161b22;
            --bg-card-hover: #1c2128;
            --text-primary: #e6e8eb;
            --text-muted: #7d8590;
            --border: #1f242d;
            --border-strong: #30363d;
            --accent: #4493f8;
            --danger: #f47067;
            --success: #56d364;
            --state-running: #4493f8;
            --state-awaiting: #d29922;
            --state-done: #56d364;
            --terminal-bg: #0d1117;
            --terminal-fg: #e6e8eb;
            --terminal-cursor: #4493f8;
            --terminal-selection: rgba(68,147,248,0.22);
            --terminal-cursor-accent: #0d1117;
            /* Same T3 dark ANSI set as carbon; black = slate's card surface. */
            --terminal-ansi-black: #161b22;
            --terminal-ansi-red: #ff7a8e;
            --terminal-ansi-green: #86e795;
            --terminal-ansi-yellow: #f4cd72;
            --terminal-ansi-blue: #89beff;
            --terminal-ansi-magenta: #d0b0ff;
            --terminal-ansi-cyan: #7ce8ed;
            --terminal-ansi-white: #d2dae6;
            --terminal-ansi-bright-black: #6e7888;
            --terminal-ansi-bright-red: #ffa8b4;
            --terminal-ansi-bright-green: #b0f5ba;
            --terminal-ansi-bright-yellow: #ffe095;
            --terminal-ansi-bright-blue: #aed2ff;
            --terminal-ansi-bright-magenta: #e5cbff;
            --terminal-ansi-bright-cyan: #a7f4f7;
            --terminal-ansi-bright-white: #f4f7fc;
        }
        body.theme-mono {
            --bg-page: #0d0d0d;
            --bg-sidebar: #131313;
            --bg-card: #1a1a1a;
            --bg-card-hover: #232323;
            --text-primary: #e0e0e0;
            --text-muted: #7d7d7d;
            --border: #2a2a2a;
            --border-strong: #3a3a3a;
            --accent: #e8e8e8;
            --danger: #cc7070;
            --success: #9ccb9c;
            --state-running: #e8e8e8;
            --state-awaiting: #d4a054;
            --state-done: #9ccb9c;
            --terminal-bg: #0d0d0d;
            --terminal-fg: #e0e0e0;
            --terminal-cursor: #e8e8e8;
            --terminal-selection: rgba(255,255,255,0.18);
            --terminal-cursor-accent: #0d0d0d;
            /* Same T3 dark ANSI set; black = mono's card surface. */
            --terminal-ansi-black: #1a1a1a;
            --terminal-ansi-red: #ff7a8e;
            --terminal-ansi-green: #86e795;
            --terminal-ansi-yellow: #f4cd72;
            --terminal-ansi-blue: #89beff;
            --terminal-ansi-magenta: #d0b0ff;
            --terminal-ansi-cyan: #7ce8ed;
            --terminal-ansi-white: #d2dae6;
            --terminal-ansi-bright-black: #6e7888;
            --terminal-ansi-bright-red: #ffa8b4;
            --terminal-ansi-bright-green: #b0f5ba;
            --terminal-ansi-bright-yellow: #ffe095;
            --terminal-ansi-bright-blue: #aed2ff;
            --terminal-ansi-bright-magenta: #e5cbff;
            --terminal-ansi-bright-cyan: #a7f4f7;
            --terminal-ansi-bright-white: #f4f7fc;
        }
        body.theme-ink {
            --bg-page: #faf7f2;
            --bg-sidebar: #f1ebda;
            --bg-card: #ffffff;
            --bg-card-hover: #f4eee0;
            --text-primary: #1d1b18;
            --text-muted: #6e6862;
            --border: #d8d2c4;
            --border-strong: #b8b0a0;
            --accent: #b5482d;
            --danger: #b5482d;
            --success: #3d6b3d;
            --state-running: #b5482d;
            --state-awaiting: #9a6b00;
            --state-done: #3d6b3d;
            --terminal-bg: #faf7f2;
            --terminal-fg: #1d1b18;
            --terminal-cursor: #b5482d;
            --terminal-selection: rgba(181,72,45,0.18);
            --terminal-cursor-accent: #faf7f2;
            /* ANSI 16 — T3's hand-tuned LIGHT palette: dark, desaturated
               colors that stay legible on paper-white (the stock xterm VGA
               set is tuned for dark bg and washes out here). */
            --terminal-ansi-black: #2c3542;
            --terminal-ansi-red: #bf4657;
            --terminal-ansi-green: #3c7e56;
            --terminal-ansi-yellow: #927023;
            --terminal-ansi-blue: #4866a3;
            --terminal-ansi-magenta: #845695;
            --terminal-ansi-cyan: #357f8d;
            --terminal-ansi-white: #d2d7df;
            --terminal-ansi-bright-black: #707b8c;
            --terminal-ansi-bright-red: #d45f70;
            --terminal-ansi-bright-green: #55946f;
            --terminal-ansi-bright-yellow: #ad852d;
            --terminal-ansi-bright-blue: #5b7cc2;
            --terminal-ansi-bright-magenta: #996bac;
            --terminal-ansi-bright-cyan: #4695a4;
            --terminal-ansi-bright-white: #ecf0f6;
        }
        /* T3 Code parity pair — surfaces/accents ported from t3code
           apps/web/src/index.css (oklch/color-mix values resolved to hex),
           ANSI sets from ThreadTerminalDrawer.tsx. Alpha hairline borders
           on near-flat surfaces are the T3 signature. */
        body.theme-t3-dark {
            --bg-page: #161616;
            --bg-sidebar: #1b1b1b;
            --bg-card: #1b1b1b;
            --bg-card-hover: #242424;
            --text-primary: #f5f5f5;
            --text-muted: #818181;
            --border: rgba(255,255,255,0.06);
            --border-strong: rgba(255,255,255,0.12);
            --accent: #366ffb;
            --danger: #ff6467;
            --success: #10b981;
            /* T3's semantic pill trio: sky running / amber awaiting /
               emerald done. */
            --state-running: #0ea5e9;
            --state-awaiting: #f59e0b;
            --state-done: #10b981;
            --terminal-bg: #161616;
            --terminal-fg: #f5f5f5;
            --terminal-cursor: #b4cbff;
            --terminal-selection: rgba(54,111,251,0.22);
            --terminal-cursor-accent: #161616;
            /* T3 dark ANSI incl. its own elevated black rgb(24,30,38). */
            --terminal-ansi-black: #181e26;
            --terminal-ansi-red: #ff7a8e;
            --terminal-ansi-green: #86e795;
            --terminal-ansi-yellow: #f4cd72;
            --terminal-ansi-blue: #89beff;
            --terminal-ansi-magenta: #d0b0ff;
            --terminal-ansi-cyan: #7ce8ed;
            --terminal-ansi-white: #d2dae6;
            --terminal-ansi-bright-black: #6e7888;
            --terminal-ansi-bright-red: #ffa8b4;
            --terminal-ansi-bright-green: #b0f5ba;
            --terminal-ansi-bright-yellow: #ffe095;
            --terminal-ansi-bright-blue: #aed2ff;
            --terminal-ansi-bright-magenta: #e5cbff;
            --terminal-ansi-bright-cyan: #a7f4f7;
            --terminal-ansi-bright-white: #f4f7fc;
        }
        body.theme-t3-light {
            --bg-page: #ffffff;
            --bg-sidebar: #f7f7f7;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f5f5;
            --text-primary: #262626;
            --text-muted: #676767;
            --border: rgba(0,0,0,0.08);
            --border-strong: rgba(0,0,0,0.15);
            --accent: #1b4ed8;
            /* Text-red/-green on white: T3 uses the darker *-foreground
               variants for copy (red-700 / emerald-700). */
            --danger: #c10007;
            --success: #047857;
            --state-running: #0ea5e9;
            --state-awaiting: #f59e0b;
            --state-done: #10b981;
            --terminal-bg: #ffffff;
            --terminal-fg: #262626;
            --terminal-cursor: #26384e;
            --terminal-selection: rgba(27,78,216,0.18);
            --terminal-cursor-accent: #ffffff;
            /* T3 light ANSI set (same T3-light palette ink uses). */
            --terminal-ansi-black: #2c3542;
            --terminal-ansi-red: #bf4657;
            --terminal-ansi-green: #3c7e56;
            --terminal-ansi-yellow: #927023;
            --terminal-ansi-blue: #4866a3;
            --terminal-ansi-magenta: #845695;
            --terminal-ansi-cyan: #357f8d;
            --terminal-ansi-white: #d2d7df;
            --terminal-ansi-bright-black: #707b8c;
            --terminal-ansi-bright-red: #d45f70;
            --terminal-ansi-bright-green: #55946f;
            --terminal-ansi-bright-yellow: #ad852d;
            --terminal-ansi-bright-blue: #5b7cc2;
            --terminal-ansi-bright-magenta: #996bac;
            --terminal-ansi-bright-cyan: #4695a4;
            --terminal-ansi-bright-white: #ecf0f6;
        }
        /* Catppuccin pair — colors verbatim from the official palette
           (github.com/catppuccin/palette): mocha base/mantle/surface/text,
           latte likewise; ANSI mapping = the official editor-port
           convention (black/brightBlack from surface2|subtext, brights
           repeat the normals). Cursor = rosewater, per upstream ports. */
        body.theme-catppuccin-mocha {
            --bg-page: #1e1e2e;      /* base */
            --bg-sidebar: #181825;   /* mantle */
            --bg-card: #313244;      /* surface0 */
            --bg-card-hover: #45475a;/* surface1 */
            --text-primary: #cdd6f4; /* text */
            --text-muted: #9399b2;   /* overlay2 */
            --border: #45475a;       /* surface1 */
            --border-strong: #585b70;/* surface2 */
            --accent: #cba6f7;       /* mauve */
            --danger: #f38ba8;       /* red */
            --success: #a6e3a1;      /* green */
            --state-running: #89b4fa;  /* blue */
            --state-awaiting: #fab387; /* peach */
            --state-done: #a6e3a1;     /* green */
            --terminal-bg: #1e1e2e;
            --terminal-fg: #cdd6f4;
            --terminal-cursor: #f5e0dc; /* rosewater */
            --terminal-selection: rgba(203,166,247,0.22);
            --terminal-cursor-accent: #1e1e2e;
            --terminal-ansi-black: #45475a;
            --terminal-ansi-red: #f38ba8;
            --terminal-ansi-green: #a6e3a1;
            --terminal-ansi-yellow: #f9e2af;
            --terminal-ansi-blue: #89b4fa;
            --terminal-ansi-magenta: #f5c2e7;
            --terminal-ansi-cyan: #94e2d5;
            --terminal-ansi-white: #bac2de;
            --terminal-ansi-bright-black: #585b70;
            --terminal-ansi-bright-red: #f38ba8;
            --terminal-ansi-bright-green: #a6e3a1;
            --terminal-ansi-bright-yellow: #f9e2af;
            --terminal-ansi-bright-blue: #89b4fa;
            --terminal-ansi-bright-magenta: #f5c2e7;
            --terminal-ansi-bright-cyan: #94e2d5;

        body.theme-catppuccin-latte {
            --bg-page: #eff1f5;      /* base */
            --bg-sidebar: #e6e9ef;   /* mantle */
            --bg-card: #ffffff;
            --bg-card-hover: #e6e9ef;
            --text-primary: #4c4f69; /* text */
            --text-muted: #6c6f85;   /* subtext0 */
            --border: #ccd0da;       /* surface0 */
            --border-strong: #bcc0cc;/* surface1 */
            --accent: #8839ef;       /* mauve */
            --danger: #d20f39;       /* red */

            --terminal-fg: #4c4f69;
            --terminal-cursor: #dc8a78; /* rosewater */
            --terminal-selection: rgba(136,57,239,0.18);
            --terminal-cursor-accent: #eff1f5;
            --terminal-ansi-black: #5c5f77;
            --terminal-ansi-red: #d20f39;
            --terminal-ansi-green: #40a02b;
            --terminal-ansi-yellow: #df8e1d;

            --terminal-ansi-white: #acb0be;
            --terminal-ansi-bright-black: #6c6f85;
            --terminal-ansi-bright-red: #d20f39;
            --terminal-ansi-bright-green: #40a02b;
            --terminal-ansi-bright-yellow: #df8e1d;
            --terminal-ansi-bright-blue: #1e66f5;
            --terminal-ansi-bright-magenta: #ea76cb;

        /* Scheme-dependent tokens (Tasks 1.10/1.11) — dark defaults on
           body, flipped by the light themes as a GROUP (body.theme-* wins on
           specificity). A new light theme must join this selector list. The
           scrollbar values also feed the xterm ITheme scrollbarSlider* keys
           via readTerminalTheme(). --surface-shadow = T3's card treatment:
           soft 5% drop + a scheme-dependent 1px inner bevel (light-catching
           top edge on dark, grounding bottom edge on light).
           --skeleton-highlight = T3's shimmer band (white 4% dark / 64%
           light, over the card surface). */
        body {
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.18);
            --scrollbar-thumb-active: rgba(255, 255, 255, 0.22);
            --surface-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05),
                              inset 0 1px rgba(255, 255, 255, 0.06);
            --skeleton-highlight: rgba(255, 255, 255, 0.04);
            /* Density tokens (Task 2.8). --hover-tint = T3's neutral
               ghost-hover accent (white 4% dark / black 4% light) for
               menu items and other transparent-resting controls.
               --ring = the focus-visible ring color; T3 pins a blue —
               ours follows the theme accent (exact on the t3-* pair,
               whose accent IS that blue). Declared on body so
               var(--accent) resolves against the body's theme class. */
            --hover-tint: rgba(255, 255, 255, 0.04);
            --ring: var(--accent);
        }
        body.theme-ink, body.theme-t3-light, body.theme-catppuccin-latte {
            --scrollbar-thumb: rgba(0, 0, 0, 0.15);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.25);
            --scrollbar-thumb-active: rgba(0, 0, 0, 0.3);
            --surface-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05),
                              inset 0 -1px rgba(0, 0, 0, 0.04);
            --skeleton-highlight: rgba(255, 255, 255, 0.64);
            --hover-tint: rgba(0, 0, 0, 0.04);
        }

        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: var(--bg-page, #0d1117);
            color: var(--text-primary, #e6e8eb);
            /* Suppress Chrome pull-to-refresh and iOS rubber-band scroll. */
            overscroll-behavior: none;
        }
        #terminal {
            height: 100%; width: 100%;
            /* border-box so any future padding/border here stays inside the
               100%/inline-px height (syncViewport sets one on the mobile
               keyboard path). The window padding itself must NOT live here:
               FitAddon reads THIS element's computed width/height raw —
               Chrome resolves them to the border box once box-sizing is
               border-box, so padding here silently clips one grid row/column
               (measured: 36 rows × 20px = 720px canvas in a 704px content
               box). It lives on .xterm below instead. */
            box-sizing: border-box;
            /* Fills the sliver the cell grid can't cover (rounding remainder
               below/right of .xterm) so the frame reads as one surface —
               Ghostty's window-padding-color=background. */
            background: var(--terminal-bg);
            /* Allow scroll + pinch-zoom (accessibility); kill double-tap zoom. */
            touch-action: pan-x pan-y pinch-zoom;
        }
        /* Window padding (Task 1.9): 8×10px grid inset. The .xterm element
           is the ONE padding location addon-fit@0.10.0 actually subtracts
           when proposing cols/rows (it reads the parent's size and THIS
           element's padding — verified against the pinned addon source), so
           the grid shrinks to fit instead of clipping. The theme-colored
           frame comes for free: .xterm-viewport is absolutely inset-0 over
           the padding box and xterm paints it with theme.background. The
           ADR-0003 pixel→cell replay anchors to .xterm-screen's LIVE rect,
           which now simply sits 10/8px in — no replay math touched. */
        #terminal .xterm { padding: 8px 10px; }
        /* Use dynamic viewport height where supported so the terminal pane
           shrinks when the soft keyboard opens. Older browsers stick with 100%. */
        @supports (height: 100dvh) {
            html, body { height: 100dvh; }
        }
        .hidden { display: none !important; }
        /* Typed toast stack (Task 2.7). #toast — the single-element toast
           of old — is now the fixed stack VIEWPORT; each toast renders as
           a .toast-card child. Position + safe-area offsets kept verbatim
           (battery 1.12 asserts them):
           Safe-area offsets (Task 1.12 audit): the page opts into
           viewport-fit=cover + a translucent status bar, so a bare
           top:16px toast sits half-under the iOS notch/status bar
           (~47-59px inset). env() is 0 on desktop.
           .visible mirrors "has any toast" purely for battery A.3 compat.
           The empty viewport never eats pointer events over the terminal;
           cards do (Copy / expand / dismiss are interactive — same class
           of fixed clickable surface as the floating action buttons). */
        #toast {
            position: fixed; z-index: 9999;
            top: calc(16px + env(safe-area-inset-top));
            right: calc(16px + env(safe-area-inset-right));
            display: flex; flex-direction: column; gap: 10px;
            width: min(360px, calc(100vw - 32px));
            pointer-events: none;
            font-family: var(--font-ui); font-size: 14px;
        }
        .toast-card {
            display: flex; align-items: flex-start; gap: 10px;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            padding: 10px 14px;
            pointer-events: auto;
            box-shadow: var(--surface-shadow);
            animation: toast-in 0.18s ease-out;
        }
        @keyframes toast-in { from { opacity: 0; transform: translateY(-4px); } }
        .toast-card .t-icon {
            flex: none; width: 16px; text-align: center;
            font-size: 13px; line-height: 20px;
        }
        .t-error   > .t-icon { color: var(--danger); }
        .t-success > .t-icon { color: var(--success); }
        .t-warning > .t-icon { color: #f59e0b; } /* amber — Task 2.4 state palette */
        .t-info    > .t-icon { color: var(--accent); }
        .t-loading > .t-icon { /* ring spinner instead of a glyph */
            width: 12px; height: 12px; margin: 4px 2px 0;
            border-radius: 50%;
            border: 2px solid var(--border); border-top-color: var(--accent);
            animation: toast-spin 0.8s linear infinite;
        }
        @keyframes toast-spin { to { transform: rotate(360deg); } }
        .toast-card .t-body { flex: 1; min-width: 0; }
        .toast-card .t-title { font-weight: 500; word-break: break-word; }
        .toast-card .t-desc {
            margin-top: 2px; font-size: 12px; color: var(--text-muted);
            word-break: break-word;
            user-select: text; -webkit-user-select: text;
        }
        /* Long bodies (≥180 chars) shorten visually; Copy still gets the
           full string (T3's error-description clamp). */
        .toast-card .t-desc.t-clamp {
            display: -webkit-box; -webkit-box-orient: vertical;
            -webkit-line-clamp: 4; overflow: hidden;
        }
        .toast-card .t-expand {
            margin-top: 4px; padding: 0; border: 0; background: none;
            font: 500 12px var(--font-ui); color: var(--text-muted);
            cursor: pointer;
        }
        .toast-card .t-expand:hover { color: var(--text-primary); }
        .toast-card .t-detail {
            margin-top: 6px; max-height: 160px; overflow-y: auto;
            overscroll-behavior: contain;
            user-select: text; -webkit-user-select: text;
        }
        .toast-card .t-detail-row {
            padding: 4px 0; border-bottom: 1px solid var(--border);
            font-size: 12px; word-break: break-word;
        }
        .toast-card .t-detail-row:last-child { border-bottom: 0; }
        .toast-card .t-detail-sub {
            font-size: 10px; color: var(--text-muted); margin-top: 1px;
        }
        .toast-card .t-copy, .toast-card .t-x {
            flex: none; border: 0; background: none; padding: 0 2px;
            cursor: pointer; color: var(--text-muted);
            font-size: 13px; line-height: 20px;
        }
        .toast-card .t-copy:hover, .toast-card .t-x:hover { color: var(--text-primary); }
        /* Connection pill (Task 2.2): slim non-modal WS status for the
           terminal iframe — top-center so it never covers the floating
           action buttons or the prompt. Pure status surface:
           pointer-events none keeps every mouse event on the terminal
           beneath it (red line: mouse semantics untouched). */
        #conn-pill {
            position: fixed; z-index: 9998;
            top: calc(10px + env(safe-area-inset-top));
            left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 7px;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: 999px;
            padding: 5px 14px;
            font-family: var(--font-ui); font-size: 12px; font-weight: 500;
            pointer-events: none; white-space: nowrap;
            box-shadow: var(--surface-shadow);
        }
        #conn-pill::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            flex: none;
            background: #f59e0b; /* amber — same state color as "awaiting" */
            animation: conn-pulse 1.2s ease-in-out infinite;
        }
        #conn-pill.offline::before { background: var(--danger); animation: none; }
        @keyframes conn-pulse { 50% { opacity: 0.35; } }
        #paste-btn, #img-btn, #gallery-btn, #font-inc-btn, #font-dec-btn {
            position: fixed;
            /* --kb-offset is updated from window.visualViewport on touch
               devices so floating elements lift above the soft keyboard. */
            bottom: calc(24px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            z-index: 9999;
            width: 48px; height: 48px; border-radius: 12px;
            background: color-mix(in srgb, var(--accent) 22%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
            color: var(--text-primary); font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        #paste-btn   { right: calc(24px + env(safe-area-inset-right)); }
        #img-btn     { right: calc(80px + env(safe-area-inset-right)); }
        #gallery-btn { right: calc(136px + env(safe-area-inset-right)); }
        #font-inc-btn { right: calc(192px + env(safe-area-inset-right)); }
        #font-dec-btn { right: calc(248px + env(safe-area-inset-right)); }
        /* A+/A− are text glyphs, not 22px emoji — UI face, smaller size. */
        #font-inc-btn, #font-dec-btn {
            font-family: var(--font-ui); font-size: 15px; font-weight: 600;
        }
        /* On touch devices the floating buttons would sit on top of the
           soft-key toolbar — lift them above it. */
        @media (pointer: coarse) {
            #paste-btn, #img-btn, #gallery-btn, #font-inc-btn, #font-dec-btn {
                bottom: calc(72px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            }
        }
        #paste-btn:hover, #img-btn:hover, #gallery-btn:hover,
        #font-inc-btn:hover, #font-dec-btn:hover {
            background: color-mix(in srgb, var(--accent) 35%, transparent);
        }
        #paste-btn:active, #img-btn:active, #gallery-btn:active,
        #font-inc-btn:active, #font-dec-btn:active { transform: scale(0.92); }
        #img-input { display: none; }

        /* Pasted/uploaded image preview — floating thumbnail just above the
           Paste/Img buttons (terminal mode only, element built from JS).
           Click opens the #img-lightbox enlargement; closing that removes
           the preview entirely. */
        #img-preview {
            position: fixed;
            bottom: calc(84px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            right: calc(24px + env(safe-area-inset-right));
            z-index: 9999;
            max-width: 220px; max-height: 160px;
            object-fit: contain;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            cursor: zoom-in;
        }
        /* Track the floating buttons, which sit higher on touch devices. */
        @media (pointer: coarse) {
            #img-preview {
                bottom: calc(132px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            }
        }
        #img-lightbox {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            cursor: zoom-out;
        }
        #img-lightbox img {
            max-width: 85vw; max-height: 85vh;
            object-fit: contain;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        /* Session image gallery — overlay grid of everything stored for
           this (user, session); a thumbnail click opens #img-lightbox on
           top and closing that lands back here. Backdrop/panel theming
           matches the lightbox. */
        #img-gallery {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.65);
        }
        #img-gallery .gallery-panel {
            box-sizing: border-box;
            max-width: 85vw; max-height: 85vh;
            min-width: min(60vw, 480px);
            display: flex; flex-direction: column;
            background: var(--bg-card);
            /* T3 dialog surface (Task 1.11b/c): hairline border + panel
               radius; the elevation drop stays (separation over dark
               themes) and gains the scheme bevel via --surface-shadow. */
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), var(--surface-shadow);
            padding: 14px 16px 16px;
            font-family: var(--font-ui);
        }
        #img-gallery .gallery-title {
            margin: 0 0 10px; font-size: 14px; font-weight: 600;
            color: var(--text-primary);
        }
        #img-gallery .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px; overflow-y: auto; min-height: 0;
        }
        #img-gallery .gallery-cell {
            position: relative; aspect-ratio: 1 / 1; padding: 0;
            border: 1px solid var(--border); border-radius: 6px;
            overflow: hidden; background: var(--bg-page); cursor: zoom-in;
        }
        #img-gallery .gallery-cell img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        #img-gallery .gallery-badge {
            position: absolute; top: 4px; right: 4px;
            padding: 1px 6px; border-radius: 6px; font-size: 10px;
            font-family: inherit; color: var(--text-primary);
            background: color-mix(in srgb, var(--accent) 30%, rgba(0, 0, 0, 0.6));
        }
        #img-gallery .gallery-note {
            grid-column: 1 / -1; padding: 12px 4px;
            color: var(--text-muted); font-style: italic; font-size: 13px;
        }

        /* Lobby */
        #lobby {
            display: none; height: 100vh; box-sizing: border-box;
            font-family: var(--font-ui);
            color: var(--text-primary); background: var(--bg-sidebar);
        }
        #lobby.visible { display: block; }
        #lobby.access-denied { padding: 32px; overflow-y: auto; }
        /* Film grain over the lobby chrome (Task 1.11a — T3's body::after,
           same SVG turbulence tile at 3.5%). body.lobby is set ONLY in
           lobby mode; z-0 keeps it UNDER the z-1 #lobby-content pane, so
           the terminal iframe (and any sixel inside it) is never washed by
           grain — and terminal-mode pages never carry the class at all.
           pointer-events: none = purely decorative, hit-testing unchanged. */
        body.lobby::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }
        /* T3 weight scale on the UI face: 400 body / 500 buttons / 600
           headings (headings already carry 600 individually). Chrome-text
           buttons only — icon/glyph buttons (#sidebar-toggle 600, floating
           paste/img/gallery, #soft-keys) keep their own weights. */
        .new-row button, .new-project-btn, .restore-btn, .theme-options button,
        .session-actions button, .project-actions button, .popup-menu button {
            font-weight: 500;
        }

        #lobby-shell {
            display: grid; grid-template-columns: 260px 1fr; height: 100vh;
            transition: grid-template-columns 0.18s ease;
        }
        #lobby.sidebar-collapsed #lobby-shell { grid-template-columns: 0 1fr; }
        #lobby-sidebar {
            /* Safe-area (Task 1.12 audit): the sidebar touches the viewport
               TOP in the stacked <720px layout (portrait standalone: status
               bar overlaps the header without the top inset) and the LEFT
               edge in the side-by-side grid (landscape notch). env() is 0
               where there is no inset, so desktop stays byte-identical. */
            padding: calc(20px + env(safe-area-inset-top)) 14px
                     20px calc(14px + env(safe-area-inset-left));
            overflow-x: hidden; overflow-y: auto;
            border-right: 1px solid var(--border);
            background: var(--bg-sidebar); min-width: 0;
            display: flex; flex-direction: column;
        }
        #lobby-content {
            position: relative; background: var(--terminal-bg);
            min-width: 0; height: 100vh; overflow: hidden;
            /* Above the body.lobby::after grain (z-0): the terminal iframe
               pane must stay grain-free (red line: nothing may sit over the
               terminal/sixel canvas). Overlays (toast 9999, menus 10000,
               #sidebar-toggle 100) are body-level siblings — unaffected. */
            z-index: 1;
        }
        #sidebar-toggle {
            position: fixed; top: 12px; left: 220px; z-index: 100;
            width: 32px; height: 32px; padding: 0;
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
            border-radius: var(--radius);
            font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 15%, transparent);
            transition: background 0.15s, color 0.15s, border-color 0.15s,
                        transform 0.12s, left 0.18s ease;
        }
        #lobby.sidebar-collapsed #sidebar-toggle { left: 12px; }
        #sidebar-toggle:hover {
            background: color-mix(in srgb, var(--accent) 14%, var(--bg-card));
            border-color: var(--accent);
        }
        #sidebar-toggle:active { transform: scale(0.95); }
        #sidebar-toggle:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 1px;
        }
        @media (max-width: 720px) {
            #sidebar-toggle {
                left: auto;
                right: calc(12px + env(safe-area-inset-right));
                top: calc(12px + env(safe-area-inset-top));
            }
            #lobby.sidebar-collapsed #sidebar-toggle {
                left: calc(12px + env(safe-area-inset-left));
                right: auto;
            }
        }
        #session-frame { width: 100%; height: 100%; border: 0; display: block; }
        #session-frame.hidden { display: none; }
        #lobby-empty {
            color: var(--text-muted); display: flex; align-items: center; justify-content: center;
            height: 100%; font-style: italic; padding: 24px; text-align: center;
        }
        #lobby-empty.hidden { display: none; }

        .lobby-header { font-size: 18px; color: var(--accent); margin: 0 0 4px 0; font-weight: 600; }
        /* Header row: title + the notification bell toggle (Task 2.1).
           padding-right reserves the fixed #sidebar-toggle's footprint
           (32px + 12px inset, top-right of the sidebar on every layout)
           so the bell never sits under it. 52px = T3's topbar strip
           (--workspace-topbar-height), items vertically centered. */
        .lobby-header-row {
            display: flex; align-items: center; gap: 8px;
            min-height: 52px;
            margin: 0 0 4px 0; padding-right: 44px;
        }
        .lobby-header-row .lobby-header { margin: 0; flex: 1 1 auto; min-width: 0; }
        /* T3 icon-button tier (Task 2.8): 32×32 (size-8), 16px glyph at
           80% resting opacity, button radius. */
        #notify-toggle {
            flex: 0 0 auto; width: 32px; height: 32px; padding: 0;
            box-sizing: border-box;
            border-radius: var(--radius);
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border);
            font-size: 16px; line-height: 1; cursor: pointer; opacity: 0.8;
            transition: background 0.15s, border-color 0.15s, opacity 0.15s;
        }
        #notify-toggle:hover { background: var(--bg-card-hover); opacity: 1; }
        #notify-toggle.on {
            border-color: var(--accent); background: var(--bg-card-hover); opacity: 1;
        }
        .lobby-sub { color: var(--text-muted); font-size: 12px; margin: 0 0 18px 0; line-height: 1.5; }
        .new-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .new-row input {
            box-sizing: border-box; height: 32px; padding: 0 11px;
            border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-primary); font-family: inherit;
            /* 16px so iOS Safari doesn't auto-zoom on focus. */
            font-size: 16px;
        }
        /* No outline: none here — the shared :focus-visible ring below
           supplies the focus indicator (Task 2.8). */
        .new-row input:focus { border-color: var(--accent); }
        /* T3 default-button metric (Task 2.8, button.tsx size default):
           h-8 = 32px, px 11px, 500 14px (weight via the group rule
           above), radius already var(--radius). */
        .new-row button {
            box-sizing: border-box; height: 32px;
            padding: 0 11px; border-radius: var(--radius);
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            background: color-mix(in srgb, var(--accent) 18%, transparent);
            color: var(--text-primary); font-family: inherit; font-size: 14px; cursor: pointer;
            /* T3 primary-button finish (Task 1.11b): 1px light inner bevel +
               a primary-tinted drop (T3 hardcodes its blue at 24%; ours is
               theme-accent-tinted — same recipe, themed). */
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.16),
                        0 1px 2px color-mix(in srgb, var(--accent) 24%, transparent);
        }
        .new-row button:hover {
            background: color-mix(in srgb, var(--accent) 30%, transparent);
        }
        .new-row button:active {
            /* T3 pressed state: bevel flips dark, drop collapses. */
            box-shadow: inset 0 1px rgba(0, 0, 0, 0.08);
        }
        .restore-btn {
            margin: 10px 0 4px; width: 100%;
            /* Direct flex child of the #lobby-sidebar column: without
               flex-shrink:0 the fixed 32px height gets compressed (to
               ~20px) as soon as the sidebar content overflows the
               viewport and scrolls — the T3 density metric (Task 2.8)
               must hold under overflow too. */
            flex-shrink: 0;
            box-sizing: border-box; height: 32px; padding: 0 11px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong); background: transparent;
            color: var(--text-muted); font-family: inherit; font-size: 14px; cursor: pointer;
        }
        .restore-btn:hover {
            color: var(--text-primary); border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }
        .restore-btn:disabled { opacity: 0.64; cursor: default; }

        .session-list { display: flex; flex-direction: column; gap: 6px; }
        .session-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-card); border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: calc(var(--radius) + 8px);
            /* T3 card surface: soft drop + 1px scheme bevel (Task 1.11b). */
            box-shadow: var(--surface-shadow);
            padding: 10px 12px; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit; color: var(--text-primary); text-align: left;
        }
        .session-card:hover { background: var(--bg-card-hover); }
        .session-card:focus-visible {
            /* var(--ring) like the shared rule below, but INSET: a +1px
               ring on this full-bleed row would clip under the sidebar's
               overflow-x: hidden. */
            outline: 2px solid var(--ring);
            outline-offset: -2px;
        }
        .session-card.active {
            background: var(--bg-card-hover);
            border-color: color-mix(in srgb, var(--accent) 50%, transparent);
            border-left-color: var(--accent);
        }
        .session-meta {
            display: flex; flex-direction: column; gap: 2px;
            min-width: 0; flex: 1;
        }
        .session-name {
            font-size: 14px; font-weight: 600; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .session-detail { font-size: 12px; color: var(--text-muted); }
        .session-detail.attached { color: var(--success); }
        /* Live-command chip (Task 2.5): what the session's active pane is
           running right now ("claude", "vim", …), off tmux's native
           pane_current_command tracking. Mono to read as a command. */
        .cmd-chip {
            font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 4px);
            padding: 0 5px; margin-left: auto; flex-shrink: 0;
            max-width: 96px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        /* Inline rename editor (Task 2.5) — sits where the title was, at
           the title's own metrics so the card doesn't jump. */
        .session-name input.rename-input {
            font: inherit; color: var(--text-primary);
            background: var(--bg-page);
            border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
            border-radius: calc(var(--radius) - 4px);
            padding: 0 4px; margin: -1px 0; width: 100%;
            min-width: 60px; box-sizing: border-box; outline: none;
        }
        .session-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .session-actions button {
            /* xs buttons sit at radius − 2 (T3's rounded-md tier). The ⋯
               is an icon glyph: 16px at 80% opacity (Task 2.8, T3's
               [&_svg]:size-4 opacity-80 — opacity on the glyph color, not
               the button, so the border stays crisp). */
            padding: 4px 8px; border-radius: calc(var(--radius) - 2px);
            border: 1px solid var(--border);
            background: var(--bg-card-hover);
            color: color-mix(in srgb, var(--text-primary) 80%, transparent);
            font-family: inherit; font-size: 16px; line-height: 1; cursor: pointer;
        }
        .session-actions button.rename {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .session-actions button.kill {
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        }
        .session-actions button:hover {
            /* T3 hover tint layered over the chip surface (Task 2.8) —
               replaces the old brightness filter, which also brightened
               the border. Glyph goes full-opacity. */
            background: linear-gradient(var(--hover-tint), var(--hover-tint))
                        var(--bg-card-hover);
            color: var(--text-primary);
        }
        .session-card.dragging { opacity: 0.4; cursor: grabbing; }
        .empty { color: var(--text-muted); font-style: italic; padding: 12px 0; font-size: 12px; }

        /* Session-card loading skeleton (Task 1.11d — T3's shimmer):
           placeholder cards seeded into #session-list at lobby boot, alive
           only until the first /sessions render (every render path starts
           with clearChildren). One gradient band sweeps the card surface;
           the -1s delay starts it mid-sweep so the first paint already
           moves. */
        .session-skeleton {
            height: 55px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 8px);
            background: linear-gradient(120deg, transparent 40%,
                            var(--skeleton-highlight), transparent 60%)
                        var(--bg-card) 0 0 / 200% 100%;
            animation: skeleton 2s -1s infinite linear;
        }
        @keyframes skeleton {
            to { background-position: -200% 0; }
        }

        /* Claude state dot — running pulses, awaiting glows, done sits still. */
        .session-title-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .state-dot {
            width: 8px; height: 8px; border-radius: 50%;
            flex: 0 0 8px; display: inline-block;
        }
        .state-dot.running {
            background: var(--state-running);
            animation: state-pulse 1.3s ease-in-out infinite;
        }
        .state-dot.awaiting {
            background: var(--state-awaiting);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-awaiting) 22%, transparent);
        }
        /* Pills v2 (Task 2.4): done only demands attention while UNSEEN —
           full emerald + soft ring until the next visit (T3's unseen-
           Completed pill), then it settles to a dimmed dot. */
        .state-dot.done { background: var(--state-done); opacity: 0.45; }
        .state-dot.done.unseen {
            opacity: 1;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-done) 22%, transparent);
        }
        @keyframes state-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.8); }
        }
        /* "Working for Xs" note on running cards (Task 2.4, T3's
           WorkingTimelineRow): three 4px dots pulsing staggered
           0/200/400ms + a self-ticking seconds span. */
        .working-note {
            display: inline-flex; align-items: center; gap: 3px;
            color: var(--state-running); white-space: nowrap;
        }
        .working-note i {
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--state-running);
            animation: working-pulse 1.4s ease-in-out infinite;
        }
        .working-note i:nth-child(2) { animation-delay: 200ms; }
        .working-note i:nth-child(3) { animation-delay: 400ms; margin-right: 3px; }
        @keyframes working-pulse {
            0%, 100% { opacity: 0.25; }
            50%      { opacity: 1; }
        }

        /* Project groups */
        .project-group { display: flex; flex-direction: column; gap: 6px; }
        .project-header {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 6px 4px 2px; border-radius: 6px;
            cursor: pointer; user-select: none; -webkit-user-select: none;
            color: var(--text-muted); min-width: 0;
        }
        /* Ghost row: T3's neutral 4% hover tint (Task 2.8). */
        .project-header:hover { background: var(--hover-tint); color: var(--text-primary); }
        .project-header:focus-visible {
            /* Inset for the same overflow reason as .session-card. */
            outline: 2px solid var(--ring);
            outline-offset: -2px;
        }
        .project-header .chev {
            display: inline-block; width: 12px; text-align: center;
            font-size: 10px; transition: transform 0.15s;
        }
        .project-group.collapsed .project-header .chev { transform: rotate(-90deg); }
        .project-title {
            /* T3 group-label type: 10px uppercase, .08em tracking
               (ThreadTerminalDrawer.tsx:1439), 600 per the weight scale. */
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .project-badges {
            display: flex; align-items: center; gap: 8px;
            margin-left: auto; flex-shrink: 0;
            font-size: 12px; color: var(--text-muted);
        }
        .project-badges .state-chip {
            display: inline-flex; align-items: center; gap: 4px;
        }
        .project-badges .state-dot { width: 7px; height: 7px; flex-basis: 7px; }
        .project-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .project-actions button {
            /* Icon glyphs (+ / ⋯) at the T3 16px icon size; the muted
               color IS the T3 ghost-icon treatment. */
            padding: 1px 7px 2px;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); font-family: inherit; font-size: 16px;
            line-height: 1.25; cursor: pointer;
        }
        .project-actions button:hover {
            color: var(--accent); background: var(--hover-tint);
            border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .project-sessions {
            display: flex; flex-direction: column; gap: 6px;
            margin-left: 5px; padding-left: 8px;
            border-left: 1px solid var(--border);
        }
        .project-group.collapsed .project-sessions { display: none; }
        .project-group[data-project=""] .project-sessions {
            margin-left: 0; padding-left: 0; border-left: 0;
        }
        .project-group.dragging { opacity: 0.4; }
        .project-header.drag-over {
            outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent);
            outline-offset: -2px;
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }
        .project-empty-hint {
            color: var(--text-muted); font-style: italic;
            font-size: 12px; padding: 2px 0 2px 2px;
        }
        .new-project-btn {
            margin-top: 10px; width: 100%;
            flex-shrink: 0;   /* sidebar flex child — see .restore-btn */
            box-sizing: border-box; height: 32px; padding: 0 11px;
            border-radius: var(--radius);
            border: 1px dashed var(--border-strong);
            background: transparent; color: var(--text-muted);
            font-family: inherit; font-size: 14px; cursor: pointer;
        }
        .new-project-btn:hover {
            color: var(--text-primary); border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }

        /* Card/header popup menu (Move to…, Rename, Kill / project actions) */
        .popup-menu {
            position: fixed; z-index: 10000;
            background: var(--bg-card);
            /* T3 menu surface (Task 1.11b/c): hairline border, --radius,
               elevation drop kept + scheme bevel appended. */
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 4px; min-width: 150px; max-width: 230px;
            max-height: 60vh; overflow-y: auto;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), var(--surface-shadow);
            font-family: var(--font-ui);
        }
        .popup-menu .menu-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); padding: 6px 10px 2px;
        }
        .popup-menu button {
            text-align: left; padding: 7px 10px; border: 0;
            border-radius: calc(var(--radius) - 2px);
            background: transparent; color: var(--text-primary);
            font-family: inherit; font-size: 14px; cursor: pointer;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* Menu-item hover = T3's neutral 4% tint (Task 2.8). */
        .popup-menu button:hover { background: var(--hover-tint); color: var(--accent); }
        .popup-menu button.danger { color: var(--danger); }
        .popup-menu button.danger:hover { color: var(--danger); }
        .popup-menu button:disabled { opacity: 0.64; cursor: default; }

        /* Slim scrollbars (Task 1.10) — lobby chrome + gallery scrollables
           ONLY, listed explicitly. The terminal's .xterm-viewport scrollbar
           is deliberately absent: styling ANY ::-webkit-scrollbar pseudo
           flips that scrollbar to custom rendering, which can change the
           width xterm measured at open() — grid geometry is a red line.
           (xterm gets themed slider COLORS via readTerminalTheme() instead —
           inert on 5.5.0, live after the deferred 6.x upgrade.) */
        #lobby-sidebar::-webkit-scrollbar,
        #lobby.access-denied::-webkit-scrollbar,
        #img-gallery .gallery-grid::-webkit-scrollbar,
        .popup-menu::-webkit-scrollbar { width: 6px; }
        #lobby-sidebar::-webkit-scrollbar-track,
        #lobby.access-denied::-webkit-scrollbar-track,
        #img-gallery .gallery-grid::-webkit-scrollbar-track,
        .popup-menu::-webkit-scrollbar-track { background: transparent; }
        #lobby-sidebar::-webkit-scrollbar-thumb,
        #lobby.access-denied::-webkit-scrollbar-thumb,
        #img-gallery .gallery-grid::-webkit-scrollbar-thumb,
        .popup-menu::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        #lobby-sidebar::-webkit-scrollbar-thumb:hover,
        #lobby.access-denied::-webkit-scrollbar-thumb:hover,
        #img-gallery .gallery-grid::-webkit-scrollbar-thumb:hover,
        .popup-menu::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Theme picker — sits at the bottom of the sidebar */
        .theme-picker {
            margin-top: auto; padding-top: 14px;
            border-top: 1px solid var(--border);
            font-size: 12px; color: var(--text-muted);
        }
        .theme-picker-label {
            display: block; margin-bottom: 6px;
            /* T3 group-label type (Task 2.8): 10px uppercase .08em. */
            font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        /* Nine choices wrap into rows of three (260px sidebar). */
        .theme-options { display: flex; flex-wrap: wrap; gap: 4px; }
        .theme-options button {
            flex: 1 1 calc(33.33% - 3px); min-width: 0;
            white-space: nowrap; padding: 5px 4px;
            border-radius: calc(var(--radius) - 2px);
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border); font-family: inherit;
            font-size: 12px; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .theme-options button:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
        }
        .theme-options button.active {
            border-color: var(--accent); color: var(--accent);
            background: var(--bg-card-hover);
        }

        /* Font-size stepper — sits under the theme picker (Task 1.8).
           Steps the TERMINAL font (xterm fontSize), not lobby chrome. */
        .font-size-row {
            display: flex; align-items: center; gap: 6px;
            padding-top: 10px; font-size: 12px; color: var(--text-muted);
        }
        .font-size-row .theme-picker-label { display: inline; margin: 0 auto 0 0; }
        .font-size-row button {
            width: 36px; padding: 5px 0;
            border-radius: calc(var(--radius) - 2px);
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border); font-family: inherit;
            font-size: 12px; font-weight: 500; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .font-size-row button:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
        }
        #font-size-value {
            min-width: 2ch; text-align: center; color: var(--text-primary);
        }

        /* Settings popover (Task 2.6) — roaming terminal prefs, opened
           from the sidebar gear under the theme picker. Same surface
           language as .popup-menu (hairline border, --radius, elevation
           drop + scheme bevel). */
        .settings-row { padding-top: 10px; }
        #settings-btn {
            width: 100%; padding: 6px 8px; text-align: left;
            border-radius: calc(var(--radius) - 2px);
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border); font-family: inherit;
            font-size: 12px; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        #settings-btn:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
        }
        #settings-btn[aria-expanded="true"] {
            border-color: var(--accent); color: var(--accent);
            background: var(--bg-card-hover);
        }
        .settings-panel {
            position: fixed; z-index: 10000;
            width: 240px; padding: 10px 12px 12px;
            max-height: calc(100vh - 24px); overflow-y: auto;
            display: flex; flex-direction: column; gap: 9px;
            background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), var(--surface-shadow);
            font-family: var(--font-ui); font-size: 12px;
            color: var(--text-primary);
        }
        .settings-panel .sp-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); padding-bottom: 1px;
        }
        .settings-panel .sp-row { display: flex; align-items: center; gap: 6px; }
        .settings-panel .sp-row > label {
            flex: 0 0 auto; width: 82px; color: var(--text-muted); font-size: 12px;
        }
        .settings-panel .sp-val {
            min-width: 4ch; text-align: right; color: var(--text-primary);
            font-variant-numeric: tabular-nums; font-size: 12px;
        }
        .settings-panel input[type="range"] {
            flex: 1 1 auto; min-width: 0; accent-color: var(--accent);
        }
        .settings-panel input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
        .settings-panel .sp-seg { display: flex; gap: 4px; flex: 1 1 auto; }
        .settings-panel .sp-seg button,
        .settings-panel .sp-step button {
            flex: 1 1 0; min-width: 0; padding: 5px 4px; white-space: nowrap;
            border-radius: calc(var(--radius) - 2px);
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border); font-family: inherit;
            font-size: 12px; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .settings-panel .sp-seg button:hover,
        .settings-panel .sp-step button:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
        }
        .settings-panel .sp-seg button.active {
            border-color: var(--accent); color: var(--accent);
            background: var(--bg-card-hover);
        }
        .settings-panel .sp-step { display: flex; gap: 4px; flex: 1 1 auto; align-items: center; }
        .settings-panel .sp-step button { flex: 0 0 36px; }
        .settings-panel .sp-step .sp-val { flex: 1 1 auto; text-align: center; }

        /* ——— Chrome density pass (Task 2.8, T3 metrics) ———
           Focus treatment: 2px var(--ring) at 1px offset, keyboard-only
           (:focus-visible — pointer clicks stay ring-free; text inputs
           match on any focus, as in T3). :where() pins specificity at the
           bare pseudo-class so the full-bleed rows above (.session-card,
           .project-header) keep their inset −2px variants and the inline
           rename editor keeps its own outline: none. Terminal-mode
           floating buttons are body-level, hence the second selector. */
        :where(#lobby, .popup-menu, .settings-panel, #img-gallery, .toast-card)
            :where(button, input, [tabindex]):focus-visible,
        :where(#paste-btn, #img-btn, #gallery-btn, #font-inc-btn, #font-dec-btn):focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 1px;
        }
        /* One disabled treatment across the chrome (T3's
           disabled:opacity-64). Higher-specificity rules above restate
           0.64 where they add cursor/etc. */
        :where(#lobby, .popup-menu, .settings-panel, .toast-card)
            :where(button, input):disabled {
            opacity: 0.64; cursor: default;
        }

        @media (max-width: 720px) {
            /* Stack sidebar + terminal; let the terminal pane take whatever
               remains after the sidebar so it tracks the soft keyboard via
               the dynamic viewport height. */
            #lobby, #lobby-shell { height: 100dvh; }
            #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            #lobby-sidebar {
                border-right: 0; border-bottom: 1px solid var(--border);
                max-height: 40vh;
            }
            #lobby-content { height: auto; min-height: 0; }
            #lobby.sidebar-collapsed #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 0 1fr;
            }
            #lobby.sidebar-collapsed #lobby-content { height: auto; }
        }

        /* Task 2.8 touch ergonomics: 44px minimum targets (T3's
           pointer-coarse:min-h-11) and one type step up (T3 is
           mobile-first: text-base, stepping DOWN to sm:text-sm on
           desktop). Lobby chrome + popovers only — the soft-key toolbar
           (#soft-keys) and the 48px floating action buttons keep their
           own sizing. The inline rename editor is excluded: 44px would
           jump the card layout mid-rename. min-height beats the 32px
           height on the standard buttons by CSS min-wins rules. */
        @media (pointer: coarse) {
            :where(#lobby, .popup-menu, .settings-panel)
                :where(button, input:not(.rename-input)) {
                min-height: 44px;
            }
            /* Square icon buttons stay square at target size. */
            #sidebar-toggle, #notify-toggle { width: 44px; height: 44px; }
            /* The header row's reserve for the fixed #sidebar-toggle
               grows with it (44px + 12px inset). */
            .lobby-header-row { padding-right: 56px; }
            .font-size-row button { width: 44px; }
            .settings-panel .sp-step button { flex-basis: 44px; }
            /* Type steps: standard buttons 14→16, 12px tier →14. */
            .new-row button, .restore-btn, .new-project-btn,
            .popup-menu button { font-size: 16px; }
            .theme-options button, .font-size-row button, #settings-btn,
            .settings-panel .sp-seg button, .settings-panel .sp-step button {
                font-size: 14px;
            }
        }

        /* Soft-key toolbar — terminal mode only, touch devices only.
           Built in JS after xterm mounts; lives docked above the soft
           keyboard (visualViewport-aware). Display:none by default; the
           pointer:coarse media query un-hides it. */
        #soft-keys {
            display: none;
            position: fixed;
            left: 0; right: 0;
            /* Lift above the soft keyboard via --kb-offset (JS-updated from
               visualViewport). Without this iOS Safari's keyboard would
               cover the toolbar — the layout viewport doesn't shrink when
               the keyboard opens, only the visual viewport does. */
            bottom: calc(var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            z-index: 9998;
            box-sizing: border-box;
            padding: 6px calc(6px + env(safe-area-inset-left))
                     6px calc(6px + env(safe-area-inset-right));
            background: color-mix(in srgb, var(--bg-card) 92%, transparent);
            border-top: 1px solid var(--border-strong);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            font-family: var(--font-mono);
        }
        #soft-keys::-webkit-scrollbar { height: 0; }
        #soft-keys .sk-row {
            display: inline-flex; gap: 6px; align-items: center;
        }
        #soft-keys button {
            flex: 0 0 auto;
            min-width: 38px; height: 38px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            font: inherit; font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: background 0.1s, border-color 0.1s, color 0.1s;
        }
        #soft-keys button:active {
            background: color-mix(in srgb, var(--accent) 25%, var(--bg-card-hover));
        }
        #soft-keys button.sk-mod.armed {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            background: color-mix(in srgb, var(--accent) 18%, var(--bg-card-hover));
        }
        #soft-keys button.sk-mod.latched {
            color: var(--bg-page);
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent);
        }
        #soft-keys button.sk-mod.latched::after {
            content: '•';
            margin-left: 4px;
            font-weight: 700;
        }
        @media (pointer: coarse) {
            #soft-keys { display: flex; }
            /* Shrink the terminal container so its bottom edge meets the
               top of the soft-key toolbar. Using height (not padding) so
               xterm's FitAddon — which reads getComputedStyle(parent).height
               — picks up the reduced size and proposes the right row count. */
            body.has-soft-keys #terminal {
                height: calc(100% - 50px - env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <script>
    /* Pre-paint theme boot — body's FIRST child, executed before any content
       exists to paint, so the very first frame already carries the right
       palette and the browser-chrome color (<meta name=theme-color>) is in
       sync. It cannot live in <head>: every theme selector is body.theme-*
       and document.body does not exist during <head> parsing. 'system'
       follows the OS scheme as t3-dark/t3-light (kept live by the change
       listener); an UNSET choice keeps the historical default (slate) so
       users who never picked a theme see zero change. The main app script
       reuses these globals (__tlThemes / __tlApplyTheme). */
    (function () {
        var FALLBACK = 'slate';
        window.__tlThemes = ['carbon', 'slate', 'mono', 'ink', 't3-dark',
            't3-light', 'catppuccin-mocha', 'catppuccin-latte', 'system'];
        window.__tlApplyTheme = function (t) {
            if (window.__tlThemes.indexOf(t) === -1) t = FALLBACK;
            if (t === 'system') {
                t = matchMedia('(prefers-color-scheme: dark)').matches
                    ? 't3-dark' : 't3-light';
            }
            var b = document.body;
            Array.prototype.slice.call(b.classList).forEach(function (c) {
                if (c.indexOf('theme-') === 0) b.classList.remove(c);
            });
            b.classList.add('theme-' + t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.content = getComputedStyle(b)
                    .getPropertyValue('--bg-page').trim() || '#0d1117';
            }
        };
        function stored() {
            try { return localStorage.getItem('tmux-theme'); }
            catch (e) { return null; }
        }
        window.__tlApplyTheme(stored() || FALLBACK);
        try {
            matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', function () {
                    if (stored() !== 'system') return;
                    window.__tlApplyTheme('system');
                    // xterm bakes its colors at boot: terminal-mode pages
                    // (valid ?arg=) reload to re-read them — same effect as
                    // the picker's iframe reload. Task 1.7's live switch
                    // hooks in via __tlThemeLive and replaces the reload.
                    if (typeof window.__tlThemeLive === 'function') {
                        window.__tlThemeLive('system');
                    } else if (/[?&]arg=/.test(location.search)) {
                        location.reload();
                    }
                });
        } catch (e) { /* no matchMedia listener — auto-follow stays off */ }
    })();
