        .pd-field > label { flex: 0 0 auto; width: 52px; color: var(--text-muted); }
        .pd-field > input, .pd-search {
            flex: 1 1 auto; min-width: 0; padding: 7px 9px;
            background: var(--bg-page); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: calc(var(--radius) - 3px);
            font: inherit;
        }
        .pd-field > input:focus, .pd-search:focus {
            outline: none; border-color: var(--accent);
        }
        .pd-selected {
            font-size: 12px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pd-selected b { color: var(--text-primary); font-weight: 500; }
        .pd-list {
            flex: 0 1 auto; min-height: 120px; max-height: 300px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 2px;
            border: 1px solid var(--border); border-radius: calc(var(--radius) - 3px);
            padding: 4px;
        }
        .pd-row {
            /* never let the flex column compress a row to a sliver: overflow
               below zeroes a flex item's automatic min-size, so without this
               flex-shrink collapses the rows and clips the text vertically. */
            flex: 0 0 auto;
            text-align: left; padding: 6px 8px; border: 0; border-radius: 6px;
            background: transparent; color: var(--text-primary);
            font: inherit; font-size: 12px; line-height: 1.5; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pd-row:hover { background: var(--bg-card-hover); }
        .pd-row.active { color: var(--accent); background: var(--bg-card-hover); }
        .pd-hint { font-size: 11px; color: var(--text-muted); min-height: 14px; }
        .pd-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
        .pd-btn {
            padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-card); color: var(--text-primary);
            font: inherit; font-size: 12px; cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .pd-btn:hover { background: var(--bg-card-hover); }
        .pd-btn.pd-primary { border-color: var(--accent); color: var(--accent); }

        /* Bottom-sheet presentation (Task M.5) — coarse-pointer chrome
           for the settings panel + the Task 2.5 context menu. The
           backdrop div is the ROOT (modal shade, tap = dismiss; its
           background-color is what fades, so the sheet child never
           inherits an opacity ramp); the sheet rides the SAME
           --kb-offset + safe-area plumbing as the soft-key toolbar so
           it lifts above the soft keyboard in the terminal iframe
           (0px fallback in the lobby). Drag affordances (grip zone +
           header) are touch-action:none pointer surfaces; the CONTENT
           area keeps native scrolling — no scroll-vs-drag ambiguity
           by construction, and zero touch listeners anywhere. */
        .tl-sheet-backdrop {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.35);
            touch-action: none;
        }
        .tl-sheet {
            position: absolute; left: 0; right: 0;
            bottom: calc(var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            display: flex; flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border); border-bottom: 0;
            border-radius: 14px 14px 0 0;
            box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.4), var(--surface-shadow);
            font-family: var(--font-ui);
            will-change: transform, height;
        }
        .tl-sheet .tl-sheet-grip-zone {
            flex: 0 0 auto; padding: 8px 0 6px;
            touch-action: none; cursor: grab;
        }
        .tl-sheet .tl-sheet-grip {
            width: 32px; height: 4px; border-radius: 2px; margin: 0 auto;
            background: var(--border-strong);
        }
        .tl-sheet .tl-sheet-header {
            flex: 0 0 auto; padding: 0 16px 8px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted);
            touch-action: none;
        }
        /* The wrapped surface becomes the sheet's scrollable content —
           shed its popover chrome (fixed position/size/border/shadow),
           keep its innards untouched. */
        .tl-sheet .settings-panel,
        .tl-sheet .popup-menu {
            position: static; width: auto; max-width: none; max-height: none;
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            border: 0; border-radius: 0; box-shadow: none;
            background: transparent;
            overscroll-behavior: contain;
            padding-bottom: 12px;
        }

        /* Command palette (Task 4.1) — opt-in keybinding layer. Same
           surface language as .settings-panel; sits above every other
           overlay tier (they are all ≤10000, appended-later wins ties). */
        .cmd-palette-backdrop {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.35);
        }
        .cmd-palette {
            position: fixed; z-index: 10001;
            top: 12vh; left: 50%; transform: translateX(-50%);
            width: min(560px, calc(100vw - 32px));
            max-height: 62vh; display: flex; flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), var(--surface-shadow);
            font-family: var(--font-ui); font-size: 13px;
            color: var(--text-primary); overflow: hidden;
        }
        .cmd-palette input {
            font: inherit; color: var(--text-primary);
            background: transparent; border: 0; outline: none;
            border-bottom: 1px solid var(--border);
            padding: 11px 14px; width: 100%; box-sizing: border-box;
        }
        .cmd-palette input::placeholder { color: var(--text-muted); }
        .cmd-palette .cp-list { overflow-y: auto; padding: 5px; }
        .cmd-palette .cp-list::-webkit-scrollbar { width: 6px; }
        .cmd-palette .cp-list::-webkit-scrollbar-track { background: transparent; }
        .cmd-palette .cp-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb); border-radius: 3px;
        }
        .cmd-palette .cp-group-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); padding: 6px 9px 3px;
        }
        .cmd-palette .cp-note {
            padding: 6px 9px; color: var(--text-muted); font-size: 12px;
        }
        .cmd-palette .cp-item {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 9px; border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
        }
        .cmd-palette .cp-item.sel { background: var(--hover-tint); }
        .cmd-palette .cp-item .cp-title {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .cmd-palette .cp-item.danger .cp-title { color: var(--danger); }
        .cmd-palette .cp-item .cp-meta {
            margin-left: auto; flex-shrink: 0;
            font-size: 11px; color: var(--text-muted);
        }

        /* Alt-held session-jump badges (Task 4.1): numbered chips on the
           first nine sidebar cards while Alt is held ≥100 ms and the
           keybinding layer is enabled — they label the Alt+1..9 targets.
           .session-card is position:relative purely as their anchor. */
        .kb-badge {
            position: absolute; top: -6px; right: -4px; z-index: 2;
            min-width: 16px; height: 16px; line-height: 16px;
            text-align: center; border-radius: 8px; padding: 0 3px;
            background: var(--accent); color: var(--bg-page);
            font-family: var(--font-mono); font-size: 11px; font-weight: 700;
            pointer-events: none;
        }

        /* ——— Chrome density pass (Task 2.8, T3 metrics) ———
           Focus treatment: 2px var(--ring) at 1px offset, keyboard-only
           (:focus-visible — pointer clicks stay ring-free; text inputs
           match on any focus, as in T3). :where() pins specificity at the
           bare pseudo-class so the full-bleed rows above (.session-card,
           .project-header) keep their inset −2px variants and the inline
           rename editor keeps its own outline: none. Terminal-mode
           floating buttons are body-level, hence the second selector. */
        :where(#lobby, .popup-menu, .settings-panel, #img-gallery, .toast-card)
            :where(button, input, [tabindex]):focus-visible,
        :where(#paste-btn, #img-btn, #gallery-btn, #font-inc-btn, #font-dec-btn):focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 1px;
        }
        /* One disabled treatment across the chrome (T3's
           disabled:opacity-64). Higher-specificity rules above restate
           0.64 where they add cursor/etc. */
        :where(#lobby, .popup-menu, .settings-panel, .toast-card)
            :where(button, input):disabled {
            opacity: 0.64; cursor: default;
        }

        @media (max-width: 720px) {
            /* Stack sidebar + terminal; let the terminal pane take whatever
               remains after the sidebar so it tracks the soft keyboard via
               the dynamic viewport height. */
            #lobby, #lobby-shell { height: 100dvh; }
            #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            #lobby-sidebar {
                border-right: 0; border-bottom: 1px solid var(--border);
                max-height: 40vh;
            }
            #lobby-content { height: auto; min-height: 0; }
            #lobby.sidebar-collapsed #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 0 1fr;
            }
            #lobby.sidebar-collapsed #lobby-content { height: auto; }
        }

        /* Task 2.8 touch ergonomics: 44px minimum targets (T3's
           pointer-coarse:min-h-11) and one type step up (T3 is
           mobile-first: text-base, stepping DOWN to sm:text-sm on
           desktop). Lobby chrome + popovers only — the soft-key toolbar
           (#soft-keys) and the 48px floating action buttons keep their
           own sizing. The inline rename editor is excluded: 44px would
           jump the card layout mid-rename. min-height beats the 32px
           height on the standard buttons by CSS min-wins rules. */
        @media (pointer: coarse) {
            :where(#lobby, .popup-menu, .settings-panel)
                :where(button, input:not(.rename-input)) {
                min-height: 44px;
            }
            /* Square icon buttons stay square at target size. */
            #sidebar-toggle, #notify-toggle, #reload-toggle, #list-close { width: 44px; height: 44px; }
            /* The header row's reserve for the fixed #sidebar-toggle
               grows with it (44px + 12px inset). */
            .lobby-header-row { padding-right: 56px; }
            .settings-panel .sp-step button { flex-basis: 44px; }
            /* Type steps: standard buttons 14→16, 12px tier →14. */
            .new-row button, .restore-btn, .new-project-btn,
            .popup-menu button { font-size: 16px; }
            .theme-options button, #settings-btn,
            .settings-panel .sp-seg button, .settings-panel .sp-step button {
                font-size: 14px;
            }
        }

        /* Full-screen two-view mobile nav (coarse pointer + narrow).
           A phone shows EITHER the whole session list OR the whole
           terminal — never the old sidebar-40vh + terminal split, which
           wasted the screen on both. sidebar-collapsed is the view flip:
           absent = BROWSING (the list owns the viewport), present =
           TERMINAL (the attached session owns it). #sidebar-toggle is the
           always-visible "back to the list" control in terminal view, and
           a session card is the forward path in browsing view. Pure CSS +
           class state — no history entries, so the M.3 flat history holds.
           Kept separate from the plain max-width:720px block above so a
           narrow FINE-pointer window (a shrunk desktop) is byte-identical
           to before; only touch phones get the flip. */
        @media (pointer: coarse) and (max-width: 720px) {
            #lobby, #lobby-shell { height: 100dvh; }
            /* BROWSING VIEW (default): the list fills the viewport and
               owns its own scroll (5526 inner-scroller — the document
               never scrolls). The terminal pane is fully out of flow. */
            #lobby-shell {
                display: block;
                grid-template-columns: none; grid-template-rows: none;
            }
            #lobby-sidebar {
                height: 100dvh; max-height: none;
                border-right: 0; border-bottom: 0;
            }
            /* Density (Viktor: "show the most projects when browsing on
               mobile"): the helper sub-line is redundant once the list owns
               the whole screen — reclaim its row for another session. */
            #lobby-sidebar .lobby-sub { display: none; }
            #lobby-content { display: none; }
            /* The toggle only ever means "go back to the list" here, so it
               is redundant (and confusing) while the list is already up. */
            #sidebar-toggle { display: none; }
            /* Base tier gives #list-close its look; visibility stays gated:
               display:none by default (below, outside this block it never
               shows) and inline-flex only here when un-hidden. */
            /* Closing the list WITHOUT picking a session (Viktor: "the only
               option to close it is to choose a project"): an ✕ in the list
               header, shown only while a session is attached — it returns
               to that session's terminal view. Fresh boots with nothing
               attached have nothing to close, so it stays hidden (the JS
               toggles .hidden; rule 9735 both ways: the list's own close is
               this ✕, the terminal's is the ‹ Sessions pill). */
            #list-close:not(.hidden) { display: inline-flex; }

            /* TERMINAL VIEW (sidebar-collapsed): the attached session
               fills the viewport; the sidebar is fully hidden (its restore
               path is the toggle below, per 9735). */
            #lobby.sidebar-collapsed #lobby-sidebar { display: none; }
            #lobby.sidebar-collapsed #lobby-content { display: block; height: 100dvh; }
            /* Back-to-list control: a labelled pill in the top-left, above
               the terminal but not over its content (the terminal's own
               chrome lives inside the iframe). Label text set in JS. */
            #lobby.sidebar-collapsed #sidebar-toggle {
                display: inline-flex; width: auto; min-width: 0;
                top: calc(12px + env(safe-area-inset-top));
                left: calc(12px + env(safe-area-inset-left)); right: auto;
                padding: 0 14px; gap: 6px; font-size: 15px;
            }
        }

        /* Soft-key toolbar — terminal mode only, touch devices only.
           Built in JS after xterm mounts; lives docked above the soft
           keyboard (visualViewport-aware). Display:none by default; the
           pointer:coarse media query un-hides it. */
        #soft-keys {
            display: none;
            position: fixed;
            left: 0; right: 0;
            /* Lift above the soft keyboard via --kb-offset (JS-updated from
               visualViewport). Without this iOS Safari's keyboard would
               cover the toolbar — the layout viewport doesn't shrink when
               the keyboard opens, only the visual viewport does. */
            bottom: calc(var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            z-index: 9998;
            box-sizing: border-box;
            padding: 6px calc(6px + env(safe-area-inset-left))
                     6px calc(6px + env(safe-area-inset-right));
            background: color-mix(in srgb, var(--bg-card) 92%, transparent);
            border-top: 1px solid var(--border-strong);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            /* Task M.1: the toolbar is now a flex row of
               [ scrolling .sk-row | pinned ⌄ dismiss ] — the horizontal
               scrolling moved INTO .sk-row so the dismiss key can never
               scroll out of reach. */
            gap: 6px;
            align-items: center;
            font-family: var(--font-mono);
        }
        #soft-keys .sk-row {
            display: flex; gap: 6px; align-items: center;
            flex: 1 1 auto;
            min-width: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            /* Task M.1: edge fade — the row scrolls horizontally; fading
               edges are the scroll affordance (static two-sided mask, no
               scroll-position JS). */
            -webkit-mask-image: linear-gradient(to right,
                transparent, #000 16px, #000 calc(100% - 16px), transparent);
            mask-image: linear-gradient(to right,
                transparent, #000 16px, #000 calc(100% - 16px), transparent);
        }
        #soft-keys .sk-row::-webkit-scrollbar { height: 0; }
        #soft-keys button {
            flex: 0 0 auto;
            min-width: 38px; height: 38px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            font: inherit; font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: background 0.1s, border-color 0.1s, color 0.1s;
        }
        #soft-keys button:active {
            background: color-mix(in srgb, var(--accent) 25%, var(--bg-card-hover));
        }
        /* Icon soft keys (makeBtn opts.icon): flex-center the svg in the
           same 38px box the text keys use — geometry untouched. */
        #soft-keys button.sk-icon {
            display: inline-flex; align-items: center; justify-content: center;
        }
        #soft-keys button.sk-mod.armed {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            background: color-mix(in srgb, var(--accent) 18%, var(--bg-card-hover));
        }
        #soft-keys button.sk-mod.latched {
            color: var(--bg-page);
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent);
        }
        #soft-keys button.sk-mod.latched::after {
            content: '•';
            margin-left: 4px;
            font-weight: 700;
        }
        /* Task IR.3 (Viktor: "way too many buttons") — the toolbar
           declutters into TWO tiers and every rule below is ADDITIVE (the
           M.1 row/button/mod rules above are byte-untouched and keep
           styling both tiers). #soft-keys becomes a flex COLUMN of
           [.sk-row.sk-extra — the ⋯-toggled overflow tier, display:none
           unless #soft-keys.expanded, stacked ABOVE] then [.sk-line — the
           always-visible bottom line = scrolling .sk-row.sk-primary
           (Esc ⇧Tab · arrows) + pinned ⋯ + pinned ⌄]. Both pinned keys
           are direct children of the bottom line so neither can ever
           scroll out of reach (the M.1 dismiss lesson). .sk-extra is
           still an .sk-row, so it inherits the overflow-x scroll, hidden
           scrollbar and 16px two-edge mask fade for free. Collapsed
           height is identical to the old single-row toolbar (the static
           50px terminal-height fallback below still covers the pre-JS
           boot state). */
        #soft-keys {
            flex-direction: column;
            /* Column axis flip: the base align-items:center would
               shrink-wrap the tiers; stretch keeps them full-width
               exactly like the old single row. */
            align-items: stretch;
        }
        #soft-keys .sk-line {
            display: flex; gap: 6px; align-items: center;
            min-width: 0;
        }
        #soft-keys .sk-row.sk-extra { display: none; }
        #soft-keys.expanded .sk-row.sk-extra { display: flex; }
        #soft-keys .sk-group { display: flex; gap: 6px; }
        /* Hairline separator between row-2 key groups. */
        #soft-keys .sk-sep {
            flex: 0 0 1px;
            align-self: stretch;
            margin: 6px 5px;
            background: var(--border-strong);
            opacity: 0.6;
        }
        /* Single-glyph keys (arrows, ‹ › ⌄ ⋯ and the row-2 glyphs) shave
           width so the primary line fits 390px-class screens with ZERO
           scroll (binding IR.3 fit assertion). */
        #soft-keys button.sk-narrow { min-width: 36px; padding: 0 8px; }
        /* The primary pair reads as two groups — the row's own gap IS the
           12px group gap; the in-group gap stays 6px via .sk-group. */
        #soft-keys .sk-row.sk-primary { gap: 12px; }
        /* 375px-class: measured at 375 CSS px the primary line misses the
           fit by ~4px at 36px min-width — shave the glyph keys to 34px
           (spec'd allowance). ≤360px degrades to the M.1 fade+scroll. */
        @media (max-width: 375px) {
            #soft-keys button.sk-narrow { min-width: 34px; }
        }
        /* The primary line FITS by design above 360px, where the M.1
           scroll-affordance edge fade would only dim Esc/→ — drop it
           there; ≤360px keeps the fade+scroll degradation. */
        @media (min-width: 361px) {
            #soft-keys .sk-row.sk-primary {
                -webkit-mask-image: none;
                mask-image: none;
            }
        }
        /* Task M.10/M.11/IR.1: native compose bar — a VISIBLE sibling of
           the soft-key toolbar hosting full-fidelity mobile text input
           (autocorrect / swipe typing / dictation). Since IR.1 the field
           is a transparent live MIRROR of the pty input line — every edit
           streams immediately through the differ in the coarse compose

           field stays in the DOM, focusable and keyboard-summoning, but is
           painted away so the terminal is the ONLY visible input surface.

           focus + the soft keyboard on iOS — a WebKit trait confirmed

           QuickType and swipe typing all still fire; the bar reserves NO
           terminal space (syncViewport reads a .ghost bar as height 0, so

    <script>
    /* Pre-paint theme boot — body's FIRST child, executed before any content
       exists to paint, so the very first frame already carries the right
       palette and the browser-chrome color (<meta name=theme-color>) is in
       sync. It cannot live in <head>: every theme selector is body.theme-*
       and document.body does not exist during <head> parsing. 'system'
       follows the OS scheme as t3-dark/t3-light (kept live by the change
       listener); an UNSET choice keeps the historical default (slate) so
       users who never picked a theme see zero change. The main app script
       reuses these globals (__tlThemes / __tlApplyTheme). */
    (function () {
        var FALLBACK = 'slate';
        window.__tlThemes = ['carbon', 'slate', 'mono', 'ink', 't3-dark',
            't3-light', 'catppuccin-mocha', 'catppuccin-latte', 'system'];
        window.__tlApplyTheme = function (t) {
            if (window.__tlThemes.indexOf(t) === -1) t = FALLBACK;
            if (t === 'system') {
                t = matchMedia('(prefers-color-scheme: dark)').matches
                    ? 't3-dark' : 't3-light';
            }
            var b = document.body;
            Array.prototype.slice.call(b.classList).forEach(function (c) {
                if (c.indexOf('theme-') === 0) b.classList.remove(c);
            });
            b.classList.add('theme-' + t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.content = getComputedStyle(b)
                    .getPropertyValue('--bg-page').trim() || '#0d1117';
            }
        };
        function stored() {
            try { return localStorage.getItem('tmux-theme'); }
            catch (e) { return null; }
        }
        window.__tlApplyTheme(stored() || FALLBACK);
        try {
            matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', function () {
                    if (stored() !== 'system') return;
                    window.__tlApplyTheme('system');
                    // xterm bakes its colors at boot: terminal-mode pages
                    // (valid ?arg=) reload to re-read them — same effect as
                    // the picker's iframe reload. Task 1.7's live switch
                    // hooks in via __tlThemeLive and replaces the reload.
                    if (typeof window.__tlThemeLive === 'function') {
                        window.__tlThemeLive('system');
                    } else if (/[?&]arg=/.test(location.search)) {
                        location.reload();
                    }
                });
        } catch (e) { /* no matchMedia listener — auto-follow stays off */ }
    })();

                        label: g.label,
                        note: null,
                        items: g.items
                            .map((item, index) => ({ item, index, rank: rankItem(item, q) }))
                            .filter(en => normalizeSearchText(en.item.terms.join(' ')).includes(q))
                            .sort((a, b) => b.rank - a.rank || a.index - b.index)
                            .map(en => en.item)
                    })).filter(g => g.items.length || g.note);
                }
                function setSel(i) {
                    if (!flatItems.length) { selIdx = 0; return; }
                    selIdx = Math.max(0, Math.min(i, flatItems.length - 1));
                    flatItems.forEach((f, j) => f.el.classList.toggle('sel', j === selIdx));
                    try { flatItems[selIdx].el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
                }
                function runItem(item) {
                    // keepFocus items pick their own focus target (e.g. the
                    // new-session name box) — mirroring the ⋯ menu's flag;
                    // everything else hands the keyboard back (the deferred
                    // refocus lands after any sync prompt/confirm the item
                    // opens, same trick as closeMenu(true)).
                    close(!item.keepFocus);
                    item.run();
                }
                function render() {
                    if (!backdrop) return;
                    const groups = buildGroups(inputEl.value);
                    clearChildren(listBox);
                    flatItems = [];
                    for (const g of groups) {
                        const lab = document.createElement('div');
                        lab.className = 'cp-group-label';
                        lab.textContent = g.label;
                        listBox.appendChild(lab);
                        if (g.note) {
                            const n = document.createElement('div');
                            n.className = 'cp-note';
                            n.textContent = g.note;
                            listBox.appendChild(n);
                        }
                        for (const item of g.items) {
                            const row = document.createElement('div');
                            row.className = 'cp-item' + (item.danger ? ' danger' : '');
                            const t = document.createElement('span');
                            t.className = 'cp-title';
                            t.textContent = item.title;
                            row.appendChild(t);
                            if (item.meta) {
                                const m = document.createElement('span');
                                m.className = 'cp-meta';
                                m.textContent = item.meta;
                                row.appendChild(m);
                            }
                            const idx = flatItems.length;
                            // Keep the query input focused: swallow the
                            // focus-stealing mousedown, let the click fire.
                            row.addEventListener('mousedown', (e) => e.preventDefault());
                            row.addEventListener('mouseenter', () => setSel(idx));
                            row.addEventListener('click', () => runItem(item));
                            listBox.appendChild(row);
                            flatItems.push({ item, el: row });
                        }
                    }
                    if (!flatItems.length && sessionsCache) {
                        const n = document.createElement('div');
                        n.className = 'cp-note';
                        n.textContent = 'No matches';
                        listBox.appendChild(n);
                    }
                    setSel(0);
                }
                function onKey(e) {
                    if (e.key === 'Escape') {
                        e.preventDefault(); e.stopPropagation();
                        close(true);
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault(); e.stopPropagation();
                        setSel(selIdx + 1);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault(); e.stopPropagation();
                        setSel(selIdx - 1);
                    } else if (e.key === 'Enter') {
                        e.preventDefault(); e.stopPropagation();
                        if (flatItems[selIdx]) runItem(flatItems[selIdx].item);
                    }
                }
                function open() {
                    if (backdrop) return;
                    backdrop = document.createElement('div');
                    backdrop.className = 'cmd-palette-backdrop';
                    const panel = document.createElement('div');
                    panel.className = 'cmd-palette';
                    inputEl = document.createElement('input');
                    inputEl.type = 'text';
                    inputEl.placeholder = 'Search sessions…  (start with > for actions)';
                    inputEl.setAttribute('aria-label', 'Command palette');
                    listBox = document.createElement('div');
                    listBox.className = 'cp-list';
                    panel.appendChild(inputEl);
                    panel.appendChild(listBox);
                    backdrop.appendChild(panel);
                    backdrop.addEventListener('click', (e) => {
                        if (e.target === backdrop) close(true);
                    });
                    backdrop.addEventListener('keydown', onKey);
                    inputEl.addEventListener('input', render);
                    document.body.appendChild(backdrop);
                    inputEl.focus();
                    const seq = ++openSeq;
                    render();   // paints 'Loading sessions…' + actions immediately
                    Promise.resolve().then(() => env.sessions()).then((list) => {
                        if (seq !== openSeq || !backdrop) return;
                        sessionsCache = Array.isArray(list) ? list : [];
                        render();
                    }).catch(() => {
                        if (seq !== openSeq || !backdrop) return;
                        sessionsCache = [];
                        render();
                    });
                }
                return { toggle, open, close, isOpen };
            }

            return {
                KEY: KB_KEY,
                init,
                matchesAppChord,
                enabled: kbEnabled,
                setEnabled: setKbEnabled,
                createPalette,
                recentsFirst,
                newShellChord: IS_MAC ? 'Cmd+J' : 'Ctrl+J'
            };
        })();

        // ---- typed toast manager (Task 2.7) ---------------------------
        // T3's toast surface (apps/web ui/toast.tsx) reduced to vanilla
        // DOM: five types with icons, id-based update-in-place + close,
        // long descriptions clamp to 4 lines with a Copy button, optional
        // expandable detail rows. The old single-element #toast div is now
        // the stack viewport (see the CSS block).
        const tlToast = (() => {
            const stack = document.getElementById('toast');
            // Icon fix: node FACTORIES, not glyph strings — ⚠/ℹ are
            // emoji-capable (render as color emoji on iOS/Android) and
            // ✕/✓ fell to fallback fonts. loading stays null: that card
            // draws the CSS ring spinner, no glyph.
            const ICONS = {
                error:   () => iconNode('x', 16),
                warning: () => iconNode('triangle-alert', 16),
                success: () => iconNode('check', 16),
                info:    () => iconNode('info', 16),
                loading: null
            };
            const CLAMP_MIN_CHARS = 180; // T3: shorten long bodies visually; Copy keeps the full string
            const MAX_STACK = 6;
            const toasts = new Map(); // id → {id, el, opts, timer, expanded}
            let seq = 0;
            // "has any toast" marker — battery A.3 asserts #toast.visible.
            function syncVisible() { stack.classList.toggle('visible', toasts.size > 0); }
            function render(t) {
                const o = t.opts;
                clearChildren(t.el);
                const type = ICONS.hasOwnProperty(o.type) ? o.type : 'info';
                t.el.className = 'toast-card t-' + type;
                if (typeof o.onTap === 'function') t.el.classList.add('t-tappable');
                const icon = document.createElement('span');
                icon.className = 't-icon';
                if (ICONS[type]) icon.appendChild(ICONS[type]());
                t.el.appendChild(icon);
                const body = document.createElement('div');
                body.className = 't-body';
                const title = document.createElement('div');
                title.className = 't-title';
                title.textContent = o.title || '';
                body.appendChild(title);
                const desc = typeof o.description === 'string' ? o.description : '';
                if (desc) {
                    const d = document.createElement('div');
                    d.className = 't-desc' + (desc.length >= CLAMP_MIN_CHARS ? ' t-clamp' : '');
                    d.textContent = desc;
                    body.appendChild(d);
                }
                if (Array.isArray(o.detail) && o.detail.length) {
                    const labels = o.expandLabels || {};
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 't-expand';
                    const panel = document.createElement('div');
                    panel.className = 't-detail';
                    const paintExpand = () => {
                        // Icon fix: label text + chevron svg (▴/▾ fell
                        // outside every bundled font's coverage).
                        btn.replaceChildren(
                            document.createTextNode(t.expanded
                                ? (labels.collapse || 'Hide details') + ' '
                                : (labels.expand || 'Show details') + ' '),
                            iconNode(t.expanded ? 'chevron-up' : 'chevron-down', 14));
                        panel.classList.toggle('hidden', !t.expanded);
                    };
                    btn.addEventListener('click', () => { t.expanded = !t.expanded; paintExpand(); });
                    for (const row of o.detail) {
                        const r = document.createElement('div');
                        r.className = 't-detail-row';
                        const main = document.createElement('div');
                        main.textContent = row.text || '';
                        r.appendChild(main);
                        if (row.sub) {
                            const sub = document.createElement('div');
                            sub.className = 't-detail-sub';
                            sub.textContent = row.sub;
                            r.appendChild(sub);
                        }
                        panel.appendChild(r);
                    }
                    paintExpand();
                    body.appendChild(btn);
                    body.appendChild(panel);
                }
                t.el.appendChild(body);
                if (desc && (type === 'error' || desc.length >= CLAMP_MIN_CHARS)) {
                    const copy = document.createElement('button');
                    copy.type = 'button';
                    copy.className = 't-copy';
                    copy.title = 'Copy message';
                    copy.replaceChildren(iconNode('copy', 14));
                    copy.addEventListener('click', () => {
                        (navigator.clipboard
                            ? navigator.clipboard.writeText(desc)
                            : Promise.reject()
                        ).then(() => {
                            copy.replaceChildren(iconNode('check', 14));
                            setTimeout(() => {
                                copy.replaceChildren(iconNode('copy', 14));
                            }, 1200);
                        }).catch(() => {});
                    });
                    t.el.appendChild(copy);
                }
                const x = document.createElement('button');
                x.type = 'button';
                x.className = 't-x';
                x.title = 'Dismiss';
                x.textContent = '×';
                x.addEventListener('click', () => close(t.id));
                t.el.appendChild(x);
            }
            function arm(t) {
                clearTimeout(t.timer);
                const ms = t.opts.timeout === undefined ? 3000 : t.opts.timeout;
                if (ms > 0) t.timer = setTimeout(() => close(t.id), ms); // 0 = sticky
            }
            function add(opts) {
                // Cap the stack: drop the oldest auto-dismiss card first so
                // a burst can never bury a sticky health toast (the old
                // single-element toast simply replaced itself).
                if (toasts.size >= MAX_STACK) {
                    let victim = null;
                    for (const t of toasts.values()) { if (t.timer) { victim = t; break; } }
                    close((victim || toasts.values().next().value).id);
                }
                const id = ++seq;
                const t = { id, el: document.createElement('div'),
                            opts: opts || {}, timer: null, expanded: false };
                toasts.set(id, t);
                // Whole-card tap action (opt-in onTap — the deploy "Update
                // ready" toast): wired once on the persistent card element,
                // NOT in render() (update() re-renders and would stack
                // listeners). Inner controls (✕ dismiss, expand, copy) keep
                // their own click semantics.
                if (typeof t.opts.onTap === 'function') {
                    t.el.addEventListener('click', (e) => {
                        if (e.target.closest('.t-x, .t-expand, .t-copy')) return;
                        t.opts.onTap();
                    });
                }
                render(t);
                arm(t);
                stack.appendChild(t.el);
                syncVisible();
                if (t.opts.type === 'error') haptic('error');   // Task M.7
                return id;
            }
            function update(id, opts) {
                const t = toasts.get(id);
                if (!t) return;
                const wasError = t.opts.type === 'error';
                Object.assign(t.opts, opts || {});
                render(t); // t.expanded survives the re-render
                arm(t);
                // Task M.7: a toast TURNING into an error buzzes like a new
                // one; re-rendering an already-error toast stays silent.
                if (t.opts.type === 'error' && !wasError) haptic('error');
            }
            function close(id) {
                const t = toasts.get(id);
                if (!t) return;
                clearTimeout(t.timer);
                toasts.delete(id);
                t.el.remove();
                syncVisible();
            }
            return { add, update, close };
        })();
        window.__tlToast = tlToast; // battery hook

        // Legacy signature kept as a thin wrapper — every pre-existing call
        // site works unchanged: ''/undefined type → info, `duration || 3000`
        // matches the old timer default exactly.
        function showToast(msg, type, duration) {
            tlToast.add({
                type: type === 'error' || type === 'success' ? type : 'info',
                title: msg,
                timeout: duration || 3000
            });
        }

        // ---- slow-request health toast (Task 2.7) ---------------------
        // Port of T3's requestLatencyState + SlowRpcRequestToastCoordinator:
        // every tmux-api/clipboard-upload fetch (and the terminal WS connect,
        // tracked from the connect path) is "pending" until acknowledged;
        // anything pending >15s joins ONE self-updating sticky warning toast,
        // which closes when the last slow item acks. Failures ack too — the
        // caller's own error handling owns that messaging.
        const SLOW_ACK_MS = 15000;
        const slowRequests = (() => {
            const MAX_TRACKED = 64; // hard cap — a leak must not grow unbounded
            const pending = new Map(); // id → {tag, startedAtMs, timer}
            const slow = new Map();    // id → {tag, startedAtMs}
            let seq = 0;
            let toastId = null;
            function repaint() {
                if (!slow.size) {
                    if (toastId !== null) { tlToast.close(toastId); toastId = null; }
                    return;
                }
                const list = Array.from(slow.values());
                const opts = {
                    type: 'warning',
                    title: 'Some requests are slow',
                    description: list.length + ' request' + (list.length === 1 ? '' : 's')
                        + ' waiting longer than ' + Math.round(SLOW_ACK_MS / 1000) + 's.',
                    detail: list.map(r => ({
                        text: r.tag,
                        sub: 'Started ' + new Date(r.startedAtMs).toLocaleTimeString()
                    })),
                    expandLabels: { expand: 'Show requests', collapse: 'Hide requests' },
                    timeout: 0
                };
                if (toastId === null) toastId = tlToast.add(opts);
                else tlToast.update(toastId, opts);
            }
            function track(tag) {
                if (pending.size + slow.size >= MAX_TRACKED) return 0;
                const id = ++seq;
                const startedAtMs = Date.now();
                pending.set(id, {
                    tag, startedAtMs,
                    timer: setTimeout(() => {
                        pending.delete(id);
                        slow.set(id, { tag, startedAtMs });
                        repaint();
                    }, SLOW_ACK_MS)
                });
                return id;
            }
            function ack(id) {
                if (!id) return;
                const p = pending.get(id);
                if (p) { clearTimeout(p.timer); pending.delete(id); return; }
                if (slow.delete(id)) repaint();
            }
            return { track, ack };
        })();
        window.__tlSlowRequests = slowRequests; // battery hook

        // Wrap fetch so every tmux-api/clipboard-upload call site (present
        // and future) is tracked without touching the call sites. Anything
        // else — the stale-tab healer's self-fetch, ttyd's /token, CDN
        // assets — passes straight through.
        const tlRealFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            let u = null;
            try {
                u = new URL(
                    typeof input === 'string' ? input
                        : (input instanceof URL ? input.href : input.url),
                    location.href
                );
            } catch (e) { /* unparseable → untracked */ }
            if (!u || u.origin !== location.origin
                   || !/^\/(api\/sessions|clipboard)\//.test(u.pathname)) {
                return tlRealFetch(input, init);
            }
            const method = ((init && init.method)
                || (input && typeof input === 'object' && input.method) || 'GET').toUpperCase();
            const id = slowRequests.track(method + ' ' + u.pathname);
            const p = tlRealFetch(input, init);
            // Ack on headers-arrived or failure; return the ORIGINAL promise
            // so caller semantics (incl. rejection) are untouched.
            p.then(() => slowRequests.ack(id), () => slowRequests.ack(id));
            return p;
        };

        function clearChildren(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function emptyState(text) {
            const e = document.createElement('div');
            e.className = 'empty';
            e.textContent = text;
            return e;
        }

        // ---- bottom-sheet presenter (Task M.5) --------------------------
        // Coarse-pointer presentation for the settings panel and the Task
        // 2.5 context menu — presentation ONLY, callers keep their own
        // semantics. A fixed bottom sheet with a 32×4 grabber; pointer-
        // drag lives on the grabber/header ONLY, so the content area
        // scrolls natively (no scroll-vs-drag ambiguity) and NO touch
        // listener exists anywhere in this module (pointer events +
        // CSS touch-action on the handle elements, per-open, removed
        // with the sheet — nothing standing, nothing near the terminal
        // surface; red line untouched).
        //   Detents (opts.detents, the settings panel): opens at 55% of
        //   the visualViewport height, grabber-drag snaps 55%⇄92%.
        //   Menus (no detents): content-sized, CAPPED at the 55% detent
        //   (there is nothing to reveal past the content, so an up-drag
        //   rubber-bands and springs back).
        //   Dismiss: downward drag >25% of the sheet's height at drag
        //   start (from the 92% detent additionally "below the 55%
        //   detent", so 92→55 snaps stay reachable) or a backdrop tap —
        //   both fire opts.onDismiss; the CALLER owns the close path
        //   (settings routes through closeOverlay for the Task 2.3
        //   focus return; the menu resolves its promise exactly like a
        //   popover dismissal).
        //   Bottom offset rides the EXISTING --kb-offset + safe-area
        //   CSS plumbing (written by the terminal's syncViewport; 0px
        //   fallback in the lobby) — deliberately NO new visualViewport
        //   listeners: detents are measured at open and per drag.
        // Returns { root, panel, close(done) }: close() slides out and
        // then calls done() (which removes root, e.g. via closeOverlay).
        function presentBottomSheet(contentEl, opts) {
            opts = opts || {};
            const vvH = () => (window.visualViewport
                ? window.visualViewport.height : window.innerHeight);
            const d55 = () => Math.round(vvH() * 0.55);
            const d92 = () => Math.round(vvH() * 0.92);

            const root = document.createElement('div');
            root.className = 'tl-sheet-backdrop';
            const panel = document.createElement('div');
            panel.className = 'tl-sheet';
            panel.setAttribute('role', 'dialog');
            panel.setAttribute('aria-modal', 'true');
            panel.setAttribute('aria-label', opts.title || 'Menu');
            const grip = document.createElement('div');
            grip.className = 'tl-sheet-grip-zone';
            const bar = document.createElement('div');
            bar.className = 'tl-sheet-grip';
            grip.appendChild(bar);
            panel.appendChild(grip);
            let header = null;
            if (opts.title) {
                header = document.createElement('div');
                header.className = 'tl-sheet-header';
                header.textContent = opts.title;
                panel.appendChild(header);
            }
            contentEl.classList.add('tl-sheet-content');
            panel.appendChild(contentEl);
            root.appendChild(panel);

            // Height is set SYNCHRONOUSLY (only the slide-in animates), so
            // callers and the battery can measure the detent immediately.
            if (opts.detents) panel.style.height = d55() + 'px';
            else panel.style.maxHeight = d55() + 'px';

            panel.style.transform = 'translateY(105%)';
            root.style.backgroundColor = 'rgba(0,0,0,0)';
            document.body.appendChild(root);
            requestAnimationFrame(() => {
                panel.style.transition = 'transform 0.22s ease-out';
                root.style.transition = 'background-color 0.2s ease-out';
                panel.style.transform = '';
                root.style.backgroundColor = '';
            });

            let closed = false;
            function close(done) {
                if (closed) { if (done) done(); return; }
                closed = true;
                // The exit animation must not eat taps meant for what's
                // underneath (or a fast re-open of the gear button).
                root.style.pointerEvents = 'none';
                panel.style.transition = 'transform 0.18s ease-in';
                root.style.transition = 'background-color 0.18s ease-in';
                panel.style.transform = 'translateY(105%)';
                root.style.backgroundColor = 'rgba(0,0,0,0)';
                setTimeout(() => { if (done) done(); }, 190);
            }

            // Backdrop tap → dismiss. click, not pointerdown, so the M.4
            // trailing-click swallower (window capture, armed before a
            // long-press menu opens) still eats the opening press's lift.
            root.addEventListener('click', (e) => {
                if (e.target === root && !closed && opts.onDismiss) opts.onDismiss();
            });

            // Grabber/header drag. Pointer capture keeps the stream while
            // the finger wanders; preventDefault on pointerdown because the
            // handle is pure chrome — it must never steal focus (in the
            // terminal iframe a focus flip would collapse the soft
            // keyboard mid-gesture).
            let drag = null;   // { id, y0, h0 }
            const curH = () => panel.getBoundingClientRect().height;
            function onDown(e) {
                if (drag || closed || (e.button !== undefined && e.button !== 0)) return;
                drag = { id: e.pointerId, y0: e.clientY, h0: curH() };
                panel.style.transition = 'none';
                root.style.transition = 'none';
                if (!opts.detents) panel.style.maxHeight = 'none';   // let the rubber overshoot render
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            }
            function onMove(e) {
                if (!drag || e.pointerId !== drag.id) return;
                const dy = e.clientY - drag.y0;              // >0 = downward
                const hi = opts.detents ? d92() : drag.h0;
                let h = drag.h0 - dy;
                if (h > hi) h = hi + (h - hi) * 0.15;        // rubber past the top
                if (h < 0) h = 0;
                panel.style.height = h + 'px';
                const drop = Math.max(0, dy);                // fade shade on the way down
                root.style.backgroundColor =
                    'rgba(0,0,0,' + (0.35 * Math.max(0.3, 1 - drop / (drag.h0 * 1.33))).toFixed(3) + ')';
            }
            function settle(snapH, clearH) {
                panel.style.transition = 'height 0.2s ease, transform 0.2s ease';
                root.style.transition = 'background-color 0.2s ease';
                root.style.backgroundColor = '';
                panel.style.height = snapH + 'px';
                if (clearH) setTimeout(() => {
                    if (!closed && !drag) {
                        panel.style.height = '';
                        panel.style.maxHeight = d55() + 'px';
                    }
                }, 210);
            }
            function endDrag(e, cancelled) {
                if (!drag || e.pointerId !== drag.id) return;
                const dy = e.clientY - drag.y0;
                const h0 = drag.h0;
                drag = null;
                const h = curH();
                if (opts.detents) {
                    const dismiss = !cancelled && dy > h0 * 0.25 && h < d55();
                    if (dismiss) { if (opts.onDismiss) opts.onDismiss(); return; }
                    settle(h > (d55() + d92()) / 2 ? d92() : d55(), false);
                } else {
                    const dismiss = !cancelled && dy > h0 * 0.25;
                    if (dismiss) { if (opts.onDismiss) opts.onDismiss(); return; }
                    settle(h0, true);                        // spring back, then height:auto again
                }
            }
            for (const el of (header ? [grip, header] : [grip])) {
                el.addEventListener('pointerdown', onDown);
                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', (e) => endDrag(e, false));
                el.addEventListener('pointercancel', (e) => endDrag(e, true));
            }
            return { root, panel, close };
        }
        // Sheet presentation gate: coarse primary pointer AND the Wave-5
        // tl-gestures master kill AND the roamed per-feature flag
        // (gestures.bottomSheet, default on). Evaluated at every open —
        // a flip applies to the NEXT open, no reload.
        function sheetPresentationWanted() {
            try {
                return matchMedia('(pointer: coarse)').matches &&
                    gesturesEnabled() && getPrefs().gestures.bottomSheet;
            } catch (e) { return false; }
        }

        // ---- right-click context menu (Task 2.5) -----------------------
        // Promise-based DOM menu, ported from T3's contextMenuFallback.ts
        // (rAF first-frame dismissal guard + 4px viewport clamping;
        // submenus dropped — flat items only). Shares the .popup-menu
        // visual language and item shape ({label, onClick, danger?,
        // disabled?} / {labelHeading}); resolves with the PICKED ITEM (the
        // caller runs its onClick), or null on dismissal. Callers attach
        // `contextmenu` ONLY to lobby session cards and gallery thumbs —
        // NEVER the xterm surface, which keeps its native browser menu
        // (red line: no mouse-semantics changes). Dismissal listeners ride
        // window-capture so they run before any document-level Escape
        // handlers (gallery/lightbox) — one Escape closes one layer.
        function showContextMenu(x, y, items) {
            return new Promise((resolve) => {
                const menu = document.createElement('div');
                menu.className = 'popup-menu';
                // Task M.5: on coarse pointers (flags permitting) the same
                // menu presents as a bottom sheet instead of an at-pointer
                // popup — presentation ONLY: items, the promise shape,
                // Escape/outside dismissal and the M.4 swallower interplay
                // are unchanged.
                const asSheet = sheetPresentationWanted();
                let sheet = null;
                let disposed = false;
                // T3's canDismissFromPointer: the pointer gesture that
                // OPENED the menu is still dispatching — outside-dismissal
                // arms one frame later or the menu dies as it is born.
                let canDismiss = false;
                const cleanup = (result) => {
                    if (disposed) return;
                    disposed = true;
                    window.removeEventListener('keydown', onKey, true);
                    window.removeEventListener('pointerdown', onPointer, true);
                    window.removeEventListener('contextmenu', onCtx, true);
                    if (sheet) sheet.close(() => sheet.root.remove());
                    else menu.remove();
                    resolve(result);
                };
                // Outside-dismissal must ignore the sheet's own chrome
                // (grabber drags start there): "inside" is the sheet PANEL
                // when presented as a sheet. The BACKDROP is special-cased
                // too — dismissing it on pointerdown would remove the shade
                // before the tap's trailing CLICK hit-tests, letting that
                // click fall through onto whatever sits underneath (a card
                // tap-through, observed in the harness); the backdrop's own
                // click listener dismisses instead, consuming the tap.
                const within = (t) => (sheet ? sheet.panel : menu).contains(t);
                const onKey = (e) => {
                    if (e.key !== 'Escape') return;
                    e.preventDefault();
                    e.stopPropagation();
                    cleanup(null);
                };
                const onPointer = (e) => {
                    if (!canDismiss || within(e.target)) return;
                    if (sheet && e.target === sheet.root) return;   // backdrop: its click dismisses
                    cleanup(null);
                };
                const onCtx = (e) => {
                    if (!canDismiss || within(e.target)) return;
                    e.preventDefault();   // this right-click dismisses, it doesn't browse
                    if (sheet && e.target === sheet.root) return;   // hold on backdrop: lift-click dismisses
                    cleanup(null);
                };
                for (const it of items) {
                    if (it.labelHeading) {
                        const l = document.createElement('div');
                        l.className = 'menu-label';
                        l.textContent = it.labelHeading;
                        menu.appendChild(l);
                        continue;
                    }
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = it.label;
                    if (it.danger) b.classList.add('danger');
                    if (it.disabled) b.disabled = true;
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        cleanup(it);
                    });
                    menu.appendChild(b);
                }
                if (asSheet) {
                    // Sheet presentation ignores the anchor point (the
                    // sheet is bottom-fixed); backdrop tap and >25% grabber
                    // drag-down resolve null — the popover's dismissal
                    // contract, so callers keep their focus semantics.
                    sheet = presentBottomSheet(menu, {
                        onDismiss: () => cleanup(null)
                    });
                    requestAnimationFrame(() => { canDismiss = true; });
                } else {
                    menu.style.left = x + 'px';
                    menu.style.top = y + 'px';
                    document.body.appendChild(menu);
                    requestAnimationFrame(() => {
                        // 4px viewport clamp (T3's clampMenuPosition), after
                        // layout so the measured size is real.
                        const r = menu.getBoundingClientRect();
                        menu.style.left = Math.min(Math.max(4, x),
                            Math.max(4, window.innerWidth - r.width - 4)) + 'px';
                        menu.style.top = Math.min(Math.max(4, y),
                            Math.max(4, window.innerHeight - r.height - 4)) + 'px';
                        canDismiss = true;
                    });
                }
                window.addEventListener('keydown', onKey, true);
                window.addEventListener('pointerdown', onPointer, true);
                window.addEventListener('contextmenu', onCtx, true);
            });
        }

        // ---- long-press → context menu (Task M.4) ----------------------
        // Shared recognizer for lobby session cards + gallery thumbs —
        // OVERLAY/LOBBY chrome only, NEVER the xterm surface (red line:
        // the terminal keeps its native browser menu and untouched touch
        // path). Two detectors, deduped per press:
        //   1. `contextmenu` — desktop right-click, and Android synthesizes
        //      it ~400-500 ms into a touch hold (free, OS-timed). This is
        //      the same handler Task 2.5 installed, now owned here; it is
        //      pre-Wave-5 behavior and stays live even with gestures
        //      opted out.
        //   2. a 500 ms pointerdown timer — iOS Safari never fires
        //      contextmenu for touch. Timer path ONLY is the Wave-5
        //      addition: gated per press (live, no reload) by the
        //      tl-gestures master kill + tl:prefs:v1
        //      gestures.cardLongPress (one flag governs cards AND thumbs);
        //      cancels on >10 px travel, lift, pointercancel, pointerleave
        //      or a second touch; vibrates on fire.
        // Dedupe: whichever detector fires first stamps lastFire; the
        // other is a no-op for LONG_PRESS_DEDUPE_MS unless a new
        // pointerdown started a new press (so desktop double-right-click
        // still relocates the menu exactly as before).
        // Opt-out semantics: with the gesture off, TOUCH-derived
        // contextmenu is silenced too (preventDefault, no menu) — "long-
        // press does nothing" must hold on Android or the opt-out is
        // meaningless exactly where gestures live; the master-kill
        // comment above promises the same. Touch-derived is detected via
        // the tracked press, Chromium's sourceCapabilities, or a recent
        // touch pointerdown on the element. MOUSE right-click (and
        // keyboard menu) stays unconditional — that is the Task 2.5
        // contract, not a gesture.
        // Trailing-event swallow (one-shot window-capture flags, armed
        // just BEFORE the menu opens so they register AHEAD of
        // showContextMenu's own window-capture dismissal listeners; both
        // disarm at the next pointerdown so real gestures are untouched):
        //   - click: the finger-lift after a timer fire still synthesizes
        //     a click that would activate the card/thumb underneath;
        //   - contextmenu (timer path only): on Android whose long-press
        //     timeout is >500 ms our timer wins the race and the OS
        //     contextmenu lands AFTER the menu opened — unswallowed it
        //     would instantly dismiss it (onCtx) and double-fire (el
        //     listener).
        // opts: { skip(e), onActive(bool) } — onActive marks a pending
        // press (the lobby parks its 5 s poll repaint on it, the
        // isDragging precedent, so paint() can't detach a mid-press card).
        const LONG_PRESS_MS = 500;
        const LONG_PRESS_TRAVEL_PX = 10;
        const LONG_PRESS_DEDUPE_MS = 700;
        function attachLongPress(el, fn, opts) {
            opts = opts || {};
            const onActive = opts.onActive || (() => {});
            let lastFire = 0;   // dedupe stamp; reset by each new pointerdown
            let timer = null;
            let pid = null;     // tracked primary-touch pointerId
            let lastTouchDown = 0;   // any touch press on el, flag-independent
            let sx = 0, sy = 0, lx = 0, ly = 0;

            let swClick = null, swCtx = null, swDisarm = null;
            function disarmSwallowers() {
                if (swClick)  { window.removeEventListener('click', swClick, true); swClick = null; }
                if (swCtx)    { window.removeEventListener('contextmenu', swCtx, true); swCtx = null; }
                if (swDisarm) { window.removeEventListener('pointerdown', swDisarm, true); swDisarm = null; }
            }
            function armSwallowers(alsoCtx) {
                disarmSwallowers();
                swClick = (e) => {
                    if (e.detail === 0) return;   // keyboard activation, not our tap
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    disarmSwallowers();
                };
                window.addEventListener('click', swClick, true);
                if (alsoCtx) {
                    swCtx = (e) => {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        window.removeEventListener('contextmenu', swCtx, true);
                        swCtx = null;
                    };
                    window.addEventListener('contextmenu', swCtx, true);
                }
                swDisarm = () => disarmSwallowers();
                window.addEventListener('pointerdown', swDisarm, true);
            }

            function fire(x, y, fromTouch, alsoCtxSwallow) {
                if (Date.now() - lastFire < LONG_PRESS_DEDUPE_MS) return;
                lastFire = Date.now();
                if (fromTouch) {
                    armSwallowers(alsoCtxSwallow);
                    haptic('impact');   // Task M.7 vocabulary (menu open)
                }
                fn(x, y);
            }
            function cancelPress() {
                if (timer !== null) { clearTimeout(timer); timer = null; }
                if (pid !== null) { pid = null; onActive(false); }
            }

            el.addEventListener('contextmenu', (e) => {
                if (opts.skip && opts.skip(e)) return;
                e.preventDefault();
                e.stopPropagation();
                const fromTouch = pid !== null ||   // arrived mid-tracked-press
                    !!(e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) ||
                    Date.now() - lastTouchDown < 1500;
                cancelPress();
                if (fromTouch && !(gesturesEnabled() && getPrefs().gestures.cardLongPress)) {
                    // Opted out: an OS-recognized touch-hold does NOTHING —
                    // swallow the trailing click too, or the hold would
                    // "tap" the card on lift (observed in the harness:
                    // Chrome synthesizes a click after a preventDefaulted
                    // contextmenu).
                    armSwallowers(false);
                    return;
                }
                fire(e.clientX, e.clientY, fromTouch, false);
            });
            el.addEventListener('pointerdown', (e) => {
                lastFire = 0;                     // new press = new dedupe window
                if (e.pointerType !== 'touch' || !e.isPrimary) { cancelPress(); return; }
                lastTouchDown = Date.now();
                if (opts.skip && opts.skip(e)) return;
                if (pid !== null) { cancelPress(); return; }   // second pointer
                if (!(gesturesEnabled() && getPrefs().gestures.cardLongPress)) return;
                pid = e.pointerId;
                sx = lx = e.clientX; sy = ly = e.clientY;
                onActive(true);
                timer = setTimeout(() => {
                    timer = null;
                    if (pid === null) return;
                    pid = null;
                    onActive(false);
                    fire(lx, ly, true, true);
                }, LONG_PRESS_MS);
            });
            el.addEventListener('pointermove', (e) => {
                if (e.pointerId !== pid) return;
                lx = e.clientX; ly = e.clientY;
                if (Math.hypot(lx - sx, ly - sy) > LONG_PRESS_TRAVEL_PX) cancelPress();
            });
            el.addEventListener('pointerup', (e) => { if (e.pointerId === pid) cancelPress(); });
            el.addEventListener('pointercancel', (e) => { if (e.pointerId === pid) cancelPress(); });
            // M.1 precedent: a press drifting off the element cancels too
            // (covers <10 px starts near the edge without pointer capture).
            el.addEventListener('pointerleave', () => { if (pid !== null) cancelPress(); });
        }

        function showAccessDenied(detail) {
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            document.getElementById('font-inc-btn').classList.add('hidden');
            document.getElementById('font-dec-btn').classList.add('hidden');
            const lobby = document.getElementById('lobby');
            clearChildren(lobby);
            const h = document.createElement('h1');
            h.className = 'lobby-header';
            h.textContent = 'Access denied';
            lobby.appendChild(h);
            const p = document.createElement('p');
            p.className = 'lobby-sub';
            p.textContent = detail || 'You do not have a terminal account on this server.';
            lobby.appendChild(p);
            const p2 = document.createElement('p');
            p2.className = 'lobby-sub';
            p2.textContent = 'Authentik logs you in; access here requires an OS-user mapping in /etc/ttyd-user-map. Ask Viktor to add one.';
            lobby.appendChild(p2);
            lobby.classList.add('visible', 'access-denied');
            document.title = 'access denied';
        }

        // ---- deploy reload: TOP-owned, single reload ----------------------
        // After a deploy the served page changes. Reloading is owned by the
        // TOP document: an embedded terminal signals its parent (see
        // reloadIfStale) rather than reloading itself, so the lobby shell —
        // the part with no WebSocket to drop — is what actually refreshes,
        // and the iframe is replaced by that one top reload instead of racing
        // its own. tlTopReload is installed by the lobby (a defer-while-typing
        // policy); a top-level document with no policy installed (a
        // directly-opened terminal) falls back to the storm-guarded plain
        // reload below.
        let tlTopReload = null;
        function tlStormOK() {
            // At most one auto-reload per 2 minutes per top-level document.
            // This is also the anti-loop backstop: our served page is
            // byte-stable within a deploy (ttyd serves a static file; TL_BUILD
            // is seded once at deploy — nothing per-request varies), and a
            // reload re-boots the page so armBaseline('boot') re-arms the
            // baseline to the NEW bytes and detection stops. Even in the
            // pathological case of a per-request-varying page this caps
            // reloads at one per 2 min rather than a tight loop.
            let last = 0;
            try { last = Number(sessionStorage.getItem('tl-stale-reload') || 0); } catch (e) {}
            if (Date.now() - last < 120000) return false;
            try { sessionStorage.setItem('tl-stale-reload', String(Date.now())); } catch (e) {}
            return true;
        }
        function tlPlainReload(why) {
            if (!tlStormOK()) return;
            console.log('page changed on the server (' + why + ') — reloading');
            location.reload();
        }

        // ---- stale-page self-heal (shared: lobby + terminal) --------------
        // Deploys restart ttyd, which only DROPS the WebSocket: the page
        // silently reconnects and keeps running its old JavaScript forever —
        // Cache-Control: no-store never helps because the tab never
        // re-fetches itself. (Found the hard way: a day-old tab lacked the
        // drag-select feature entirely; drags fell through to Claude Code's
        // own hold-to-select highlight, which dies on mouse release.)
        // Remedy: hash our own served bytes at boot, and later re-fetch +
        // compare — if the server now serves a different page, reload into
        // it. The TERMINAL checks on every reconnect (the connection just
        // dropped anyway and tmux keeps the session); the LOBBY — which has
        // no WebSocket to drop — runs the same check on a short timer and on
        // visibility/pageshow resume (this hash check is the ONLY deploy
        // channel — there is no server build header). cacheMode threads the
        // cost knob: default 'no-store' (terminal verbatim — full
        // re-download); 'no-cache' (lobby) revalidates with If-None-Match
        // against the strong ETag the patched ttyd serves, so an unchanged
        // page costs a bodyless 304 (an unpatched ttyd just serves full
        // 200s — correct, merely not as cheap).
        // Known gap: a deploy landing between page load and the boot fetch
        // makes the baseline the NEW bytes while old code runs — heals on
        // the deploy after next. Not worth a build-stamp pipeline.
        let bootPageHash = null;
        function hashPage(text) {
            let h = 5381;
            for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
            return text.length + ':' + h;
        }
        function fetchSelf(cacheMode) {
            return fetch(location.pathname + location.search,
                         { cache: cacheMode || 'no-store', credentials: 'same-origin' })
                // Validate it is OUR page — an auth interstitial must never
                // become the baseline (it would blind the comparison).
                .then(r => r.ok ? r.text() : null)
                .then(t => (t && t.includes('terminal-lobby build:') ? t : null));
        }
        function armBaseline(where, cacheMode) {
            return fetchSelf(cacheMode).then(t => {
                if (t) { bootPageHash = hashPage(t); }
                else { console.warn('stale-tab healer: baseline fetch failed (' + where + ') — will retry on reconnect'); }
            }).catch(() => {});
        }
        function reloadIfStale(cacheMode) {
            // A failed boot baseline must not disarm the healer forever:
            // re-arm now, compare on the NEXT check.
            if (!bootPageHash) { armBaseline('reconnect', cacheMode); return; }
            fetchSelf(cacheMode).then(t => {
                if (!t || hashPage(t) === bootPageHash) return;
                // A new build is being served. Reloading is TOP-owned: an
                // embedded terminal never reloads itself (that freshens only
                // the iframe, leaves the lobby shell stale, and races the top
                // into a double load) — it signals the parent and lets the
                // top own the single reload, which replaces this iframe
                // anyway. A top-level document (the lobby, or a
                // directly-opened terminal) drives its own reload.
                if (window.parent !== window) {
                    try { window.parent.postMessage({ type: 'tl-build-stale' }, location.origin); } catch (e) {}
                    return;
                }
                (tlTopReload || tlPlainReload)('self-heal');
            }).catch(() => {});
        }

        // Preflight: ask tmux-api who we are. 403 = unmapped Authentik user → deny.
        let whoami = null;
        try {
            const resp = await fetch(WHOAMI_API, { credentials: 'same-origin' });
            if (resp.status === 401 || resp.status === 403) {
                showAccessDenied((await resp.text()).trim());
                return;
            }
            if (!resp.ok) {
                showAccessDenied('Preflight failed: HTTP ' + resp.status);
                return;
            }
            whoami = await resp.json();
        } catch (err) {
            showAccessDenied('Preflight failed: ' + err.message);
            return;
        }

        if (!validArg) {
            // ============================================================
            // LOBBY MODE — no valid ?arg=, render sidebar + iframe shell
            // ============================================================
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            document.getElementById('font-inc-btn').classList.add('hidden');
            document.getElementById('font-dec-btn').classList.add('hidden');
            document.getElementById('lobby').classList.add('visible');
            // Lobby-scoped styling hook (Task 1.11): drives the film-grain
            // overlay (body.lobby::after). Never set in terminal mode, so
            // the inner iframe document stays grain-free; applyTheme only
            // strips theme-* classes, so this survives theme switches.
            document.body.classList.add('lobby');
            const baseTitle = 'tmux sessions (' + whoami.osUser + ')';
            document.title = baseTitle;
            document.querySelector('#lobby .lobby-sub').textContent =
                'Logged in as ' + whoami.osUser + ' (' + whoami.authentik + '). Sessions are kernel-isolated per Unix user; you only see your own.';

            const listEl    = document.getElementById('session-list');
            const sidebarScrollEl = document.getElementById('lobby-sidebar');
            const newNameEl = document.getElementById('new-name');
            const newBtnEl  = document.getElementById('new-btn');
            const newProjectBtnEl = document.getElementById('new-project-btn');
            const restoreBtnEl = document.getElementById('restore-btn');
            const frameEl   = document.getElementById('session-frame');
            const emptyEl   = document.getElementById('lobby-empty');
