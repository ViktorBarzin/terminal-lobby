                dot.title = 'Claude: ' + (state === 'done' ? 'completed' :
                    state === 'awaiting' ? 'awaiting your input' : 'running');
                if (extraClass === 'unseen') dot.title += ' (new since your last visit)';
                tlAttachLegend(dot, 'claude', () => state);   // hover explains ALL the colors
                return dot;
            }

            // A transparent stand-in for the state dot so stateless sessions
            // keep the same left inset, so names stay aligned down the list.
            function placeholderDot() {
                const d = document.createElement('span');
                d.className = 'state-dot';
                d.setAttribute('aria-hidden', 'true');
                return d;
            }

            // Everything the thin row no longer shows inline lives in the
            // hover / long-press tooltip (2026-07-16 redesign): the live
            // command + pane title, the attach count, and last activity.
            function rowTooltip(s) {
                const parts = [];
                if (s.state) {
                    parts.push(s.state === 'done' ? 'completed'
                        : s.state === 'awaiting' ? 'awaiting your input'
                        : 'running');
                }
                if (s.pane_current_command) {
                    parts.push(s.pane_title
                        ? s.pane_current_command + ' — ' + s.pane_title
                        : s.pane_current_command);
                }
                if (s.attached > 0) parts.push(s.attached + ' attached');
                if (s.lastActivity) parts.push('active ' + relativeTime(s.lastActivity));
                return parts.join(' · ');
            }

            function renderCard(s) {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.dataset.name = s.name;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', 'Activate session ' + s.name);
                card.draggable = !isCoarsePointer;   // Task M.4 (see isCoarsePointer above)
                if (s.name === currentActive) card.classList.add('active');

                // Left: the state dot (in a fixed-width slot so names align
                // even when a session has no Claude state) + the name.
                const titleRow = document.createElement('div');
                titleRow.className = 'session-title-row';
                const dot = stateDot(s.state, isUnseenDone(s) ? 'unseen' : '');
                titleRow.appendChild(dot || placeholderDot());
                const name = document.createElement('div');
                name.className = 'session-name';
                name.textContent = s.name;
                titleRow.appendChild(name);
                if (dockState().session === s.name && !isCoarsePointer) {
                    const badge = document.createElement('span');
                    badge.className = 'dock-badge';
                    badge.textContent = '▤';
                    badge.title = 'Docked in the bottom panel';
                    badge.setAttribute('aria-label', 'docked');
                    titleRow.appendChild(badge);
                }
                card.appendChild(titleRow);

                // Right edge: a time on every row (2026-07-16). Running -> the
                // live elapsed timer, self-ticked by the shared 1 Hz interval
                // (state colour); otherwise -> the relative last activity.
                const time = document.createElement('div');
                time.className = 'row-time' + (s.state === 'running' ? ' running' : '');
                if (s.state === 'running') {
                    const since = stateChangedAt(s.name) || Date.now();
                    const t = document.createElement('span');
                    t.className = 'working-timer';
                    t.dataset.since = String(since);
                    t.textContent = formatWorking(Date.now() - since);
                    time.appendChild(t);
                } else {
                    time.textContent = relativeTime(s.lastActivity);
                }
                card.appendChild(time);
                card.title = rowTooltip(s);

                const actions = document.createElement('div');
                actions.className = 'session-actions';
                const menuBtn = document.createElement('button');
                menuBtn.replaceChildren(iconNode('ellipsis', 16));
                menuBtn.title = 'Session actions';
                menuBtn.setAttribute('aria-label', 'Actions for session ' + s.name);
                menuBtn.draggable = false;
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMenu(menuBtn, [
                        ...moveMenuItems(s.name),
                        { labelHeading: 'Session' },
                        { label: 'Rename', onClick: () => renameSession(s.name) },
                        { label: 'Kill', danger: true, onClick: () => killSession(s.name) }
                    ]);
                });
                actions.appendChild(menuBtn);
                card.appendChild(actions);

                card.addEventListener('click', (e) => {
                    // detail > 1 = second click of a double-click — the
                    // inline-rename path owns it (Task 2.5 guard).
                    if (e.detail > 1) return;
                    // On the ALREADY-selected session, a single click on the
                    // name text opens inline rename (desktop only — a coarse
                    // pointer keeps tap = flip-to-terminal, and renames via
                    // long-press). Non-active cards always attach first.
                    if (s.name === currentActive && !isCoarsePointer &&
                        e.target.closest('.session-name')) {
                        startInlineRename(s.name);
                        return;
                    }
                    activateSession(s.name);
                });
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateSession(s.name);
                    }
                });
                // Double-click the TITLE → inline rename (Task 2.5).
                // Guards per plan: nested buttons/inputs keep their own
                // double-click, held modifiers mean something else.
                card.addEventListener('dblclick', (e) => {
                    if (!e.target.closest('.session-title-row')) return;
                    if (e.target.closest('button, input')) return;
                    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
                    e.preventDefault();
                    startInlineRename(s.name);
                });
                // Right-click / long-press → the ⋯ menu at the pointer
                // (Tasks 2.5 + M.4) — on CARDS only, never the terminal
                // (red line: the xterm surface keeps the native browser
                // menu). attachLongPress owns BOTH detectors: contextmenu
                // (desktop right-click, Android touch-hold) and the 500 ms
                // pointer timer (iOS, which never fires contextmenu).
                async function openCardCtxMenu(x, y) {
                    closeMenu();
                    ctxMenuOpen++;
                    let picked = null;
                    try {
                        picked = await showContextMenu(x, y, [
                            ...moveMenuItems(s.name),
                            { labelHeading: 'Session' },
                            { label: 'Rename', keepFocus: true,
                              onClick: () => startInlineRename(s.name) },
                            { label: 'Kill', danger: true, onClick: () => killSession(s.name) }
                        ]);
                    } finally {
                        ctxMenuOpen--;
                    }
                    if (!picked) return;
                    // Picking refocuses the terminal (the openMenu(true)
                    // contract) — except Rename, whose editor needs the
                    // keyboard the moment it opens.
                    if (!picked.keepFocus) requestTerminalFocus();
                    picked.onClick();
                }
                attachLongPress(card, openCardCtxMenu, {
                    // native menu inside the rename editor
                    skip: (e) => !!e.target.closest('input'),
                    onActive: (v) => { gestureActive = v; }
                });

                card.addEventListener('dragstart', (e) => {
                    dragSrcCard = card;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', s.name);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    if (dragSrcCard === card) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcCard = null;
                    isDragging = false;
                });
                // Dropping on a card positions before/after it — including
                // cards in ANOTHER project, which reassigns on dragend.
                card.addEventListener('dragover', (e) => {
                    if (!dragSrcCard || dragSrcCard === card) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = card.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) card.after(dragSrcCard);
                    else card.before(dragSrcCard);
                });

                return card;
            }

            // One collapsible section: the Ungrouped area (projectName '') or a
            // project. `members` are live sessions in layout order.
            function renderGroup(projectName, members) {
                const isUngrouped = projectName === '';
                const collapseId = isUngrouped ? UNGROUPED_COLLAPSE_ID : projectName;
                const collapsed = !!getCollapsed()[collapseId];

                const group = document.createElement('div');
                group.className = 'project-group' + (collapsed ? ' collapsed' : '');
                group.dataset.project = projectName;

                const header = document.createElement('div');
                header.className = 'project-header';
                header.setAttribute('role', 'button');
                header.setAttribute('tabindex', '0');
                header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                header.setAttribute('aria-label',
                    (collapsed ? 'Expand ' : 'Collapse ') + (isUngrouped ? 'ungrouped sessions' : 'project ' + projectName));

                const chev = document.createElement('span');
                chev.className = 'chev';
                // Icon fix: chevron-down svg; the existing .collapsed CSS
                // rotate(-90deg) on the span still points it sideways.
                chev.replaceChildren(iconNode('chevron-down', 14));
                header.appendChild(chev);

                const title = document.createElement('span');
                title.className = 'project-title';
                title.textContent = isUngrouped ? 'Ungrouped' : projectName;
                header.appendChild(title);

                const badges = document.createElement('span');
                badges.className = 'project-badges';
                const count = document.createElement('span');
                count.textContent = String(members.length);
                badges.appendChild(count);
                // Collapsed headers aggregate member states so a folded
                // project still shows when something inside needs you.
                if (collapsed) {
                    for (const state of ['running', 'awaiting', 'done']) {
                        const n = members.filter(s => s.state === state).length;
                        if (!n) continue;
                        const chip = document.createElement('span');
                        chip.className = 'state-chip';
                        // A folded project's done chip keeps the unseen
                        // emphasis while ANY member completion is unseen.
                        chip.appendChild(stateDot(state,
                            state === 'done' && members.some(isUnseenDone) ? 'unseen' : ''));
                        const num = document.createElement('span');
                        num.textContent = String(n);
                        chip.appendChild(num);
                        badges.appendChild(chip);
                    }
                }
                header.appendChild(badges);

                const actions = document.createElement('span');
                actions.className = 'project-actions';
                if (!isUngrouped) {
                    const addBtn = document.createElement('button');
                    addBtn.textContent = '+';
                    addBtn.title = 'New session in ' + projectName;
                    addBtn.setAttribute('aria-label', 'New session in project ' + projectName);
                    addBtn.draggable = false;
                    addBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        createSessionInProject(projectName);
                    });
                    actions.appendChild(addBtn);
                }
                const pMenuBtn = document.createElement('button');
                pMenuBtn.replaceChildren(iconNode('ellipsis', 16));
                pMenuBtn.title = isUngrouped ? 'Ungrouped actions' : 'Project actions';
                pMenuBtn.setAttribute('aria-label',
                    isUngrouped ? 'Actions for ungrouped sessions' : 'Actions for project ' + projectName);
                pMenuBtn.draggable = false;
                pMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Touch parity for header drag-reorder (HTML5 DnD is
                    // mouse-only), mirroring the card Move-to menu. Positions
                    // are on the combined sequence, so Ungrouped and projects
                    // move past each other.
                    const seq = groupSeq();
                    const idx = isUngrouped
                        ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                        : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === projectName);
                    const items = [
                        { label: 'Move up', disabled: idx <= 0,
                          onClick: () => moveGroup(projectName, -1) },
                        { label: 'Move down', disabled: idx < 0 || idx >= seq.length - 1,
                          onClick: () => moveGroup(projectName, 1) }
                    ];
                    if (!isUngrouped) {
                        items.push(
                            { label: 'Rename project', onClick: () => renameProject(projectName) },
                            { label: 'Set directory…', onClick: () => openProjectModal({ mode: 'edit-dir', projectName }) },
                            { label: 'Delete project', danger: true, onClick: () => deleteProject(projectName) }
                        );
                    }
                    openMenu(pMenuBtn, items);
                });
                actions.appendChild(pMenuBtn);
                header.appendChild(actions);

                // Drag the header to reorder whole groups — projects AND the
                // Ungrouped section. Order persists via the same
                // captureLayoutFromDom as card drags — it rebuilds
                // layout.projects (+ ungroupedIndex) in DOM order.
                header.draggable = true;
                header.addEventListener('dragstart', (e) => {
                    dragSrcGroup = group;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', projectName);
                    group.classList.add('dragging');
                });
                header.addEventListener('dragend', () => {
                    group.classList.remove('dragging');
                    if (dragSrcGroup === group) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcGroup = null;
                    isDragging = false;
                });
                group.addEventListener('dragover', (e) => {
                    if (!dragSrcGroup || dragSrcGroup === group) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = group.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) group.after(dragSrcGroup);
                    else group.before(dragSrcGroup);
                });

                function toggleCollapse() {
                    setCollapsed(collapseId, !getCollapsed()[collapseId]);
                    paint();
                }
                header.addEventListener('click', toggleCollapse);
                header.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleCollapse();
                    }
                });

                // Header as a drop target: a card append to this project, OR
                // the docked shell dragged out (un-dock + join this project).
                header.addEventListener('dragover', (e) => {
                    if (!dragSrcCard && !dragSrcDockSession) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    header.classList.add('drag-over');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
                header.addEventListener('drop', (e) => {
                    header.classList.remove('drag-over');
                    if (dragSrcDockSession) {
                        e.preventDefault();
                        e.stopPropagation();
                        unDock(group.dataset.project || '');   // '' = Ungrouped
                        return;
                    }
                    if (!dragSrcCard) return;
                    e.preventDefault();
                    group.querySelector('.project-sessions').appendChild(dragSrcCard);
                    // If the group was collapsed the card is now hidden —
                    // dragend's captureLayoutFromDom still finds it in the DOM.
                });

                group.appendChild(header);

                const body = document.createElement('div');
                body.className = 'project-sessions';
                for (const s of members) body.appendChild(renderCard(s));
                if (!members.length && !isUngrouped) {
                    const hint = document.createElement('div');
                    hint.className = 'project-empty-hint';
                    hint.textContent = 'empty — drag a session here, or +';
                    body.appendChild(hint);
                }
                group.appendChild(body);
                return group;
            }

            // paint renders the sidebar from lastSessions + layout. Pure view —
            // no fetching — so layout mutations repaint instantly.
            function paint() {
                if (isDragging || gestureActive || openMenuEl || ctxMenuOpen || renameEditing) return;
                // Preserve the sidebar scroll across the full list rebuild:
                // switching sessions (and every poll) re-renders via
                // clearChildren, which momentarily collapses the content and
                // resets the scroller to the top — losing the user's place in
                // a long session list. Save now, restore after the re-append.
                const savedScroll = sidebarScrollEl ? sidebarScrollEl.scrollTop : 0;
                clearChildren(listEl);
                const liveByName = new Map(lastSessions.map(s => [s.name, s]));
                const referenced = new Set();
                for (const p of layout.projects) p.sessions.forEach(n => referenced.add(n));
                layout.ungrouped.forEach(n => referenced.add(n));

                // Ungrouped members: explicit order first, then any live
                // session the layout has never seen (fresh creations), in
                // tmux order. The section renders at its slot in the combined
                // sequence (ungroupedIndex) and is skipped while empty.
                const ungrouped = layout.ungrouped
                    .map(n => liveByName.get(n)).filter(Boolean)
                    .concat(lastSessions.filter(s => !referenced.has(s.name)));
                for (const g of groupSeq()) {
                    if (g === UNGROUPED_COLLAPSE_ID) {
                        if (ungrouped.length) listEl.appendChild(renderGroup('', ungrouped));
                        continue;
                    }
                    const members = g.sessions.map(n => liveByName.get(n)).filter(Boolean);
                    listEl.appendChild(renderGroup(g.name, members));
                }
                if (!ungrouped.length && !layout.projects.length) {
                    listEl.appendChild(emptyState('No sessions yet.'));
                }
                updateTitle();
                // Task 4.1: a repaint mid-Alt-hold rebuilds the cards —
                // re-overlay the jump badges (no-op unless showing).
                applyAltBadges();
                // Restore scroll after the synchronous rebuild — no paint has
                // happened between save and here, so it is invisible (no jump).
                if (sidebarScrollEl) sidebarScrollEl.scrollTop = savedScroll;
            }

            // ---- deploy self-refresh: top-owned reload policy ------------
            // Detection is the healer (lobbySelfCheck, below) plus the
            // tl-build-stale signal an embedded terminal sends when its
            // reconnect heal sees a new build. Both route to requestTopReload,
            // which owns the single reload. Policy (research doc): no attached
            // terminal, a hidden tab, or an idle terminal → reload NOW (the
            // top reload takes the iframe with it; tmux keeps the session).
            // Only active typing defers: a sticky tappable "Update ready"
            // toast that reloads on tap, on the tab hiding, or on the next
            // idle check.
            let updatePending = false;     // a deferred reload is armed (pill up)
            function requestTopReload(why) {
                // Viktor: "keep it connected and repaint only on refresh."
                // While a terminal is ATTACHED and the tab is VISIBLE, a new
                // build NEVER yanks the page out from under the user — it
                // surfaces a sticky "Update ready" pill and waits for the tap
                // (or the tab hiding, below). Auto-reload stays immediate ONLY
                // when there is no attached terminal (pure lobby) or the tab
                // is hidden — nothing on screen to interrupt. (Previously it
                // reloaded unless the user had typed in the last 10s, so a
                // reader watching a session got flashed on every deploy — the
                // flicker Viktor called out. The typing-recency signal is
                // retired with this change.)
                if (!currentActive || document.hidden) {
                    if (!tlStormOK()) return;
                    console.log('deploy detected (' + why + ') — reloading (no active terminal / hidden)');
                    location.reload();
                    return;
                }
                if (updatePending) return;   // pill already up
                updatePending = true;
                tlToast.add({
                    type: 'info',
                    title: 'Update ready — tap to refresh',
                    timeout: 0,  // sticky until tapped or the tab hides
                    // A tap is an EXPLICIT user action — never gate it on
                    // tlStormOK (that 2-min guard exists only to break AUTO
                    // reload loops). Gating the tap meant that when two deploys
                    // landed <2min apart, tapping "Update ready" silently did
                    // nothing and the pill stuck (esp. desktop, which relies on
                    // the tap since it stays visible+attached).
                    onTap: () => { location.reload(); }
                });
            }
            tlTopReload = requestTopReload;   // reloadIfStale routes top-level reloads here
            // Deferred update: fire the moment the tab hides (nothing left to
            // interrupt), and re-check on resume — iOS standalone throttles/
            // suspends background timers hard, so the resume hook is what makes
            // an update land the instant the user comes back (treat "became
            // visible" as "re-check now"; per WebKit 202399 don't trust the
            // state value beyond that).
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (updatePending && tlStormOK()) { updatePending = false; location.reload(); }
                    return;
                }
                lobbySelfCheck();    // resume — re-check for a deploy right away
            });
            // bfcache restore: the page comes back frozen, not reloaded —
            // an entire deploy may have landed while it slept.
            window.addEventListener('pageshow', (e) => {
                if (e.persisted) lobbySelfCheck();
            });

            async function renderLobby() {
                if (isDragging || gestureActive || openMenuEl || ctxMenuOpen || renameEditing) return;
                try {
                    const [sessResp, layoutResult] = await Promise.all([
                        fetch(SESSIONS_API, { credentials: 'same-origin' }),
                        fetchLayout().catch(err => err)
                    ]);
                    if (!sessResp.ok) {
                        clearChildren(listEl);
                        listEl.appendChild(emptyState('Failed to load sessions: HTTP ' + sessResp.status));
                        return;
                    }
                    const sessions = await sessResp.json();
                    if (layoutResult instanceof Error) {
                        // Grouping degrades gracefully: keep the last-known
                        // layout, sessions still render.
                        if (!layoutLoaded) console.warn('layout fetch failed:', layoutResult);
                    } else {
                        // A dock change we just made locally may not have
                        // round-tripped through the PUT yet — keep it over a
                        // stale fetch for a short grace window.
                        const inGrace = Date.now() < dockGraceUntil;
                        const localDock = inGrace ? layout.dock : undefined;
                        layout = layoutResult;
                        if (inGrace) {
                            if (localDock) layout.dock = localDock; else delete layout.dock;
                        }
                        if (!layoutLoaded) {
                            layoutLoaded = true;
                            seedLayoutFromLegacyOrder();
                        }
                    }
                    const activeListed = sessions.some(s => s.name === currentActive);
                    if (currentActive && activeListed) activeConfirmed = true;
                    // Only deactivate a session we've SEEN before and that is now
                    // gone (killed elsewhere). Never tear down one that has yet to
                    // appear — it's still being created (see activeConfirmed note).
                    if (currentActive && !activeListed && activeConfirmed) {
                        deactivateSession();
                    }
                    lastSessions = sessions;
                    reconcileDock();   // clear the dock if its session died; keep the grid in sync
                    // Attention (Task 2.1): favicon + OS notifications track
                    // the same poll that paints the cards (title via paint's
                    // updateTitle). State-change timestamps (Task 2.4) must
                    // land BEFORE paint so fresh transitions render with a
                    // non-zero stateChangedAt.
                    notifyTransitions(sessions);
                    trackStateChanges(sessions);
                    updateFavicon();
                    paint();
                } catch (err) {
                    clearChildren(listEl);
                    listEl.appendChild(emptyState('Error: ' + err.message));
                }
            }

            // One-time migration: an untouched server layout + a legacy
            // localStorage drag-order → carry the old order into Ungrouped.
            function seedLayoutFromLegacyOrder() {
                if (layout.projects.length || layout.ungrouped.length) return;
                const old = getSavedOrder().filter(n => NAME_RE.test(n));
                if (!old.length) return;
                layout.ungrouped = old;
                putLayout().catch(() => {});
            }

            // A newly-created session is spawned by the iframe's WebSocket a
            // beat after it loads, so the regular 5s poll can miss it and the
            // per-user API cache can briefly hold a pre-spawn empty list. Poll a
            // few times in the first seconds so the new card appears within ~1-2s.
            function quickRefreshAfterCreate() {
                [700, 1600, 3000, 4500].forEach((ms) => setTimeout(renderLobby, ms));
            }
            // New-session command dropdown (roamed session.newCommand):
            // reflect the pref, write it back on change, follow roam
            // updates from other devices via tl-prefs-change.
            const newCmdEl = document.getElementById('new-cmd');
            function syncNewCmd() {
                let v = 'claude';
                try { v = getPrefs().session.newCommand; } catch (e) {}
                // 'default' is a valid backing value (kept for LAUNCHER users
                // like emo/ancamilea, whose tmux default-command runs their
                // start-claude.sh) but is no longer a dropdown option — reflect
                // it as the visible 'claude' WITHOUT overwriting the pref (only
                // the change handler writes), so their launcher path via
                // frameArgs()'s pref read stays intact.
                newCmdEl.value = (v === 'claude' || v === 'codex' || v === 'shell') ? v : 'claude';
            }
            syncNewCmd();
            newCmdEl.addEventListener('change', () => {
                setPrefs({ session: { newCommand: newCmdEl.value } });
            });
            window.addEventListener('tl-prefs-change', syncNewCmd);
            newBtnEl.addEventListener('click', () => {
                const name = newNameEl.value.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (sessionExists(name)) {
                    showToast('Session "' + name + '" already exists', 'error', 4000);
                    return;  // keep the typed name so it can be adjusted
                }
                newNameEl.value = '';
                activateSession(name);
                quickRefreshAfterCreate();
            });
            newNameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') newBtnEl.click();
            });
            restoreBtnEl.addEventListener('click', () => restoreSessions(restoreBtnEl));
            newProjectBtnEl.addEventListener('click', createProject);

            window.addEventListener('hashchange', () => {
                const hash = location.hash.slice(1);
                if (hash && NAME_RE.test(hash)) {
                    if (hash !== currentActive) activateSession(hash);
                } else if (currentActive) {
                    deactivateSession();
                }
            });

            // Sidebar collapse — toggle a class on #lobby + persist in localStorage.
            // The grid-template-columns transition handles the slide; xterm in the
            // iframe re-fits on its own window resize event.
            const SIDEBAR_KEY = 'tmux-sidebar-collapsed';
            const lobbyEl    = document.getElementById('lobby');
            const toggleEl   = document.getElementById('sidebar-toggle');
            function getSidebarCollapsed() {
                try { return localStorage.getItem(SIDEBAR_KEY) === '1'; }
                catch (e) { return false; }
            }
            function setSidebarCollapsed(collapsed) {
                lobbyEl.classList.toggle('sidebar-collapsed', collapsed);
                // On a phone the collapsed toggle IS the "back to the list"
                // control (terminal view); label it plainly. The CSS hides it
                // in the browsing view. Desktop keeps the ‹/› collapse chevrons.
                if (collapsed && mobileQuery.matches) {
                    toggleEl.textContent = '‹ Sessions';
                    toggleEl.title = 'Back to your sessions';
                } else {
                    toggleEl.textContent = collapsed ? '›' : '‹';
                    toggleEl.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
                }
                toggleEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
                if (typeof updateListClose === 'function') updateListClose();
            }
            toggleEl.addEventListener('click', () => {
                setSidebarCollapsed(!lobbyEl.classList.contains('sidebar-collapsed'));
            });
            // ✕ in the list header (mobile browsing view): close the list and
            // return to the ATTACHED session without having to re-pick its
            // card. Hidden when nothing is attached (nothing to close) and on
            // desktop (the split has no "closed" state). Recomputed on every
            // view flip — setSidebarCollapsed is the single flip choke point,
            // and both attach paths and deactivateSession flip through it.
            const listCloseEl = document.getElementById('list-close');
            function updateListClose() {
                const show = mobileQuery.matches && !!currentActive &&
                    !lobbyEl.classList.contains('sidebar-collapsed');
                listCloseEl.classList.toggle('hidden', !show);
                if (show) listCloseEl.title = 'Close the list — back to ' + currentActive;
            }
            listCloseEl.addEventListener('click', () => setSidebarCollapsed(true));
            // On a phone the view is derived from the attached session, not the
            // persisted collapse pref: boot into the list and let a #hash or the
            // MF-5 reland flip to the terminal via activateSession. Desktop keeps
            // honoring the saved collapse pref.
            setSidebarCollapsed(mobileQuery.matches ? false : getSidebarCollapsed());
            // Rotating across the breakpoint (portrait phone ⇄ landscape, which
            // exceeds 720px and uses the desktop grid) re-derives the toggle's
            // label/shape without changing the collapse state.
            mobileQuery.addEventListener('change', () => {
                setSidebarCollapsed(lobbyEl.classList.contains('sidebar-collapsed'));
            });

            // Theme selection — the grid lives in the ⚙ settings panel
            // (#sp-theme, MF-1; formerly a standalone sidebar picker).
            // Picking a swatch swaps body class, persists, and live-rethemes
            // the inner terminal via postMessage (tl-theme, same channel as
            // tl-drop-files). The iframe ACKs back; no ACK within 1s means
            // it runs a stale pre-live-switch build, so fall back to the old
            // iframe reload (a reload re-reads the theme from localStorage
            // at boot anyway).
            let themeAckTimer = null;
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-theme-ack') return;
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            // A frame that was still LOADING when tl-theme was posted never
            // saw the message — but its boot paints from localStorage, which
            // already holds the new theme. Cancel the pending fallback so a
            // fresh frame isn't pointlessly reloaded a second time.
            frameEl.addEventListener('load', () => {
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            function selectTheme(t) {
                if (!THEMES.includes(t)) return;
                try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
                applyTheme(t);
                paintSettingsPanel();
                if (currentActive && frameUrl && frameEl.contentWindow) {
                    clearTimeout(themeAckTimer);
                    themeAckTimer = setTimeout(() => {
                        themeAckTimer = null;
                        // No ACK: reload iframe so xterm picks up the new
                        // theme (re-read the tracked frameUrl — the
                        // session may have changed during the wait).
                        const url = frameUrl;
                        if (!url || url === 'about:blank') return;
                        setFrameUrl('about:blank');
                        setTimeout(() => { setFrameUrl(url); }, 0);
                    }, 1000);
                    frameEl.contentWindow.postMessage({ type: 'tl-theme', name: t }, location.origin);
                }
            }

            // Font-size stepping — since Task 2.6 routed through the prefs
            // layer: setPrefs persists BOTH keys (tl:prefs:v1 + the legacy
            // tl-font-size), fires tl-prefs-change (→ repaint + live-apply
            // forward below) and PUTs the roamed doc. A stale iframe build
            // without any handler still picks the size up at its next boot
            // (the constructor reads the same keys). Since MF-1 the panel's
            // A−/A+ row is the only lobby stepper (the duplicate sidebar
            // row was folded into it).
            function stepFontSize(delta) {
                const before = getPrefs().fontSize;
                const next = setPrefs({ fontSize: clampFontSize(before + delta) });
                // Task M.7: tick only when the step actually committed.
                if (next.fontSize !== before) haptic('selection');
            }
            // The terminal's floating A−/A+ and its prefs writes land in the
            // same keys; storage events fire only in windows that did NOT
            // write — i.e. exactly here — so the open panel tracks
            // in-terminal changes. No forward back into the
            // iframe: the change originated there and is already applied.
            window.addEventListener('storage', (e) => {
                if (e.key === FONT_SIZE_KEY || e.key === PREFS_KEY ||
                    e.key === FLOW_KILL_KEY || e.key === tlKb.KEY ||
                    e.key === PINCH_FONT_KEY) {
                    paintSettingsPanel();
                }
            });

            // Any prefs change made in THIS window (panel controls,
            // server-doc adoption at boot) live-applies to the attached
            // terminal over the same postMessage channel as tl-theme /
            // tl-drop-files. The extra tl-font-size message keeps pre-2.6
            // iframe builds in step (they only know that type); a current
            // build applies both idempotently.
            window.addEventListener('tl-prefs-change', () => {
                paintSettingsPanel();
                renderLobby();   // re-render cards so pref changes apply live
                if (currentActive && frameUrl && frameEl.contentWindow) {
                    const p = getPrefs();
                    frameEl.contentWindow.postMessage({ type: 'tl-prefs', prefs: p }, location.origin);
                    frameEl.contentWindow.postMessage({ type: 'tl-font-size', size: p.fontSize }, location.origin);
                }
            });

            // --- settings popover (Task 2.6) ------------------------------
            // Roaming terminal prefs: fontSize (the A−/A+ steppers — the
            // sidebar row was folded in here, MF-1), lineHeight,
            // letterSpacing, cursorStyle, cursorBlink, fontWeightBold.
            // Deliberately EXCLUDED (red line): smooth-scroll, renderer
            // toggles, and any mouse/wheel/scroll option. Plus two
            // NON-roaming controls: the Task 3.5 flow-control kill-switch
            // (plain tl-flow-control localStorage key) and the theme grid
            // (#sp-theme, MF-1 — moved from the sidebar picker): per-device
            // localStorage 'tmux-theme', NEVER roamed (a 9-way grid doesn't
            // fit segCtl, and theme is per-device by design).
            const settingsBtn = document.getElementById('settings-btn');
            let settingsPanel = null;
            let settingsSheet = null;   // Task M.5: non-null while presented as a bottom sheet
            function paintSettingsPanel() {
                if (!settingsPanel) return;
                const p = getPrefs();
                settingsPanel.querySelector('#sp-font-val').textContent = p.fontSize;
                const lh = settingsPanel.querySelector('#sp-lh');
                lh.value = String(p.lineHeight);
                settingsPanel.querySelector('#sp-lh-val').textContent = p.lineHeight.toFixed(2);
                const ls = settingsPanel.querySelector('#sp-ls');
                ls.value = String(p.letterSpacing);
                settingsPanel.querySelector('#sp-ls-val').textContent = p.letterSpacing.toFixed(1) + 'px';
                settingsPanel.querySelector('#sp-blink').checked = p.cursorBlink;
                settingsPanel.querySelector('#sp-flow').checked = flowControlWanted();
                settingsPanel.querySelector('#sp-kb').checked = tlKb.enabled();
                const lcp = settingsPanel.querySelector('#sp-linkchip');
                if (lcp) lcp.checked = p.links.copyChip;       // hover-pointer row only ([links])
                const rep = settingsPanel.querySelector('#sp-repeat');
                if (rep) rep.checked = p.gestures.keyRepeat;   // coarse-pointer row only
                const lp = settingsPanel.querySelector('#sp-longpress');
                if (lp) lp.checked = p.gestures.cardLongPress; // coarse-pointer row only (M.4)
                const os = settingsPanel.querySelector('#sp-overlayswipe');
                if (os) os.checked = p.gestures.overlaySwipe;  // coarse-pointer row only (M.4)
                const bs = settingsPanel.querySelector('#sp-sheet');
                if (bs) bs.checked = p.gestures.bottomSheet;   // coarse-pointer row only (M.5)
                const sw = settingsPanel.querySelector('#sp-swipe');
                if (sw) sw.checked = p.gestures.swipeSessionOptIn; // Android coarse row only (M.6)
                const tf = settingsPanel.querySelector('#sp-twofinger');
                if (tf) tf.checked = p.gestures.twoFingerTap;  // coarse-pointer row only (M.6)
                const skr = settingsPanel.querySelector('#sp-showrow');
                if (skr) skr.checked = !toolbarHiddenHere();   // coarse-pointer row only (toolbar-fix, device-local)
                const hp = settingsPanel.querySelector('#sp-haptics');
                if (hp) hp.checked = p.gestures.haptics;       // coarse row, vibrate-capable only (M.7)
                const pf = settingsPanel.querySelector('#sp-pinch');
                if (pf) pf.checked = pinchFontWanted();        // coarse row, Chromium or WebKit (M.8; default ON)
                const smo = settingsPanel.querySelector('#sp-scrollmomentum');
                if (smo) smo.checked = p.gestures.scrollMomentum; // coarse-pointer row only (touch scroll)
                const smw = settingsPanel.querySelector('#sp-wheelsmooth');
                if (smw) smw.checked = p.gestures.wheelSmooth; // hover-pointer row only (desktop wheel)
                // input.bar and gestures.scrollSpeedV2/wheelSpeed are .sp-seg controls — the
                // generic .sp-seg reflect below paints their active values.
                const sr = settingsPanel.querySelector('#sp-reopen');
                if (sr) sr.checked = p.session.reopenLast;
                // Notifications section — universal (always present). Toggles
                // reflect the roamed notify.* prefs; the state readout is
                // per-THIS-device (permission + bell synchronously here, the
                // server-compared subscription filled by refreshNotifyDeviceState).
                const nd = settingsPanel.querySelector('#sp-notify-done');
                if (nd) nd.checked = p.notify.onDone;
                const na = settingsPanel.querySelector('#sp-notify-awaiting');
                if (na) na.checked = p.notify.onAwaiting;
                const nperm = settingsPanel.querySelector('#sp-notify-perm');
                if (nperm) {
                    nperm.textContent = (typeof Notification === 'undefined') ? 'unsupported'
                        : Notification.permission === 'granted' ? 'granted'
                        : Notification.permission === 'denied' ? 'denied' : 'not set';
                }
                const nbell = settingsPanel.querySelector('#sp-notify-bell');
                if (nbell) {
                    const bellOn = notifyOptedIn() && typeof Notification !== 'undefined' &&
                        Notification.permission === 'granted';
                    nbell.textContent = bellOn ? 'on' : 'off';
                }
                settingsPanel.querySelectorAll('.sp-seg').forEach(seg => {
                    // Dotted keys ('input.tapFocus', Task M.10/IR.2)
                    // resolve one level into the nested namespaces; flat
                    // keys read exactly as before.
                    const val = String(seg.dataset.pref.split('.')
                        .reduce((o, k) => (o || {})[k], p));
                    seg.querySelectorAll('button').forEach(b => {
                        b.classList.toggle('active', b.dataset.val === val);
                    });
                });
                // Theme grid (MF-1): same active semantics as the old
                // sidebar picker — getTheme() defaults to 'slate'.
                const activeTheme = getTheme();
                settingsPanel.querySelectorAll('#sp-theme button[data-theme]').forEach(b => {
                    b.classList.toggle('active', b.dataset.theme === activeTheme);
                });
            }
            // Fills the "Subscribed here" readout — async because it compares
            // this browser's live push endpoint against the server's stored
            // list. Fired once when the panel opens (not on every repaint, so
            // toggling a pref doesn't re-hit GET /push-subscriptions); re-guards
            // settingsPanel since the panel may close while we await.
            async function refreshNotifyDeviceState() {
                const state = await deviceSubscriptionState();
                if (!settingsPanel) return;
                const el = settingsPanel.querySelector('#sp-notify-sub');
                if (el) el.textContent = state; // 'yes' | 'no' | 'unsupported'
            }
            function onSettingsOutside(e) {
                if (!settingsPanel) return;
                if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target)) return;
                closeSettings(false);   // the click picks its own focus target
            }
            function onSettingsKey(e) {
                if (e.key !== 'Escape') return;
                e.stopPropagation();
                closeSettings(true);    // Escape = dismissal → terminal refocus
            }
            function closeSettings(refocus) {
                if (!settingsPanel) return;
                const el = settingsPanel;
                const sheet = settingsSheet;
                settingsPanel = null;
                settingsSheet = null;
                settingsBtn.setAttribute('aria-expanded', 'false');
                document.removeEventListener('pointerdown', onSettingsOutside, true);
                document.removeEventListener('keydown', onSettingsKey, true);
                if (sheet) {
                    // Task M.5: slide out, then remove the whole sheet root.
                    // Dismissals keep the Task 2.3 focus-return contract.
                    sheet.close(() => {
                        if (refocus) closeOverlay(sheet.root);
                        else sheet.root.remove();
                    });
                } else if (refocus) closeOverlay(el);   // remove + focus return (Task 2.3)
                else el.remove();
            }
            // Advanced → Clear local data: wipe THIS browser's saved
            // terminal-lobby state and boot fresh. Enumerate-and-remove
            // every app key — a prefix sweep over tl:*, tl-* and the tmux-*
            // family is the only COMPLETE enumeration, because the session
            // order/collapse keys are suffixed with the OS user
            // (tmux-session-order-<user>, tmux-collapsed-<user>) and can't
            // be listed by a fixed name. sessionStorage too. Then
            // location.replace(pathname) for a clean boot with no #session
            // hash (the index is served no-store/no-cache, so no
            // cache-buster is needed). alsoRoamed first resets the
            // server-side /prefs doc so the reset reaches the user's OTHER
            // devices — /prefs is GET/PUT only (no DELETE verb), so PUT the
            // normalized defaults. tmux sessions are untouched throughout.
            async function clearLocalData(alsoRoamed) {
                if (!confirm('Clear this browser’s terminal-lobby data ' +
                    '(theme, font size, sidebar layout, gestures, ' +
                    'notification opt-in)' +
                    (alsoRoamed ? ' AND reset the settings that roam to your '
                        + 'other devices' : '') +
                    ', then reload?\n\nYour tmux sessions are not affected.')) {
                    return;
                }
                if (alsoRoamed) {
                    try {
                        const resp = await fetch(PREFS_API, {
                            method: 'PUT',
                            credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(normalizePrefs({}))
                        });
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        showToast('Roamed settings reset on the server', 'success', 2000);
                    } catch (e) {
                        showToast('Could not reset roamed settings (' + e.message +
                            ') — clearing this browser only', 'error', 4000);
                    }
                }
                try {
                    const doomed = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && (k.indexOf('tl:') === 0 || k.indexOf('tl-') === 0 ||
                                  k.indexOf('tmux-') === 0)) doomed.push(k);
                    }
                    doomed.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
                } catch (e) {}
                try { sessionStorage.clear(); } catch (e) {}
                showToast('Local data cleared — reloading', 'success', 1500);
                setTimeout(() => location.replace(location.pathname), 300);
            }
            function openSettings() {
                const asSheet = sheetPresentationWanted();   // Task M.5
                const panel = document.createElement('div');
                panel.className = 'settings-panel';
                panel.id = 'settings-panel';
                if (!asSheet) {
                    // Sheet mode hoists the title into the sheet header
                    // (a drag surface); popover mode keeps it in-panel.
                    const title = document.createElement('div');
                    title.className = 'sp-title';
                    title.textContent = 'Settings';
                    panel.appendChild(title);
                }

                // Theme grid (MF-1, complaint 4: "move the theme in the
                // settings menu") — 9 presets applied live via selectTheme.
                // Per-device localStorage 'tmux-theme'; deliberately NOT a
                // roamed setPrefs/segCtl row.
                const themeTitle = document.createElement('div');
                themeTitle.className = 'sp-title';
                themeTitle.textContent = 'Theme';
                panel.appendChild(themeTitle);
                const themeGrid = document.createElement('div');
                themeGrid.className = 'theme-options';
                themeGrid.id = 'sp-theme';
                [['carbon', 'Carbon'], ['slate', 'Slate'], ['mono', 'Mono'],
                 ['ink', 'Ink'], ['t3-dark', 'T3 Dark'], ['t3-light', 'T3 Light'],
                 ['catppuccin-mocha', 'Mocha'], ['catppuccin-latte', 'Latte'],
                 ['system', 'System']].forEach(([id, label]) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.dataset.theme = id;
                    b.textContent = label;
                    if (id === 'system') {
                        b.title = 'Follow the OS light/dark setting (T3 Light / T3 Dark)';
                    }
                    b.addEventListener('click', () => selectTheme(id));
                    themeGrid.appendChild(b);
                });
                panel.appendChild(themeGrid);

                function row(labelText) {
                    const d = document.createElement('div');
                    d.className = 'sp-row';
                    const l = document.createElement('label');
                    l.textContent = labelText;
                    d.appendChild(l);
                    panel.appendChild(d);
                    return d;
                }
                function rangeCtl(row_, id, key, min, max, step) {
                    const input = document.createElement('input');
                    input.type = 'range';
                    input.id = id;
                    input.min = String(min); input.max = String(max); input.step = String(step);
                    input.addEventListener('input', () => setPrefs({ [key]: Number(input.value) }));
                    const val = document.createElement('span');
                    val.className = 'sp-val';
                    val.id = id + '-val';
                    row_.appendChild(input);
                    row_.appendChild(val);
                }
                // onPick (optional): a side effect run with the chosen
                // value BEFORE the pref write — e.g. the Input-mode seg
                // clears the device-local ⌨ suppression when the user
                // picks a field-engaging mode, so explicit settings intent
                // beats the quick toggle. Existing callers pass 4 args;
                // onPick is undefined and the guard skips it (byte-safe).
                function segCtl(row_, key, values, labels, onPick) {
                    const seg = document.createElement('div');
                    seg.className = 'sp-seg';
                    seg.dataset.pref = key;
                    values.forEach((v, i) => {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.dataset.val = v;
                        b.textContent = labels[i];
                        // Dotted keys ('input.tapFocus', Task M.10/IR.2)
                        // write through the nested namespace — setPrefs
                        // deep-merges one level, so sibling flags survive.
                        // Flat keys patch exactly as before.
                        b.addEventListener('click', () => {
                            if (onPick) onPick(v);
                            const dot = key.indexOf('.');
                            setPrefs(dot === -1 ? { [key]: v }
                                : { [key.slice(0, dot)]: { [key.slice(dot + 1)]: v } });
                        });
                        seg.appendChild(b);
                    });
                    row_.appendChild(seg);
                }

                // Font size — the same store the A−/A+ steppers use.
                const fs = row('Font size');
                const step = document.createElement('div');
                step.className = 'sp-step';
                const dec = document.createElement('button');
                dec.type = 'button'; dec.textContent = 'A−';
                dec.title = 'Smaller terminal font (min ' + FONT_SIZE_MIN + ')';
                dec.addEventListener('click', () => stepFontSize(-1));
                const fval = document.createElement('span');
                fval.className = 'sp-val'; fval.id = 'sp-font-val';
                const inc = document.createElement('button');
                inc.type = 'button'; inc.textContent = 'A+';
                inc.title = 'Larger terminal font (max ' + FONT_SIZE_MAX + ')';
                inc.addEventListener('click', () => stepFontSize(1));
                step.appendChild(dec); step.appendChild(fval); step.appendChild(inc);
                fs.appendChild(step);

                rangeCtl(row('Line height'), 'sp-lh', 'lineHeight', 1, 1.4, 0.05);
                rangeCtl(row('Letter spacing'), 'sp-ls', 'letterSpacing', 0, 1, 0.5);
                segCtl(row('Cursor'), 'cursorStyle',
                       ['block', 'bar', 'underline'], ['Block', 'Bar', 'Under']);
                const blinkRow = row('Cursor blink');
                const blink = document.createElement('input');
                blink.type = 'checkbox';
                blink.id = 'sp-blink';
                blink.addEventListener('change', () => setPrefs({ cursorBlink: blink.checked }));
                blinkRow.appendChild(blink);
                segCtl(row('Bold weight'), 'fontWeightBold', ['600', '700'], ['600', '700']);

                // Task 3.5: WS flow-control kill-switch — writes the plain
                // tl-flow-control key, NOT setPrefs (per-browser, never
                // roamed). The attached terminal picks a flip up live via
                // the storage event, or at its next connect.
                const flowRow = row('Flow control');
                const flow = document.createElement('input');
                flow.type = 'checkbox';
                flow.id = 'sp-flow';
                flow.title = 'Backpressure the server when output floods a slow tab (recommended). Untick to bypass flow control in this browser.';
                flow.addEventListener('change', () => {
                    try {
                        if (flow.checked) localStorage.removeItem(FLOW_KILL_KEY);
                        else localStorage.setItem(FLOW_KILL_KEY, 'off');
                    } catch (e) {}
                });
                flowRow.appendChild(flow);

                // Task 4.1: "App shortcuts" opt-in — the keybinding layer +
                // command palette. Plain per-browser tl:keybindings:v1 key
                // (never roamed): chords steal keys from the pty, so each
                // browser opts in explicitly; DEFAULT OFF. The attached
                // terminal follows live via the storage event.
                const kbRow = row('App shortcuts');
                const kb = document.createElement('input');
                kb.type = 'checkbox';
                kb.id = 'sp-kb';
                kb.title = 'Enable app keyboard shortcuts in this browser: ' +

                // Notifications (universal — desktop AND mobile, unlike the

                // here AND the background push the server sends, both reading

                // Per-THIS-device truthful state. Permission + bell are read

                const permRow = row('Permission');

                permVal.id = 'sp-notify-perm';

                subRow.title = 'Whether THIS device + browser is registered for background push on the server.';

                // "Test this device" fires a LOCAL notification (no server,
                // no other devices): it exercises exactly the browser→OS
                // display chain on THIS machine, so a silent result with
                // permission granted means the OS/browser is suppressing
                // notifications for this site (macOS Focus/DND, Chrome
                // banners off) — the one failure the server-side 201s can
                // never reveal. Viktor: the fan-out test buzzing his phone
                // while debugging the desktop was confusing scoping.
                const testHereRow = row('Test this device');
                testHereRow.title = 'Show a notification on THIS device only — no server, ' +
                    'no other devices. If nothing appears while permission is granted, ' +
                    'your OS or browser is blocking notifications for this site.';
                const testHereBtn = document.createElement('button');

                testHereBtn.className = 'sp-btn';
                testHereBtn.id = 'sp-notify-test-here';
                testHereBtn.textContent = 'Show';
                testHereBtn.addEventListener('click', async () => {
                    if (typeof Notification === 'undefined') {
                        showToast('This browser has no Notification API', 'error', 4000);
                        return;
                    }
                    let perm = Notification.permission;
                    if (perm === 'default') perm = await Notification.requestPermission();
                    if (perm !== 'granted') {
                        showToast('Notification permission is "' + perm + '" — allow notifications for this site in the browser', 'error', 6000);
                        return;
                    }
                    const title = 'Test — this device';
                    const opts = { body: 'If you can read this outside the tab, the OS chain works.', tag: 'tl-test-here' };
                    let shown = false;
                    try {
                        const reg = await navigator.serviceWorker.getRegistration();
                        if (reg && reg.showNotification) { await reg.showNotification(title, opts); shown = true; }
                    } catch (e) {}
                    if (!shown) {
                        try { new Notification(title, opts); shown = true; } catch (e) {}
                    }
                    showToast(shown
                        ? 'Shown. Nothing on screen? Your OS/browser is hiding notifications for this site (Focus/DND, banners off).'
                        : 'The browser refused to show it — check site notification settings.',
                        shown ? 'info' : 'error', 7000);
                });
                testHereRow.appendChild(testHereBtn);

                const testRow = row('Test all devices');
                testRow.title = 'Send a real push through the server to EVERY device ' +

                const testBtn = document.createElement('button');
                testBtn.type = 'button';
                testBtn.className = 'sp-btn';
                testBtn.id = 'sp-notify-test';
                testBtn.textContent = 'Send';
                testBtn.addEventListener('click', async () => {
                    testBtn.disabled = true;

                            showToast('Test push failed (server ' + resp.status + ')', 'error', 4000);

                        }

                            showToast('Push accepted for ' + sent + ' registered device' + (sent === 1 ? '' : 's') +

                // Task M.1: hold-to-repeat on the soft-key arrows/Tab —

                    const ssRow = row('Scroll speed');
                    ssRow.title = 'How fast a one-finger drag scrolls the terminal. ' +

                        'finger, one line per finger row-height, in apps like Claude ' +
                        'Code. 2×/3× scroll faster. Precise slow drags stay ' +
                        'line-accurate at any setting.';
                    segCtl(ssRow, 'gestures.scrollSpeedV2',
                           [1, 1.5, 2, 3], ['1×', '1.5×', '2×', '3×']);

                    const smo = document.createElement('input');
                    smo.type = 'checkbox';
                    smo.id = 'sp-scrollmomentum';
                    smo.title = 'After a quick flick, the terminal keeps scrolling ' +
                        'and coasts to a stop (like a phone list). Any new touch, ' +
                        'a key, or scrolling with a mouse stops it at once. Turn ' +
                        'off for strictly one-to-one, no-coast scrolling.';
                    smo.addEventListener('change',
                        () => setPrefs({ gestures: { scrollMomentum: smo.checked } }));
                    smoRow.appendChild(smo);

                    const repRow = row('Key repeat');
                    const rep = document.createElement('input');
                    rep.type = 'checkbox';
                    rep.id = 'sp-repeat';
                    rep.title = 'Hold a soft-key arrow or Tab to auto-repeat it ' +
                        '(500 ms delay, then ~16 keys/s).';
                    rep.addEventListener('change',
                        () => setPrefs({ gestures: { keyRepeat: rep.checked } }));
                    repRow.appendChild(rep);

                    // Task M.4: long-press menus (session cards + gallery
                    // thumbs). Governs only the Wave-5 timer path — desktop
                    // right-click and Android's native contextmenu hold
                    // keep the Task 2.5 menu regardless.
                    const lpRow = row('Card long-press');
                    const lp = document.createElement('input');
                    lp.type = 'checkbox';
                    lp.id = 'sp-longpress';
                    lp.title = 'Press and hold a session card or gallery ' +
                        'thumbnail (500 ms) to open its actions menu.';
                    lp.addEventListener('change',
                        () => setPrefs({ gestures: { cardLongPress: lp.checked } }));
                    lpRow.appendChild(lp);

                    // Task M.4: lightbox swipe-down dismiss + horizontal
                    // gallery navigation (overlay-only recognizer).
                    const osRow = row('Overlay swipes');
                    const os = document.createElement('input');
                    os.type = 'checkbox';
                    os.id = 'sp-overlayswipe';
                    os.title = 'Swipe down on an enlarged image to dismiss ' +
                        'it; swipe sideways to flip through the gallery.';
                    os.addEventListener('change',
                        () => setPrefs({ gestures: { overlaySwipe: os.checked } }));
                    osRow.appendChild(os);

                    // Task M.5: bottom-sheet presentation for this panel +
                    // the card/thumb context menu. Off = the desktop-style
                    // anchored popover / at-pointer menu. Applies at the

                    const bsRow = row('Bottom sheets');
                    const bs = document.createElement('input');
                    bs.type = 'checkbox';
                    bs.id = 'sp-sheet';
                    bs.title = 'Present settings and long-press menus as a ' +

                        sw.title = 'Swipe horizontally with three fingers ' +
                            'over the terminal to switch sessions. ' +

                    skr.id = 'sp-showrow';

                            if (skr.checked) localStorage.removeItem(TOOLBAR_HIDDEN_KEY);

                    // vibration API exists (Android/Chromium; iOS ships

                    srRow.appendChild(sr);

                    // Task M.8: pinch-to-font-size — DEFAULT ON, plain
                    // per-browser tl:gesture-pinch-font:v1 key (never
                    // roamed; per-DEVICE, like the App-shortcuts opt-in
                    // above): it claims the native pinch-zoom stream over the

                    // remove-to-default would read as ON. Rendered wherever a

                    // showing a toggle that governs nothing (fine-pointer

                    if (isChromiumFamily || hasGestureEvent) {
                        const pfRow = row('Pinch font size');
                        const pf = document.createElement('input');
                        pf.type = 'checkbox';
                        pf.id = 'sp-pinch';
                        pf.title = 'Pinch with two fingers over the ' +
                            'terminal to step the font size. On by default. ' +
                            'Pinching while the page is already zoomed keeps ' +
                            'native browser zoom (your way back out); the ' +
                            'gestures kill-switch turns it off with every ' +
                            'other touch gesture.';
                        pf.addEventListener('change', () => {
                            try {
                                localStorage.setItem(PINCH_FONT_KEY, pf.checked ? 'on' : 'off');
                            } catch (e) {}
                        });
                        pfRow.appendChild(pf);
                    }

                    // Ghost composer: roamed input.bar tri-state, now a
                    // 3-WAY control (was a binary checkbox). The three
                    // stored values map to what the user sees on a phone:
                    //   'auto' = INVISIBLE (recommended) — the terminal is
                    //            the only visible surface; a painted-away
                    //            composer still carries autocorrect,
                    //            QuickType and swipe typing (ghost mode);
                    //   'on'   = VISIBLE BAR — a separate text field above
                    //            the keyboard (the pre-ghost experience);
                    //   'off'  = raw terminal keyboard (no field).
                    // 'auto' stays the never-touched default so existing
                    // roamed docs adopt ghost with no re-key (the value
                    // meaning was redefined, not the key). The generic
                    // .sp-seg reflect paints the active value; onPick clears
                    // the device-local ⌨ suppression (tl:input.barHidden:v1)
                    // whenever the user picks a field-engaging mode
                    // ('auto'/'on'), so explicit settings intent beats the

                    const ibRow = row('Input mode');
                    ibRow.title = 'How you type on this device. Invisible ' +
                        '(recommended): the terminal is the only thing you ' +
                        'see, but an invisible composer still gives you ' +
                        'autocorrect, QuickType and swipe typing. Visible ' +
                        'bar: a separate text field above the keyboard. Off: ' +

                        'device without leaving this screen.';
                    segCtl(ibRow, 'input.bar',
                           ['auto', 'on', 'off'],
                           ['Invisible', 'Visible bar', 'Off'],
                           (v) => {
                               if (v !== 'off') {
                                   try { localStorage.removeItem(INPUT_BAR_HIDDEN_KEY); } catch (e) {}
                               }
                           });

                    // IR.2) — the segCtl writes the dotted nested key
                    // (deep-merge keeps the bar sibling intact).
                    // 'terminal' restores the shipped M.10 tap
                    // byte-for-byte.
                    const tapRow = row('Terminal tap');
                    tapRow.title = 'Where a tap on the terminal puts the ' +
                        'cursor while the input bar is open: the input ' +
                        'field (native keyboard) or the raw terminal ' +
                        'keyboard.';
                    segCtl(tapRow, 'input.tapFocus',
                           ['field', 'terminal'], ['Field', 'Keyboard']);
                }

                // Reload app (Item 2): a plain location.reload(), mirrored
                // by the header ⟳ button. Same value in the installed PWA,

                const reloadRow = row('Reload app');
                reloadRow.title = 'Reload the terminal-lobby app in this browser.';
                const reloadBtn = document.createElement('button');

                reloadBtn.className = 'sp-btn';
                reloadBtn.textContent = 'Reload';

                reloadRow.appendChild(reloadBtn);

                const advTitle = document.createElement('div');

                advTitle.textContent = 'Advanced';

                    // through closeSettings(true) → closeOverlay so the

            // ---- keybinding layer + palette (Task 4.1), lobby side -------
            // The lobby owns the sidebar, so it executes every session
            // command — both from its own capture-phase keydown (focus in
            // the lobby chrome) and forwarded up from the terminal iframe
            // over tl-command (focus in xterm, the common case). Alt+N /
