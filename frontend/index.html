                // WebKit front-end (iOS/iPadOS). gz holds the active CLAIMED
                // gesture; gestureTouches tracks the live finger count —
                // GestureEvent exposes scale but not touch count, and the
                // 3rd-finger guard needs it — via the sanctioned passive
                // touch listeners (a noop-move recognizer, so it never
                // consumes touchmove and never affects native zoom).
                let gz = null;            // {baseFont, lastTarget, frozen}
                let gestureTouches = 0;
                multiTouch.add({
                    start(e) { gestureTouches = e.touches.length; },
                    end(e)   { gestureTouches = e.touches.length; },
                    reset()  { gestureTouches = 0; }
                });
                document.addEventListener('gesturestart', (e) => {
                    // Per-gesture gates (master kill + flag read live), then
                    // the shared guards. preventDefault HERE is the claim —
                    // it suppresses native pinch-zoom for the whole gesture.
                    if (!gesturesEnabled() || !pinchFontWanted()) return;
                    if (pageScale() > 1.001) return;              // zoomed page: native only
                    if (!terminalEl.contains(e.target)) return;   // terminal surface only
                    if (e.cancelable !== false) e.preventDefault();
                    gz = { baseFont: getPrefs().fontSize, lastTarget: null, frozen: false };
                }, { passive: false });
                document.addEventListener('gesturechange', (e) => {
                    if (!gz) return;
                    if (e.cancelable !== false) e.preventDefault();   // hold the claim
                    if (gestureTouches > 2) gz.frozen = true;         // 3rd finger: freeze, never resume mid-gesture
                    if (gz.frozen) return;
                    const ratio = e.scale > 0 ? e.scale : 1;          // WebKit: cumulative span ratio

                    // classify): no pill/step for sub-5% incidental scale.
                    if (gz.lastTarget === null && Math.abs(ratio - 1) < PINCH_CLASSIFY_RATIO) return;
                    const target = clampFontSize(
                        gz.baseFont + Math.trunc((ratio - 1) / PINCH_STEP_RATIO));
                    if (target !== gz.lastTarget) {
                        gz.lastTarget = target;
                        if (target !== getPrefs().fontSize) applyFontSize(target);
                        showFontPill(target);
                    }
                }, { passive: false });
                document.addEventListener('gestureend', (e) => {
                    if (!gz) return;
                    if (e.cancelable !== false) e.preventDefault();
                    gz = null;
                    hideFontPillSoon();
                }, { passive: false });
            }
        }

        function sendInput(data) {
            // A pty-bound byte hard-cancels a flick coast, WHATEVER path
            // produced it (raw keyboard, mirror field, soft key, paste):
            // this is the single choke point, so the cancel contract can't
            // be missed by a new input path. The scattered per-path cancels
            // remain as belt-and-braces.
            cancelScrollMomentum();
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const payload = textEncoder.encode(data);
            const buf = new Uint8Array(payload.length + 1);
            buf[0] = MSG_INPUT.charCodeAt(0);
            buf.set(payload, 1);
            ws.send(buf.buffer);
        }

        function sendResize() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            // Carry the terminal's pixel size alongside cols/rows: tmux
            // only re-emits sixel to clients whose pty reports a pixel
            // size (it reads it exclusively via TIOCGWINSZ; zero pixels →
            // "SIXEL IMAGE (WxH)" text placeholder instead). Our patched
            // ttyd (devvm/ttyd-pixel-size.patch) forwards these optional
            // fields to the pty; stock ttyd ignores unknown JSON fields,
            // so this stays backward compatible.
            const scr = document.querySelector('.xterm-screen');
            const rect = scr ? scr.getBoundingClientRect() : null;
            const json = JSON.stringify({
                columns: term.cols, rows: term.rows,
                xpixel: rect ? Math.round(rect.width) : 0,
                ypixel: rect ? Math.round(rect.height) : 0
            });
            const payload = textEncoder.encode(json);
            const buf = new Uint8Array(payload.length + 1);
            buf[0] = MSG_RESIZE.charCodeAt(0);
            buf.set(payload, 1);
            ws.send(buf.buffer);
        }

        // term.onData wrapper: when a soft-toolbar modifier is armed/latched,
        // remap the first char (Ctrl-letter or Alt-prefix) before sending.
        // On desktop softMods stays null and this falls through to sendInput.
        term.onData((data) => {
            cancelScrollMomentum();   // any keyboard/mirror byte hard-cancels a flick coast
            if (!mirrorEmitting) mirrorLineReset();   // Task IR.1: out-of-band bytes invalidate the compose-mirror baseline (the ONE declared guard delta)
            if (softMods && data) {
                const ctrlActive = softMods.ctrl !== 'idle';
                const altActive  = softMods.alt  !== 'idle';
                if (ctrlActive || altActive) {
                    const first = data.charAt(0);
                    const rest  = data.slice(1);
                    let mapped  = first;
                    if (ctrlActive && /^[a-zA-Z]$/.test(first)) {
                        mapped = String.fromCharCode(first.toLowerCase().charCodeAt(0) & 0x1f);
                    }
                    if (altActive) mapped = '\x1b' + mapped;
                    sendInput(mapped + rest);
                    consumeSoftMods();
                    return;
                }
            }
            sendInput(data);
        });
        term.onBinary((data) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const bytes = new Uint8Array(data.length + 1);
            bytes[0] = MSG_INPUT.charCodeAt(0);
            for (let i = 0; i < data.length; i++) bytes[i + 1] = data.charCodeAt(i);
            ws.send(bytes.buffer);
        });

        term.onResize(() => sendResize());

        // Refit on every viewport change. visualViewport tracks the visible
        // area below the soft keyboard on iOS Safari (and is the most
        // reliable signal on Chrome Android too). rAF-debounce coalesces
        // multiple events fired in the same frame (rotate + keyboard).
        // Resize is split into a fast visual pass and a debounced fit:
        //   syncViewport() — rAF-fast. Updates --kb-offset AND the terminal's
        //     pixel height from visualViewport. iOS Safari does NOT shrink the
        //     layout viewport when the soft keyboard rises (only visualViewport
        //     reflects it), so a CSS height:100% terminal renders its bottom
        //     rows — the prompt — behind the keyboard. Driving height off
        //     visualViewport keeps the prompt visible.
        //   refit() — debounced fitAddon.fit(). fit() emits a tmux resize on
        //     every call; the keyboard animates over ~250ms firing a burst of
        //     resize/scroll events, so we coalesce them into a single resize
        //     instead of thrashing tmux (the "glitchy resize" on mobile).
        function syncViewport() {
            if (!window.visualViewport) return;
            const vv = window.visualViewport;

            // the prompt slides behind the iOS keyboard. Byte-equivalent
            // while the toolbar is visible (coarse pointers always carried

            // offsetHeight 0, so the terminal gets the full viewport.
            if (isCoarsePointer) {
                const tb = document.getElementById('soft-keys');
                const tbH = tb ? tb.offsetHeight : 0;
                // Task M.10: --sk-h parks the compose bar directly above
                // the toolbar (0 while the M.6 toggle hides it — the bar
                // then sits on the keyboard/safe-area edge itself); --cb-h
                // lifts the floating action buttons above the visible bar

        }
        let kbRafScheduled = false;
        let fitTimer = null;

        // excluded so AltGr (Ctrl+Alt) typing chords are never hijacked.

            // Task 4.1 keybinding layer, MERGED into this handler (xterm
            // stores exactly one; a second attachCustomKeyEventHandler call
            // would silently replace the whole ADR-0003 contract below).
            // An exact app-chord match while the layer is enabled must not
            // reach the pty — tlKb's capture-phase window listener already
            // ran the command before xterm consulted us. Evaluated BEFORE

        // Image preview — a pasted/uploaded/dropped image pops up as a

        // Escape listener only exists while the lightbox is open
        // (capture + stopPropagation, so xterm never sees that Escape —
        // and terminal Escape is untouched the rest of the time).

            // by a new image, lightbox close) — the object URL is always
            // revoked here, exactly once. Gallery lightboxes carry server
            // URLs and never come through here.
            if (!preview) return;
            const p = preview;
            preview = null;             // null first: close() re-enters here
            clearTimeout(p.timer);
            if (p.thumb) p.thumb.remove();
            if (p.lightbox) p.lightbox.close();
            URL.revokeObjectURL(p.url);
        }

        function armImagePreviewTimer() {

        // ---- focus return after overlays (Task 2.3) ----------------------
        // Central dismissal: every overlay tear-down routes through
        // closeOverlay() so the terminal reliably gets the keyboard back —
        // opening via the floating buttons focuses the BUTTON, and without
        // this the first post-Escape keystrokes went nowhere. The counter is
        // T3's focusRequestId pattern (ThreadTerminalDrawer.tsx): each
        // request supersedes any still-scheduled one, and any caller — the
        // parent lobby included, via the tl-focus message — can re-request
        // focus at will. rAF defers past the same-tick DOM teardown, but is
        // RENDER-GATED: an iframe with no pending paint produces no
        // animation frames (measured in headless Chromium — tl-focus
        // arriving from the lobby scheduled a rAF that never ran, because
        // nothing in THIS document changed), so a 50ms timeout races it as

        let focusRequestId = 0;
        function requestTerminalFocus() {
            const id = ++focusRequestId;

                done = true;

            requestAnimationFrame(fire);
            setTimeout(fire, 50);

        function closeOverlay(el) {
            if (el && el.parentNode) el.remove();

            // already, so this focus cannot be stolen back by its own
            // teardown — and it closes the ~1-frame hole where a
            // keystroke arriving right after Escape still routed to the
            // launcher button that opened the overlay (#gallery-btn kept
            // focus the whole time; robot-speed typing <16ms after
            // Escape lost its first key in about half of battery runs).

            // runs after us in the same dismissal tick and could move
            // focus again (the rAF/50ms race above).

            const navUrls = (nav && Array.isArray(nav.urls) && nav.urls.length > 1 &&

                    e.stopPropagation();

                // onData, so disarm any armed soft-modifier first — it would

                            const formData = new FormData();

                formData.append('session', validArg);

                sendInput(path);
                showToast('Pasted: ' + path, 'success', 4000);
            } catch (err) {
                showToast('Upload error: ' + err.message, 'error', 5000);

        // ------------------------------------------------------------------

        function closeGallery() {
            if (!gallery) return;
            document.removeEventListener('keydown', gallery.onKey, true);
            const box = gallery.box;
            gallery = null;
            closeOverlay(box);          // remove + focus return (Task 2.3)
        }

        async function openGallery() {
            if (gallery) return;
            const box = document.createElement('div');
            box.id = 'img-gallery';
            const panel = document.createElement('div');
            panel.className = 'gallery-panel';
            const title = document.createElement('h2');
            title.className = 'gallery-title';
            title.textContent = 'Session images';
            panel.appendChild(title);
            const grid = document.createElement('div');
            grid.className = 'gallery-grid';
            panel.appendChild(grid);
            box.appendChild(panel);

            box.addEventListener('click', (e) => {
                if (e.target === box) closeGallery();   // backdrop only
            });
            const onKey = (e) => {
                if (e.key !== 'Escape') return;
                // A lightbox opened from the grid sits on top and owns

                if (document.getElementById('img-lightbox')) return;
                e.preventDefault();
                e.stopPropagation();
                closeGallery();
            };
            document.addEventListener('keydown', onKey, true);
            gallery = { box, onKey };
            document.body.appendChild(box);

            function note(text) {
                clearChildren(grid);
                const n = document.createElement('div');
                n.className = 'gallery-note';
                n.textContent = text;
                grid.appendChild(n);
            }
            note('Loading…');
            let images;
            try {
                const resp = await fetch('/clipboard/list?session=' + encodeURIComponent(validArg),
                    { credentials: 'same-origin' });
                if (!resp.ok) { note('Loading images failed: HTTP ' + resp.status); return; }
                images = await resp.json();
            } catch (err) {
                note('Loading images failed: ' + err.message);
                return;
            }
            if (!Array.isArray(images) || !images.length) {
                note('Nothing pasted or shown in this session yet');
                return;
            }
            clearChildren(grid);
            // Task M.4: grid-order URL list — handed to the lightbox as
            // nav so horizontal swipes walk neighbors + the position chip
            // can render.
            const navUrls = images.map(im =>
                '/clipboard/img/' + encodeURIComponent(validArg) + '/' + encodeURIComponent(im.name));
            for (const [idx, im] of images.entries()) {   // server orders mtime-desc = newest first
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'gallery-cell';
                cell.title = im.name;
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = im.name;
                img.src = navUrls[idx];
                cell.appendChild(img);
                if (im.kind === 'displayed') {
                    const badge = document.createElement('span');
                    badge.className = 'gallery-badge';
                    badge.textContent = 'shown';
                    cell.appendChild(badge);
                }
                cell.addEventListener('click', () => {
                    // No onClose teardown: the gallery stays mounted
                    // underneath, so closing the lightbox returns to it.
                    openLightbox(img.src, null, { urls: navUrls, index: idx });
                });
                // Right-click / long-press on gallery THUMBS only (Tasks
                // 2.5 + M.4) — the xterm surface keeps its native menu
                // untouched (red line). Insert-path reuses the exact
                // string the upload flow types into the pty.
                async function openThumbMenu(x, y) {
                    const items = [
                        { label: 'Open', onClick: () =>
                            openLightbox(img.src, null, { urls: navUrls, index: idx }) }
                    ];
                    if (im.path) {
                        items.push({ label: 'Insert path into terminal', onClick: () => {
                            mirrorLineReset();   // IR.1: path-send bypasses onData
                            sendInput(im.path);
                            closeGallery();   // land where the path went
                        } });
                    }
                    items.push({ label: 'Download', onClick: () => {
                        const a = document.createElement('a');
                        a.href = img.src;
                        a.download = im.name;
                        a.click();
                    } });
                    const picked = await showContextMenu(x, y, items);
                    if (picked) picked.onClick();
                }
                attachLongPress(cell, openThumbMenu);
                grid.appendChild(cell);
            }
        }

        document.getElementById('gallery-btn').addEventListener('click', openGallery);

        // Task M.8 repaint mask: a font-metric change re-rasterizes the
        // whole grid at new cell sizes — mid-burst (pinch steps arriving
        // every few frames, rapid A−/A+ taps) that reads as tearing. Dim
        // the CONTAINER to .35 before each fit (80ms CSS fade on
        // #terminal — container opacity only, never the WebGL canvas
        // contents) and restore 180ms after the LAST fit in the burst:
        // every step extends the timer, the same debounce posture as
        // refit()'s 120ms fitTimer. applyFontSize routes through
        // applyTermPrefs, so pinch/stepper/panel changes all wrap here —
        // and no-op applies (e.g. the duplicate tl-font-size message the
        // lobby sends for stale builds) never flash the mask.
        let fitMaskTimer = null;
        function maskFitBurst() {
            // Item 3(b): during the opacity-hold the container is already
            // fully hidden (opacity 0), so a burst dim would REVEAL it at
            // 35% — no-op until the boot reveal fires.
            if (!terminalRevealed) return;
            terminalEl.style.opacity = '0.35';
            clearTimeout(fitMaskTimer);
            fitMaskTimer = setTimeout(() => {
                fitMaskTimer = null;
                terminalEl.style.opacity = '';
            }, 180);
        }

        // Apply the validated prefs doc to the live terminal (Task 2.6).
        // Geometry-affecting options route through fitAddon.fit() — the
        // exact window-resize path (sendResize with pixel size) that
        // ADR-0003 already declares safe — and cursor/weight swaps are
        // pure repaints. Never touches mouse/wheel/scroll options (red
        // line; smoothScrollDuration stays unset forever).
        function applyTermPrefs(p) {
            let needFit = false;
            if (term.options.fontSize !== p.fontSize) { term.options.fontSize = p.fontSize; needFit = true; }
            if (term.options.lineHeight !== p.lineHeight) { term.options.lineHeight = p.lineHeight; needFit = true; }
            if (term.options.letterSpacing !== p.letterSpacing) { term.options.letterSpacing = p.letterSpacing; needFit = true; }
            if (term.options.cursorStyle !== p.cursorStyle) term.options.cursorStyle = p.cursorStyle;
            if (term.options.cursorBlink !== p.cursorBlink) term.options.cursorBlink = p.cursorBlink;
            if (term.options.fontWeightBold !== p.fontWeightBold) term.options.fontWeightBold = p.fontWeightBold;
            if (needFit) {
                maskFitBurst();   // Task M.8: dim the container through the metric swap
                try { fitAddon.fit(); } catch (e) { console.warn('prefs fit failed:', e); }
            }
            // Task M.6: toolbar visibility — device-local
            // tl:input.toolbarHidden:v1 (toolbar-fix; formerly the roamed
            // gestures.toolbarHidden) — a no-op stub on fine pointers.
            applyToolbarPrefs();
            // Task M.10/IR.2: input bar rides it too (input.bar × the
            // device-local ⌨ override) — a no-op stub on fine pointers.
            applyInputPrefs();
            // Desktop smooth-wheel: attach/detach the wheel interceptor to
            // match gestures.wheelSmooth (+ the gesture master kill). Every
            // apply path routes here — the Settings toggle (tl-prefs-change),
            // a roamed doc adoption, and the cross-frame prefs push — so the
            // toggle is instant and reversible on this red-line surface.
            applyWheelSmoothPref();
        }
        // Changes made in THIS window (floating A−/A+, boot adoption of the
        // server doc) come through the same-tab CustomEvent.
        window.addEventListener('tl-prefs-change', (e) => {
            applyTermPrefs(e.detail || getPrefs());
        });
        // One-shot reconciliation: if the boot /prefs GET adopted the server
        // doc BETWEEN the constructor reading bootPrefs and the listener
        // registration above, that CustomEvent was missed — re-read now
        // (no-op when nothing changed).
        applyTermPrefs(getPrefs());

        // Font-size stepper (Task 1.8), since 2.6 routed through the prefs
        // layer: setPrefs persists both keys + PUTs the roamed doc and
        // fires tl-prefs-change → applyTermPrefs above; the trailing
        // direct apply covers the no-change case (already-synced doc).
        function applyFontSize(n) {
            const before = getPrefs().fontSize;
            const next = setPrefs({ fontSize: clampFontSize(n) });
            // Task M.7: selection-grade tick per COMMITTED step (clamped
            // no-ops at 6/22 stay silent). Pinch steps (M.8) ride this
            // same shared fn.
            if (next.fontSize !== before) haptic('selection');
            applyTermPrefs(getPrefs());
        }
        document.getElementById('font-dec-btn').addEventListener('click', () => {
            applyFontSize(getPrefs().fontSize - 1);
            term.focus();
        });
        document.getElementById('font-inc-btn').addEventListener('click', () => {
            applyFontSize(getPrefs().fontSize + 1);
            term.focus();
        });

        // ------------------------------------------------------------------
        // Drag-and-drop files → upload → type the path(s) into the PTY.
        // Any file type is accepted. Dropped IMAGES are gallery content like
        // pastes: they ride the "image" field into the per-session store.
        // Everything else keeps the "file" field — saved under
        // /tmp/clipboard-files with a sanitized original name, a transfer
        // convenience. Either way the absolute path(s) are sent as input so
        // you can use them in a command.
        //
        // preventDefault MUST run on dragover AND drop UNCONDITIONALLY — if it
        // doesn't, the browser falls back to its default "open the dropped file"
        // (Chrome opens it in a new tab). Only the overlay + upload are gated on
        // whether the drag actually carries files.
        // ------------------------------------------------------------------
        const dropOverlay = document.createElement('div');
        dropOverlay.id = 'drop-overlay';
        dropOverlay.textContent = 'Drop files — paths typed into the session (images join its gallery)';
        Object.assign(dropOverlay.style, {
            position: 'fixed', inset: '0', zIndex: '9997', display: 'none',
            alignItems: 'center', justifyContent: 'center', textAlign: 'center',
            padding: '24px', boxSizing: 'border-box',
            background: 'color-mix(in srgb, var(--accent) 14%, rgba(0,0,0,0.55))',
            border: '3px dashed var(--accent)', color: 'var(--text-primary)',
            font: "600 16px var(--font-mono)",
            backdropFilter: 'blur(2px)', webkitBackdropFilter: 'blur(2px)',
            pointerEvents: 'none'
        });
        document.body.appendChild(dropOverlay);

        // dataTransfer.types is a DOMStringList in some browsers and an array in
        // others — probe both ways so file detection is reliable.
        const dragHasFiles = (e) => {
            const types = e.dataTransfer && e.dataTransfer.types;
            if (!types) return false;
            return (types.contains && types.contains('Files')) ||
                   Array.prototype.indexOf.call(types, 'Files') !== -1;
        };
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            if (!dragHasFiles(e)) return;
            dragDepth++;
            dropOverlay.style.display = 'flex';
        });
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        });
        window.addEventListener('dragleave', () => {
            if (dragDepth === 0) return;
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) dropOverlay.style.display = 'none';
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDepth = 0;
            dropOverlay.style.display = 'none';
            const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
            if (files.length) uploadDroppedFiles(files);
        });

        // Live re-theme without an iframe reload (Task 1.7): hand xterm a
        // freshly-read ITheme and repaint every row in place. Pure repaint —
        // selection, scroll position and mouse semantics untouched (red
        // line). Also exported as __tlThemeLive: the pre-paint boot script's
        // prefers-color-scheme listener calls it (after swapping the body
        // class itself) instead of reloading the page when the OS scheme
        // flips while the stored theme is 'system'.
        function liveRetheme() {
            term.options.theme = readTerminalTheme();
            term.refresh(0, term.rows - 1);
        }
        window.__tlThemeLive = liveRetheme;

        // The lobby (parent) drives this page over postMessage: files dropped
        // on its chrome (tl-drop-files), live theme switches (tl-theme —
        // ACKed back, so a lobby talking to a stale build without this branch
        // knows to fall back to its old iframe reload), font-size steps
        // (tl-font-size — no ACK: a stale build reads the persisted size at
        // its next boot anyway), whole prefs docs (tl-prefs, Task 2.6 —
        // settings panel changes + boot adoption; no ACK for the same
        // reason) and focus re-requests (tl-focus, Task 2.3: lobby-side
        // overlays live outside this iframe, so their dismissal hands the
        // keyboard back through here).
        window.addEventListener('message', (e) => {
            if (e.origin !== location.origin || !e.data) return;
            if (e.data.type === 'tl-drop-files') {
                const files = Array.isArray(e.data.files) ? e.data.files : [];
                if (files.length) uploadDroppedFiles(files);
            } else if (e.data.type === 'tl-font-size') {
                applyFontSize(e.data.size);
            } else if (e.data.type === 'tl-prefs') {
                // localStorage (shared same-origin, written by the lobby
                // before posting) is the truth; the payload only covers the
                // rare failed-write case. Idempotent with the tl-font-size
                // message the lobby sends alongside for stale builds.
                applyTermPrefs(readRawPrefs() ? getPrefs() : normalizePrefs(e.data.prefs));
            } else if (e.data.type === 'tl-focus') {
                requestTerminalFocus();
            } else if (e.data.type === 'tl-theme') {
                // localStorage (shared same-origin, written by the lobby
                // before posting) is the source of truth; the message name
                // is the carrier for the rare failed-write case.
                applyTheme(THEMES.includes(e.data.name) ? e.data.name : getTheme());
                liveRetheme();
                // __tlSuppressThemeAck: battery hook — suppressing the ACK
                // simulates a stale build so the reload fallback is testable.
                if (e.source && !window.__tlSuppressThemeAck) {
                    e.source.postMessage({ type: 'tl-theme-ack', name: e.data.name }, location.origin);
                }
            } else if (e.data.type === 'tl-command') {
                // Task 4.1: lobby palette actions that live in THIS
                // document. Restricted to the two terminal-local commands
                // so a session command can never ping-pong between frames.
                if (e.source === window.parent &&
                        (e.data.command === 'gallery.open' ||
                         e.data.command === 'terminal.paste')) {
                    runAppCommand(e.data.command);
                }
            }
        });

        // ---- keybinding layer + palette (Task 4.1), terminal side --------
        // Chords are executed by tlKb's single capture-phase window keydown
        // (init below); the matchesAppChord branch merged into the
        // attachCustomKeyEventHandler above is what keeps a matched chord
        // out of the pty. Framed (the normal case): every session command
        // is forwarded UP — the lobby owns the sidebar, the palette and
        // session switching. A deep-linked top-level ?arg= tab has no
        // lobby: it gets a local palette over the same factory, with
        // real navigation standing in for iframe swaps.
        const ATTACH_PREFIX = 'session.attach.';
        async function fetchSessionList() {
            const resp = await fetch(SESSIONS_API, { credentials: 'same-origin' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
        }
        // MF-3 (Viktor complaint 1, rank 4): gesture/soft-key session
        // CYCLING must not re-arm the iOS edge-back-swipe — every assign()
        // grows a history chain behind the page and Safari then dedicates
        // the screen edge to back-navigation (flat-history doctrine, M.3),
        // so cycling callers pass {replace:true}. Deliberate jumps (the
        // palette attach binding, Alt+N via the ATTACH_PREFIX branch) keep
        // the assign default: those stay back-walkable on desktop.
        function gotoSession(name, opts) {
            if (name && name !== validArg) {
                const url = '/?arg=' + encodeURIComponent(name);
                if (opts && opts.replace) location.replace(url);
                else location.assign(url);
            }
        }
        function promptNewSession() {
            const input = prompt('New session name:');
            if (input === null) return;
            const name = input.trim();
            if (!NAME_RE.test(name)) {
                showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                return;
            }
            location.assign('/?arg=' + encodeURIComponent(name));
        }
        async function killCurrentSession() {
            if (!confirm('Kill tmux session "' + validArg + '"? Any running processes inside it will be terminated.')) return;
            try {
                const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(validArg), {
                    method: 'DELETE', credentials: 'same-origin'
                });
                if (resp.ok) location.assign('/');
                else showToast('Kill failed: HTTP ' + resp.status, 'error');
            } catch (err) {
                showToast('Kill error: ' + err.message, 'error');
            }
        }
        async function renameCurrentSession() {
            const input = prompt('Rename "' + validArg + '" to:', validArg);
            if (input === null) return;
            const newName = input.trim();
            if (!NAME_RE.test(newName)) {
                showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                return;
            }
            if (newName === validArg) return;
            try {
                const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(validArg) + '/rename', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                if (resp.status === 204) location.replace('/?arg=' + encodeURIComponent(newName));
                else showToast('Rename failed: HTTP ' + resp.status, 'error');
            } catch (err) {
                showToast('Rename error: ' + err.message, 'error');
            }
        }
        // Unframed Alt+N / cycling works over the live /sessions order
        // (no sidebar here to define a visual order).
        async function unframedJump(cmd) {
            let list;
            try { list = await fetchSessionList(); } catch (e) { return; }
            const names = list.map(s => s.name);
            if (!names.length) return;
            if (cmd.startsWith(ATTACH_PREFIX)) {
                gotoSession(names[Number(cmd.slice(ATTACH_PREFIX.length)) - 1]);
                return;
            }
            const i = names.indexOf(validArg);
            // {replace:true}: ‹/› soft keys and the 3-finger swipe route
            // here — cycling must keep history flat (see gotoSession).
            gotoSession(cmd === 'session.next'
                ? (i < 0 ? names[0] : names[(i + 1) % names.length])
                : (i < 0 ? names[names.length - 1] : names[(i - 1 + names.length) % names.length]),
                { replace: true });
        }
        const palette = isFramed ? null : tlKb.createPalette({
            sessions: fetchSessionList,
            current: () => validArg,
            attach: gotoSession,
            refocus: () => requestTerminalFocus(),
            actions: () => [
                { label: 'New session', run: promptNewSession },
                { label: 'Rename current session', hint: validArg, run: renameCurrentSession },
                { label: 'Open image gallery', hint: validArg, run: () => openGallery() },
                { label: 'Paste into terminal', hint: validArg,
                  run: () => document.getElementById('paste-btn').click() },
                { label: 'Kill current session', hint: validArg, danger: true,
                  run: killCurrentSession }
            ]
        });
        function runAppCommand(cmd) {
            if (cmd === 'gallery.open') { openGallery(); return; }
            if (cmd === 'terminal.paste') {
                // The floating paste button's routine: clipboard read
                // (image → upload + path, text → term.paste) + refocus.
                document.getElementById('paste-btn').click();
                return;
            }
            if (isFramed) {
                try {
                    window.parent.postMessage({ type: 'tl-command', command: cmd }, location.origin);
                } catch (e) {}
                return;
            }
            if (cmd === 'palette.toggle') { palette.toggle(); return; }
            if (palette.isOpen()) palette.close(false);
            if (cmd.startsWith(ATTACH_PREFIX) || cmd === 'session.next' || cmd === 'session.prev') {
                unframedJump(cmd);
            }
        }
        tlKb.init({
            // terminalFocus ≈ this document holds the keyboard (it IS the
            // focus surface — keydowns land here only while it does), minus
            // the gallery modal, which owns its own keys.
            getContext: () => ({
                terminalFocus: !gallery,
                lobbyOpen: isFramed,
                galleryOpen: !!gallery
            }),
            runCommand: runAppCommand,
            // Badges render on the lobby's session cards; forward this
            // document's Alt state up (keydowns here never reach the
            // parent window). Blur resets the tracker → forwards false.
            onAltChange: (down) => {
                if (isFramed) {
                    try {
                        window.parent.postMessage({ type: 'tl-kb-alt', alt: down }, location.origin);
                    } catch (e) {}
                }
            }
        });

        async function uploadDroppedFiles(files) {
            // Preview the first dropped image (non-images have nothing to show).
            const firstImage = files.find((f) => f.type && f.type.startsWith('image/'));
            if (firstImage) showImagePreview(firstImage);
            showToast('Uploading ' + files.length + ' file' + (files.length > 1 ? 's' : '') + '...', '');
            const paths = [];
            for (const f of files) {
                try {
                    const fd = new FormData();
                    // Images persist like pastes (per-session store → gallery,
                    // Viktor's locked scope); anything else stays an ephemeral
                    // /tmp transfer via the legacy file field.
                    if (f.type && f.type.startsWith('image/')) {
                        fd.append('image', f, f.name);
                    } else {
                        fd.append('file', f, f.name);
                    }
                    fd.append('session', validArg);
                    const resp = await fetch('/clipboard/upload', { method: 'POST', body: fd });
                    if (!resp.ok) {
                        showToast('Upload failed (' + f.name + '): ' + (await resp.text()), 'error', 5000);
                        continue;
                    }
                    const { path } = await resp.json();
                    if (path) paths.push(path);
                } catch (err) {
                    showToast('Upload error (' + f.name + '): ' + err.message, 'error', 5000);
                }
            }
            if (paths.length) {
                // Saved names are sanitized (no spaces/shell specials), so paths
                // are safe to insert verbatim, space-separated.
                mirrorLineReset();   // IR.1: path-send bypasses onData
                sendInput(paths.join(' '));
                showToast('Added ' + paths.length + ' path' + (paths.length > 1 ? 's' : ''), 'success', 4000);
            }
            term.focus();
        }

        // Reconnect guard: ttyd attaches with `tmux new-session -A`, so a blind
        // reconnect RECREATES a session that was just killed. Returns false only
        // when we positively confirm the session is gone; any uncertainty
        // (network/API error) returns true so a transient blip still reconnects.
        async function sessionStillExists() {
            try {
                const resp = await fetch(SESSIONS_API, { credentials: 'same-origin' });
                if (!resp.ok) return true;
                const list = await resp.json();
                return Array.isArray(list) && list.some((s) => s.name === validArg);
            } catch (e) {
                return true;
            }
        }

        // ---- reconnect ladder + connection pill (Task 2.2) ---------------
        // tmux reattach makes aggressive retry lossless, so back off fast:
        // 1s → 2s → 4s → 8s → 16s, capped. The attempt counter resets only
        // after a connection has stayed up 30s — a flapping link keeps
        // escalating instead of hammering the server. Coexists with the
        // stale-tab healer: onopen still runs reloadIfStale() on every
        // reconnect, and the sessionStillExists() kill-guard is unchanged.
        // Status now lives in the #conn-pill overlay instead of red
        // term.write lines (those stacked up per retry and got overdrawn
        // by tmux's reattach repaint anyway).
        const RETRY_DELAYS_MS = [1000, 2000, 4000, 8000, 16000];
        let connAttempts = 0;   // connect()s started since the last stable connection
        let retryTimer = null;  // pending scheduled connect (null while attempting)
        let stableTimer = null; // pending "connection survived 30s" ladder reset
        // ---- battery saver: drop the socket while the tab stays hidden ----
        // ttyd pings the WebSocket every 30s (server -P) and streams any pane
        // output; left open behind a locked screen or a switched-away PWA it
        // keeps the phone's radio warm for nothing — the reason a mobile PWA
        // drains battery "after" a session. So once the tab has been hidden
        // HIDDEN_SUSPEND_MS, close the socket and hold it down until the tab is
        // shown again. Lossless: tmux reattach repaints the live screen on
        // reconnect (the same path a deploy's ttyd restart already exercises),
        // and "awaiting input" alerts still arrive over Web Push while
        // suspended (the push subscription is server-driven, independent of
        // this socket). The grace is generous on purpose — a brief app-switch
        // must not cost a reconnect flicker; 60s hidden ~always means the phone
        // was put down. Single knob, tune here.
        const HIDDEN_SUSPEND_MS = 60000;
        let hiddenSuspendTimer = null; // grace countdown once hidden (null otherwise)
        let batterySuspended = false;  // socket intentionally down until the tab shows
        const connPill = document.getElementById('conn-pill');
        // Hovering the pill explains the connection colors (amber pulse vs red).
        tlAttachLegend(connPill, 'conn',
            () => connPill.classList.contains('offline') ? 'offline' : 'connecting');
        function paintConnPill(attempt) {
            connPill.textContent =
                navigator.onLine === false ? 'You are offline'
                : attempt <= 1 ? 'Connecting…'
                : 'Reconnecting… (attempt ' + attempt + ')';
            connPill.classList.toggle('offline', navigator.onLine === false);
            connPill.classList.remove('hidden');
        }
        function hideConnPill() { connPill.classList.add('hidden'); }
        function scheduleReconnect() {
            if (batterySuspended) return; // suspended for battery — reconnect waits for the tab to show
            if (retryTimer) return; // one pending attempt at a time
            const delay = RETRY_DELAYS_MS[Math.min(connAttempts, RETRY_DELAYS_MS.length - 1)];
            paintConnPill(connAttempts + 1); // the attempt this timer will run
            retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
        }
        // A hidden tab throttles timers and a dead network fails fast — when
        // either recovers, retry NOW instead of waiting out a 16s rung. Only
        // while a retry is actually pending: never a second socket during a
        // live attempt, never a resurrect after "Session ended."
        function retryNow(why) {
            if (!retryTimer) return;
            clearTimeout(retryTimer);
            retryTimer = null;
            console.log('reconnect: instant retry (' + why + ')');
            connect();
        }
        // Tear the socket down after the tab has been hidden long enough, and
        // reopen the moment it's shown — reusing the existing connect()/ladder.
        function suspendForBattery() {
            hiddenSuspendTimer = null;
            // The timer can fire just as the tab is shown: its callback was
            // already queued when the visible handler ran, so clearTimeout
            // missed it. Never suspend a visible tab — that would close a
            // healthy socket with nothing left to reconnect it (a visible tab
            // fires no further visibilitychange).
            if (!document.hidden || batterySuspended) return;
            batterySuspended = true;
            clearTimeout(retryTimer); retryTimer = null; // drop any pending reconnect
            clearTimeout(stableTimer);
            hideConnPill();
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                try { ws.close(); } catch (e) { /* already closing */ }
            }
            console.log('battery saver: socket suspended (tab hidden ' + HIDDEN_SUSPEND_MS + 'ms)');
        }
        // Resume from a suspend — shared by the visibilitychange and pageshow
        // paths. connect() detaches any prior socket, so calling this twice
        // (both events firing on one restore) can't leave two live sockets.
        function resumeFromSuspend(why) {
            clearTimeout(hiddenSuspendTimer); hiddenSuspendTimer = null;
            if (!batterySuspended) return false;
            batterySuspended = false;
            console.log('battery saver: ' + why + ' → reconnecting');
            connect();
            return true;
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (!hiddenSuspendTimer && !batterySuspended) {
                    hiddenSuspendTimer = setTimeout(suspendForBattery, HIDDEN_SUSPEND_MS);
                }
                return;
            }
            // Tab shown: resume a suspended socket, else bring a pending
            // reconnect forward.
            if (!resumeFromSuspend('tab visible')) retryNow('tab visible');
        });
        // bfcache restore (iOS standalone especially): the page returns frozen,
        // not reloaded, and its visibilitychange can be unreliable — so pageshow
        // is the belt to visibilitychange's suspenders for waking a suspend.
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) resumeFromSuspend('bfcache restore');
        });
        // A page that boots hidden (opened in a background tab) arms the same
        // countdown; visibilitychange won't fire until it is first shown.
        if (document.hidden) hiddenSuspendTimer = setTimeout(suspendForBattery, HIDDEN_SUSPEND_MS);
        window.addEventListener('online', () => retryNow('back online'));
        window.addEventListener('offline', () => {
            // Repaint a waiting pill to "You are offline"; the online
            // handler above brings the retry forward when service returns.
            if (retryTimer) paintConnPill(connAttempts + 1);
        });

        // ---- stale-tab self-heal (definitions hoisted) -------------------
        // hashPage/fetchSelf/armBaseline/reloadIfStale live ABOVE the
        // lobby/terminal split now (the lobby generalizes them as its
        // no-backend fallback). This terminal path keeps its historic
        // behavior verbatim: full no-store baseline at boot, compare on
        // every reconnect (see ws.onopen → reloadIfStale()).
        armBaseline('boot');

        function connect() {
            // Neutralize any earlier socket before opening a new one. A battery
            // resume can call connect() while a just-closed socket's onclose is
            // still queued (a frozen mobile tab completes close() late);
            // detaching its handlers stops that stale onclose from scheduling a
            // competing reconnect — without this, resume's socket plus the
            // stale-onclose's socket both go live, doubling the pty stream and
            // the pings. Idempotent: on the normal ladder the prior socket is
            // already CLOSED, so this is a no-op.
            if (ws) {
                try { ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null; ws.close(); }
                catch (e) { /* already closing */ }
                ws = null;
            }
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            let argSuffix = '?arg=' + encodeURIComponent(validArg);
            // Keep a project dir pinned to arg3: when we have one, always emit a
            // command at arg2 ('default' if none) so ttyd's positional -a
            // forwarding lands the dir on $3. Without a dir, the historic shape
            // (arg2 only when there's a command). Shared by /ws and /token below.
            if (validDir) {
                argSuffix += '&arg=' + encodeURIComponent(validCmdKey || 'default');
                argSuffix += '&arg=' + encodeURIComponent(validDir);
            } else if (validCmdKey) {
                argSuffix += '&arg=' + encodeURIComponent(validCmdKey);
            }
            const base = location.pathname.replace(/\/+$/, '');
            const wsUrl = proto + '//' + location.host + base + '/ws' + argSuffix;

            connAttempts++;
            paintConnPill(connAttempts);

            fetch(base + '/token' + argSuffix, { credentials: 'same-origin' })
                .then(r => r.json())
                .then(tokenData => {
                    // Tab went hidden while the token was in flight — don't open
                    // a socket the battery saver is about to suspend anyway.
                    if (batterySuspended) return;
                    const token = tokenData.token || '';
                    ws = new WebSocket(wsUrl, ['tty']);
                    ws.binaryType = 'arraybuffer';
                    // Task 2.7: WS liveness feeds the slow-request health
                    // toast — this attempt is "pending" until onopen. The
                    // onclose ack keeps a failed attempt from lingering as
                    // slow (the connection pill owns retry messaging).
                    const wsSlowId = slowRequests.track('WS ' + base + '/ws');

                    ws.onopen = () => {
                        console.log('Connected to ttyd (session: ' + validArg + ')');
                        slowRequests.ack(wsSlowId);
                        // Task 3.5: flow-control counters must not leak
                        // across connections (a carried-over PAUSE state
                        // would strangle the fresh pty stream). Re-read the
                        // kill-switch too — a same-window flip (no storage
                        // event) applies from this connection on.
                        flowOn = flowControlWanted();
                        flowReset();
                        // Task IR.1: a (re)attach starts a fresh pty input
                        // line — the compose mirror's diff baseline is
                        // stale; drop it (no-op on fine pointers).
                        mirrorLineReset();
                        cancelScrollMomentum();   // a (re)attach / session switch hard-cancels a coast
                        hideConnPill();
                        // Ladder reset only after the connection PROVES
                        // stable (30s up) — an instant re-drop keeps the
                        // escalated delay instead of restarting at 1s.
                        clearTimeout(stableTimer);
                        stableTimer = setTimeout(() => { connAttempts = 0; }, 30000);
                        const isReconnect = hasConnectedOnce;
                        hasConnectedOnce = true;
                        // A reconnect usually means ttyd restarted — i.e. a
                        // deploy. Check whether this page is now stale.
                        if (isReconnect) reloadIfStale();
                        const initMsg = JSON.stringify({
                            AuthToken: token,
                            columns: term.cols,
                            rows: term.rows
                        });
                        ws.send(initMsg);
                        // The session now exists (ttyd just ran tmux new-session).
                        // The lobby's /sessions cache was invalidated on this
                        // iframe's earlier /whoami, but that fired BEFORE the
                        // session was spawned — so the lobby may have re-cached an
                        // empty list. Invalidate again now that it's live so the
                        // parent lobby's next poll surfaces it promptly.
                        fetch(WHOAMI_API, { credentials: 'same-origin' }).catch(() => {});
                        // Arm the one-shot pixel-size kick for THIS connection
                        // (fires on the first OUTPUT message — the only proof
                        // ttyd's process exists; earlier RESIZEs are dropped).
                        needsPixelResizeKick = true;
                        // Belt-and-braces: usually a no-op server-side (the
                        // process may not be spawned yet, and ttyd drops
                        // RESIZE until it is), but harmless — term is already
                        // opened by this point and sendResize guards the ws.
                        sendResize();
                    };

                    ws.onmessage = (event) => {
                        const data = event.data;
                        if (data instanceof ArrayBuffer) {
                            const view = new Uint8Array(data);
                            if (view.length < 1) return;
                            const msgType = view[0];
                            const payload = view.slice(1);

                            switch (msgType) {
                                case MSG_OUTPUT:
                                    // First server output = ttyd's process
                                    // provably exists (ttyd drops RESIZE
                                    // messages that arrive before spawn, and
                                    // the initial JSON handshake carries no
                                    // pixel fields). Send one explicit resize
                                    // now so the pty learns its pixel size
                                    // and tmux starts re-emitting sixel.
                                    if (needsPixelResizeKick) {
                                        needsPixelResizeKick = false;
                                        sendResize();
                                    }
                                    // Item 3(b): first output frame is the
                                    // second opacity-reveal gate. Defer via
                                    // refit's 120ms debounce so the reveal
                                    // lands after the frame's content + the
                                    // pixel-resize-kick fit settle, not
                                    // mid-fit.
                                    if (!firstFrameSeen) {
                                        firstFrameSeen = true;
                                        setTimeout(maybeRevealTerminal, 120);
                                    }
                                    // Attention (Task 2.1): note THAT output
                                    // arrived while hidden — once per hidden
                                    // period; content is never inspected.
                                    if (document.hidden && !hiddenOutputSignaled) {
                                        hiddenOutputSignaled = true;
                                        signalAttention('output');
                                    }
                                    // Task 3.5: counted write (flow control)
                                    // unless the kill-switch says plain.
                                    if (flowOn) writeData(payload);
                                    else term.write(payload);
                                    break;
                                case MSG_SET_PREFS:
                                    try {
                                        const prefs = JSON.parse(textDecoder.decode(payload));
                                        console.log('ttyd prefs:', prefs);
                                    } catch (e) {}
                                    break;
                                case MSG_SET_TITLE:
                                    // ttyd sends one SET_TITLE frame per connect,
                                    // carrying '<command> (<hostname>)'. The page
                                    // already set the meaningful 'tmux: <user>/<session>'
                                    // title — keep it; don't let the frame overwrite.
                                    break;
                            }
                        }
                    };

                    ws.onclose = () => {
                        slowRequests.ack(wsSlowId); // no-op after onopen's ack
                        clearTimeout(stableTimer);
                        // Battery saver closed us on purpose — stay down (no
                        // pill, no ladder); the visibilitychange handler
                        // reconnects when the tab is shown again.
                        if (batterySuspended) return;
                        // The connection did not survive — show status while we
                        // decide whether to reconnect (the existence check below
                        // can itself take a moment on a struggling network).
                        paintConnPill(connAttempts + 1);
                        // First connection is the create/attach — always retry it.
                        // After we've connected once, a close may mean the session
                        // was killed (by this or another client); reconnecting would
                        // resurrect it via `tmux new-session -A`. Only reconnect if
                        // the session still exists.
                        if (!hasConnectedOnce) {
                            scheduleReconnect();
                            return;
                        }
                        sessionStillExists().then((exists) => {
                            if (exists) {
                                scheduleReconnect();
                            } else {
                                hideConnPill();
                                term.write('\r\n\x1b[33mSession ended.\x1b[0m\r\n');
                            }
                        });
                    };

                    ws.onerror = (e) => console.error('WebSocket error:', e);
                })
                .catch(err => {
                    // Token fetch failed = the attempt failed before a
                    // socket ever existed — same ladder as a WS drop.
                    console.error('Token fetch failed:', err);
                    scheduleReconnect();
                });
        }

        connect();
    })();
    </script>
</body>
</html>
