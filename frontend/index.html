            function orderedSessionNames() {
                return Array.from(listEl.querySelectorAll('.session-card'))
                    .map(c => c.dataset.name).filter(Boolean);
            }
            const palette = tlKb.createPalette({
                // lastSessions is the poll the cards are painted from —
                // ≤5s stale, instantly available (no fetch on open).
                sessions: () => Promise.resolve(lastSessions),
                current: () => currentActive,
                attach: (name) => {
                    if (currentActive === name) requestTerminalFocus();
                    else activateSession(name);
                },
                refocus: () => requestTerminalFocus(),
                actions: () => {
                    const acts = [{ label: 'New session', hint: 'name box',
                                    keepFocus: true, run: () => runAppCommand('session.new') }];
                    if (currentActive) {
                        acts.push(
                            { label: 'Rename current session', hint: currentActive,
                              run: () => runAppCommand('session.rename.current') },
                            { label: 'Open image gallery', hint: currentActive,
                              run: () => runAppCommand('gallery.open') },
                            { label: 'Paste into terminal', hint: currentActive,
                              run: () => runAppCommand('terminal.paste') },
                            { label: 'Kill current session', hint: currentActive,
                              danger: true, run: () => runAppCommand('session.kill.current') }
                        );
                    }
                    return acts;
                }
            });
            // Task M.6: ONE cycle function shared by the Task 4.1 chords
            // (Alt+Shift+[ / ]), the ‹/› soft keys and the Android 3-finger
            // swipe (both arrive as tl-gesture messages). The order is the
            // PAINTED card order — lastSessions merged with the roamed
            // layout — i.e. exactly what the user sees in the sidebar, so
            // every cycling affordance walks the same ring. announce=true
            // (gesture callers only) flashes the 220ms #session-pill naming
            // the target: mid-swipe the toolbar/sidebar may be off-screen
            // and the iframe is about to be replaced, so the OUTER pill is
            // the only feedback that can survive the switch. Chord calls
            // keep their pre-M.6 pill-less behavior.
            let sessionPillEl = null, sessionPillTimer = null;
            function flashSessionPill(name, dir) {
                if (!sessionPillEl) {
                    sessionPillEl = document.createElement('div');
                    sessionPillEl.id = 'session-pill';
                    sessionPillEl.setAttribute('role', 'status');
                    document.body.appendChild(sessionPillEl);
                }
                sessionPillEl.textContent = dir > 0 ? name + ' ›' : '‹ ' + name;
                sessionPillEl.classList.add('visible');
                clearTimeout(sessionPillTimer);
                sessionPillTimer = setTimeout(
                    () => sessionPillEl.classList.remove('visible'), 220);
            }
            function cycleSession(dir, announce) {
                const names = orderedSessionNames();
                if (!names.length) return;
                const i = names.indexOf(currentActive);
                const target = dir > 0
                    ? (i < 0 ? names[0] : names[(i + 1) % names.length])
                    : (i < 0 ? names[names.length - 1] : names[(i - 1 + names.length) % names.length]);
                if (target === currentActive) return;     // single session: no-op
                if (announce) flashSessionPill(target, dir);
                activateSession(target);
            }
            // ---- Ctrl+J bottom dock (persistent shell panel) --------------
            // The shell docks in a persistent bottom panel instead of swapping
            // the window (design: docs/2026-07-17-ctrl-j-shell-dock-design.md).
            // The docked session + visibility ride the roamed layout
            // (layout.dock); the split ratio is a per-browser view pref. Fine-
            // pointer only — coarse pointers never render the dock.
            const DOCK_RATIO_KEY = 'tl:dock-split:v1';
            const dockEl         = document.getElementById('dock');
            const dockFrameEl    = document.getElementById('dock-frame');
            const dockGutterEl   = document.getElementById('dock-gutter');
            const dockTitleEl    = document.getElementById('dock-title');
            const lobbyContentEl = document.getElementById('lobby-content');
            let dockFrameSession = null;   // session #dock-frame currently attaches
            let dockGraceUntil = 0;        // shields a local dock change from a stale poll

            const pendingShellNames = new Set();
            function firstFreeShellName() {
                const taken = new Set(lastSessions.map(s => s.name));
                pendingShellNames.forEach(n => taken.add(n));
                if (!taken.has('shell')) return 'shell';
                for (let i = 2; i < 1000; i++) {
                    if (!taken.has('shell-' + i)) return 'shell-' + i;
                }
                return 'shell-' + Date.now();     // pathological fallback
            }
            function dockState() {
                const d = layout && layout.dock;
                if (d && typeof d === 'object' && typeof d.session === 'string' && NAME_RE.test(d.session)) {
                    return { session: d.session, visible: d.visible !== false,
                        dir: typeof d.dir === 'string' ? d.dir : '' };
                }
                return { session: null, visible: false, dir: '' };
            }
            function dockPct() {
                let p = parseFloat(localStorage.getItem(DOCK_RATIO_KEY));
                if (!isFinite(p)) p = 30;
                return Math.max(12, Math.min(85, p));
            }
            function setFrameUrlOn(frame, url) {
                try { frame.contentWindow.location.replace(url); }
                catch (e) { frame.src = url; }
            }
            // Reconcile the grid + dock iframe with layout.dock. Reattaches the
            // iframe only when the docked session changes, so polls don't flicker
            // it. A docked-but-hidden session keeps its iframe alive (0-height
            // row) so re-showing is instant and the shell keeps running.
            function applyDock() {
                const ds = dockState();
                const showable = !!ds.session && !isCoarsePointer;
                if (showable) {
                    if (dockFrameSession !== ds.session) {
                        dockFrameSession = ds.session;
                        dockTitleEl.textContent = ds.session;
                        setFrameUrlOn(dockFrameEl, frameArgs(ds.session, { cmd: 'shell', dir: ds.dir }));
                    }
                } else if (dockFrameSession) {
                    dockFrameSession = null;
                    setFrameUrlOn(dockFrameEl, 'about:blank');
                }
                const open = showable && ds.visible;
                lobbyContentEl.style.gridTemplateRows = open
                    ? ('1fr 6px ' + dockPct() + '%') : '1fr 0px 0px';
                dockGutterEl.setAttribute('aria-hidden', open ? 'false' : 'true');
            }
            function focusDockSoon() {
                setTimeout(() => { try { dockFrameEl.contentWindow.focus(); } catch (e) {} }, 60);
            }
            // Ctrl+J: create+dock a shell if none; else toggle the panel.
            function openOrToggleDock() {
                if (isCoarsePointer) {
                    // No dock on touch → fall back to a full-window shell.
                    const nm = firstFreeShellName();
                    pendingShellNames.add(nm);
                    setTimeout(() => pendingShellNames.delete(nm), 15000);
                    activateSession(nm, { cmd: 'shell', dir: currentActive ? projectDirForSession(currentActive) : '' });
                    quickRefreshAfterCreate();
                    return;
                }
                const ds = dockState();
                dockGraceUntil = Date.now() + 4000;
                if (!ds.session) {
                    const name = firstFreeShellName();
                    const dir = currentActive ? projectDirForSession(currentActive) : '';
                    pendingShellNames.add(name);
                    setTimeout(() => pendingShellNames.delete(name), 15000);
                    layout.dock = { session: name, visible: true, dir: dir };
                    applyDock();
                    saveLayout();
                    quickRefreshAfterCreate();
                    focusDockSoon();
                } else {
                    layout.dock = { session: ds.session, visible: !ds.visible, dir: ds.dir };
                    applyDock();
                    saveLayout();
                    if (layout.dock.visible) focusDockSoon();
                }
            }
            function hideDock() {
                const ds = dockState();
                if (!ds.session) return;
                dockGraceUntil = Date.now() + 4000;
                layout.dock = { session: ds.session, visible: false, dir: ds.dir };
                applyDock();
                saveLayout();
            }
            // Promote the docked shell to a normal sidebar card. It's a live
            // session, so clearing the dock is enough; a project name (from a
            // drop on a project header) also assigns it there.
            function unDock(projectName) {
                const ds = dockState();
                if (!ds.session) return;
                const name = ds.session;
                dockGraceUntil = Date.now() + 4000;
                delete layout.dock;
                applyDock();                          // tears the iframe down
                if (typeof projectName === 'string') moveSessionTo(name, projectName);  // saves layout
                else saveLayout();
                showToast('Shell moved to the sidebar', 'info', 2000);
            }
            // Clear a dock whose session died / was killed (from the poll).
            function reconcileDock() {
                const ds = dockState();
                if (ds.session && !pendingShellNames.has(ds.session)
                        && !lastSessions.some(s => s.name === ds.session)) {
                    delete layout.dock;
                }
                applyDock();
            }

            // Dock header controls + drag-out + gutter resize (fine pointer).
            document.getElementById('dock-hide').addEventListener('click', hideDock);
            document.getElementById('dock-close').addEventListener('click', () => unDock());
            const dockHeaderEl = document.getElementById('dock-header');
            dockHeaderEl.draggable = !isCoarsePointer;
            dockHeaderEl.addEventListener('dragstart', (e) => {
                const ds = dockState();
                if (!ds.session) { e.preventDefault(); return; }
                dragSrcDockSession = ds.session;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', ds.session);
                dockHeaderEl.classList.add('drag-out');
            });
            dockHeaderEl.addEventListener('dragend', () => {
                dockHeaderEl.classList.remove('drag-out');
                dragSrcDockSession = null;
            });
            // Resize: a viewport shield captures pointer moves over the iframes;
            // the ratio persists per-browser. Grid transition off while dragging.
            dockGutterEl.addEventListener('pointerdown', (e) => {
                const ds = dockState();
                if (isCoarsePointer || !ds.session || !ds.visible) return;
                e.preventDefault();
                const rect = lobbyContentEl.getBoundingClientRect();
                lobbyContentEl.classList.add('dock-resizing');
                dockGutterEl.classList.add('resizing');
                const shield = document.createElement('div');
                shield.style.cssText = 'position:fixed;inset:0;z-index:10001;cursor:row-resize;';
                document.body.appendChild(shield);
                function onMove(ev) {
                    const pct = (rect.bottom - ev.clientY) / rect.height * 100;
                    try { localStorage.setItem(DOCK_RATIO_KEY, String(Math.max(12, Math.min(85, pct)))); } catch (_) {}
                    lobbyContentEl.style.gridTemplateRows = '1fr 6px ' + dockPct() + '%';
                }
                function onUp() {
                    shield.removeEventListener('pointermove', onMove);
                    shield.removeEventListener('pointerup', onUp);
                    shield.remove();
                    lobbyContentEl.classList.remove('dock-resizing');
                    dockGutterEl.classList.remove('resizing');
                }
                shield.addEventListener('pointermove', onMove);
                shield.addEventListener('pointerup', onUp);
            });
            // Whole-sidebar fallback: dropping the dragged-out dock anywhere in
            // the sidebar that ISN'T a project header un-docks it to Ungrouped
            // (project-header drops stopPropagation for the join-a-project case).
            const sidebarEl = document.getElementById('lobby-sidebar');
            if (sidebarEl) {
                sidebarEl.addEventListener('dragover', (e) => {
                    if (!dragSrcDockSession) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                sidebarEl.addEventListener('drop', (e) => {
                    if (!dragSrcDockSession) return;
                    e.preventDefault();
                    unDock('');
                });
            }
            const ATTACH_PREFIX = 'session.attach.';
            function runAppCommand(cmd) {
                if (cmd === 'palette.toggle') { palette.toggle(); return; }
                // Any other command closes an open palette first (its own
                // items already closed it in runItem; this covers chords
                // fired while the palette is up).
                if (palette.isOpen()) palette.close(false);
                if (cmd.startsWith(ATTACH_PREFIX)) {
                    const name = orderedSessionNames()[Number(cmd.slice(ATTACH_PREFIX.length)) - 1];
                    if (!name) return;                    // fewer cards than N
                    if (currentActive === name) { requestTerminalFocus(); return; }
                    activateSession(name);                // fresh iframe self-focuses at boot
                    return;
                }
                if (cmd === 'session.next' || cmd === 'session.prev') {
                    cycleSession(cmd === 'session.next' ? 1 : -1, false);
                    return;
                }
                if (cmd === 'session.new') {
                    setSidebarCollapsed(false);           // the box lives in the sidebar
                    newNameEl.focus();
                    return;
                }
                if (cmd === 'session.new.shell') {
                    openOrToggleDock();
                    return;
                }
                if (cmd === 'session.kill.current') {
                    if (currentActive) killSession(currentActive);
                    return;
                }
                if (cmd === 'session.rename.current') {
                    if (currentActive) renameSession(currentActive);
                    return;
                }
                if (cmd === 'gallery.open' || cmd === 'terminal.paste') {
                    // These live in the terminal document — forward down.
                    if (currentActive && frameEl.contentWindow) {
                        try {
                            frameEl.contentWindow.postMessage(
                                { type: 'tl-command', command: cmd }, location.origin);
                        } catch (e) {}
                    } else {
                        showToast('Open a session first', 'error', 2500);
                    }
                    return;
                }
            }

            // Alt-held session-jump badges: numbered chips on the first
            // nine cards after Alt has been down 100 ms (plan spec), from
            // EITHER document — the iframe forwards its own tracker over
            // tl-kb-alt, since its keydowns never reach this window.
            let lobbyAltDown = false, frameAltDown = false;
            let altBadgeTimer = null, altBadgesOn = false;
            function applyAltBadges() {
                listEl.querySelectorAll('.kb-badge').forEach(el => el.remove());
                if (!altBadgesOn) return;
                Array.from(listEl.querySelectorAll('.session-card'))
                    .slice(0, 9)
                    .forEach((card, i) => {
                        const b = document.createElement('span');
                        b.className = 'kb-badge';
                        b.textContent = String(i + 1);
                        b.setAttribute('aria-hidden', 'true');
                        card.appendChild(b);
                    });
            }
            function syncAltBadges() {
                const want = tlKb.enabled() && (lobbyAltDown || frameAltDown);
                if (want) {
                    if (altBadgesOn || altBadgeTimer) return;
                    altBadgeTimer = setTimeout(() => {
                        altBadgeTimer = null;
                        if (tlKb.enabled() && (lobbyAltDown || frameAltDown)) {
                            altBadgesOn = true;
                            applyAltBadges();
                        }
                    }, 100);
                } else {
                    clearTimeout(altBadgeTimer);
                    altBadgeTimer = null;
                    if (altBadgesOn) { altBadgesOn = false; applyAltBadges(); }
                }
            }
            // An iframe swap mid-hold loses the keyup — reset its half.
            frameEl.addEventListener('load', () => { frameAltDown = false; syncAltBadges(); });

            // Commands + Alt state forwarded up by the terminal iframe.
            // Same trust model as tl-attention: only OUR iframe's window.
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data) return;
                const fromTop  = e.source === frameEl.contentWindow;
                const fromDock = e.source === dockFrameEl.contentWindow;
                if (!fromTop && !fromDock) return;
                if (e.data.type === 'tl-terminal-ready') {
                    // The incoming terminal painted its first frame — lift the
                    // session-swap cover (anti-flicker). Top pane only.
                    if (fromTop) hideFrameCover();
                } else if (e.data.type === 'tl-command') {
                    // Commands from EITHER terminal drive the lobby — e.g. Ctrl+J
                    // pressed inside the dock toggles the panel.
                    if (typeof e.data.command === 'string') runAppCommand(e.data.command);
                } else if (fromTop && e.data.type === 'tl-gesture') {
                    // Task M.6: touch affordances forwarded up by the
                    // terminal iframe — the ‹/› soft keys and the Android
                    // 3-finger swipe. Only cycle-session exists; dir is
                    // validated to ±1 (origin + source checked above —
                    // strictly stronger than the tl-theme-ack pattern this
                    // listener mirrors).
                    if (e.data.gesture === 'cycle-session' &&

                        cycleSession(e.data.dir, true);
                    }

                } else if (e.data.type === 'tl-build-stale') {

                    // heal and handed the reload up: the top owns the single
                    // reload (it replaces the iframe too).
                    requestTopReload('terminal signal');
                }
            });

                // Keydowns landing in THIS window are never terminal input
                // (the iframe is a separate document), and the gallery only
                // exists inside the terminal document.
                getContext: () => ({ terminalFocus: false, lobbyOpen: true, galleryOpen: false }),
                runCommand: runAppCommand,
                onAltChange: (down) => { lobbyAltDown = down; syncAltBadges(); }
            });

            // Drops on the terminal are handled inside the iframe. If one lands
            // on the lobby chrome (sidebar) instead, suppress the browser's
            // default file-open and forward the files to the active session's
            // iframe (it uploads them and types the paths in). preventDefault is
            // unconditional — gating it caused Chrome to open the file instead.
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
                if (!files.length) return;
                if (currentActive && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ type: 'tl-drop-files', files }, location.origin);
                    showToast('Sent ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' to ' + currentActive, 'success', 3000);
                } else {
                    showToast('Open a session first, then drop files', 'error', 3500);
                }
            });

            // ---- deploy detection: the lobby's stale-page healer --------
            // The lobby has no WebSocket to drop, so it polls its own served
            // bytes: re-hash the page (conditional GET — cache:'no-cache'
            // revalidates against ttyd's strong ETag, so an unchanged page is
            // a bodyless 304) and, on a real change, route to requestTopReload
            // (reusing the fetchSelf/reloadIfStale hoisted above the split).
            // This hash check is the ONLY deploy channel, so the cadence is a
            // short 5 s to meet the "picked up within seconds" bar; the 304
            // keeps that cheap. Skipped while hidden (the visibility/pageshow
            // resume hooks re-check on return). Detection runs even while
            // typing — the defer lives in requestTopReload (it raises the
            // toast instead of reloading), so a typing user still learns an
            // update is ready.
            const TL_SELF_CHECK_MS = 5000;
            function lobbySelfCheck() {
                if (document.hidden) return;
                reloadIfStale('no-cache');
            }
            armBaseline('boot', 'no-cache');
            setInterval(lobbySelfCheck, TL_SELF_CHECK_MS);

            renderLobby();
            setInterval(renderLobby, 5000);

            const initialHash = location.hash.slice(1);
            if (initialHash && NAME_RE.test(initialHash)) {
                activateSession(initialHash);
            } else if (!initialHash && isCoarsePointer && getPrefs().session.reopenLast) {
                // Task MF-5 (complaint 1: "side swipe opens all sessions").
                // The iOS edge-back-swipe traverses to the pre-app
                // (Authentik) history entry, which redirects back to '/'
                // WITHOUT the #session hash — so the lobby booted onto the
                // full list. The gesture itself can't be removed; fix the
                // LANDING: reattach the session this device last had open
                // (also fixes cold PWA relaunch at start_url '/').
                // BOOT-ONLY by design — never wired to hashchange: the
                // hashchange→deactivateSession path stays the explicit
                // in-app detach, and deactivateSession clears the marker,
                // so a user who chose the list keeps the list. Reattach
                // rides activateSession's existing history.replaceState —
                // history stays flat. REJECTED (audit): a pushState
                // sentinel to absorb the swipe — it would re-arm the very
                // gesture the M.3 flat-history work disarmed.
                let last = null;
                try { last = localStorage.getItem(LAST_ACTIVE_KEY); } catch (e) {}
                if (last && NAME_RE.test(last)) {
                    fetch(SESSIONS_API, { credentials: 'same-origin' })
                        .then(r => r.ok ? r.json()
                                        : Promise.reject(new Error('HTTP ' + r.status)))
                        .then(list => {
                            if (currentActive) return; // user already picked a card during the fetch
                            if (list.some(s => s.name === last)) activateSession(last);

                        })

        }

        // ============================================================
        // TERMINAL MODE — valid ?arg=<session>, attach via ttyd
        // ============================================================

        // ttyd binary protocol (server → client: '0' OUTPUT,
        // '1' SET_WINDOW_TITLE, '2' SET_PREFERENCES)
        const MSG_OUTPUT    = 0x30; // '0' - terminal output
        const MSG_SET_TITLE = 0x31; // '1' - window title
        const MSG_SET_PREFS = 0x32; // '2' - JSON preferences
        const MSG_INPUT     = '0';  // client → server: input data
        const MSG_RESIZE    = '1';  // client → server: {columns, rows}

        // --- Task 3.5 (P20): client → server WS flow control ----------
        // Port of stock ttyd's writeData accounting (upstream
        // html/src/components/terminal/xterm/index.ts): every FLOW_LIMIT
        // bytes written to xterm, register a term.write completion
        // callback and count it pending; pending > FLOW_HIGH → send the
        // 1-byte PAUSE frame ('2'/0x32), a callback dropping pending
        // below FLOW_LOW → RESUME ('3'/0x33). The patched ttyd
        // (devvm/ttyd-local.patch, Task 3.4) actually stops reading the
        // pty on PAUSE, so a slow tab backpressures tmux instead of
        // ballooning xterm's write buffer unboundedly.
        //
        // Fail-OPEN by design (challenge round: fail-closed = a frozen
        // terminal for a real user):
        //  (a) watchdog — while paused, if NO write callback fires for
        //      4s, force RESUME + reset counters + console.warn;
        //  (b) kill-switch — tl-flow-control='off' (settings-panel
        //      toggle) bypasses the whole branch: plain term.write,
        //      byte-identical to the pre-3.5 path;
        //  (c) onopen resets every counter, and each completion callback
        //      captures ITS socket: a stale callback must never RESUME
        //      (or miscount) a newer connection.
        const FLOW_LIMIT = 100000;      // bytes between counted callbacks
        const FLOW_HIGH  = 10;          // pending > high  → PAUSE
        const FLOW_LOW   = 4;           // pending < low   → RESUME
        const FLOW_WATCHDOG_MS = 4000;
        const FLOW_PAUSE_FRAME  = Uint8Array.of(0x32).buffer;  // '2'
        const FLOW_RESUME_FRAME = Uint8Array.of(0x33).buffer;  // '3'
        let flowOn = flowControlWanted();
        let flowWritten = 0;     // bytes since the last counted callback
        let flowPending = 0;     // counted callbacks not yet completed
        let flowPaused  = false; // we told the server to stop reading
        let flowWatchdog = null;

        function flowReset() {
            clearTimeout(flowWatchdog);
            flowWatchdog = null;
            flowPaused = false;
            flowPending = 0;
            flowWritten = 0;
        }
        function flowForceResume(reason) {
            const wasPaused = flowPaused;
            flowReset();
            if (!wasPaused) return;
            console.warn('tl-flow: ' + reason + ' resume');
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(FLOW_RESUME_FRAME);
        }
        function flowArmWatchdog() {
            clearTimeout(flowWatchdog);
            flowWatchdog = setTimeout(() => {
                flowWatchdog = null;
                flowForceResume('watchdog');
            }, FLOW_WATCHDOG_MS);
        }
        function writeData(data) {
            flowWritten += data.length;
            if (flowWritten <= FLOW_LIMIT) { term.write(data); return; }
            // Boundary crossed: this chunk carries a counted callback.
            const sock = ws;    // stale-callback guard (see (c) above)
            term.write(data, () => {
                if (sock !== ws) return;  // counters belong to a newer conn
                flowPending = Math.max(flowPending - 1, 0);
                if (!flowOn) return;      // kill-switch flipped mid-flight
                if (flowPending < FLOW_LOW) {
                    if (flowPaused) {
                        flowPaused = false;
                        clearTimeout(flowWatchdog);
                        flowWatchdog = null;
                    }
                    if (sock.readyState === WebSocket.OPEN) sock.send(FLOW_RESUME_FRAME);
                } else if (flowPaused) {
                    flowArmWatchdog();    // progress while paused: feed the timer
                }
            });
            flowPending++;
            flowWritten = 0;
            if (flowPending > FLOW_HIGH && sock.readyState === WebSocket.OPEN) {
                sock.send(FLOW_PAUSE_FRAME);
                if (!flowPaused) {
                    flowPaused = true;
                    flowArmWatchdog();
                }
            }
        }
        // Kill-switch flips live from the lobby's settings panel (the
        // storage event fires in this iframe because ANOTHER window wrote
        // the key). Turning it off while paused must release the server.
        window.addEventListener('storage', (e) => {
            if (e.key !== FLOW_KILL_KEY) return;
            flowOn = flowControlWanted();
            if (!flowOn) flowForceResume('kill-switch');
        });

        let ws = null;
        let hasConnectedOnce = false;
        // Armed per connection: the page's initial size reaches ttyd via
        // the JSON handshake, which carries NO pixel fields, and ttyd drops
        // RESIZE messages that arrive before the process is spawned — so
        // the pty's pixel size (which tmux needs for sixel) only starts
        // flowing once we push one explicit resize after the process
        // provably exists. See the MSG_OUTPUT handler.
        let needsPixelResizeKick = false;
        const textEncoder = new TextEncoder();
        const textDecoder = new TextDecoder();

        // Fonts-ready boot gate: give the JetBrains Mono webfont up to 2s to
        // arrive before xterm measures cell metrics — measuring an OS fallback
        // first bakes wrong glyph metrics into the renderer until a refit.
        // Race-capped so a dead CDN can never hold the terminal hostage; the
        // loadingdone listener below repairs the late-arrival case.
        try {
            await Promise.race([
                document.fonts.load('15px "JetBrains Mono"'),
                new Promise(r => setTimeout(r, 2000))
            ]);
        } catch (e) { /* face unavailable → OS mono fallback, still functional */ }

        // Boot values for the user-tunable options (Task 2.6): validated
        // tl:prefs:v1 (roamed via /prefs), every field defaulting to the
        // historical constructor value when unset. fontSize keeps riding
        // the Task 1.8 key underneath.
        const bootPrefs = getPrefs();
        const term = new Terminal({
            cursorBlink: bootPrefs.cursorBlink,
            cursorStyle: bootPrefs.cursorStyle,
            fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
            // User-steppable via A−/A+ (Task 1.8): persisted in
            // tl-font-size, clamped 10-22, default 15 (the historical
            // hardcoded value).
            fontSize: bootPrefs.fontSize,
            lineHeight: bootPrefs.lineHeight,
            letterSpacing: bootPrefs.letterSpacing,
            // Pin both weights to the vendored JetBrains Mono faces so
            // browsers never synthesize a faux bold — or substitute a
            // different family for it — now that real webfonts are in
            // play. Bold weight is user-selectable 600/700 (plan spec);
            // NOTE with only the 400/700 faces vendored, CSS matching
            // resolves 600 upward to the Bold face — the choice only
            // renders differently on fallback stacks (or once a SemiBold
            // face is vendored). It still roams like every other pref.
            fontWeight: '400',
            fontWeightBold: bootPrefs.fontWeightBold,
            theme: readTerminalTheme(),
            // Nudge foreground colors toward WCAG AA (4.5:1) against each
            // cell's background — VS Code's default. xterm excludes box/block
            // glyphs from the adjustment (TUI borders keep exact theme colors)
            // and holds \e[2m dim text to half-ratio, so dim stays visibly
            // dim while low-contrast pairs (e.g. dark-tuned ANSI colors on
            // the light ink theme) become readable.
            minimumContrastRatio: 4.5,
            // Unfocused terminal renders a hollow outline cursor instead of
            // a solid block — the standard "keystrokes go elsewhere" cue.
            cursorInactiveStyle: 'outline',
            // Mac leg of the plain-drag selection reclaim (mousedown
            // interceptor below term.open): the synthetic clones carry
            // altKey, and only this option makes xterm treat Option-clicks
            // as force-selection — without it they leak to the app as
            // Alt-clicks. Must be set in the constructor.
            macOptionClickForcesSelection: true,
            // Off: with it on (xterm default), a real Option-drag's RELEASE
            // moves the cursor via arrow-key spam into the app and clears
            // the just-made selection (reproduced on the Mac path). We never
            // want click-to-move-cursor in tmux/Claude panes.
            altClickMovesCursor: false,
            // tmux attaches on the ALTERNATE screen, so xterm's scrollback
            // holds nothing while attached: Shift+scroll/drag never reaches
            // history, selection is limited to the visible frame, and deep
            // history is tmux copy-mode's job. This buffer is inert under
            // tmux's alt screen — it only matters if alternate-screen were
            // ever disabled.
            scrollback: 10000,
            // OSC 8 explicit hyperlinks ([links] leg c): the full URI
            // rides the escape sequence, immune to visual wrapping.
            // devvm/tmux.conf.system lets OSC 8 through for xterm*
            // clients (tmux 3.4 strips it otherwise), and WITHOUT this
            // handler xterm core's OscLinkProvider falls back to a scary
            // confirm() dialog on click — so this must ship with (or
            // before) the tmux enablement. Activation mirrors the
            // web-links addon byte-for-byte via the shared
            // openDetectedLink; hover shows the copy chip, whose title
            // reveals the TARGET (visible text can differ — the
            // anti-phishing affordance). allowNonHttpProtocols stays
            // unset: xterm then ignores non-http(s) URIs (file:,
            // javascript:, …) — deliberate.
            linkHandler: {
                activate: (e, uri) => openDetectedLink(e, uri),
                hover: (e, uri, range) => linkChip.show(uri, range),
                leave: () => linkChip.scheduleHide()
            },
            allowProposedApi: true
        });

        // ---- Wrapped-URL link detection ([links] fix) -----------------
        // tmux redraws TUI-repainted rows — above all Claude Code's ink
        // output — as INDEPENDENT lines: a long URL arrives hard-split at
        // the pane edge with the continuation on its own written row, so
        // xterm's isWrapped stays false at the seam and the stock
        // web-links addon saw only the row-1 fragment (click opened a
        // truncated, invalid target; the continuation row was dead).
        // Naturally-streamed shell output is NOT affected — tmux re-flows
        // lines it knows are wrapped, isWrapped arrives true, and the
        // addon already joins those. Fix: a custom link provider that
        // reproduces the addon's detection verbatim (regex, URL gate,
        // native-wrap windowing, activation) and ADDS a bounded join
        // heuristic at seams the buffer does not mark wrapped. Registered
        // BEFORE the web-links addon — xterm's Linkifier gives the
        // first-registered provider priority wherever both match (core's
        // OSC 8 provider stays ranked above both) — with the addon kept
        // loaded as a pure fallback. Detection-quality only: activation
        // stays plain-click (mouseup on the same link the mousedown
        // started on, exactly the addon's semantics); the selection/copy
        // machinery is untouched (red line).

        // Verbatim from @xterm/addon-web-links 0.12.0 (MIT, (c) 2019 The
        // xterm.js authors; regex unchanged from 0.11.0, re-verified byte-
        // identical at the 6.0 bump) — regex and URL gate must stay byte-identical
        // so detection semantics never drift from stock.
        const TL_URL_REGEX = /(https?|HTTPS?):[/]{2}[^\s"'!*(){}|\\\^<>`]*[^\s"':,.!?{}|\\\^~\[\]`()<>]/;
        function tlIsUrl(urlString) {
            try {
                const url = new URL(urlString);
                const parsedBase = url.password && url.username
                    ? url.protocol + '//' + url.username + ':' + url.password + '@' + url.host
                    : url.username
                        ? url.protocol + '//' + url.username + '@' + url.host
                        : url.protocol + '//' + url.host;
                return urlString.toLocaleLowerCase().startsWith(parsedBase.toLocaleLowerCase());
            } catch (e) {
                return false;
            }
        }
        // Parity clone of the addon's default handleLink — shared by the
        // join provider, the fallback addon and the OSC 8 linkHandler so
        // every link class opens identically (plain unmodified click,
        // window.open with the opener nulled).
        function openDetectedLink(event, uri) {
            const newWindow = window.open();
            if (newWindow) {
                try { newWindow.opener = null; } catch (e) { /* no-op */ }
                newWindow.location.href = uri;
            } else {
                console.warn('Opening link blocked as opener could not be cleared');
            }
        }
        function makeTmuxJoinLinkProvider(terminal) {
            // A row seam the buffer does NOT mark wrapped joins when it
            // looks like a TUI hard split: the upper row's content —
            // JS-rtrimmed, because WRITTEN pad spaces count as content in
            // translateToString(true) — reaches within EDGE_SLACK cells of
            // the right edge, both seam-adjacent chars are URL-plausible
            // ASCII, and the lower row starts with at most MAX_INDENT
            // spaces (Claude Code indents continuations by 2). The char
            // class is deliberately ASCII-only RFC 3986 vocabulary: CC's
            // '⏺'/'⎿' transcript prefixes and TUI box glyphs must fail it
            // so adjacent transcript lines never join (the addon regex's
            // negated body class would admit them). Native isWrapped
            // joins keep stock's exact gates, budgets and raw strings
            // (_getWindowedLineStrings parity).
            const EDGE_SLACK = 2;
            const MAX_INDENT = 8;
            const MAX_WINDOW_ROWS = 8;   // heuristic windows: total row cap
            const MAX_LEN = 2048;        // stock's char budget, shared
            const BOUNDARY = /[A-Za-z0-9\-._~:\/?#\[\]@!$&'*+,;=%()]/;
            const LEAD_SPACES = /^ */;
            const TRAIL_SPACES = / +$/;

            // Heuristic seam test (upper row flows into lower row). Texts
            // are the CURRENT segment strings — earlier trims never touch
            // the seam-adjacent chars this inspects; upperLead keeps the
            // right-edge test a true CELL position for trimmed segments.
            function seamJoins(upperText, upperLead, lowerText) {
                const u = upperText.replace(TRAIL_SPACES, '');
                if (!u || upperLead + u.length < terminal.cols - EDGE_SLACK) return false;
                const lead = LEAD_SPACES.exec(lowerText)[0].length;
                if (lead > MAX_INDENT) return false;
                const l = lowerText.slice(lead);
                if (!l) return false;
                return BOUNDARY.test(u[u.length - 1]) && BOUNDARY.test(l[0]);
            }

            // Joined window around 0-based buffer row L. Segments
            // {y, lead, text}: lead = spaces a heuristic join stripped off
            // the row start (spaces are width-1 single-char cells, so lead
            // chars == lead cells for the cell walk); text = the exact
            // chars the regex runs over for that row.
            function buildWindow(L) {
                const buf = terminal.buffer.active;
                const originLine = buf.getLine(L);
                if (!originLine) return null;
                const originRaw = originLine.translateToString(true);
                const segs = [{ y: L, lead: 0, text: originRaw }];
                let totalLen = originRaw.length;

                // -- upward. Native ascent gates exactly like stock:
                // engage only when the lower row isWrapped (and, at the
                // origin, doesn't start with a space); push raw rows until
                // an unwrapped head or a row containing a space (stock's
                // sufficient-window stops) under stock's separate top
                // budget. Wherever the native branch is off, try one
                // heuristic join; a joined row re-arms the native rules
                // for the seam above it (mixed chains).
                let nativeUp = originLine.isWrapped && originRaw.charAt(0) !== ' ';
                let upAcc = 0;
                while (segs[0].y > 0) {
                    const top = segs[0];
                    const aboveLine = buf.getLine(top.y - 1);
                    if (!aboveLine) break;
                    const aboveRaw = aboveLine.translateToString(true);
                    if (nativeUp && upAcc < MAX_LEN) {
                        upAcc += aboveRaw.length;
                        totalLen += aboveRaw.length;
                        segs.unshift({ y: top.y - 1, lead: 0, text: aboveRaw });
                        nativeUp = aboveLine.isWrapped && aboveRaw.indexOf(' ') === -1;
                        continue;
                    }
                    if (segs.length >= MAX_WINDOW_ROWS || totalLen >= MAX_LEN) break;
                    if (!seamJoins(aboveRaw, 0, top.text)) break;
                    const lead = LEAD_SPACES.exec(top.text)[0].length;
                    top.lead += lead;
                    top.text = top.text.slice(lead);
                    totalLen -= lead;
                    const aboveTrimmed = aboveRaw.replace(TRAIL_SPACES, '');
                    upAcc += aboveTrimmed.length;
                    totalLen += aboveTrimmed.length;
                    segs.unshift({ y: top.y - 1, lead: 0, text: aboveTrimmed });
                    nativeUp = aboveLine.isWrapped && aboveTrimmed.indexOf(' ') === -1;
                }

                // -- downward. Stock: descend while the next line
                // isWrapped, unconditionally from the origin, then only
                // past pushed rows containing no space; heuristic seams
                // extend where the buffer flag is absent.
                let nativeDown = true;
                let downAcc = 0;
                while (true) {
                    const bottom = segs[segs.length - 1];
                    const belowLine = buf.getLine(bottom.y + 1);
                    if (!belowLine) break;
                    const belowRaw = belowLine.translateToString(true);
                    if (nativeDown && belowLine.isWrapped && downAcc < MAX_LEN) {
                        downAcc += belowRaw.length;
                        totalLen += belowRaw.length;
                        segs.push({ y: bottom.y + 1, lead: 0, text: belowRaw });
                        nativeDown = belowRaw.indexOf(' ') === -1;
                        continue;
                    }
                    if (segs.length >= MAX_WINDOW_ROWS || totalLen >= MAX_LEN) break;
                    if (!seamJoins(bottom.text, bottom.lead, belowRaw)) break;
                    const upperTrimmed = bottom.text.replace(TRAIL_SPACES, '');
                    totalLen -= (bottom.text.length - upperTrimmed.length);
                    bottom.text = upperTrimmed;
                    const lead = LEAD_SPACES.exec(belowRaw)[0].length;
                    const belowText = belowRaw.slice(lead);
                    downAcc += belowText.length;
                    totalLen += belowText.length;
                    segs.push({ y: bottom.y + 1, lead: lead, text: belowText });
                    nativeDown = belowText.indexOf(' ') === -1;
                }
                return segs;
            }

            // Map a char index in the joined string to its buffer cell.
            // Per-segment cell walk (stock's _mapStrIdx accounting: width-0
            // wide-char tails skipped, each width>0 cell consumes
            // chars.length||1) — segments never overrun their row, so
            // stock's early-wrapped-wide-char correction is unnecessary by
            // construction. Returns 0-based {y, x, w} of the char's cell.
            function mapCharToCell(buf, segs, gIdx, cell) {
                let acc = 0;
                for (let s = 0; s < segs.length; s++) {
                    const seg = segs[s];
                    if (gIdx >= acc + seg.text.length) { acc += seg.text.length; continue; }
                    const local = gIdx - acc;
                    const line = buf.getLine(seg.y);
                    if (!line) return null;
                    let consumed = 0;
                    for (let i = seg.lead; i < line.length; i++) {
                        line.getCell(i, cell);
                        const width = cell.getWidth();
                        if (!width) continue;
                        consumed += cell.getChars().length || 1;
                        if (consumed > local) return { y: seg.y, x: i, w: width };
                    }
                    return null;
                }
                return null;
            }

            return {
                provideLinks(y, callback) {
                    const buf = terminal.buffer.active;
                    const segs = buildWindow(y - 1);
                    if (!segs) { callback(undefined); return; }
                    const joined = segs.map(s => s.text).join('');
                    const rex = new RegExp(TL_URL_REGEX.source, (TL_URL_REGEX.flags || '') + 'g');
                    const cell = buf.getNullCell();
                    const links = [];
                    let match;
                    while ((match = rex.exec(joined)) !== null) {
                        const text = match[0];
                        if (!tlIsUrl(text)) continue;
                        const start = mapCharToCell(buf, segs, match.index, cell);
                        const end = mapCharToCell(buf, segs, match.index + text.length - 1, cell);
                        if (!start || !end) continue;
                        // 1-based, end-inclusive — the exact shape stock
                        // emits (its end lands on the cell after the last
                        // char, x deliberately un-bumped).
                        const range = {
                            start: { x: start.x + 1, y: start.y + 1 },
                            end: { x: end.x + end.w, y: end.y + 1 }
                        };
                        links.push({
                            range: range,
                            text: text,
                            activate: openDetectedLink,
                            // Additive ([links] chip): surface the copy
                            // affordance on hover; underline/pointer
                            // decorations stay stock.
                            hover: (e, uri) => linkChip.show(uri, range),
                            leave: () => linkChip.scheduleHide()
                        });
                    }
                    callback(links);
                }
            };
        }

        const fitAddon = new FitAddon.FitAddon();
        // Fallback for positions the join provider yields nothing at —
        // constructed with the SAME shared handler and chip hooks, so
        // where only the addon matches, behavior degrades to exactly
        // today's opening semantics with the same copy affordance.
        const webLinksAddon = new WebLinksAddon.WebLinksAddon(openDetectedLink, {
            hover: (e, uri, range) => linkChip.show(uri, range),
            leave: () => linkChip.scheduleHide()
        });
        term.loadAddon(fitAddon);
        // Priority is registration order in xterm's Linkifier: the join
        // provider must outrank the addon's, so register it BEFORE
        // loadAddon(webLinksAddon) (which registers its provider inside
        // activate()). Registration is a rendering/decoration API — not a
        // listener on any terminal input path.
        term.registerLinkProvider(makeTmuxJoinLinkProvider(term));
        term.loadAddon(webLinksAddon);

        // ---- '⧉ Copy link' hover chip ([links] fix, additive) ---------
        // Hovering a detected link shows one small body-level button that
        // copies the FULL resolved target — the reliable copy affordance
        // for URLs that visually wrap (drag-copy across a TUI hard split
        // yields indent + injected newline + padding BY DESIGN: selection
        // semantics are red-line frozen). Body-level placement is the
        // red-line-clean choice: the document-capture mousedown
        // interceptor and the A.1 motion swallow key off .xterm-screen
        // containment, and the Linkifier listens on .xterm, so chip
        // events never touch a terminal input path. Gated on the roamed
        // links.copyChip pref, hover-capable pointers (touch copy stays
        // Sel/Mark/Yank + /capture -J), and the absence of a selection
        // (also closes the theoretical A.1 interaction where a trusted
        // move over the chip would bypass the motion swallow). Its title
        // carries the target URI — the hover reveal for an OSC 8 link
        // whose visible text differs from where it points. Known bounded
        // nuance: a wheel tick exactly over the ~90×24px chip targets the
        // chip (hides it) instead of scrolling that tick — transient by
        // design, NO re-dispatch (that would touch wheel semantics).
        const linkChip = (() => {
            let el = null;
            let hideTimer = null;
            let uri = '';
            function ensure() {
                if (el) return el;
                el = document.createElement('button');
                el.type = 'button';
                el.id = 'link-chip';
                // Icon fix: ⧉ (U+29C9) was the set's highest tofu risk —
                // a rare math glyph no bundled font covers.
                el.replaceChildren(iconNode('copy', 14),
                    document.createTextNode(' Copy link'));
                el.hidden = true;
                // Keep xterm focused: swallow the focus-stealing mousedown
                // but let the click through (same trick as #img-preview).
                el.addEventListener('mousedown', (e) => e.preventDefault());
                el.addEventListener('pointerenter', () => { clearTimeout(hideTimer); hideTimer = null; });
                el.addEventListener('pointerleave', scheduleHide);
                el.addEventListener('click', () => {
                    const u = uri;
                    navigator.clipboard.writeText(u).then(() => {
                        showToast('Link copied', 'success', 1500);
                    }).catch(() => {
                        showToast('Copy failed — clipboard unavailable', 'error', 3000);
                    });
                    tel('link-copy', { len: u.length });
                    hideNow();
                });
                document.body.appendChild(el);
                return el;
            }
            function hideNow() {
                clearTimeout(hideTimer); hideTimer = null;
                if (el) el.hidden = true;
            }
            // 300 ms grace after leaving the link so the pointer can
            // travel onto the chip; entering the chip cancels it.
            function scheduleHide() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(hideNow, 300);
            }
            function show(linkUri, range) {
                if (!getPrefs().links.copyChip) return;
                if (!matchMedia('(hover: hover)').matches) return;
                if (term.hasSelection()) return;
                const scr = document.querySelector('.xterm-screen');
                if (!scr) return;
                const rect = scr.getBoundingClientRect();
                const cellW = rect.width / term.cols;
                const cellH = rect.height / term.rows;
                // range y is 1-based ABSOLUTE buffer coords (both the join
                // provider's and xterm's OSC 8 ranges).
                const vRow = range.start.y - 1 - term.buffer.active.viewportY;
                if (vRow < 0 || vRow >= term.rows) return;
                const c = ensure();
                uri = linkUri;
                c.title = linkUri;
                clearTimeout(hideTimer); hideTimer = null;
                c.hidden = false;              // unhide first: offset* need layout
                const left = rect.left + (range.start.x - 1) * cellW;
                let top = rect.top + vRow * cellH - c.offsetHeight - 4;
                if (top < 4) {
                    // No room above → flip below the link's LAST row (a
                    // joined link spans rows; parking below the FIRST row
                    // would sit the chip on the continuation row and
                    // steal clicks meant for the link itself).
                    const endVRow = Math.min(
                        range.end.y - 1 - term.buffer.active.viewportY,
                        term.rows - 1);
                    top = rect.top + (endVRow + 1) * cellH + 4;
                }
                c.style.left = Math.max(4, Math.min(left, window.innerWidth - c.offsetWidth - 4)) + 'px';
                c.style.top = Math.min(top, window.innerHeight - c.offsetHeight - 4) + 'px';
            }
            // Immediate dismissals — all passive observers; none touch the
            // machinery they watch: wheel anywhere (capture + passive, the
            // same shape as the telemetry listener), Escape, a selection
            // appearing, window blur.
            window.addEventListener('wheel', hideNow, { capture: true, passive: true });
            window.addEventListener('blur', hideNow);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideNow(); }, true);
            term.onSelectionChange(() => { if (term.hasSelection()) hideNow(); });
            return { show: show, scheduleHide: scheduleHide, hideNow: hideNow };
        })();

        try {
            const webglAddon = new WebglAddon.WebglAddon();
            webglAddon.onContextLoss(() => { webglAddon.dispose(); });
            term.loadAddon(webglAddon);
        } catch (e) {
            console.warn('WebGL addon failed:', e);
        }

        // OSC 52 clipboard: lets tmux's own copy (with `set-clipboard on`) and
        // any program write straight to the OS clipboard. NOTE on UMD shape:
        // addon-clipboard@0.2.0 normalized its export to the namespaced
        // `ClipboardAddon.ClipboardAddon` form (fit/webgl style); the old
        // 0.1.0 build exposed the class as the global `ClipboardAddon`
        // directly. Accept BOTH shapes so the accessor is version-proof.
        // Wrapped so a load hiccup can't break the terminal.
        try {
            const ClipAddon = (typeof ClipboardAddon !== 'undefined')
                && (ClipboardAddon.ClipboardAddon || ClipboardAddon);
            if (ClipAddon) {
                // Custom provider instead of the addon's default, for two
                // verified reasons:
                //   - tmux 3.4 emits OSC 52 with an EMPTY selection field
                //     (\x1b]52;;<base64>), and the default provider drops any
                //     selection that isn't exactly 'c' — so tmux copy-mode
                //     copies never reached the browser clipboard. Accept ''
                //     and 'c'.
                //   - readText deliberately refuses: answering OSC 52 '?'
                //     queries would let any program running in the PTY read
                //     the user's clipboard.
                const osc52Provider = {
                    readText: () => Promise.resolve(''),
                    writeText: (selection, text) =>
                        selection === '' || selection === 'c'
                            ? navigator.clipboard.writeText(text)
                                  .then(() => showToast('Copied', 'success', 1500))
                                  .catch(() => {})
                            : Promise.resolve()
                };
                term.loadAddon(new ClipAddon(undefined, osc52Provider));
                console.log('clipboard addon (OSC 52) loaded');
            } else {
                console.warn('ClipboardAddon global not found');
            }
        } catch (e) {
            console.warn('Clipboard addon failed:', e);
        }

        // Inline images: renders sixel (and iTerm IIP) sequences on the
        // canvas — viu, img2sixel, matplotlib backends, anything that
        // emits sixel. Loading it also amends the terminal's DA1 response
        // so tmux and the apps inside it auto-detect sixel support, and
        // answers CSI 14t/16t pixel-size reports. Default options are
        // fine. Same UMD shape caveat as the clipboard addon — accept
        // both `ImageAddon` and `ImageAddon.ImageAddon`; wrapped so a
        // load hiccup can't break the terminal.
        try {
            const ImgAddon = (typeof ImageAddon !== 'undefined')
                && (ImageAddon.ImageAddon || ImageAddon);
            if (ImgAddon) {
                term.loadAddon(new ImgAddon());
                console.log('image addon (sixel) loaded');
            } else {
                console.warn('ImageAddon global not found');
            }
        } catch (e) {
            console.warn('Image addon failed:', e);
        }

        // Unicode 11 width tables: xterm's built-in tables are Unicode 6,
        // which counts most emoji as width 1 while tmux measures them as 2
        // — everything after an emoji then drifts one cell (misaligned
        // `├──` trees under Claude Code's emoji output). Version 11 matches
        // tmux's wcwidth. Activated before open() so the first frame is
        // already measured with the right tables. Same UMD shape caveat as
        // the clipboard addon — accept both `Unicode11Addon` and
        // `Unicode11Addon.Unicode11Addon`; wrapped so a load hiccup can't
        // break the terminal (falls back to the built-in version 6).
        try {
            const U11Addon = (typeof Unicode11Addon !== 'undefined')
                && (Unicode11Addon.Unicode11Addon || Unicode11Addon);
            if (U11Addon) {
                term.loadAddon(new U11Addon());
                term.unicode.activeVersion = '11';
                console.log('unicode11 addon loaded (active version ' + term.unicode.activeVersion + ')');
            } else {
                console.warn('Unicode11Addon global not found');
            }
        } catch (e) {
            console.warn('Unicode11 addon failed:', e);
        }

        // Item 3(a): on coarse pointers, reserve the 50px soft-key strip
        // BEFORE the first fit so xterm's initial cell/row measurement
        // already matches the settled post-toolbar geometry. Without it
        // the first fit sizes to full height, then the has-soft-keys add
        // during the toolbar build (later in boot) shrinks #terminal and
        // the seed fit re-measures — a visible layout shift on phones.
        // isCoarsePointer isn't declared until the mobile block below, so
        // probe matchMedia here; the later add is idempotent.
        if (matchMedia('(pointer: coarse)').matches) {
            document.body.classList.add('has-soft-keys');
        }

        // Item 3(b): opacity-hold. Keep the #terminal CONTAINER (never the
        // WebGL canvas) hidden until boot has BOTH fit to final geometry
        // AND received the first WS output frame — so phones never flash a
        // wrong-sized grid that then reflows. Inline opacity is the same
        // channel maskFitBurst uses; the 80ms CSS transition on #terminal
        // fades it in. A hard cap from open guarantees the reveal even if
        // the socket never delivers a frame (a dead network must never
        // leave the terminal blank forever).
        const bootTermContainer = document.getElementById('terminal');
        bootTermContainer.style.opacity = '0';
        term.open(bootTermContainer);
        fitAddon.fit();
        // Nothing else focuses the terminal on load — without this,
        // keystrokes on desktop are dead until the user clicks.
        term.focus();

        let booted = false;          // set at the boot-end fit (Items 3b/3c)
        let firstFrameSeen = false;  // first WS output frame arrived (3b)
        let terminalRevealed = false;
        function revealTerminal() {
            if (terminalRevealed) return;
            terminalRevealed = true;
            clearTimeout(terminalRevealCap);
            bootTermContainer.style.opacity = '';   // 80ms CSS fade-in
            // Tell the parent lobby the terminal has painted so it can lift its
            // session-swap cover (anti-flicker). No-op when top-level (a
            // directly-opened terminal has no parent cover).
            if (window.parent !== window) {
                try { window.parent.postMessage({ type: 'tl-terminal-ready' }, location.origin); } catch (e) {}
            }
        }
        function maybeRevealTerminal() {
            if (booted && firstFrameSeen) revealTerminal();
        }
        const terminalRevealCap = setTimeout(revealTerminal, 1500);

        // Late-arriving faces (a CDN slower than the 2s boot gate; TL Symbols
        // below): refit and rebuild the WebGL glyph atlas so rendering uses
        // the real font, not whatever fallback got measured first.
        document.fonts.addEventListener('loadingdone', () => {
            // Item 3(c): only refit for late-arriving faces DURING boot.
            // After the boot-end fit the grid geometry is settled; an
            // unsolicited fit here just churns tmux (and, before the
            // opacity reveal, could fight the hold). The atlas rebuild
            // stays unconditional — a newly-loaded face must repaint.
            if (!booted) fitAddon.fit();
            term.clearTextureAtlas?.();
        });

        // Returning from OS sleep or a long-backgrounded tab can leave the
        // WebGL glyph atlas corrupted (GPU texture invalidated without a
        // context-loss event, so onContextLoss never fires). Rebuild it on
        // every return to visibility — near-free when nothing was lost.
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) term.clearTextureAtlas?.();
        });

        // ---- attention signals (Task 2.1) --------------------------------
        // This page normally renders inside the lobby's iframe, and the
        // TAB's favicon/title belong to the parent document — so attention
        // is signalled upward over the existing postMessage channel and the
        // lobby decides what to badge. Two signals, neither parses output:
        //   bell   — xterm's parser saw BEL (term.onBell);
        //   output — the fact THAT pty bytes arrived while the tab was
        //            hidden (latched once per hidden period, re-armed on
        //            return to visibility, so the hot output path pays one
        //            boolean check per chunk).
        // A direct top-level /?arg= tab has no lobby to tell: fall back to
        // prefixing its own title, cleared on return to visibility.
        const isFramed = window.parent !== window;
        let hiddenOutputSignaled = false;
        function signalAttention(kind) {
            if (isFramed) {
                try {
                    window.parent.postMessage(
                        { type: 'tl-attention', kind: kind, session: validArg },
                        location.origin);
                } catch (e) {}
            } else if (document.hidden && !document.title.startsWith('● ')) {
                document.title = '● ' + document.title;
            }
        }
        term.onBell(() => signalAttention('bell'));
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            hiddenOutputSignaled = false;
            if (!isFramed && document.title.startsWith('● ')) {
                document.title = document.title.slice(2);
            }
        });
