<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Terminal">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        /* Themes — set on <body> as theme-{carbon,slate,mono,ink}. Slate is the default. */
        body.theme-carbon {
            --bg-page: #0c0c0a;
            --bg-sidebar: #131311;
            --bg-card: #1a1916;
            --bg-card-hover: #22211d;
            --text-primary: #e8e3d6;
            --text-muted: #8a8474;
            --border: #2a2826;
            --border-strong: #3a3733;
            --accent: #d4a574;
            --danger: #c47a5a;
            --success: #88a888;
            --terminal-bg: #0c0c0a;
            --terminal-fg: #e8e3d6;
            --terminal-cursor: #d4a574;
            --terminal-selection: rgba(212,165,116,0.22);
        }
        body.theme-slate {
            --bg-page: #0d1117;
            --bg-sidebar: #11151c;
            --bg-card: #161b22;
            --bg-card-hover: #1c2128;
            --text-primary: #e6e8eb;
            --text-muted: #7d8590;
            --border: #1f242d;
            --border-strong: #30363d;
            --accent: #4493f8;
            --danger: #f47067;
            --success: #56d364;
            --terminal-bg: #0d1117;
            --terminal-fg: #e6e8eb;
            --terminal-cursor: #4493f8;
            --terminal-selection: rgba(68,147,248,0.22);
        }
        body.theme-mono {
            --bg-page: #0d0d0d;
            --bg-sidebar: #131313;
            --bg-card: #1a1a1a;
            --bg-card-hover: #232323;
            --text-primary: #e0e0e0;
            --text-muted: #7d7d7d;
            --border: #2a2a2a;
            --border-strong: #3a3a3a;
            --accent: #e8e8e8;
            --danger: #cc7070;
            --success: #9ccb9c;
            --terminal-bg: #0d0d0d;
            --terminal-fg: #e0e0e0;
            --terminal-cursor: #e8e8e8;
            --terminal-selection: rgba(255,255,255,0.18);
        }
        body.theme-ink {
            --bg-page: #faf7f2;
            --bg-sidebar: #f1ebda;
            --bg-card: #ffffff;
            --bg-card-hover: #f4eee0;
            --text-primary: #1d1b18;
            --text-muted: #6e6862;
            --border: #d8d2c4;
            --border-strong: #b8b0a0;
            --accent: #b5482d;
            --danger: #b5482d;
            --success: #3d6b3d;
            --terminal-bg: #faf7f2;
            --terminal-fg: #1d1b18;
            --terminal-cursor: #b5482d;
            --terminal-selection: rgba(181,72,45,0.18);
        }

        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: var(--bg-page, #0d1117);
            color: var(--text-primary, #e6e8eb);
            /* Suppress Chrome pull-to-refresh and iOS rubber-band scroll. */
            overscroll-behavior: none;
        }
        #terminal {
            height: 100%; width: 100%;
            /* Allow scroll + pinch-zoom (accessibility); kill double-tap zoom. */
            touch-action: pan-x pan-y pinch-zoom;
        }
        /* Use dynamic viewport height where supported so the terminal pane
           shrinks when the soft keyboard opens. Older browsers stick with 100%. */
        @supports (height: 100dvh) {
            html, body { height: 100dvh; }
        }
        .hidden { display: none !important; }
        #toast {
            position: fixed; top: 16px; right: 16px; z-index: 9999;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 18px; font-family: monospace;
            font-size: 14px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; max-width: 500px; word-break: break-all;
        }
        #toast.visible { opacity: 1; }
        #toast.error { color: var(--danger); border-color: var(--danger); }
        #toast.success { color: var(--success); border-color: var(--success); }
        #paste-btn, #img-btn {
            position: fixed;
            /* --kb-offset is updated from window.visualViewport on touch
               devices so floating elements lift above the soft keyboard. */
            bottom: calc(24px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            z-index: 9999;
            width: 48px; height: 48px; border-radius: 12px;
            background: color-mix(in srgb, var(--accent) 22%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
            color: var(--text-primary); font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        #paste-btn { right: calc(24px + env(safe-area-inset-right)); }
        #img-btn   { right: calc(80px + env(safe-area-inset-right)); }
        /* On touch devices the floating Paste/Img buttons would sit on top
           of the soft-key toolbar — lift them above it. */
        @media (pointer: coarse) {
            #paste-btn, #img-btn {
                bottom: calc(72px + var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            }
        }
        #paste-btn:hover, #img-btn:hover {
            background: color-mix(in srgb, var(--accent) 35%, transparent);
        }
        #paste-btn:active, #img-btn:active { transform: scale(0.92); }
        #img-input { display: none; }

        /* Lobby */
        #lobby {
            display: none; height: 100vh; box-sizing: border-box;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace;
            color: var(--text-primary); background: var(--bg-sidebar);
        }
        #lobby.visible { display: block; }
        #lobby.access-denied { padding: 32px; overflow-y: auto; }

        #lobby-shell {
            display: grid; grid-template-columns: 260px 1fr; height: 100vh;
            transition: grid-template-columns 0.18s ease;
        }
        #lobby.sidebar-collapsed #lobby-shell { grid-template-columns: 0 1fr; }
        #lobby-sidebar {
            padding: 20px 14px; overflow-x: hidden; overflow-y: auto;
            border-right: 1px solid var(--border);
            background: var(--bg-sidebar); min-width: 0;
            display: flex; flex-direction: column;
        }
        #lobby-content {
            position: relative; background: var(--terminal-bg);
            min-width: 0; height: 100vh; overflow: hidden;
        }
        #sidebar-toggle {
            position: fixed; top: 12px; left: 220px; z-index: 100;
            width: 32px; height: 32px; padding: 0;
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
            border-radius: 8px;
            font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 15%, transparent);
            transition: background 0.15s, color 0.15s, border-color 0.15s,
                        transform 0.12s, left 0.18s ease;
        }
        #lobby.sidebar-collapsed #sidebar-toggle { left: 12px; }
        #sidebar-toggle:hover {
            background: color-mix(in srgb, var(--accent) 14%, var(--bg-card));
            border-color: var(--accent);
        }
        #sidebar-toggle:active { transform: scale(0.95); }
        #sidebar-toggle:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
            outline-offset: 2px;
        }
        @media (max-width: 720px) {
            #sidebar-toggle {
                left: auto;
                right: calc(12px + env(safe-area-inset-right));
                top: calc(12px + env(safe-area-inset-top));
            }
            #lobby.sidebar-collapsed #sidebar-toggle {
                left: calc(12px + env(safe-area-inset-left));
                right: auto;
            }
        }
        #session-frame { width: 100%; height: 100%; border: 0; display: block; }
        #session-frame.hidden { display: none; }
        #lobby-empty {
            color: var(--text-muted); display: flex; align-items: center; justify-content: center;
            height: 100%; font-style: italic; padding: 24px; text-align: center;
        }
        #lobby-empty.hidden { display: none; }

        .lobby-header { font-size: 18px; color: var(--accent); margin: 0 0 4px 0; font-weight: 600; }
        .lobby-sub { color: var(--text-muted); font-size: 12px; margin: 0 0 18px 0; line-height: 1.5; }
        .new-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .new-row input {
            box-sizing: border-box; padding: 8px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-primary); font-family: inherit;
            /* 16px so iOS Safari doesn't auto-zoom on focus. */
            font-size: 16px;
        }
        .new-row input:focus { outline: none; border-color: var(--accent); }
        .new-row button {
            padding: 8px 12px; border-radius: 8px;
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            background: color-mix(in srgb, var(--accent) 18%, transparent);
            color: var(--text-primary); font-family: inherit; font-size: 13px; cursor: pointer;
        }
        .new-row button:hover {
            background: color-mix(in srgb, var(--accent) 30%, transparent);
        }

        .session-list { display: flex; flex-direction: column; gap: 6px; }
        .session-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-card); border: 1px solid var(--border);
            border-left: 3px solid transparent; border-radius: 8px;
            padding: 10px 12px; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit; color: var(--text-primary); text-align: left;
        }
        .session-card:hover { background: var(--bg-card-hover); }
        .session-card:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
            outline-offset: -2px;
        }
        .session-card.active {
            background: var(--bg-card-hover);
            border-color: color-mix(in srgb, var(--accent) 50%, transparent);
            border-left-color: var(--accent);
        }
        .session-meta {
            display: flex; flex-direction: column; gap: 2px;
            min-width: 0; flex: 1;
        }
        .session-name {
            font-size: 14px; font-weight: 600; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .session-detail { font-size: 11px; color: var(--text-muted); }
        .session-detail.attached { color: var(--success); }
        .session-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .session-actions button {
            padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-card-hover); color: var(--text-primary);
            font-family: inherit; font-size: 11px; cursor: pointer;
        }
        .session-actions button.rename {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .session-actions button.kill {
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        }
        .session-actions button:hover { filter: brightness(1.25); }
        .session-card.dragging { opacity: 0.4; cursor: grabbing; }
        .empty { color: var(--text-muted); font-style: italic; padding: 12px 0; font-size: 12px; }

        /* Theme picker — sits at the bottom of the sidebar */
        .theme-picker {
            margin-top: auto; padding-top: 14px;
            border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-muted);
        }
        .theme-picker-label {
            display: block; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .theme-options { display: flex; gap: 4px; }
        .theme-options button {
            flex: 1; padding: 5px 4px; border-radius: 6px;
            background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border); font-family: inherit;
            font-size: 11px; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .theme-options button:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
        }
        .theme-options button.active {
            border-color: var(--accent); color: var(--accent);
            background: var(--bg-card-hover);
        }

        @media (max-width: 720px) {
            /* Stack sidebar + terminal; let the terminal pane take whatever
               remains after the sidebar so it tracks the soft keyboard via
               the dynamic viewport height. */
            #lobby, #lobby-shell { height: 100dvh; }
            #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            #lobby-sidebar {
                border-right: 0; border-bottom: 1px solid var(--border);
                max-height: 40vh;
            }
            #lobby-content { height: auto; min-height: 0; }
            #lobby.sidebar-collapsed #lobby-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 0 1fr;
            }
            #lobby.sidebar-collapsed #lobby-content { height: auto; }
        }

        /* Soft-key toolbar — terminal mode only, touch devices only.
           Built in JS after xterm mounts; lives docked above the soft
           keyboard (visualViewport-aware). Display:none by default; the
           pointer:coarse media query un-hides it. */
        #soft-keys {
            display: none;
            position: fixed;
            left: 0; right: 0;
            /* Lift above the soft keyboard via --kb-offset (JS-updated from
               visualViewport). Without this iOS Safari's keyboard would
               cover the toolbar — the layout viewport doesn't shrink when
               the keyboard opens, only the visual viewport does. */
            bottom: calc(var(--kb-offset, 0px) + env(safe-area-inset-bottom));
            z-index: 9998;
            box-sizing: border-box;
            padding: 6px calc(6px + env(safe-area-inset-left))
                     6px calc(6px + env(safe-area-inset-right));
            background: color-mix(in srgb, var(--bg-card) 92%, transparent);
            border-top: 1px solid var(--border-strong);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, monospace;
        }
        #soft-keys::-webkit-scrollbar { height: 0; }
        #soft-keys .sk-row {
            display: inline-flex; gap: 6px; align-items: center;
        }
        #soft-keys button {
            flex: 0 0 auto;
            min-width: 38px; height: 38px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            font: inherit; font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: background 0.1s, border-color 0.1s, color 0.1s;
        }
        #soft-keys button:active {
            background: color-mix(in srgb, var(--accent) 25%, var(--bg-card-hover));
        }
        #soft-keys button.sk-mod.armed {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            background: color-mix(in srgb, var(--accent) 18%, var(--bg-card-hover));
        }
        #soft-keys button.sk-mod.latched {
            color: var(--bg-page);
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent);
        }
        #soft-keys button.sk-mod.latched::after {
            content: '•';
            margin-left: 4px;
            font-weight: 700;
        }
        @media (pointer: coarse) {
            #soft-keys { display: flex; }
            /* Shrink the terminal container so its bottom edge meets the
               top of the soft-key toolbar. Using height (not padding) so
               xterm's FitAddon — which reads getComputedStyle(parent).height
               — picks up the reduced size and proposes the right row count. */
            body.has-soft-keys #terminal {
                height: calc(100% - 50px - env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="lobby">
        <button id="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">‹</button>
        <div id="lobby-shell">
            <aside id="lobby-sidebar">
                <h1 class="lobby-header">tmux sessions</h1>
                <p class="lobby-sub">Pick a session or create one. Sessions persist after you close the tab.</p>
                <div class="new-row">
                    <input id="new-name" type="text" placeholder="new session name" maxlength="32" autocomplete="off">
                    <button id="new-btn">Create &amp; Open</button>
                </div>
                <div id="session-list" class="session-list"></div>
                <div id="theme-picker" class="theme-picker">
                    <span class="theme-picker-label">Theme</span>
                    <div class="theme-options">
                        <button type="button" data-theme="carbon">Carbon</button>
                        <button type="button" data-theme="slate">Slate</button>
                        <button type="button" data-theme="mono">Mono</button>
                        <button type="button" data-theme="ink">Ink</button>
                    </div>
                </div>
            </aside>
            <main id="lobby-content">
                <div id="lobby-empty">Pick a session, or create one above.</div>
                <iframe id="session-frame" class="hidden" referrerpolicy="same-origin" allow="clipboard-read; clipboard-write" title="terminal session"></iframe>
            </main>
        </div>
    </div>
    <div id="toast"></div>
    <button id="img-btn" title="Upload image">&#128247;</button>
    <button id="paste-btn" title="Paste from clipboard">&#128203;</button>
    <input type="file" id="img-input" accept="image/*">

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-clipboard@0.1.0/lib/addon-clipboard.min.js"></script>
    <script>
    (async function() {
        const NAME_RE = /^[a-zA-Z0-9_-]{1,32}$/;
        const SESSIONS_API = '/api/sessions/sessions';
        const WHOAMI_API   = '/api/sessions/whoami';
        const params = new URLSearchParams(location.search);
        const rawArg = params.get('arg');
        const validArg = rawArg && NAME_RE.test(rawArg) ? rawArg : null;

        // Theme — shared by lobby + terminal-mode iframe (same-origin localStorage).
        const THEMES = ['carbon', 'slate', 'mono', 'ink'];
        const THEME_KEY = 'tmux-theme';
        function getTheme() {
            try {
                const t = localStorage.getItem(THEME_KEY);
                return THEMES.includes(t) ? t : 'slate';
            } catch (e) { return 'slate'; }
        }
        function applyTheme(t) {
            THEMES.forEach(x => document.body.classList.remove('theme-' + x));
            document.body.classList.add('theme-' + t);
        }
        function readTerminalTheme() {
            const cs = getComputedStyle(document.body);
            const v = k => cs.getPropertyValue(k).trim();
            return {
                background: v('--terminal-bg') || '#0d1117',
                foreground: v('--terminal-fg') || '#e6e8eb',
                cursor: v('--terminal-cursor') || '#4493f8',
                selectionBackground: v('--terminal-selection') || 'rgba(68,147,248,0.22)'
            };
        }
        applyTheme(getTheme());

        function showToast(msg, type, duration) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'visible' + (type ? ' ' + type : '');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => { el.className = ''; }, duration || 3000);
        }

        function clearChildren(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function emptyState(text) {
            const e = document.createElement('div');
            e.className = 'empty';
            e.textContent = text;
            return e;
        }

        function showAccessDenied(detail) {
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            const lobby = document.getElementById('lobby');
            clearChildren(lobby);
            const h = document.createElement('h1');
            h.className = 'lobby-header';
            h.textContent = 'Access denied';
            lobby.appendChild(h);
            const p = document.createElement('p');
            p.className = 'lobby-sub';
            p.textContent = detail || 'You do not have a terminal account on this server.';
            lobby.appendChild(p);
            const p2 = document.createElement('p');
            p2.className = 'lobby-sub';
            p2.textContent = 'Authentik logs you in; access here requires an OS-user mapping in /etc/ttyd-user-map. Ask Viktor to add one.';
            lobby.appendChild(p2);
            lobby.classList.add('visible', 'access-denied');
            document.title = 'access denied';
        }

        // Preflight: ask tmux-api who we are. 403 = unmapped Authentik user → deny.
        let whoami = null;
        try {
            const resp = await fetch(WHOAMI_API, { credentials: 'same-origin' });
            if (resp.status === 401 || resp.status === 403) {
                showAccessDenied((await resp.text()).trim());
                return;
            }
            if (!resp.ok) {
                showAccessDenied('Preflight failed: HTTP ' + resp.status);
                return;
            }
            whoami = await resp.json();
        } catch (err) {
            showAccessDenied('Preflight failed: ' + err.message);
            return;
        }

        if (!validArg) {
            // ============================================================
            // LOBBY MODE — no valid ?arg=, render sidebar + iframe shell
            // ============================================================
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('lobby').classList.add('visible');
            const baseTitle = 'tmux sessions (' + whoami.osUser + ')';
            document.title = baseTitle;
            document.querySelector('#lobby .lobby-sub').textContent =
                'Logged in as ' + whoami.osUser + ' (' + whoami.authentik + '). Sessions are kernel-isolated per Unix user; you only see your own.';

            const listEl    = document.getElementById('session-list');
            const newNameEl = document.getElementById('new-name');
            const newBtnEl  = document.getElementById('new-btn');
            const frameEl   = document.getElementById('session-frame');
            const emptyEl   = document.getElementById('lobby-empty');

            let currentActive = null;
            // A session is "confirmed" once a /sessions poll has actually listed
            // it. Only a confirmed-then-vanished session means it was killed
            // elsewhere (→ deactivate). A freshly-activated session that has
            // never appeared yet is still being CREATED — its tmux session is
            // born only after the iframe's WebSocket reaches ttyd (whoami →
            // token → ws). Tearing the iframe down before then aborts that very
            // chain ("Token fetch failed: TypeError: Failed to fetch"), so the
            // session never gets created. Gate deactivation on this flag.
            let activeConfirmed = false;
            let dragSrcCard = null;
            let isDragging = false;
            const ORDER_KEY = 'tmux-session-order-' + whoami.osUser;

            function relativeTime(epochSec) {
                if (!epochSec) return '';
                const diff = Math.floor(Date.now() / 1000) - epochSec;
                if (diff < 60)    return diff + 's ago';
                if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            }

            function getSavedOrder() {
                try {
                    const raw = localStorage.getItem(ORDER_KEY);
                    if (!raw) return [];
                    const arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string') : [];
                } catch (e) { return []; }
            }
            function saveOrder(names) {
                try { localStorage.setItem(ORDER_KEY, JSON.stringify(names)); } catch (e) {}
            }
            function captureOrderFromDom() {
                return Array.from(listEl.querySelectorAll('.session-card')).map(c => c.dataset.name);
            }
            function applySavedOrder(sessions) {
                const saved = getSavedOrder();
                const byName = new Map(sessions.map(s => [s.name, s]));
                const out = [];
                for (const name of saved) {
                    const s = byName.get(name);
                    if (s) { out.push(s); byName.delete(name); }
                }
                for (const s of sessions) {
                    if (byName.has(s.name)) out.push(s);
                }
                return out;
            }
            function renameInOrder(oldName, newName) {
                const order = getSavedOrder();
                const i = order.indexOf(oldName);
                if (i < 0) return;
                order[i] = newName;
                saveOrder(order);
            }

            function updateActiveCard() {
                listEl.querySelectorAll('.session-card').forEach(c => {
                    if (c.dataset.name === currentActive) c.classList.add('active');
                    else c.classList.remove('active');
                });
            }

            // On touch + small screen, the first session activation collapses
            // the sidebar so the terminal gets the full viewport. We stamp a
            // localStorage flag so we don't fight users who manually re-open it.
            const MOBILE_AUTO_COLLAPSE_KEY = 'tmux-mobile-auto-collapsed';
            const mobileQuery = matchMedia('(pointer: coarse) and (max-width: 720px)');
            function maybeAutoCollapseSidebar() {
                if (!mobileQuery.matches) return;
                try {
                    if (localStorage.getItem(MOBILE_AUTO_COLLAPSE_KEY) === 'done') return;
                    localStorage.setItem(MOBILE_AUTO_COLLAPSE_KEY, 'done');
                } catch (e) { /* localStorage disabled — best-effort */ }
                setSidebarCollapsed(true);
            }

            function activateSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (currentActive === name) { updateActiveCard(); return; }
                currentActive = name;
                activeConfirmed = false;
                emptyEl.classList.add('hidden');
                frameEl.classList.remove('hidden');
                frameEl.src = '/?arg=' + encodeURIComponent(name);
                if (location.hash.slice(1) !== name) {
                    history.replaceState(null, '', '#' + name);
                }
                document.title = 'tmux: ' + whoami.osUser + '/' + name;
                updateActiveCard();
                maybeAutoCollapseSidebar();
            }

            function deactivateSession() {
                if (!currentActive && frameEl.classList.contains('hidden')) return;
                currentActive = null;
                activeConfirmed = false;
                frameEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                frameEl.src = 'about:blank';
                if (location.hash) {
                    history.replaceState(null, '', location.pathname + location.search);
                }
                document.title = baseTitle;
                updateActiveCard();
            }

            async function killSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (!confirm('Kill tmux session "' + name + '"? Any running processes inside it will be terminated.')) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(name), {
                        method: 'DELETE', credentials: 'same-origin'
                    });
                    if (resp.ok) {
                        showToast('Killed ' + name, 'success');
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else {
                        showToast('Kill failed: HTTP ' + resp.status, 'error');
                    }
                    if (currentActive === name) deactivateSession();
                    renderLobby();
                } catch (err) {
                    showToast('Kill error: ' + err.message, 'error');
                }
            }

            async function renameSession(oldName) {
                if (!NAME_RE.test(oldName)) { showToast('Invalid name', 'error'); return; }
                const input = prompt('Rename "' + oldName + '" to:', oldName);
                if (input === null) return;
                const newName = input.trim();
                if (!NAME_RE.test(newName)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (newName === oldName) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(oldName) + '/rename', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    if (resp.status === 204) {
                        renameInOrder(oldName, newName);
                        showToast('Renamed to ' + newName, 'success');
                        if (currentActive === oldName) {
                            currentActive = newName;
                            frameEl.src = '/?arg=' + encodeURIComponent(newName);
                            history.replaceState(null, '', '#' + newName);
                            document.title = 'tmux: ' + whoami.osUser + '/' + newName;
                        }
                        renderLobby();
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else if (resp.status === 409) {
                        showToast('Name "' + newName + '" already taken', 'error', 4000);
                    } else if (resp.status === 400) {
                        showToast('Invalid name', 'error');
                    } else {
                        showToast('Rename failed: HTTP ' + resp.status, 'error');
                    }
                } catch (err) {
                    showToast('Rename error: ' + err.message, 'error');
                }
            }

            function renderCard(s) {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.dataset.name = s.name;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', 'Activate session ' + s.name);
                card.draggable = true;
                if (s.name === currentActive) card.classList.add('active');

                const meta = document.createElement('div');
                meta.className = 'session-meta';
                const name = document.createElement('div');
                name.className = 'session-name';
                name.textContent = s.name;
                meta.appendChild(name);
                const detail = document.createElement('div');
                detail.className = 'session-detail' + (s.attached > 0 ? ' attached' : '');
                const attachedText = s.attached > 0 ? (s.attached + ' attached') : 'idle';
                detail.textContent = attachedText + ' · ' + relativeTime(s.lastActivity);
                meta.appendChild(detail);
                card.appendChild(meta);

                const actions = document.createElement('div');
                actions.className = 'session-actions';
                const renameBtn = document.createElement('button');
                renameBtn.className = 'rename';
                renameBtn.textContent = 'Rename';
                renameBtn.draggable = false;
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    renameSession(s.name);
                });
                actions.appendChild(renameBtn);
                const killBtn = document.createElement('button');
                killBtn.className = 'kill';
                killBtn.textContent = 'Kill';
                killBtn.draggable = false;
                killBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    killSession(s.name);
                });
                actions.appendChild(killBtn);
                card.appendChild(actions);

                card.addEventListener('click', () => activateSession(s.name));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateSession(s.name);
                    }
                });

                card.addEventListener('dragstart', (e) => {
                    dragSrcCard = card;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', s.name);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    if (dragSrcCard === card) saveOrder(captureOrderFromDom());
                    dragSrcCard = null;
                    isDragging = false;
                });
                card.addEventListener('dragover', (e) => {
                    if (!dragSrcCard || dragSrcCard === card) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = card.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) card.after(dragSrcCard);
                    else card.before(dragSrcCard);
                });

                return card;
            }

            async function renderLobby() {
                if (isDragging) return;
                try {
                    const resp = await fetch(SESSIONS_API, { credentials: 'same-origin' });
                    if (!resp.ok) {
                        clearChildren(listEl);
                        listEl.appendChild(emptyState('Failed to load sessions: HTTP ' + resp.status));
                        return;
                    }
                    const sessions = await resp.json();
                    const activeListed = sessions.some(s => s.name === currentActive);
                    if (currentActive && activeListed) activeConfirmed = true;
                    // Only deactivate a session we've SEEN before and that is now
                    // gone (killed elsewhere). Never tear down one that has yet to
                    // appear — it's still being created (see activeConfirmed note).
                    if (currentActive && !activeListed && activeConfirmed) {
                        deactivateSession();
                    }
                    clearChildren(listEl);
                    if (sessions.length === 0) {
                        listEl.appendChild(emptyState('No sessions yet.'));
                        return;
                    }
                    const ordered = applySavedOrder(sessions);
                    for (const s of ordered) listEl.appendChild(renderCard(s));
                } catch (err) {
                    clearChildren(listEl);
                    listEl.appendChild(emptyState('Error: ' + err.message));
                }
            }

            // A newly-created session is spawned by the iframe's WebSocket a
            // beat after it loads, so the regular 5s poll can miss it and the
            // per-user API cache can briefly hold a pre-spawn empty list. Poll a
            // few times in the first seconds so the new card appears within ~1-2s.
            function quickRefreshAfterCreate() {
                [700, 1600, 3000, 4500].forEach((ms) => setTimeout(renderLobby, ms));
            }
            newBtnEl.addEventListener('click', () => {
                const name = newNameEl.value.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                newNameEl.value = '';
                activateSession(name);
                quickRefreshAfterCreate();
            });
            newNameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') newBtnEl.click();
            });

            window.addEventListener('hashchange', () => {
                const hash = location.hash.slice(1);
                if (hash && NAME_RE.test(hash)) {
                    if (hash !== currentActive) activateSession(hash);
                } else if (currentActive) {
                    deactivateSession();
                }
            });

            // Sidebar collapse — toggle a class on #lobby + persist in localStorage.
            // The grid-template-columns transition handles the slide; xterm in the
            // iframe re-fits on its own window resize event.
            const SIDEBAR_KEY = 'tmux-sidebar-collapsed';
            const lobbyEl    = document.getElementById('lobby');
            const toggleEl   = document.getElementById('sidebar-toggle');
            function getSidebarCollapsed() {
                try { return localStorage.getItem(SIDEBAR_KEY) === '1'; }
                catch (e) { return false; }
            }
            function setSidebarCollapsed(collapsed) {
                lobbyEl.classList.toggle('sidebar-collapsed', collapsed);
                toggleEl.textContent = collapsed ? '›' : '‹';
                toggleEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggleEl.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
                try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
            }
            toggleEl.addEventListener('click', () => {
                setSidebarCollapsed(!lobbyEl.classList.contains('sidebar-collapsed'));
            });
            setSidebarCollapsed(getSidebarCollapsed());

            // Theme picker — clicking a swatch swaps body class, persists, and
            // reloads the iframe so the inner terminal re-themes too.
            const themePickerEl = document.getElementById('theme-picker');
            function paintThemeButtons() {
                const active = getTheme();
                themePickerEl.querySelectorAll('button[data-theme]').forEach(b => {
                    b.classList.toggle('active', b.dataset.theme === active);
                });
            }
            themePickerEl.querySelectorAll('button[data-theme]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.theme;
                    if (!THEMES.includes(t)) return;
                    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
                    applyTheme(t);
                    paintThemeButtons();
                    if (currentActive && frameEl.src) {
                        // Reload iframe so xterm picks up the new theme.
                        const url = frameEl.src;
                        frameEl.src = 'about:blank';
                        setTimeout(() => { frameEl.src = url; }, 0);
                    }
                });
            });
            paintThemeButtons();

            // Drops on the terminal are handled inside the iframe. If one lands
            // on the lobby chrome (sidebar) instead, suppress the browser's
            // default file-open and forward the files to the active session's
            // iframe (it uploads them and types the paths in). preventDefault is
            // unconditional — gating it caused Chrome to open the file instead.
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
                if (!files.length) return;
                if (currentActive && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ type: 'tl-drop-files', files }, location.origin);
                    showToast('Sent ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' to ' + currentActive, 'success', 3000);
                } else {
                    showToast('Open a session first, then drop files', 'error', 3500);
                }
            });

            renderLobby();
            setInterval(renderLobby, 5000);

            const initialHash = location.hash.slice(1);
            if (initialHash && NAME_RE.test(initialHash)) {
                activateSession(initialHash);
            }
            return;
        }

        // ============================================================
        // TERMINAL MODE — valid ?arg=<session>, attach via ttyd
        // ============================================================

        // ttyd binary protocol
        const MSG_OUTPUT    = 0x30; // '0' - terminal output
        const MSG_SET_PREFS = 0x31; // '1' - JSON preferences
        const MSG_SET_TITLE = 0x32; // '2' - window title
        const MSG_INPUT     = '0';  // client → server: input data
        const MSG_RESIZE    = '1';  // client → server: {columns, rows}

        let ws = null;
        let hasConnectedOnce = false;
        const textEncoder = new TextEncoder();
        const textDecoder = new TextDecoder();

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
            fontSize: 15,
            theme: readTerminalTheme(),
            // tmux (mouse on) forwards the mouse to copy-mode; native browser
            // selection requires holding Shift, which xterm bounds to its OWN
            // scrollback buffer. The default (1000) is why Shift-selecting a big
            // chunk "runs out". 10000 comfortably exceeds tmux's history-limit
            // (5000), so Shift+scroll/drag selection reaches the full history.
            scrollback: 10000,
            allowProposedApi: true
        });

        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(webLinksAddon);

        try {
            const webglAddon = new WebglAddon.WebglAddon();
            webglAddon.onContextLoss(() => { webglAddon.dispose(); });
            term.loadAddon(webglAddon);
        } catch (e) {
            console.warn('WebGL addon failed:', e);
        }

        // OSC 52 clipboard: lets tmux's own copy (with `set-clipboard on`) and
        // any program write straight to the OS clipboard. NOTE: this addon's
        // UMD build exposes the class as the global `ClipboardAddon` directly,
        // NOT `ClipboardAddon.ClipboardAddon` like fit/webgl — accept both
        // shapes. Wrapped so a load hiccup can't break the terminal.
        try {
            const ClipAddon = (typeof ClipboardAddon !== 'undefined')
                && (ClipboardAddon.ClipboardAddon || ClipboardAddon);
            if (ClipAddon) {
                term.loadAddon(new ClipAddon());
                console.log('clipboard addon (OSC 52) loaded');
            } else {
                console.warn('ClipboardAddon global not found');
            }
        } catch (e) {
            console.warn('Clipboard addon failed:', e);
        }

        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        document.title = 'tmux: ' + whoami.osUser + '/' + validArg;

        // ------------------------------------------------------------------
        // Mobile / touch UI — soft keyboard, modifier toolbar, resize plumbing
        // ------------------------------------------------------------------

        // xterm.js mounts an offscreen <textarea> as its input proxy. On touch
        // devices the soft keyboard targets that textarea, so we harden it:
        //   - autocorrect/spellcheck/etc off (no inline suggestions)
        //   - type=password suppresses Gboard predictive text (xterm.js #2403),
        //     which would otherwise inject duplicate/spurious keystrokes
        //   - font-size 16px prevents iOS Safari auto-zoom on focus
        const helperTextarea = document.querySelector('.xterm-helper-textarea');
        if (helperTextarea) {
            helperTextarea.setAttribute('autocorrect', 'off');
            helperTextarea.setAttribute('autocapitalize', 'off');
            helperTextarea.setAttribute('autocomplete', 'off');
            helperTextarea.setAttribute('spellcheck', 'false');
            helperTextarea.setAttribute('type', 'password');
            helperTextarea.setAttribute('aria-label', 'terminal input');
            helperTextarea.style.fontSize = '16px';
        }

        const isCoarsePointer = matchMedia('(pointer: coarse)').matches;
        const terminalEl = document.getElementById('terminal');

        // Shared modifier state for the soft-key toolbar (only populated on
        // touch devices). Reads in the term.onData wrapper below.
        let softMods = null;
        let consumeSoftMods = () => {};

        if (isCoarsePointer) {
            // Touch behaviour on the terminal canvas:
            //   tap  → focus helper textarea → soft keyboard appears
            //   swipe → dispatch synthetic wheel events on the xterm root.
            //           xterm forwards them to the PTY (tmux has `mouse on`
            //           globally) which scrolls copy-mode. Without this,
            //           there's no way to see scrollback on touch.
            //
            // We defer the focus call to touchend with a movement-threshold
            // check so a swipe never accidentally summons the keyboard.
            (() => {
                let startY = null, lastY = null, moved = false;
                const SWIPE_THRESHOLD = 6;  // px — tap vs. swipe
                terminalEl.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) { startY = lastY = null; return; }
                    startY = lastY = e.touches[0].clientY;
                    moved = false;
                }, { passive: true });
                terminalEl.addEventListener('touchmove', (e) => {
                    if (e.touches.length !== 1 || lastY === null) return;
                    const y = e.touches[0].clientY;
                    const delta = lastY - y;
                    lastY = y;
                    if (!moved && Math.abs(startY - y) > SWIPE_THRESHOLD) moved = true;
                    if (!moved || delta === 0 || !term.element) return;
                    term.element.dispatchEvent(new WheelEvent('wheel', {
                        deltaY: delta,
                        deltaMode: 0,
                        bubbles: true, cancelable: true,
                        clientX: 0, clientY: y,
                    }));
                }, { passive: true });
                terminalEl.addEventListener('touchend', () => {
                    if (!moved && startY !== null) term.focus();
                    startY = lastY = null;
                    moved = false;
                }, { passive: true });
            })();

            softMods = { ctrl: 'idle', alt: 'idle' };
            const modTimers = { ctrl: null, alt: null };
            const DOUBLE_TAP_MS = 400;

            // Build the toolbar first so paintMod can find buttons by data-mod.
            const toolbar = document.createElement('div');
            toolbar.id = 'soft-keys';
            toolbar.setAttribute('role', 'toolbar');
            toolbar.setAttribute('aria-label', 'Terminal keys');
            const row = document.createElement('div');
            row.className = 'sk-row';
            toolbar.appendChild(row);

            function paintMod(name) {
                const btn = toolbar.querySelector('[data-mod="' + name + '"]');
                if (!btn) return;
                btn.classList.remove('armed', 'latched');
                if (softMods[name] === 'armed')   btn.classList.add('armed');
                if (softMods[name] === 'latched') btn.classList.add('latched');
            }
            function tapMod(name) {
                clearTimeout(modTimers[name]);
                const cur = softMods[name];
                if (cur === 'idle') {
                    // First tap arms; a second tap within DOUBLE_TAP_MS latches.
                    softMods[name] = 'armed';
                    modTimers[name] = setTimeout(() => {
                        if (softMods[name] === 'armed') {
                            softMods[name] = 'idle';
                            paintMod(name);
                        }
                    }, DOUBLE_TAP_MS);
                } else if (cur === 'armed') {
                    softMods[name] = 'latched';
                } else {
                    softMods[name] = 'idle';
                }
                paintMod(name);
            }
            consumeSoftMods = function() {
                // Drop armed → idle, leave latched. Called after every normal key.
                for (const name of ['ctrl', 'alt']) {
                    if (softMods[name] === 'armed') {
                        softMods[name] = 'idle';
                        paintMod(name);
                    }
                }
            };

            function makeBtn(label, onTap, opts) {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = label;
                if (opts && opts.cls)     b.classList.add(opts.cls);
                if (opts && opts.dataMod) b.setAttribute('data-mod', opts.dataMod);
                if (opts && opts.ariaLabel) b.setAttribute('aria-label', opts.ariaLabel);
                // pointerdown + preventDefault: stop the button from taking
                // focus away from the helper textarea (which would collapse
                // the soft keyboard between keystrokes).
                b.addEventListener('pointerdown', (ev) => {
                    ev.preventDefault();
                    try { onTap(); } catch (err) { console.error(err); }
                    // Re-arm helper textarea for the next physical keystroke —
                    // but skip on modifiers and arrows so tapping a navigation
                    // key doesn't summon the keyboard if it wasn't already up.
                    const skipFocus = b.classList.contains('sk-mod')
                                   || (opts && opts.noFocus);
                    if (!skipFocus) term.focus();
                });
                return b;
            }

            // A normal toolbar key — pre-baked bytes (escape sequences for
            // Esc/Tab/arrows, literal '|' / '`'). Always consume armed
            // modifiers; the bytes themselves are sent as-is (no Ctrl-byte
            // transform on toolbar keys — that only makes sense for letters
            // typed on the system soft keyboard).
            function sendKey(bytes) {
                sendInput(bytes);
                consumeSoftMods();
            }

            row.appendChild(makeBtn('Esc',  () => sendKey('\x1b')));
            row.appendChild(makeBtn('Tab',  () => sendKey('\t')));
            row.appendChild(makeBtn('Ctrl', () => tapMod('ctrl'),
                { cls: 'sk-mod', dataMod: 'ctrl', ariaLabel: 'Ctrl modifier' }));
            row.appendChild(makeBtn('Alt',  () => tapMod('alt'),
                { cls: 'sk-mod', dataMod: 'alt',  ariaLabel: 'Alt modifier' }));
            row.appendChild(makeBtn('↑', () => sendKey('\x1b[A'), { ariaLabel: 'Up arrow',    noFocus: true }));
            row.appendChild(makeBtn('↓', () => sendKey('\x1b[B'), { ariaLabel: 'Down arrow',  noFocus: true }));
            row.appendChild(makeBtn('←', () => sendKey('\x1b[D'), { ariaLabel: 'Left arrow',  noFocus: true }));
            row.appendChild(makeBtn('→', () => sendKey('\x1b[C'), { ariaLabel: 'Right arrow', noFocus: true }));
            row.appendChild(makeBtn('|',  () => sendKey('|')));
            row.appendChild(makeBtn('`',  () => sendKey('`')));

            row.appendChild(makeBtn('Copy', async () => {
                const sel = term.getSelection();
                if (!sel) { showToast('No selection', 'error', 1500); return; }
                try {
                    await navigator.clipboard.writeText(sel);
                    showToast('Copied', 'success', 1500);
                } catch (err) {
                    showToast('Copy failed', 'error', 2500);
                }
            }));
            row.appendChild(makeBtn('Paste', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) sendInput(text);
                } catch (err) {
                    showToast('Clipboard access denied', 'error', 2500);
                }
            }));
            row.appendChild(makeBtn('Kbd', () => term.focus(),
                { ariaLabel: 'Show keyboard' }));

            document.body.appendChild(toolbar);
            document.body.classList.add('has-soft-keys');
        }

        function sendInput(data) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const payload = textEncoder.encode(data);
            const buf = new Uint8Array(payload.length + 1);
            buf[0] = MSG_INPUT.charCodeAt(0);
            buf.set(payload, 1);
            ws.send(buf.buffer);
        }

        function sendResize() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const json = JSON.stringify({ columns: term.cols, rows: term.rows });
            const payload = textEncoder.encode(json);
            const buf = new Uint8Array(payload.length + 1);
            buf[0] = MSG_RESIZE.charCodeAt(0);
            buf.set(payload, 1);
            ws.send(buf.buffer);
        }

        // term.onData wrapper: when a soft-toolbar modifier is armed/latched,
        // remap the first char (Ctrl-letter or Alt-prefix) before sending.
        // On desktop softMods stays null and this falls through to sendInput.
        term.onData((data) => {
            if (softMods && data) {
                const ctrlActive = softMods.ctrl !== 'idle';
                const altActive  = softMods.alt  !== 'idle';
                if (ctrlActive || altActive) {
                    const first = data.charAt(0);
                    const rest  = data.slice(1);
                    let mapped  = first;
                    if (ctrlActive && /^[a-zA-Z]$/.test(first)) {
                        mapped = String.fromCharCode(first.toLowerCase().charCodeAt(0) & 0x1f);
                    }
                    if (altActive) mapped = '\x1b' + mapped;
                    sendInput(mapped + rest);
                    consumeSoftMods();
                    return;
                }
            }
            sendInput(data);
        });
        term.onBinary((data) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const bytes = new Uint8Array(data.length + 1);
            bytes[0] = MSG_INPUT.charCodeAt(0);
            for (let i = 0; i < data.length; i++) bytes[i + 1] = data.charCodeAt(i);
            ws.send(bytes.buffer);
        });

        term.onResize(() => sendResize());

        // Refit on every viewport change. visualViewport tracks the visible
        // area below the soft keyboard on iOS Safari (and is the most
        // reliable signal on Chrome Android too). rAF-debounce coalesces
        // multiple events fired in the same frame (rotate + keyboard).
        // Resize is split into a fast visual pass and a debounced fit:
        //   syncViewport() — rAF-fast. Updates --kb-offset AND the terminal's
        //     pixel height from visualViewport. iOS Safari does NOT shrink the
        //     layout viewport when the soft keyboard rises (only visualViewport
        //     reflects it), so a CSS height:100% terminal renders its bottom
        //     rows — the prompt — behind the keyboard. Driving height off
        //     visualViewport keeps the prompt visible.
        //   refit() — debounced fitAddon.fit(). fit() emits a tmux resize on
        //     every call; the keyboard animates over ~250ms firing a burst of
        //     resize/scroll events, so we coalesce them into a single resize
        //     instead of thrashing tmux (the "glitchy resize" on mobile).
        function syncViewport() {
            if (!window.visualViewport) return;
            const vv = window.visualViewport;
            const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            document.documentElement.style.setProperty('--kb-offset', kb + 'px');
            if (document.body.classList.contains('has-soft-keys')) {
                const tb = document.getElementById('soft-keys');
                const tbH = tb ? tb.offsetHeight : 0;
                terminalEl.style.height = Math.max(0, vv.height - tbH) + 'px';
            }
        }
        let kbRafScheduled = false;
        let fitTimer = null;
        function refit() {
            if (!kbRafScheduled) {
                kbRafScheduled = true;
                requestAnimationFrame(() => { kbRafScheduled = false; syncViewport(); });
            }
            clearTimeout(fitTimer);
            fitTimer = setTimeout(() => {
                try { fitAddon.fit(); } catch (e) { console.warn('fit failed:', e); }
            }, 120);
        }
        window.addEventListener('resize', refit);
        window.addEventListener('orientationchange', refit);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', refit);
            window.visualViewport.addEventListener('scroll', refit);
        }
        // Seed offset + height + an immediate fit on first frame so floating
        // elements and the terminal are sized correctly before any event fires.
        syncViewport();
        try { fitAddon.fit(); } catch (e) {}

        term.attachCustomKeyEventHandler((e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'c' && term.hasSelection()) {
                navigator.clipboard.writeText(term.getSelection())
                    .then(() => showToast('Copied', 'success', 1500))
                    .catch(() => showToast('Copy blocked by browser', 'error', 2500));
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
                return false; // let browser paste event fire
            }
            return true;
        });

        document.addEventListener('paste', async (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    e.stopPropagation();

                    const blob = item.getAsFile();
                    if (!blob) { showToast('Failed to read image', 'error'); return; }

                    showToast('Uploading image...', '');
                    try {
                        const formData = new FormData();
                        formData.append('image', blob);
                        const resp = await fetch('/clipboard/upload', { method: 'POST', body: formData });
                        if (!resp.ok) { showToast('Upload failed: ' + await resp.text(), 'error', 5000); return; }
                        const { path } = await resp.json();
                        sendInput(path);
                        showToast('Pasted: ' + path, 'success', 4000);
                    } catch (err) {
                        showToast('Upload error: ' + err.message, 'error', 5000);
                    }
                    return;
                }
            }

            const text = e.clipboardData.getData('text');
            if (text) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                sendInput(text);
            }
        }, true);

        document.getElementById('paste-btn').addEventListener('click', async () => {
            try {
                if (navigator.clipboard.read) {
                    const items = await navigator.clipboard.read();
                    for (const item of items) {
                        const imageType = item.types.find(t => t.startsWith('image/'));
                        if (imageType) {
                            const blob = await item.getType(imageType);
                            showToast('Uploading image...', '');
                            const formData = new FormData();
                            formData.append('image', blob);
                            const resp = await fetch('/clipboard/upload', { method: 'POST', body: formData });
                            if (!resp.ok) { showToast('Upload failed: ' + await resp.text(), 'error', 5000); return; }
                            const { path } = await resp.json();
                            sendInput(path);
                            showToast('Pasted: ' + path, 'success', 4000);
                            return;
                        }
                        if (item.types.includes('text/plain')) {
                            const blob = await item.getType('text/plain');
                            const text = await blob.text();
                            if (text) { sendInput(text); return; }
                        }
                    }
                } else {
                    const text = await navigator.clipboard.readText();
                    if (text) sendInput(text);
                }
            } catch (err) {
                showToast('Clipboard access denied', 'error', 3000);
                console.error('Clipboard read failed:', err);
            }
            term.focus();
        });

        document.getElementById('img-btn').addEventListener('click', () => {
            document.getElementById('img-input').click();
        });
        document.getElementById('img-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = ''; // reset so same file can be re-selected

            showToast('Uploading image...', '');
            try {
                const formData = new FormData();
                formData.append('image', file);
                const resp = await fetch('/clipboard/upload', { method: 'POST', body: formData });
                if (!resp.ok) { showToast('Upload failed: ' + await resp.text(), 'error', 5000); return; }
                const { path } = await resp.json();
                sendInput(path);
                showToast('Pasted: ' + path, 'success', 4000);
            } catch (err) {
                showToast('Upload error: ' + err.message, 'error', 5000);
            }
            term.focus();
        });

        // ------------------------------------------------------------------
        // Drag-and-drop files → upload to /tmp → type the path(s) into the PTY.
        // Any file type is accepted; the clipboard-upload service saves it under
        // /tmp/clipboard-files keeping a sanitized original name, and the
        // absolute path(s) are sent as input so you can use them in a command.
        //
        // preventDefault MUST run on dragover AND drop UNCONDITIONALLY — if it
        // doesn't, the browser falls back to its default "open the dropped file"
        // (Chrome opens it in a new tab). Only the overlay + upload are gated on
        // whether the drag actually carries files.
        // ------------------------------------------------------------------
        const dropOverlay = document.createElement('div');
        dropOverlay.id = 'drop-overlay';
        dropOverlay.textContent = 'Drop files — saved to /tmp, paths typed into the session';
        Object.assign(dropOverlay.style, {
            position: 'fixed', inset: '0', zIndex: '9997', display: 'none',
            alignItems: 'center', justifyContent: 'center', textAlign: 'center',
            padding: '24px', boxSizing: 'border-box',
            background: 'color-mix(in srgb, var(--accent) 14%, rgba(0,0,0,0.55))',
            border: '3px dashed var(--accent)', color: 'var(--text-primary)',
            font: "600 16px 'JetBrains Mono', Menlo, Monaco, monospace",
            backdropFilter: 'blur(2px)', webkitBackdropFilter: 'blur(2px)',
            pointerEvents: 'none'
        });
        document.body.appendChild(dropOverlay);

        // dataTransfer.types is a DOMStringList in some browsers and an array in
        // others — probe both ways so file detection is reliable.
        const dragHasFiles = (e) => {
            const types = e.dataTransfer && e.dataTransfer.types;
            if (!types) return false;
            return (types.contains && types.contains('Files')) ||
                   Array.prototype.indexOf.call(types, 'Files') !== -1;
        };
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            if (!dragHasFiles(e)) return;
            dragDepth++;
            dropOverlay.style.display = 'flex';
        });
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        });
        window.addEventListener('dragleave', () => {
            if (dragDepth === 0) return;
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) dropOverlay.style.display = 'none';
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDepth = 0;
            dropOverlay.style.display = 'none';
            const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
            if (files.length) uploadDroppedFiles(files);
        });

        // The lobby (parent) forwards files dropped on its chrome here via
        // postMessage, so a drop anywhere in the browser ends up in this session.
        window.addEventListener('message', (e) => {
            if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-drop-files') return;
            const files = Array.isArray(e.data.files) ? e.data.files : [];
            if (files.length) uploadDroppedFiles(files);
        });

        async function uploadDroppedFiles(files) {
            showToast('Uploading ' + files.length + ' file' + (files.length > 1 ? 's' : '') + '...', '');
            const paths = [];
            for (const f of files) {
                try {
                    const fd = new FormData();
                    fd.append('file', f, f.name);
                    const resp = await fetch('/clipboard/upload', { method: 'POST', body: fd });
                    if (!resp.ok) {
                        showToast('Upload failed (' + f.name + '): ' + (await resp.text()), 'error', 5000);
                        continue;
                    }
                    const { path } = await resp.json();
                    if (path) paths.push(path);
                } catch (err) {
                    showToast('Upload error (' + f.name + '): ' + err.message, 'error', 5000);
                }
            }
            if (paths.length) {
                // Saved names are sanitized (no spaces/shell specials), so paths
                // are safe to insert verbatim, space-separated.
                sendInput(paths.join(' '));
                showToast('Added ' + paths.length + ' path' + (paths.length > 1 ? 's' : ''), 'success', 4000);
            }
            term.focus();
        }

        // Reconnect guard: ttyd attaches with `tmux new-session -A`, so a blind
        // reconnect RECREATES a session that was just killed. Returns false only
        // when we positively confirm the session is gone; any uncertainty
        // (network/API error) returns true so a transient blip still reconnects.
        async function sessionStillExists() {
            try {
                const resp = await fetch(SESSIONS_API, { credentials: 'same-origin' });
                if (!resp.ok) return true;
                const list = await resp.json();
                return Array.isArray(list) && list.some((s) => s.name === validArg);
            } catch (e) {
                return true;
            }
        }

        function scheduleReconnect() {
            term.write('\r\n\x1b[31mDisconnected. Reconnecting...\x1b[0m\r\n');
            setTimeout(connect, 3000);
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const argSuffix = '?arg=' + encodeURIComponent(validArg);
            const base = location.pathname.replace(/\/+$/, '');
            const wsUrl = proto + '//' + location.host + base + '/ws' + argSuffix;

            fetch(base + '/token' + argSuffix, { credentials: 'same-origin' })
                .then(r => r.json())
                .then(tokenData => {
                    const token = tokenData.token || '';
                    ws = new WebSocket(wsUrl, ['tty']);
                    ws.binaryType = 'arraybuffer';

                    ws.onopen = () => {
                        console.log('Connected to ttyd (session: ' + validArg + ')');
                        hasConnectedOnce = true;
                        const initMsg = JSON.stringify({
                            AuthToken: token,
                            columns: term.cols,
                            rows: term.rows
                        });
                        ws.send(initMsg);
                        // The session now exists (ttyd just ran tmux new-session).
                        // The lobby's /sessions cache was invalidated on this
                        // iframe's earlier /whoami, but that fired BEFORE the
                        // session was spawned — so the lobby may have re-cached an
                        // empty list. Invalidate again now that it's live so the
                        // parent lobby's next poll surfaces it promptly.
                        fetch(WHOAMI_API, { credentials: 'same-origin' }).catch(() => {});
                    };

                    ws.onmessage = (event) => {
                        const data = event.data;
                        if (data instanceof ArrayBuffer) {
                            const view = new Uint8Array(data);
                            if (view.length < 1) return;
                            const msgType = view[0];
                            const payload = view.slice(1);

                            switch (msgType) {
                                case MSG_OUTPUT:
                                    term.write(payload);
                                    break;
                                case MSG_SET_PREFS:
                                    try {
                                        const prefs = JSON.parse(textDecoder.decode(payload));
                                        console.log('ttyd prefs:', prefs);
                                    } catch (e) {}
                                    break;
                                case MSG_SET_TITLE:
                                    document.title = textDecoder.decode(payload);
                                    break;
                            }
                        }
                    };

                    ws.onclose = () => {
                        // First connection is the create/attach — always retry it.
                        // After we've connected once, a close may mean the session
                        // was killed (by this or another client); reconnecting would
                        // resurrect it via `tmux new-session -A`. Only reconnect if
                        // the session still exists.
                        if (!hasConnectedOnce) {
                            scheduleReconnect();
                            return;
                        }
                        sessionStillExists().then((exists) => {
                            if (exists) {
                                scheduleReconnect();
                            } else {
                                term.write('\r\n\x1b[33mSession ended.\x1b[0m\r\n');
                            }
                        });
                    };

                    ws.onerror = (e) => console.error('WebSocket error:', e);
                })
                .catch(err => {
                    console.error('Token fetch failed:', err);
                    term.write('\r\n\x1b[31mFailed to connect. Retrying...\x1b[0m\r\n');
                    setTimeout(connect, 3000);
                });
        }

        connect();
    })();
    </script>
</body>
</html>
