            const frameCover = document.getElementById('frame-cover');

            // Task M.3: every session-iframe navigation goes through here.
            // Same-origin location.replace() swaps the framed document
            // WITHOUT adding a joint session-history entry (a plain
            // frameEl.src= write pushes one per swap from the second swap
            // on), so history.length stays 1: the iOS-standalone
            // edge-back-swipe stays permanently disarmed and Android
            // predictive-back minimizes the app instead of walking stale
            // attaches. location.replace() does NOT reflect into the src
            // attribute — frameUrl tracks the current URL; always read it
            // instead of frameEl.src (which goes stale on the first swap).
            let frameUrl = '';
            // Session-swap cover: hide the iframe reload behind a themed panel
            // (#frame-cover). show is INSTANT (no fade-in, so the blank gap is
            // never seen); hide FADES out, called when the incoming terminal
            // posts tl-terminal-ready — or by the fallback timer. The terminal's
            // own reveal cap is 1500ms, so 1800ms here always outlives a real
            // reveal (directly-opened / errored / slow-connect terminals that
            // never signal still get uncovered).
            let coverTimer = null;
            function showFrameCover() {
                clearTimeout(coverTimer);
                frameCover.style.transition = 'none';
                frameCover.style.opacity = '1';
                coverTimer = setTimeout(hideFrameCover, 1800);
            }
            function hideFrameCover() {
                clearTimeout(coverTimer);
                frameCover.style.transition = 'opacity 200ms ease';
                frameCover.style.opacity = '0';
            }
            function setFrameUrl(url) {
                frameUrl = url;
                // Cover a real session (re)load; a jump to the empty state
                // (about:blank) just clears any lingering cover.
                if (url && url !== 'about:blank') showFrameCover();
                else hideFrameCover();
                try {
                    frameEl.contentWindow.location.replace(url);
                } catch (e) {
                    // Detached/foreign contentWindow — degraded fallback
                    // (costs one history entry, never a dead iframe).
                    frameEl.src = url;
                }
            }

            // Loading skeletons (Task 1.11d): three shimmer cards fill
            // #session-list until the first /sessions response — paint()
            // and both renderLobby error paths start with
            // clearChildren(listEl), which removes them.
            for (let i = 0; i < 3; i++) {
                const sk = document.createElement('div');
                sk.className = 'session-skeleton';
                sk.setAttribute('aria-hidden', 'true');
                listEl.appendChild(sk);
            }

            let currentActive = null;
            // A session is "confirmed" once a /sessions poll has actually listed
            // it. Only a confirmed-then-vanished session means it was killed
            // elsewhere (→ deactivate). A freshly-activated session that has
            // never appeared yet is still being CREATED — its tmux session is
            // born only after the iframe's WebSocket reaches ttyd (whoami →
            // token → ws). Tearing the iframe down before then aborts that very
            // chain ("Token fetch failed: TypeError: Failed to fetch"), so the
            // session never gets created. Gate deactivation on this flag.
            let activeConfirmed = false;
            let dragSrcCard = null;
            // Dragging a project header reorders whole groups; mutually
            // exclusive with dragSrcCard (a drag is one or the other).
            let dragSrcGroup = null;
            let dragSrcDockSession = null;   // set while dragging the dock header out to the sidebar
            let isDragging = false;
            // Task M.4: true while a long-press is PENDING on a card (finger
            // down, 500 ms timer running). Joins isDragging in the repaint
            // guards so the 5 s poll can't detach the card mid-press (the
            // recognizer's cancel listeners live on that very element).
            let gestureActive = false;
            // Task M.4: coarse pointers get long-press instead of HTML5 DnD
            // (which never fires from touch on Android anyway; iPadOS long-
            // press-drag WOULD fight the 500 ms timer). Touch reorder stays
            // via the ⋯ Move up/down items.
            const isCoarsePointer = matchMedia('(pointer: coarse)').matches;
            // Legacy per-browser drag-order; used once to seed the server-side
            // layout, then left alone.
            const ORDER_KEY = 'tmux-session-order-' + whoami.osUser;

            // The user's sidebar layout: ordered projects (may reference dead
            // sessions — kept so restores regroup, see ADR-0002) + ungrouped
            // order. Server-side so it roams across devices.
            let layout = { version: 1, projects: [], ungrouped: [], ungroupedIndex: 0 };
            let layoutLoaded = false;
            // Last /sessions payload — lets layout mutations repaint instantly
            // without waiting for the next poll.
            let lastSessions = [];

            function relativeTime(epochSec) {
                if (!epochSec) return '';
                const diff = Math.floor(Date.now() / 1000) - epochSec;
                if (diff < 60)    return diff + 's ago';
                if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            }

            function getSavedOrder() {
                try {
                    const raw = localStorage.getItem(ORDER_KEY);
                    if (!raw) return [];
                    const arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string') : [];
                } catch (e) { return []; }
            }

            // --- layout store client -----------------------------------------

            async function fetchLayout() {
                const resp = await fetch(LAYOUT_API, { credentials: 'same-origin' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const l = await resp.json();
                l.projects  = Array.isArray(l.projects)  ? l.projects  : [];
                l.ungrouped = Array.isArray(l.ungrouped) ? l.ungrouped : [];
                l.ungroupedIndex = Number.isInteger(l.ungroupedIndex)
                    ? Math.max(0, Math.min(l.ungroupedIndex, l.projects.length))
                    : 0;
                // Ctrl+J dock: {session, visible}. Degrade a malformed dock to
                // absent rather than crash (same posture as the fields above).
                if (l.dock && typeof l.dock === 'object' && typeof l.dock.session === 'string'
                        && /^[a-zA-Z0-9_-]{1,32}$/.test(l.dock.session)) {
                    l.dock = { session: l.dock.session, visible: l.dock.visible !== false,
                        dir: typeof l.dock.dir === 'string' ? l.dock.dir : '' };
                } else if ('dock' in l) {
                    delete l.dock;
                }
                return l;
            }

            // The sidebar is one ordered sequence of groups: the Ungrouped
            // section (sentinel) sitting at ungroupedIndex among the projects.
            // All reordering goes through this sequence so moving anything
            // past anything else — including Ungrouped itself — is one code
            // path.
            function groupSeq() {
                const seq = layout.projects.slice();
                seq.splice(Math.min(layout.ungroupedIndex, seq.length), 0, UNGROUPED_COLLAPSE_ID);
                return seq;
            }
            function applyGroupSeq(seq) {
                layout.ungroupedIndex = seq.indexOf(UNGROUPED_COLLAPSE_ID);
                layout.projects = seq.filter(x => x !== UNGROUPED_COLLAPSE_ID);
            }

            async function putLayout() {
                const resp = await fetch(LAYOUT_API, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(layout)
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
            }

            // Mutate-then-save: repaint optimistically, then persist; on failure
            // re-fetch so the sidebar snaps back to the server's truth.
            async function saveLayout() {
                paint();
                try {
                    await putLayout();
                } catch (err) {
                    showToast('Saving layout failed: ' + err.message, 'error', 4000);
                    try { layout = await fetchLayout(); } catch (e) { /* next poll */ }
                    paint();
                }
            }

            function projectOfSession(name) {
                for (const p of layout.projects) {
                    if (p.sessions.includes(name)) return p.name;
                }
                return '';
            }

            // Remove a session from every layout list (before re-inserting it
            // somewhere else). Returns true when something was removed.
            function pullFromLayout(name) {
                let removed = false;
                for (const p of layout.projects) {
                    const i = p.sessions.indexOf(name);
                    if (i >= 0) { p.sessions.splice(i, 1); removed = true; }
                }
                const i = layout.ungrouped.indexOf(name);
                if (i >= 0) { layout.ungrouped.splice(i, 1); removed = true; }
                return removed;
            }

            function moveSessionTo(name, projectName) {
                pullFromLayout(name);
                if (projectName === '') {
                    layout.ungrouped.push(name);
                } else {
                    const p = layout.projects.find(p => p.name === projectName);
                    if (!p) return;
                    p.sessions.push(name);
                }
                saveLayout();
            }

            // Rebuild ordering from the rendered cards after a drag. Live-card
            // order comes from the DOM; dead members (not rendered) are
            // re-appended to their project so a drag never drops the
            // assignments that make OOM restores regroup.
            function captureLayoutFromDom() {
                const deadByProject = new Map();
                const dirByProject = new Map();   // preserve project dirs across a drag
                const liveNames = new Set(lastSessions.map(s => s.name));
                for (const p of layout.projects) {
                    deadByProject.set(p.name, p.sessions.filter(n => !liveNames.has(n)));
                    if (p.dir) dirByProject.set(p.name, p.dir);
                }
                const deadUngrouped = layout.ungrouped.filter(n => !liveNames.has(n));

                const projects = [];
                let ungrouped = [];
                let ungroupedIndex = -1;
                listEl.querySelectorAll('.project-group').forEach(group => {
                    const name = group.dataset.project;
                    const members = Array.from(group.querySelectorAll('.session-card')).map(c => c.dataset.name);
                    if (name === '') {
                        ungrouped = members.concat(deadUngrouped);
                        ungroupedIndex = projects.length;
                    } else {
                        const proj = { name, sessions: members.concat(deadByProject.get(name) || []) };
                        if (dirByProject.has(name)) proj.dir = dirByProject.get(name);
                        projects.push(proj);
                    }
                });
                // The ungrouped group isn't rendered while empty — keep its
                // dead entries and its stored slot anyway.
                if (ungroupedIndex < 0) {
                    ungrouped = deadUngrouped;
                    ungroupedIndex = Math.min(layout.ungroupedIndex, projects.length);
                }
                const next = { version: 1, projects, ungrouped, ungroupedIndex };
                if (layout.dock) next.dock = layout.dock;   // dock survives a card drag
                layout = next;
            }

            // --- collapse state (per-browser view preference) ----------------

            const COLLAPSE_KEY = 'tmux-collapsed-' + whoami.osUser;
            const UNGROUPED_COLLAPSE_ID = '__ungrouped__';
            function getCollapsed() {
                try {
                    const raw = localStorage.getItem(COLLAPSE_KEY);
                    const obj = raw ? JSON.parse(raw) : {};
                    return (obj && typeof obj === 'object') ? obj : {};
                } catch (e) { return {}; }
            }
            function setCollapsed(id, collapsed) {
                const all = getCollapsed();
                if (collapsed) all[id] = 1; else delete all[id];
                try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(all)); } catch (e) {}
            }
            // Activating a session hidden inside a collapsed project would
            // highlight nothing — auto-expand its group.
            function ensureSessionVisible(name) {
                const proj = projectOfSession(name);
                const id = proj === '' ? UNGROUPED_COLLAPSE_ID : proj;
                if (getCollapsed()[id]) {
                    setCollapsed(id, false);
                    paint();
                }
            }

            function updateActiveCard() {
                listEl.querySelectorAll('.session-card').forEach(c => {
                    if (c.dataset.name === currentActive) c.classList.add('active');
                    else c.classList.remove('active');
                });
            }

            // Coarse + narrow = the full-screen two-view mobile nav (list ⇄
            // terminal). Drives both the CSS view flip and the JS that enters
            // the terminal view on attach and returns to the list on detach.
            const mobileQuery = matchMedia('(pointer: coarse) and (max-width: 720px)');

            // --- status pills v2 (Task 2.4) -----------------------------
            // "Unseen done" bookkeeping, T3's hasUnseenCompletion shape: a
            // done state stays emerald only while stateChangedAt > the
            // user's last visit. The hooks don't timestamp transitions, so
            // stateChangedAt is OUR first observation of each state —
            // persisted per-browser so reloads keep both the emerald latch
            // and the working timer's start:
            //   tl:session-visits:v1  name → epoch-ms of the last attach
            //                          (VISITS_KEY — declared in the shared
            //                          section since Task 4.1: the palette's
            //                          recents-first sort reads it too)
            //   tl:session-states:v1  name → {state, at} as of the last poll
            const STATES_KEY = 'tl:session-states:v1';
            function readStore(key) {
                try {
                    const obj = JSON.parse(localStorage.getItem(key));
                    return (obj && typeof obj === 'object') ? obj : {};
                } catch (e) { return {}; }
            }
            function writeStore(key, obj) {
                try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
            }
            function stampVisit(name) {
                const visits = readStore(VISITS_KEY);
                visits[name] = Date.now();
                writeStore(VISITS_KEY, visits);
            }
            // Every poll: timestamp state transitions, prune dead sessions
            // from both stores, and keep the attached session "seen" while
            // the tab is actually visible (attached-but-hidden completions
            // still earn the emerald).
            function trackStateChanges(sessions) {
                const states = readStore(STATES_KEY);
                const visits = readStore(VISITS_KEY);
                const live = new Set(sessions.map(s => s.name));
                let dirtyStates = false, dirtyVisits = false;
                for (const name of Object.keys(states)) {
                    if (!live.has(name)) { delete states[name]; dirtyStates = true; }
                }
                for (const name of Object.keys(visits)) {
                    if (!live.has(name)) { delete visits[name]; dirtyVisits = true; }
                }
                for (const s of sessions) {
                    const cur = s.state || '';
                    const rec = states[s.name];
                    if (!rec || rec.state !== cur) {
                        states[s.name] = { state: cur, at: Date.now() };
                        dirtyStates = true;
                    }
                }
                if (currentActive && live.has(currentActive) && !document.hidden) {
                    visits[currentActive] = Date.now();
                    dirtyVisits = true;
                }
                if (dirtyStates) writeStore(STATES_KEY, states);
                if (dirtyVisits) writeStore(VISITS_KEY, visits);
            }
            function stateChangedAt(name) {
                const rec = readStore(STATES_KEY)[name];
                return (rec && typeof rec.at === 'number') ? rec.at : 0;
            }
            function isUnseenDone(s) {
                if (s.state !== 'done') return false;
                return stateChangedAt(s.name) > (readStore(VISITS_KEY)[s.name] || 0);
            }
            // Elapsed-time formatting, ported from T3's formatWorkingTimer
            // (MessagesTimeline.tsx): "34s", "2m 10s", "1h 5m".
            function formatWorking(elapsedMs) {
                const sec = Math.max(0, Math.floor(elapsedMs / 1000));
                if (sec < 60) return sec + 's';
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                if (h > 0) return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
                return s > 0 ? m + 'm ' + s + 's' : m + 'm';
            }
            // One shared 1 Hz ticker drives every visible working timer —
            // span.textContent only, never a card re-render (plan/T3
            // requirement). Hidden tabs skip the work; the next poll's
            // paint refreshes anyway.
            setInterval(() => {
                if (document.hidden) return;
                listEl.querySelectorAll('.working-timer').forEach(el => {
                    el.textContent = formatWorking(Date.now() - Number(el.dataset.since));
                });
            }, 1000);

            // Tab title carries an attention badge for the MAX-priority
            // state across sessions (Task 2.4; priority order mirrors T3's
            // pill ranking): awaiting ● > running ⋯ > unseen-done ✓. The
            // awaiting shape (N●) predates this task — kept verbatim.
            function updateTitle() {
                const awaiting = lastSessions.filter(s => s.state === 'awaiting').length;
                const running  = lastSessions.filter(s => s.state === 'running').length;
                const unseen   = lastSessions.filter(isUnseenDone).length;
                const badge = awaiting > 0 ? '(' + awaiting + '●) '
                            : running  > 0 ? '(' + running + '⋯) '
                            : unseen   > 0 ? '(' + unseen + '✓) ' : '';
                // Bell/output attention (Task 2.1): '● <session>' leads while
                // latched; cleared the moment the user looks again.
                const attention = attentionSession ? '● ' + attentionSession + ' ' : '';
                // While attached, lead with the live command (Task 2.5,
                // T3's tab titles): "claude — worktree". Falls back to the
                // historic user/session shape until the poll knows one.
                const active = currentActive
                    && lastSessions.find(s => s.name === currentActive);
                const cmd = active && active.pane_current_command;
                document.title = attention + badge +
                    (currentActive
                        ? (cmd ? cmd + ' — ' + currentActive
                               : 'tmux: ' + whoami.osUser + '/' + currentActive)
                        : baseTitle);
            }

            // --- attention system (Task 2.1) -----------------------------
            // Three signals, one owner: this top-level lobby document owns
            // the tab's favicon and title (the terminal is an iframe INSIDE
            // it, so anything it did to its own icon/title would be
            // invisible). Signals:
            //   1. state=awaiting — from the ADR-0001 hooks via the same
            //      /sessions polling that paints the cards (no terminal
            //      output parsing anywhere): badges the favicon while ANY
            //      session awaits input, and fires the opt-in OS
            //      notification on each →awaiting transition while hidden.
            //   2. bell — the iframe forwards term.onBell (tl-attention).
            //   3. output-while-hidden — iframe-forwarded, title prefix.
            // Bell/output latch only while the tab is hidden or the window
            // unfocused (a visible focused tab already shows the terminal;
            // a badge set then could only clear on the NEXT focus event,
            // i.e. stick around) and clear on visibility/focus return.

            let attentionSession = null;  // '● <name>' title prefix latch
            let attentionBell = false;    // favicon badge latched by a bell
            function away() { return document.hidden || !document.hasFocus(); }

            // Favicon badge: the icon canvas-rendered with an awaiting-colored dot
            // top-right (--state-awaiting; the plan's 8px dot scaled to the
            // 64px favicon raster). Rendered once and cached; while the
            // icon route 404s (PWA asset carve-out lands in Wave 3) a
            // theme-colored tile stands in so the dot still shows.
            const faviconEl = document.querySelector('link[rel="icon"]');
            const FAVICON_HREF = '/icon-192.png';
            let faviconBadged = '';                  // '' | 'awaiting' | 'done'
            const badgedFaviconUrls = {};            // kind → rendered dataURL
            const badgedFaviconPending = {};         // kind → render in flight
            // Two badge KINDS (Viktor: "yellow signals something is wrong —
            // I'd prefer a green tick" for done): 'awaiting' keeps the amber
            // dot (Claude genuinely wants input — attention color earned);
            // 'done' — a turn finished, or the bell rang with nothing
            // awaiting — draws a GREEN CIRCLE with a WHITE TICK instead of
            // wearing the warning color for good news.
            function renderBadgedFavicon(kind, done) {
                const size = 64, r = 13, cx = size - r - 3, cy = r + 3;
                const css = getComputedStyle(document.body);
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const drawBadge = () => {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    if (kind === 'done') {
                        ctx.fillStyle = css.getPropertyValue('--state-done').trim() || '#56d364';
                        ctx.fill();
                        // white tick, stroke scaled to the 13px badge radius
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3.4;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(cx - r * 0.45, cy + r * 0.05);
                        ctx.lineTo(cx - r * 0.1, cy + r * 0.42);
                        ctx.lineTo(cx + r * 0.5, cy - r * 0.35);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = css.getPropertyValue('--state-awaiting').trim() || '#8b5cf6';
                        ctx.fill();
                    }
                    done(canvas.toDataURL('image/png'));
                };
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0, size, size); drawBadge(); };
                img.onerror = () => {
                    ctx.fillStyle = css.getPropertyValue('--bg-page').trim() || '#0d1117';
                    ctx.fillRect(0, 0, size, size);
                    drawBadge();
                };
                img.src = FAVICON_HREF;
            }
            function updateFavicon() {
                if (!faviconEl) return;
                // Kind precedence: any session awaiting input outranks the
                // finished/bell signal — amber only when action is wanted.
                const kind = lastSessions.some(s => s.state === 'awaiting') ? 'awaiting'
                    : (attentionBell ? 'done' : '');
                if (kind === faviconBadged) return;
                faviconBadged = kind;
                if (!kind) { faviconEl.href = FAVICON_HREF; return; }
                if (badgedFaviconUrls[kind]) { faviconEl.href = badgedFaviconUrls[kind]; return; }
                if (badgedFaviconPending[kind]) return;  // applied when the render lands
                badgedFaviconPending[kind] = true;
                renderBadgedFavicon(kind, (url) => {
                    badgedFaviconPending[kind] = false;
                    badgedFaviconUrls[kind] = url;
                    if (faviconBadged === kind) faviconEl.href = url;
                });
            }

            // Bell / output-while-hidden signals from the session iframe.
            // Only its window is trusted (source check) — same-origin pages
            // can't spoof attention into the title from elsewhere.
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-attention') return;
                if (e.source !== frameEl.contentWindow) return;
                if (!away()) return;
                const name = (typeof e.data.session === 'string' && NAME_RE.test(e.data.session))
                    ? e.data.session : currentActive;
                if (e.data.kind === 'bell') attentionBell = true;
                attentionSession = name;
                updateTitle();
                updateFavicon();
            });
            function clearAttention() {
                if (!attentionSession && !attentionBell) return;
                attentionSession = null;
                attentionBell = false;
                updateTitle();
                updateFavicon();
            }
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) clearAttention();
            });
            window.addEventListener('focus', clearAttention);

            // Opt-in OS notifications: fired on a session's transition INTO
            // awaiting (prev poll ≠ awaiting) while the tab is hidden. The
            // tag dedupes per session — a re-fire replaces, never stacks.
            // First poll seeds silently so a (re)loaded background tab
            // doesn't re-announce a long-standing awaiting state.
            const NOTIFY_KEY = 'tl:notify:v1';
            function notifyOptedIn() {
                try { return localStorage.getItem(NOTIFY_KEY) === '1'; }
                catch (e) { return false; }
            }
            // Item 4: register the push service worker. Failure must NEVER
            // break boot — /sw.js 404s until the infra asset carve-out
            // lands (fine and silent) and some browsers lack SWs entirely.
            // notifyTransitions prefers this registration's
            // showNotification, which works where the bare Notification
            // constructor throws (Android Chrome requires SW-backed
            // notifications — the old code's constructor throw was
            // swallowed, so Android never showed anything).
            let swRegistration = null;
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => { swRegistration = reg; })
                    .catch(() => { /* unsupported, or route not live yet */ });
            }
            // A usable Notification CONSTRUCTOR is the desktop fallback.
            // The probe (new Notification('')) is the task-specified
            // feature test; it only runs when there is NO service worker
            // (so it never fires on Android/desktop-with-SW), and is
            // closed immediately.
            function notifyConstructorUsable() {
                if (typeof Notification === 'undefined') return false;
                try { new Notification('').close(); return true; }
                catch (e) { return false; }
            }
            function notifyDeliverable() {
                return !!swRegistration || notifyConstructorUsable();
            }

            // --- background Web Push (Notifications Part 2) ----------------
            // Layered ON TOP of the foreground path above: subscribing lets
            // the server (tmux-api pushsender.go) notify even when no tab is
            // open. Everything here is BEST-EFFORT — if the server has no
            // VAPID key (vapid-public 404s), the browser lacks PushManager,
            // or subscribe() is refused, we silently stay foreground-only.
            // The shared tag 'tl-<session>' coalesces a background push with
            // any foreground notification, so the user is alerted at most once.
            function base64urlToUint8Array(base64url) {
                const pad = '='.repeat((4 - (base64url.length % 4)) % 4);
                const b64 = (base64url + pad).replace(/-/g, '+').replace(/_/g, '/');
                const raw = atob(b64);
                const out = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
                return out;
            }
            async function subscribePush() {
                try {
                    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
                    const reg = await navigator.serviceWorker.ready;
                    const resp = await fetch(VAPID_PUBLIC_API, { credentials: 'same-origin' });
                    if (!resp.ok) return;            // 404 → push dark server-side
                    const key = (await resp.text()).trim();
                    if (!key) return;
                    let sub = await reg.pushManager.getSubscription();
                    if (!sub) {
                        sub = await reg.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: base64urlToUint8Array(key)
                        });
                    }
                    await fetch(PUSH_SUBS_API, {
                        method: 'PUT',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sub.toJSON ? sub.toJSON() : sub)
                    });
                } catch (e) { /* enhancement only — foreground path still delivers */ }
            }
            async function unsubscribePush() {
                try {
                    if (!('serviceWorker' in navigator)) return;
                    const reg = await navigator.serviceWorker.ready;
                    const sub = await reg.pushManager.getSubscription();
                    if (!sub) return;
                    const endpoint = sub.endpoint;
                    await sub.unsubscribe();
                    await fetch(PUSH_SUBS_API, {
                        method: 'DELETE',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ endpoint })
                    });
                } catch (e) { /* best-effort; the server prunes dead endpoints on 404/410 */ }
            }
            // Self-diagnosis (settings Notifications section): is THIS
            // device/browser actually registered for background push on the
            // server? Compares this browser's live pushManager endpoint against
            // the stored list — a subscription the browser silently dropped, or
            // one that never reached the server, both surface as "no". Returns
            // 'yes' | 'no' | 'unsupported' (no SW/PushManager here at all).
            async function deviceSubscriptionState() {
                try {
                    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
                    const reg = await navigator.serviceWorker.ready;
                    const sub = await reg.pushManager.getSubscription();
                    if (!sub) return 'no';
                    const resp = await fetch(PUSH_SUBS_API, { credentials: 'same-origin' });
                    if (!resp.ok) return 'no';
                    const list = await resp.json();
                    return (Array.isArray(list) && list.some(s => s.endpoint === sub.endpoint)) ? 'yes' : 'no';
                } catch (e) { return 'no'; }
            }
            // kind is 'awaiting' (running→awaiting, "needs input") or 'done'
            // (running→done, "finished"). Both share the tag 'tl-<session>'
            // so a later awaiting alert REPLACES a finished one for the same
            // session (coalesce by tag; sw.js omits renotify) — identical to
            // the server payloads (tmux-api buildDonePayload/buildPushPayload).
            async function fireNotification(session, kind) {
                const finished = kind === 'done';
                const title = session + (finished ? ' finished' : ' needs input');
                const opts = {
                    tag: 'tl-' + session,
                    body: finished ? 'Claude finished its turn.' : 'Claude is awaiting your input.',
                    icon: FAVICON_HREF,
                    data: { session }
                };
                // Prefer the SW registration (Android + desktop); its
                // notificationclick routing lives in sw.js.
                if (swRegistration) {
                    try {
                        const reg = await navigator.serviceWorker.ready;
                        await reg.showNotification(title, opts);
                        return;
                    } catch (e) { /* fall through to the constructor */ }
                }
                try {
                    const n = new Notification(title, opts);
                    n.onclick = () => {
                        try { window.focus(); } catch (err) {}
                        activateSession(session);
                        n.close();
                    };
                } catch (e) { /* no usable delivery mechanism here */ }
            }
            let prevStates = null;  // name → state at the previous poll
            function notifyTransitions(sessions) {
                const prev = prevStates;
                prevStates = new Map(sessions.map(s => [s.name, s.state || '']));
                if (!prev) return;   // first poll after load seeds quietly
                // Opt-in + permission gate only — away() moved PER-SESSION
                // below: while the tab is focused, sessions you are NOT
                // viewing still notify (Viktor: orchestrating in the lobby,
                // sessions finish, "i get the in-app notification but
                // nothing on the desktop" — the old blanket !away() return
                // suppressed every OS notification while focused). The
                // ACTIVE session stays quiet when focused (you are looking
                // at it); the shared tl-<session> tag still coalesces with
                // any background push, so nothing double-alerts.
                if (!notifyOptedIn() || typeof Notification === 'undefined' ||
                    Notification.permission !== 'granted') return;
                // Per-user roamed gate (mirrors the server's parseNotifyPrefs):
                // onAwaiting/onDone default true, so an untouched doc notifies
                // on both — the bell opt-in + permission above still gate on top.
                const np = getPrefs().notify;
                for (const s of sessions) {
                    const was = prev.get(s.name);
                    // Focused + this is the session on screen → the user is
                    // watching it happen; no OS notification. Everything
                    // else (hidden, unfocused, or a background session while
                    // focused) notifies.
                    if (!away() && typeof currentActive !== 'undefined' && s.name === currentActive) continue;
                    if (s.state === 'awaiting' && was !== 'awaiting') {
                        // Seeding fix (Item 4): a session first seen (absent
                        // from prev) that is ALREADY awaiting counts as a
                        // transition and is announced — only the very first
                        // poll after load stays quiet (the `if (!prev) return`
                        // above). Skip only when it was awaiting LAST poll too
                        // (no transition — the tag would merely re-fire).
                        if (np.onAwaiting) fireNotification(s.name, 'awaiting');
                    } else if (s.state === 'done' && was === 'running') {
                        // Finished edge — deliberately STRICTER than awaiting:
                        // only a genuine running→done turn completion fires, so
                        // a freshly-seen done session (was undefined) and a
                        // SessionStart→done never announce (matches the server).
                        if (np.onDone) fireNotification(s.name, 'done');
                    }
                }
            }

            // Bell toggle — the ONLY place notification permission is ever
            // requested (click = user gesture; never auto-request). Opt-in
            // is per-browser in localStorage; a browser-level "denied" wins
            // and is surfaced instead of silently doing nothing.
            const notifyToggleEl = document.getElementById('notify-toggle');
            function paintNotifyToggle() {
                const on = notifyOptedIn() &&
                    typeof Notification !== 'undefined' &&
                    Notification.permission === 'granted';
                // Icon fix: the enabled state swaps the bell for bell-ring;
                // the .on rule's color turns it accent via currentColor.
                notifyToggleEl.replaceChildren(iconNode(on ? 'bell-ring' : 'bell', 16));
                notifyToggleEl.classList.toggle('on', on);
                notifyToggleEl.setAttribute('aria-pressed', on ? 'true' : 'false');
                notifyToggleEl.title = on
                    ? 'Notifying you when Claude finishes or needs input on this device (click to disable). Enable on each device you want pushes on.'
                    : 'Notify me when Claude finishes or needs input. Per device + browser — enable on each device you want pushes on (e.g. also in the installed iPhone app).';
            }
            if (typeof Notification === 'undefined') {
                // No Notification API here. On iOS this means Safari OUTSIDE an
                // installed PWA: Apple allows web push only from a Home-Screen
                // app, so keep the bell visible and, on tap, tell the user how
                // to enable it (PushManager is likewise absent until then).
                // Everywhere else it is genuinely unsupported → hide the bell.
                const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
                if (iOS && !standalone && !('PushManager' in window)) {
                    notifyToggleEl.title = 'Install to Home Screen for notifications';
                    notifyToggleEl.addEventListener('click', () => {
                        showToast('On iPhone/iPad: tap Share, then "Add to Home Screen", ' +
                            'open the installed app, and enable notifications there.', 'info', 6000);
                    });
                } else {
                    notifyToggleEl.style.display = 'none';
                }
            } else {
                notifyToggleEl.addEventListener('click', async () => {
                    if (notifyOptedIn() && Notification.permission === 'granted') {
                        try { localStorage.setItem(NOTIFY_KEY, '0'); } catch (e) {}
                        paintNotifyToggle();
                        unsubscribePush();  // drop this device's background push too
                        return;
                    }
                    let perm = Notification.permission;
                    if (perm === 'default') {
                        try { perm = await Notification.requestPermission(); }
                        catch (e) { perm = Notification.permission; }
                    }
                    if (perm !== 'granted') {
                        showToast('Notifications are blocked in the browser settings', 'error', 4000);
                        paintNotifyToggle();
                        return;
                    }
                    // Item 4: permission granted — confirm SOMETHING can
                    // actually deliver (the SW registration, or a usable
                    // Notification constructor) before enabling a toggle
                    // that would otherwise show nothing (e.g. Android
                    // before the /sw.js route lands).
                    if (!notifyDeliverable()) {
                        showToast('Notifications are not supported in this browser', 'error', 4000);
                        paintNotifyToggle();
                        return;
                    }
                    try { localStorage.setItem(NOTIFY_KEY, '1'); } catch (e) {}
                    paintNotifyToggle();
                    showToast('You will be notified when a session needs input', 'success', 3000);
                    // Also register for BACKGROUND push (works when no tab is
                    // open); best-effort, foreground already works without it.
                    subscribePush();
                });
            }
            paintNotifyToggle();
            // Self-heal the BACKGROUND push subscription on every load (the
            // desktop-silent finding): subscribePush is idempotent
            // (getSubscription reuses, PUT upserts by endpoint), but it used
            // to run ONLY on bell-click — a lapsed/rotated desktop endpoint
            // stayed dead forever while the server kept 201-ing into the
            // void. One best-effort refresh per load keeps this device''s
            // endpoint current whenever the bell is on + permission granted.
            if (notifyOptedIn() && typeof Notification !== 'undefined' &&
                Notification.permission === 'granted') {
                try { subscribePush(); } catch (e) {}
            }

            // Item 2: header ⟳ — a plain reload, mirrored by the settings
            // panel "Reload app" row. Handy in the installed PWA, where
            // there is no browser chrome / refresh button (and the bell is
            // hidden entirely when Notification is unavailable, so this
            // stays a reachable manual-reload affordance).
            const reloadToggleEl = document.getElementById('reload-toggle');
            if (reloadToggleEl) {
                reloadToggleEl.addEventListener('click', () => location.reload());
            }

            // Frame URL for a session attach: name plus (when not
            // 'default') the roamed new-session command key as a second
            // arg. Existing sessions ignore it (tmux -A); a dead session
            // resurrected by this attach runs the chosen command.
            // The base pwd for sessions launched in a project — empty when the
            // session is ungrouped or its project has no dir. Sent to the attach
            // script, which applies it via `tmux new-session -c`.
            function projectDirForSession(name) {
                const pname = projectOfSession(name);
                if (!pname) return '';
                const p = layout.projects.find(x => x.name === pname);
                return (p && p.dir) || '';
            }
            function frameArgs(name, opts) {
                let u = '/?arg=' + encodeURIComponent(name);
                let cmd = 'default';
                if (opts && opts.cmd) {
                    cmd = opts.cmd;                  // forced command (e.g. 'shell')
                } else {
                    try {
                        const k = getPrefs().session.newCommand;
                        if (k) cmd = k;
                    } catch (e) {}
                }
                // A project dir must land at arg3, so whenever we send a dir we
                // ALSO send the command at arg2 — as 'default' when none, which
                // the attach scripts treat identically to omitting it (a launcher
                // user's tmux default-command, e.g. emo's start-claude.sh, then
                // runs). With no dir, keep the historic shape (arg2 only for a
                // non-'default' command). tmux -A ignores -c on a live session,
                // so sending the dir on every attach is harmless and lets a
                // resurrected project session land back in its dir.
                // opts.dir (new-shell shortcut) overrides the session's own
                // project dir: the new session is Ungrouped but must launch in
                // the CURRENT session's project dir. '' means home (no arg3).
                const dir = (opts && typeof opts.dir === 'string')
                    ? opts.dir : projectDirForSession(name);
                if (dir) {
                    u += '&arg=' + encodeURIComponent(cmd) + '&arg=' + encodeURIComponent(dir);
                } else if (cmd !== 'default') {
                    u += '&arg=' + encodeURIComponent(cmd);
                }
                return u;
            }

            // A create must not silently reattach to an existing session
            // (ttyd's `tmux new-session -A` would): reject a name that is
            // already a live session, exactly as project creation rejects a
            // duplicate project name. Case-sensitive, matching tmux. This
            // guards the two deliberate CREATE actions only (never attach-by-
            // click / deep link, where reattaching is the point); the server's
            // -A stays the backstop against the ~5s-stale poll window.
            function sessionExists(name) {
                return lastSessions.some(s => s.name === name);
            }
            function activateSession(name, opts) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                // The docked session lives in the bottom panel — targeting it
                // (card click / Alt+N / cycle) reveals + focuses the dock rather
                // than swapping it to the top. Coarse pointers have no dock.
                {
                    const ds = dockState();
                    if (ds.session === name && !isCoarsePointer) {
                        if (!ds.visible) {
                            dockGraceUntil = Date.now() + 4000;
                            layout.dock = { session: name, visible: true, dir: ds.dir };
                            applyDock();
                            saveLayout();
                        }
                        focusDockSoon();
                        return;
                    }
                }
                if (currentActive === name) {
                    // Re-tapping the attached session from the browsing view
                    // flips forward to its terminal (mobile two-view nav). The
                    // iframe stayed alive behind the list, so this is a pure
                    // view flip — no reload. Desktop: just refresh the card.
                    updateActiveCard();
                    if (mobileQuery.matches) setSidebarCollapsed(true);
                    return;
                }
                currentActive = name;
                // Task MF-5: remember this device's last attached session
                // for the hashless coarse-pointer reland (edge-back swipe).
                try { localStorage.setItem(LAST_ACTIVE_KEY, name); } catch (e) {}
                activeConfirmed = false;
                emptyEl.classList.add('hidden');
                frameEl.classList.remove('hidden');
                setFrameUrl(frameArgs(name, opts));
                if (location.hash.slice(1) !== name) {
                    history.replaceState(null, '', '#' + name);
                }
                // Attaching = seeing (Task 2.4): clears the unseen-done
                // emerald; paint() repaints the dot + title badge now
                // rather than on the next poll.
                stampVisit(name);
                updateTitle();
                ensureSessionVisible(name);
                updateActiveCard();
                // Mobile two-view nav: attaching flips to the full-screen
                // terminal view. Replaces the old one-shot auto-collapse —
                // now EVERY activation enters the terminal view on a phone.
                if (mobileQuery.matches) setSidebarCollapsed(true);
                paint();
            }

            function deactivateSession() {
                if (!currentActive && frameEl.classList.contains('hidden')) return;
                currentActive = null;
                // Task MF-5: a detach means the user chose the list (or the
                // session died) — a later hashless boot must honor that.
                try { localStorage.removeItem(LAST_ACTIVE_KEY); } catch (e) {}
                activeConfirmed = false;
                frameEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                setFrameUrl('about:blank');
                if (location.hash) {
                    history.replaceState(null, '', location.pathname + location.search);
                }
                updateTitle();
                updateActiveCard();
                // Mobile two-view nav: a detach empties the terminal, so drop
                // back to the full-screen list rather than a blank terminal.
                if (mobileQuery.matches) setSidebarCollapsed(false);
            }

            async function killSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (!confirm('Kill tmux session "' + name + '"? Any running processes inside it will be terminated.')) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(name), {
                        method: 'DELETE', credentials: 'same-origin'
                    });
                    if (resp.ok) {
                        showToast('Killed ' + name, 'success');
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else {
                        showToast('Kill failed: HTTP ' + resp.status, 'error');
                    }
                    if (currentActive === name) deactivateSession();
                    renderLobby();
                } catch (err) {
                    showToast('Kill error: ' + err.message, 'error');
                }
            }

            // Restore the current user's saved-but-dead sessions (tmux-persist
            // manifest) on demand. Non-destructive: tmux-persist skips sessions
            // that are already live, so this only recreates missing ones and
            // resumes their Claude conversations. Useful after an OOM kills the
            // tmux server without a reboot (the boot-only restore never fires).
            async function restoreSessions(btn) {
                if (btn) btn.disabled = true;
                try {
                    const resp = await fetch(RESTORE_API, { method: 'POST', credentials: 'same-origin' });
                    if (resp.ok) {
                        showToast('Restoring your saved sessions…', 'success', 3500);
                        quickRefreshAfterCreate();
                    } else if (resp.status === 401 || resp.status === 403) {
                        showToast('Not authorized to restore', 'error', 4000);
                    } else {
                        showToast('Restore failed: HTTP ' + resp.status, 'error', 4000);
                    }
                } catch (err) {
                    showToast('Restore error: ' + err.message, 'error', 4000);
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            // performRename: the network + bookkeeping half, shared by the
            // prompt flow (⋯ menu / context menu on touch) and the inline
            // editor (Task 2.5). Returns true on success.
            async function performRename(oldName, newName) {
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(oldName) + '/rename', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    if (resp.status === 204) {
                        // The server renames the layout entry too — the next
                        // fetch reflects it; mirror locally for the instant
                        // repaint.
                        for (const p of layout.projects) {
                            const i = p.sessions.indexOf(oldName);
                            if (i >= 0) p.sessions[i] = newName;
                        }
                        const ui = layout.ungrouped.indexOf(oldName);
                        if (ui >= 0) layout.ungrouped[ui] = newName;
                        // Carry the pills-v2 bookkeeping (Task 2.4) to the
                        // new key or a done session re-latches as "unseen"
                        // right after its rename.
                        for (const key of [VISITS_KEY, STATES_KEY]) {
                            const store = readStore(key);
                            if (oldName in store) {
                                store[newName] = store[oldName];
                                delete store[oldName];
                                writeStore(key, store);
                            }
                        }
                        showToast('Renamed to ' + newName, 'success');
                        if (currentActive === oldName) {
                            currentActive = newName;
                            setFrameUrl(frameArgs(newName));
                            history.replaceState(null, '', '#' + newName);
                            updateTitle();
                        }
                        renderLobby();
                        return true;
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else if (resp.status === 409) {
                        showToast('Name "' + newName + '" already taken', 'error', 4000);
                    } else if (resp.status === 400) {
                        showToast('Invalid name', 'error');
                    } else {
                        showToast('Rename failed: HTTP ' + resp.status, 'error');
                    }
                } catch (err) {
                    showToast('Rename error: ' + err.message, 'error');
                }
                return false;
            }

            async function renameSession(oldName) {
                if (!NAME_RE.test(oldName)) { showToast('Invalid name', 'error'); return; }
                const input = prompt('Rename "' + oldName + '" to:', oldName);
                if (input === null) return;
                const newName = input.trim();
                if (!NAME_RE.test(newName)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (newName === oldName) return;
                await performRename(oldName, newName);
            }

            // Inline rename (Task 2.5): double-click a card title → the
            // name swaps for an input posting to the same rename endpoint.
            // Enter commits, Escape/blur cancels. The card's drag is
            // disarmed while editing so selecting text inside the input
            // can't start a card drag; every key/pointer event stops at
            // the input (the card beneath activates on click/Enter/Space).
            //
            // renameEditing pauses the poll repaint exactly like
            // openMenuEl/ctxMenuOpen (2026-07-11 finding: paint() rebuilds
            // the card DOM, destroying the focused editor at the next 5s
            // poll or state-change repaint). Cleared the moment the edit
            // settles — commit, Escape, blur — so the repaint that re-keys
            // a renamed card still happens.
            let renameEditing = false;
            function startInlineRename(name) {
                const card = listEl.querySelector('.session-card[data-name="' + name + '"]');
                const nameEl = card && card.querySelector('.session-name');
                if (!nameEl || nameEl.querySelector('input')) return;
                renameEditing = true;
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'rename-input';
                input.value = name;
                input.maxLength = 32;
                input.setAttribute('aria-label', 'Rename session ' + name);
                const wasDraggable = card.draggable;
                card.draggable = false;
                clearChildren(nameEl);
                nameEl.appendChild(input);
                let settled = false;
                function finish() {
                    if (settled) return;
                    settled = true;
                    renameEditing = false;
                    card.draggable = wasDraggable;
                    nameEl.textContent = name;   // renderLobby repaints after a commit
                }
                for (const type of ['pointerdown', 'mousedown', 'click', 'dblclick', 'contextmenu']) {
                    input.addEventListener(type, (e) => e.stopPropagation());
                }
                input.addEventListener('keydown', async (e) => {
                    e.stopPropagation();
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        finish();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        const newName = input.value.trim();
                        if (newName === name) { finish(); return; }
                        if (!NAME_RE.test(newName)) {
                            showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                            return;   // editor stays open for correction
                        }
                        settled = true;   // block the blur-cancel during the await
                        renameEditing = false;   // repaint may resume (it re-keys the card)
                        card.draggable = wasDraggable;
                        const ok = await performRename(name, newName);
                        if (!ok) nameEl.textContent = name;
                    }
                });
                input.addEventListener('blur', finish);
                input.focus();
                input.select();
            }

            // --- focus return after overlays (Task 2.3), lobby flavor --------
            // Overlays here live OUTSIDE the terminal iframe, so "focus the
            // terminal" is a postMessage hop into it (the iframe's own
            // requestTerminalFocus rAF-focuses xterm; a stale build without
            // the tl-focus branch degrades to today's behavior). Future
            // lobby-side overlays (settings panel, Task 2.6) route their
            // dismissal through closeOverlay too.
            function requestTerminalFocus() {
                if (!currentActive || frameEl.classList.contains('hidden') ||
                    !frameEl.contentWindow) return;
                try {
                    frameEl.contentWindow.postMessage({ type: 'tl-focus' }, location.origin);
                } catch (e) {}
            }
            function closeOverlay(el) {
                if (el && el.parentNode) el.remove();
                requestTerminalFocus();
            }

            // --- popup menu (session ⋯ and project ⋯) -------------------------

            let openMenuEl = null;
            // >0 while a right-click context menu is up — pauses the poll
            // repaint exactly like openMenuEl (a 5s paint mid-aim would
            // swap the cards under the pointer).
            let ctxMenuOpen = 0;
            // refocus=true on user DISMISSALS (Escape, picking an item) —
            // the keyboard goes back to the terminal. Deliberately false
            // when replaced by another openMenu() and on outside-click
            // dismissal: the click chooses its own focus target (e.g. the
            // new-session input) and stealing it back would be worse.
            function closeMenu(refocus) {
                if (!openMenuEl) return;
                const el = openMenuEl;
                openMenuEl = null;
                if (refocus) closeOverlay(el);
                else el.remove();
            }
            // items: {label, onClick, danger?, disabled?} or {labelHeading}
            function openMenu(anchor, items) {
                closeMenu();
                const menu = document.createElement('div');
                menu.className = 'popup-menu';
                for (const it of items) {
                    if (it.labelHeading) {
                        const l = document.createElement('div');
                        l.className = 'menu-label';
                        l.textContent = it.labelHeading;
                        menu.appendChild(l);
                        continue;
                    }
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = it.label;
                    if (it.danger) b.classList.add('danger');
                    if (it.disabled) b.disabled = true;
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // refocus rides a rAF, so it lands AFTER any
                        // synchronous prompt()/confirm() the item opens —
                        // dialogs hand focus back to the terminal too.
                        closeMenu(true);
                        it.onClick();
                    });
                    menu.appendChild(b);
                }
                document.body.appendChild(menu);
                const r = anchor.getBoundingClientRect();
                const mw = menu.offsetWidth, mh = menu.offsetHeight;
                let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
                let top  = r.bottom + 4;
                if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
                menu.style.left = Math.max(8, left) + 'px';
                menu.style.top  = top + 'px';
                openMenuEl = menu;
            }
            document.addEventListener('pointerdown', (e) => {
                if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu(true);
            });

            // --- project CRUD --------------------------------------------------

            function promptProjectName(promptText, initial) {
                const input = prompt(promptText, initial || '');
                if (input === null) return null;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Project name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return null;
                }
                if (layout.projects.some(p => p.name === name)) {
                    showToast('Project "' + name + '" already exists', 'error', 4000);
                    return null;
                }
                return name;
            }

            function createProject() {
                openProjectModal({ mode: 'create' });
            }

            function renameProject(oldName) {
                const name = promptProjectName('Rename project "' + oldName + '" to:', oldName);
                if (!name || name === oldName) return;
                const p = layout.projects.find(p => p.name === oldName);
                if (!p) return;
                p.name = name;
                // Carry the per-browser collapse flag to the new name.
                const collapsed = getCollapsed()[oldName];
                setCollapsed(oldName, false);
                if (collapsed) setCollapsed(name, true);
                saveLayout();
            }

            // Deleting a project never touches tmux — members drop back to
            // Ungrouped.
            function deleteProject(name) {
                const p = layout.projects.find(p => p.name === name);
                if (!p) return;
                const liveNames = new Set(lastSessions.map(s => s.name));
                const liveMembers = p.sessions.filter(n => liveNames.has(n));
                const suffix = liveMembers.length
                    ? ' Its ' + liveMembers.length + ' session' + (liveMembers.length > 1 ? 's' : '') + ' move to Ungrouped.'
                    : '';
                if (!confirm('Delete project "' + name + '"?' + suffix + ' (Sessions are never killed by this.)')) return;
                layout.ungrouped.push(...p.sessions);
                layout.projects = layout.projects.filter(x => x !== p);
                layout.ungroupedIndex = Math.min(layout.ungroupedIndex, layout.projects.length);
                setCollapsed(name, false);
                saveLayout();
            }

            // --- project create / set-directory modal -------------------------
            // A small centered dialog: (create) project name + a fuzzy dir
            // picker; (edit-dir) just the picker for an existing project. The
            // chosen dir becomes the base pwd for sessions launched in the
            // project (frameArgs → tmux new-session -c). Candidates come once
            // from GET /dirs (scanned under the user's home) and are filtered
            // client-side; an absolute path can also be typed for anything the
            // scan didn't surface. Blank = no dir (sessions use $HOME).

            // Subsequence fuzzy score (case-insensitive): -1 = no match, higher
            // is better, with a bonus for contiguous runs so "tript" ranks
            // ".../tripit" above scattered hits.
            function fuzzyScore(query, str) {
                const q = query.toLowerCase(), s = str.toLowerCase();
                if (!q) return 0;
                let qi = 0, score = 0, last = -2;
                for (let si = 0; si < s.length && qi < q.length; si++) {
                    if (s[si] === q[qi]) {
                        score += (si === last + 1) ? 2 : 1;
                        last = si; qi++;
                    }
                }
                return qi === q.length ? score : -1;
            }

            let dirCache = null;   // last GET /dirs result, refreshed on open

            function openProjectModal(opts) {
                const editing = opts.mode === 'edit-dir';
                const proj = editing ? layout.projects.find(p => p.name === opts.projectName) : null;
                if (editing && !proj) return;
                let selectedDir = editing ? (proj.dir || '') : '';

                const backdrop = document.createElement('div');
                backdrop.className = 'pd-backdrop';
                const modal = document.createElement('div');
                modal.className = 'pd-modal';
                backdrop.appendChild(modal);

                const title = document.createElement('div');
                title.className = 'pd-title';
                title.textContent = editing ? ('Directory for “' + proj.name + '”') : 'New project';
                modal.appendChild(title);

                let nameInput = null;
                if (!editing) {
                    const nrow = document.createElement('div');
                    nrow.className = 'pd-field';
                    const nlab = document.createElement('label');
                    nlab.textContent = 'Name';
                    nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.maxLength = 32;
                    nameInput.placeholder = 'project name';
                    nameInput.autocomplete = 'off';
                    nrow.appendChild(nlab);
                    nrow.appendChild(nameInput);
                    modal.appendChild(nrow);
                }

                const selRow = document.createElement('div');
                selRow.className = 'pd-selected';
                function renderSelected() {
                    selRow.textContent = 'Directory: ' + (selectedDir || '(home — no directory)');
                }
                renderSelected();
                modal.appendChild(selRow);

                const search = document.createElement('input');
                search.type = 'text';
                search.className = 'pd-search';
                search.placeholder = 'search ~ or type an absolute path';
                search.autocomplete = 'off';
                modal.appendChild(search);

                const list = document.createElement('div');
                list.className = 'pd-list';
                modal.appendChild(list);

                const hint = document.createElement('div');
                hint.className = 'pd-hint';
                modal.appendChild(hint);

                function renderList() {
                    const q = search.value.trim();
                    list.replaceChildren();
                    const rows = [{ label: '(home — no directory)', dir: '' }];
                    if (q.startsWith('/')) rows.push({ label: 'Use path: ' + q, dir: q });
                    if (dirCache && dirCache.dirs) {
                        const scored = [];
                        for (const d of dirCache.dirs) {
                            const sc = fuzzyScore(q, d);
                            if (sc >= 0) scored.push([sc, d]);
                        }
                        scored.sort((a, b) => b[0] - a[0] || a[1].length - b[1].length);
                        for (const pair of scored.slice(0, 100)) rows.push({ label: pair[1], dir: pair[1] });
                    }
                    for (const r of rows) {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.className = 'pd-row' + (r.dir === selectedDir ? ' active' : '');
                        b.textContent = r.label;
                        b.title = r.dir || '';
                        b.addEventListener('click', () => {
                            selectedDir = r.dir;
                            renderSelected();
                            renderList();
                            search.focus();
                        });
                        list.appendChild(b);
                    }
                }

                const footer = document.createElement('div');
                footer.className = 'pd-footer';
                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'pd-btn';
                cancelBtn.textContent = 'Cancel';
                const saveBtn = document.createElement('button');
                saveBtn.type = 'button';
                saveBtn.className = 'pd-btn pd-primary';
                saveBtn.textContent = editing ? 'Save' : 'Create';
                footer.appendChild(cancelBtn);
                footer.appendChild(saveBtn);
                modal.appendChild(footer);

                function close() {
                    backdrop.remove();
                    document.removeEventListener('keydown', onKey);
                    requestTerminalFocus();
                }
                function onKey(e) {
                    if (e.key === 'Escape') { e.stopPropagation(); close(); }
                }
                cancelBtn.addEventListener('click', close);
                backdrop.addEventListener('pointerdown', (e) => { if (e.target === backdrop) close(); });
                document.addEventListener('keydown', onKey);
                search.addEventListener('input', renderList);

                saveBtn.addEventListener('click', () => {
                    if (selectedDir && !selectedDir.startsWith('/')) {
                        showToast('Directory must be an absolute path', 'error', 4000);
                        return;
                    }
                    if (editing) {
                        if (selectedDir) proj.dir = selectedDir; else delete proj.dir;
                        saveLayout();
                        close();
                        return;
                    }
                    const name = (nameInput.value || '').trim();
                    if (!NAME_RE.test(name)) {
                        showToast('Project name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                        return;
                    }
                    if (layout.projects.some(p => p.name === name)) {
                        showToast('Project "' + name + '" already exists', 'error', 4000);
                        return;
                    }
                    const p = { name, sessions: [] };
                    if (selectedDir) p.dir = selectedDir;
                    layout.projects.push(p);
                    saveLayout();
                    close();
                });

                document.body.appendChild(backdrop);
                renderList();
                (nameInput || search).focus();

                // Fetch candidates once; re-render when they land. A stale
                // cache from a previous open renders instantly meanwhile.
                hint.textContent = 'Loading directories…';
                fetch(DIRS_API, { credentials: 'same-origin' })
                    .then((resp) => { if (!resp.ok) throw new Error('HTTP ' + resp.status); return resp.json(); })
                    .then((data) => {
                        dirCache = data;
                        hint.textContent = data.truncated
                            ? 'Showing a subset — type an absolute path if you don’t see it.'
                            : '';
                        renderList();
                    })
                    .catch(() => { hint.textContent = 'Could not scan directories — type an absolute path.'; });
            }

            // Move a group one visual slot up/down — the touch-friendly
            // counterpart of dragging its header. Works on the combined
            // sequence, so projects and the Ungrouped section move past each
            // other symmetrically. groupId '' = Ungrouped.
            function moveGroup(groupId, delta) {
                const seq = groupSeq();
                const i = groupId === ''
                    ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                    : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === groupId);
                const j = i + delta;
                if (i < 0 || j < 0 || j >= seq.length) return;
                const [g] = seq.splice(i, 1);
                seq.splice(j, 0, g);
                applyGroupSeq(seq);
                saveLayout();
            }

            // Header "+" — create a session directly inside the project. The
            // assignment is recorded BEFORE the iframe spawn so the card never
            // flickers through Ungrouped.
            function createSessionInProject(projectName) {
                const input = prompt('New session in "' + projectName + '":');
                if (input === null) return;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (sessionExists(name)) {
                    showToast('Session "' + name + '" already exists', 'error', 4000);
                    return;
                }
                moveSessionTo(name, projectName);
                activateSession(name);
                quickRefreshAfterCreate();
            }

            function moveMenuItems(sessionName) {
                const current = projectOfSession(sessionName);
                const items = [{ labelHeading: 'Move to' }];
                if (current !== '') {
                    items.push({ label: 'Ungrouped', onClick: () => moveSessionTo(sessionName, '') });
                }
                for (const p of layout.projects) {
                    if (p.name === current) continue;
                    items.push({ label: p.name, onClick: () => moveSessionTo(sessionName, p.name) });
                }
                if (items.length === 1) {
                    items.push({ label: 'No projects yet', onClick: () => {}, disabled: true });
                }
                return items;
            }

            // --- rendering -----------------------------------------------------

            function stateDot(state, extraClass) {
                if (!state) return null;
                const dot = document.createElement('span');
                dot.className = 'state-dot ' + state + (extraClass ? ' ' + extraClass : '');
