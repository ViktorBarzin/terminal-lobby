                if (extraClass === 'unseen') dot.title += ' (new since your last visit)';
                return dot;
            }

            // Running cards carry "● ● ● Working for Xs" in the detail row
            // (Task 2.4). The seconds span self-ticks via the shared 1 Hz
            // interval — dataset.since anchors it to the state transition.
            function workingNote(sinceMs) {
                const note = document.createElement('span');
                note.className = 'working-note';
                for (let i = 0; i < 3; i++) note.appendChild(document.createElement('i'));
                note.append('Working for ');
                const timer = document.createElement('span');
                timer.className = 'working-timer';
                timer.dataset.since = String(sinceMs || Date.now());
                timer.textContent = formatWorking(Date.now() - Number(timer.dataset.since));
                note.appendChild(timer);
                return note;
            }

            function renderCard(s) {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.dataset.name = s.name;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', 'Activate session ' + s.name);
                card.draggable = true;
                if (s.name === currentActive) card.classList.add('active');

                const meta = document.createElement('div');
                meta.className = 'session-meta';
                const titleRow = document.createElement('div');
                titleRow.className = 'session-title-row';
                const dot = stateDot(s.state, isUnseenDone(s) ? 'unseen' : '');
                if (dot) titleRow.appendChild(dot);
                const name = document.createElement('div');
                name.className = 'session-name';
                name.textContent = s.name;
                titleRow.appendChild(name);
                // Live-command chip (Task 2.5): tmux's pane_current_command
                // for the active pane, straight off the /sessions poll.
                if (s.pane_current_command) {
                    const chip = document.createElement('span');
                    chip.className = 'cmd-chip';
                    chip.textContent = s.pane_current_command;
                    chip.title = s.pane_title
                        ? s.pane_current_command + ' — ' + s.pane_title
                        : s.pane_current_command;
                    titleRow.appendChild(chip);
                }
                meta.appendChild(titleRow);
                const detail = document.createElement('div');
                detail.className = 'session-detail' + (s.attached > 0 ? ' attached' : '');
                const attachedText = s.attached > 0 ? (s.attached + ' attached') : 'idle';
                detail.append(attachedText + ' · ' + relativeTime(s.lastActivity));
                if (s.state === 'running') {
                    detail.append(' · ');
                    detail.appendChild(workingNote(stateChangedAt(s.name)));
                }
                meta.appendChild(detail);
                card.appendChild(meta);

                const actions = document.createElement('div');
                actions.className = 'session-actions';
                const menuBtn = document.createElement('button');
                menuBtn.textContent = '⋯';
                menuBtn.title = 'Session actions';
                menuBtn.setAttribute('aria-label', 'Actions for session ' + s.name);
                menuBtn.draggable = false;
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMenu(menuBtn, [
                        ...moveMenuItems(s.name),
                        { labelHeading: 'Session' },
                        { label: 'Rename', onClick: () => renameSession(s.name) },
                        { label: 'Kill', danger: true, onClick: () => killSession(s.name) }
                    ]);
                });
                actions.appendChild(menuBtn);
                card.appendChild(actions);

                card.addEventListener('click', (e) => {
                    // detail > 1 = second click of a double-click — the
                    // inline-rename path owns it (Task 2.5 guard).
                    if (e.detail > 1) return;
                    activateSession(s.name);
                });
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateSession(s.name);
                    }
                });
                // Double-click the TITLE → inline rename (Task 2.5).
                // Guards per plan: nested buttons/inputs keep their own
                // double-click, held modifiers mean something else.
                card.addEventListener('dblclick', (e) => {
                    if (!e.target.closest('.session-title-row')) return;
                    if (e.target.closest('button, input')) return;
                    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
                    e.preventDefault();
                    startInlineRename(s.name);
                });
                // Right-click → the ⋯ menu at the pointer (Task 2.5) — on
                // CARDS only, never the terminal (red line: the xterm
                // surface keeps the native browser menu).
                card.addEventListener('contextmenu', async (e) => {
                    if (e.target.closest('input')) return;   // native menu inside the rename editor
                    e.preventDefault();
                    closeMenu();
                    ctxMenuOpen++;
                    let picked = null;
                    try {
                        picked = await showContextMenu(e.clientX, e.clientY, [
                            ...moveMenuItems(s.name),
                            { labelHeading: 'Session' },
                            { label: 'Rename', keepFocus: true,
                              onClick: () => startInlineRename(s.name) },
                            { label: 'Kill', danger: true, onClick: () => killSession(s.name) }
                        ]);
                    } finally {
                        ctxMenuOpen--;
                    }
                    if (!picked) return;
                    // Picking refocuses the terminal (the openMenu(true)
                    // contract) — except Rename, whose editor needs the
                    // keyboard the moment it opens.
                    if (!picked.keepFocus) requestTerminalFocus();
                    picked.onClick();
                });

                card.addEventListener('dragstart', (e) => {
                    dragSrcCard = card;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', s.name);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    if (dragSrcCard === card) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcCard = null;
                    isDragging = false;
                });
                // Dropping on a card positions before/after it — including
                // cards in ANOTHER project, which reassigns on dragend.
                card.addEventListener('dragover', (e) => {
                    if (!dragSrcCard || dragSrcCard === card) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = card.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) card.after(dragSrcCard);
                    else card.before(dragSrcCard);
                });

                return card;
            }

            // One collapsible section: the Ungrouped area (projectName '') or a
            // project. `members` are live sessions in layout order.
            function renderGroup(projectName, members) {
                const isUngrouped = projectName === '';
                const collapseId = isUngrouped ? UNGROUPED_COLLAPSE_ID : projectName;
                const collapsed = !!getCollapsed()[collapseId];

                const group = document.createElement('div');
                group.className = 'project-group' + (collapsed ? ' collapsed' : '');
                group.dataset.project = projectName;

                const header = document.createElement('div');
                header.className = 'project-header';
                header.setAttribute('role', 'button');
                header.setAttribute('tabindex', '0');
                header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                header.setAttribute('aria-label',
                    (collapsed ? 'Expand ' : 'Collapse ') + (isUngrouped ? 'ungrouped sessions' : 'project ' + projectName));

                const chev = document.createElement('span');
                chev.className = 'chev';
                chev.textContent = '▾';
                header.appendChild(chev);

                const title = document.createElement('span');
                title.className = 'project-title';
                title.textContent = isUngrouped ? 'Ungrouped' : projectName;
                header.appendChild(title);

                const badges = document.createElement('span');
                badges.className = 'project-badges';
                const count = document.createElement('span');
                count.textContent = String(members.length);
                badges.appendChild(count);
                // Collapsed headers aggregate member states so a folded
                // project still shows when something inside needs you.
                if (collapsed) {
                    for (const state of ['running', 'awaiting', 'done']) {
                        const n = members.filter(s => s.state === state).length;
                        if (!n) continue;
                        const chip = document.createElement('span');
                        chip.className = 'state-chip';
                        // A folded project's done chip keeps the unseen
                        // emphasis while ANY member completion is unseen.
                        chip.appendChild(stateDot(state,
                            state === 'done' && members.some(isUnseenDone) ? 'unseen' : ''));
                        const num = document.createElement('span');
                        num.textContent = String(n);
                        chip.appendChild(num);
                        badges.appendChild(chip);
                    }
                }
                header.appendChild(badges);

                const actions = document.createElement('span');
                actions.className = 'project-actions';
                if (!isUngrouped) {
                    const addBtn = document.createElement('button');
                    addBtn.textContent = '+';
                    addBtn.title = 'New session in ' + projectName;
                    addBtn.setAttribute('aria-label', 'New session in project ' + projectName);
                    addBtn.draggable = false;
                    addBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        createSessionInProject(projectName);
                    });
                    actions.appendChild(addBtn);
                }
                const pMenuBtn = document.createElement('button');
                pMenuBtn.textContent = '⋯';
                pMenuBtn.title = isUngrouped ? 'Ungrouped actions' : 'Project actions';
                pMenuBtn.setAttribute('aria-label',
                    isUngrouped ? 'Actions for ungrouped sessions' : 'Actions for project ' + projectName);
                pMenuBtn.draggable = false;
                pMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Touch parity for header drag-reorder (HTML5 DnD is
                    // mouse-only), mirroring the card Move-to menu. Positions
                    // are on the combined sequence, so Ungrouped and projects
                    // move past each other.
                    const seq = groupSeq();
                    const idx = isUngrouped
                        ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                        : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === projectName);
                    const items = [
                        { label: 'Move up', disabled: idx <= 0,
                          onClick: () => moveGroup(projectName, -1) },
                        { label: 'Move down', disabled: idx < 0 || idx >= seq.length - 1,
                          onClick: () => moveGroup(projectName, 1) }
                    ];
                    if (!isUngrouped) {
                        items.push(
                            { label: 'Rename project', onClick: () => renameProject(projectName) },
                            { label: 'Delete project', danger: true, onClick: () => deleteProject(projectName) }
                        );
                    }
                    openMenu(pMenuBtn, items);
                });
                actions.appendChild(pMenuBtn);
                header.appendChild(actions);

                // Drag the header to reorder whole groups — projects AND the
                // Ungrouped section. Order persists via the same
                // captureLayoutFromDom as card drags — it rebuilds
                // layout.projects (+ ungroupedIndex) in DOM order.
                header.draggable = true;
                header.addEventListener('dragstart', (e) => {
                    dragSrcGroup = group;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', projectName);
                    group.classList.add('dragging');
                });
                header.addEventListener('dragend', () => {
                    group.classList.remove('dragging');
                    if (dragSrcGroup === group) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcGroup = null;
                    isDragging = false;
                });
                group.addEventListener('dragover', (e) => {
                    if (!dragSrcGroup || dragSrcGroup === group) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = group.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) group.after(dragSrcGroup);
                    else group.before(dragSrcGroup);
                });

                function toggleCollapse() {
                    setCollapsed(collapseId, !getCollapsed()[collapseId]);
                    paint();
                }
                header.addEventListener('click', toggleCollapse);
                header.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleCollapse();
                    }
                });

                // Header as a drop target: drop = append to this project.
                header.addEventListener('dragover', (e) => {
                    if (!dragSrcCard) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    header.classList.add('drag-over');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
                header.addEventListener('drop', (e) => {
                    if (!dragSrcCard) return;
                    e.preventDefault();
                    header.classList.remove('drag-over');
                    group.querySelector('.project-sessions').appendChild(dragSrcCard);
                    // If the group was collapsed the card is now hidden —
                    // dragend's captureLayoutFromDom still finds it in the DOM.
                });

                group.appendChild(header);

                const body = document.createElement('div');
                body.className = 'project-sessions';
                for (const s of members) body.appendChild(renderCard(s));
                if (!members.length && !isUngrouped) {
                    const hint = document.createElement('div');
                    hint.className = 'project-empty-hint';
                    hint.textContent = 'empty — drag a session here, or +';
                    body.appendChild(hint);
                }
                group.appendChild(body);
                return group;
            }

            // paint renders the sidebar from lastSessions + layout. Pure view —
            // no fetching — so layout mutations repaint instantly.
            function paint() {
                if (isDragging || openMenuEl || ctxMenuOpen) return;
                clearChildren(listEl);
                const liveByName = new Map(lastSessions.map(s => [s.name, s]));
                const referenced = new Set();
                for (const p of layout.projects) p.sessions.forEach(n => referenced.add(n));
                layout.ungrouped.forEach(n => referenced.add(n));

                // Ungrouped members: explicit order first, then any live
                // session the layout has never seen (fresh creations), in
                // tmux order. The section renders at its slot in the combined
                // sequence (ungroupedIndex) and is skipped while empty.
                const ungrouped = layout.ungrouped
                    .map(n => liveByName.get(n)).filter(Boolean)
                    .concat(lastSessions.filter(s => !referenced.has(s.name)));
                for (const g of groupSeq()) {
                    if (g === UNGROUPED_COLLAPSE_ID) {
                        if (ungrouped.length) listEl.appendChild(renderGroup('', ungrouped));
                        continue;
                    }
                    const members = g.sessions.map(n => liveByName.get(n)).filter(Boolean);
                    listEl.appendChild(renderGroup(g.name, members));
                }
                if (!ungrouped.length && !layout.projects.length) {
                    listEl.appendChild(emptyState('No sessions yet.'));
                }
                updateTitle();
            }

            async function renderLobby() {
                if (isDragging || openMenuEl || ctxMenuOpen) return;
                try {
                    const [sessResp, layoutResult] = await Promise.all([
                        fetch(SESSIONS_API, { credentials: 'same-origin' }),
                        fetchLayout().catch(err => err)
                    ]);
                    if (!sessResp.ok) {
                        clearChildren(listEl);
                        listEl.appendChild(emptyState('Failed to load sessions: HTTP ' + sessResp.status));
                        return;
                    }
                    const sessions = await sessResp.json();
                    if (layoutResult instanceof Error) {
                        // Grouping degrades gracefully: keep the last-known
                        // layout, sessions still render.
                        if (!layoutLoaded) console.warn('layout fetch failed:', layoutResult);
                    } else {
                        layout = layoutResult;
                        if (!layoutLoaded) {
                            layoutLoaded = true;
                            seedLayoutFromLegacyOrder();
                        }
                    }
                    const activeListed = sessions.some(s => s.name === currentActive);
                    if (currentActive && activeListed) activeConfirmed = true;
                    // Only deactivate a session we've SEEN before and that is now
                    // gone (killed elsewhere). Never tear down one that has yet to
                    // appear — it's still being created (see activeConfirmed note).
                    if (currentActive && !activeListed && activeConfirmed) {
                        deactivateSession();
                    }
                    lastSessions = sessions;
                    // Attention (Task 2.1): favicon + OS notifications track
                    // the same poll that paints the cards (title via paint's
                    // updateTitle). State-change timestamps (Task 2.4) must
                    // land BEFORE paint so fresh transitions render with a
                    // non-zero stateChangedAt.
                    notifyTransitions(sessions);
                    trackStateChanges(sessions);
                    updateFavicon();
                    paint();
                } catch (err) {
                    clearChildren(listEl);
                    listEl.appendChild(emptyState('Error: ' + err.message));
                }
            }

            // One-time migration: an untouched server layout + a legacy
            // localStorage drag-order → carry the old order into Ungrouped.
            function seedLayoutFromLegacyOrder() {
                if (layout.projects.length || layout.ungrouped.length) return;
                const old = getSavedOrder().filter(n => NAME_RE.test(n));
                if (!old.length) return;
                layout.ungrouped = old;
                putLayout().catch(() => {});
            }

            // A newly-created session is spawned by the iframe's WebSocket a
            // beat after it loads, so the regular 5s poll can miss it and the
            // per-user API cache can briefly hold a pre-spawn empty list. Poll a
            // few times in the first seconds so the new card appears within ~1-2s.
            function quickRefreshAfterCreate() {
                [700, 1600, 3000, 4500].forEach((ms) => setTimeout(renderLobby, ms));
            }
            newBtnEl.addEventListener('click', () => {
                const name = newNameEl.value.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                newNameEl.value = '';
                activateSession(name);
                quickRefreshAfterCreate();
            });
            newNameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') newBtnEl.click();
            });
            restoreBtnEl.addEventListener('click', () => restoreSessions(restoreBtnEl));
            newProjectBtnEl.addEventListener('click', createProject);

            window.addEventListener('hashchange', () => {
                const hash = location.hash.slice(1);
                if (hash && NAME_RE.test(hash)) {
                    if (hash !== currentActive) activateSession(hash);
                } else if (currentActive) {
                    deactivateSession();
                }
            });

            // Sidebar collapse — toggle a class on #lobby + persist in localStorage.
            // The grid-template-columns transition handles the slide; xterm in the
            // iframe re-fits on its own window resize event.
            const SIDEBAR_KEY = 'tmux-sidebar-collapsed';
            const lobbyEl    = document.getElementById('lobby');
            const toggleEl   = document.getElementById('sidebar-toggle');
            function getSidebarCollapsed() {
                try { return localStorage.getItem(SIDEBAR_KEY) === '1'; }
                catch (e) { return false; }
            }
            function setSidebarCollapsed(collapsed) {
                lobbyEl.classList.toggle('sidebar-collapsed', collapsed);
                toggleEl.textContent = collapsed ? '›' : '‹';
                toggleEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggleEl.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
                try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
            }
            toggleEl.addEventListener('click', () => {
                setSidebarCollapsed(!lobbyEl.classList.contains('sidebar-collapsed'));
            });
            setSidebarCollapsed(getSidebarCollapsed());

            // Theme picker — clicking a swatch swaps body class, persists,
            // and live-rethemes the inner terminal via postMessage (tl-theme,
            // same channel as tl-drop-files). The iframe ACKs back; no ACK
            // within 1s means it runs a stale pre-live-switch build, so fall
            // back to the old iframe reload (a reload re-reads the theme from
            // localStorage at boot anyway).
            const themePickerEl = document.getElementById('theme-picker');
            let themeAckTimer = null;
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-theme-ack') return;
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            // A frame that was still LOADING when tl-theme was posted never
            // saw the message — but its boot paints from localStorage, which
            // already holds the new theme. Cancel the pending fallback so a
            // fresh frame isn't pointlessly reloaded a second time.
            frameEl.addEventListener('load', () => {
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            function paintThemeButtons() {
                const active = getTheme();
                themePickerEl.querySelectorAll('button[data-theme]').forEach(b => {
                    b.classList.toggle('active', b.dataset.theme === active);
                });
            }
            themePickerEl.querySelectorAll('button[data-theme]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.theme;
                    if (!THEMES.includes(t)) return;
                    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
                    applyTheme(t);
                    paintThemeButtons();
                    if (currentActive && frameEl.src && frameEl.contentWindow) {
                        clearTimeout(themeAckTimer);
                        themeAckTimer = setTimeout(() => {
                            themeAckTimer = null;
                            // No ACK: reload iframe so xterm picks up the new
                            // theme (re-read src — the session may have
                            // changed during the wait).
                            const url = frameEl.src;
                            if (!url || url === 'about:blank') return;
                            frameEl.src = 'about:blank';
                            setTimeout(() => { frameEl.src = url; }, 0);
                        }, 1000);
                        frameEl.contentWindow.postMessage({ type: 'tl-theme', name: t }, location.origin);
                    }
                });
            });
            paintThemeButtons();

            // Font-size stepper — since Task 2.6 routed through the prefs
            // layer: setPrefs persists BOTH keys (tl:prefs:v1 + the legacy
            // tl-font-size), fires tl-prefs-change (→ repaint + live-apply
            // forward below) and PUTs the roamed doc. A stale iframe build
            // without any handler still picks the size up at its next boot
            // (the constructor reads the same keys).
            const fontValEl = document.getElementById('font-size-value');
            function paintFontSize() { fontValEl.textContent = getPrefs().fontSize; }
            function stepFontSize(delta) {
                setPrefs({ fontSize: clampFontSize(getPrefs().fontSize + delta) });
            }
            document.getElementById('font-size-dec').addEventListener('click', () => stepFontSize(-1));
            document.getElementById('font-size-inc').addEventListener('click', () => stepFontSize(1));
            // The terminal's floating A−/A+ and its prefs writes land in the
            // same keys; storage events fire only in windows that did NOT
            // write — i.e. exactly here — so the sidebar readout and the
            // open panel track in-terminal changes. No forward back into the
            // iframe: the change originated there and is already applied.
            window.addEventListener('storage', (e) => {
                if (e.key === FONT_SIZE_KEY || e.key === PREFS_KEY) {
                    paintFontSize();
                    paintSettingsPanel();
                }
            });
            paintFontSize();

            // Any prefs change made in THIS window (panel, sidebar stepper,
            // server-doc adoption at boot) live-applies to the attached
            // terminal over the same postMessage channel as tl-theme /
            // tl-drop-files. The extra tl-font-size message keeps pre-2.6
            // iframe builds in step (they only know that type); a current
            // build applies both idempotently.
            window.addEventListener('tl-prefs-change', () => {
                paintFontSize();
                paintSettingsPanel();
                if (currentActive && frameEl.src && frameEl.contentWindow) {
                    const p = getPrefs();
                    frameEl.contentWindow.postMessage({ type: 'tl-prefs', prefs: p }, location.origin);
                    frameEl.contentWindow.postMessage({ type: 'tl-font-size', size: p.fontSize }, location.origin);
                }
            });

            // --- settings popover (Task 2.6) ------------------------------
            // Roaming terminal prefs: fontSize (shared with the stepper),
            // lineHeight, letterSpacing, cursorStyle, cursorBlink,
            // fontWeightBold. Deliberately EXCLUDED (red line): smooth-
            // scroll, renderer toggles, and any mouse/wheel/scroll option.
            const settingsBtn = document.getElementById('settings-btn');
            let settingsPanel = null;
            function paintSettingsPanel() {
                if (!settingsPanel) return;
                const p = getPrefs();
                settingsPanel.querySelector('#sp-font-val').textContent = p.fontSize;
                const lh = settingsPanel.querySelector('#sp-lh');
                lh.value = String(p.lineHeight);
                settingsPanel.querySelector('#sp-lh-val').textContent = p.lineHeight.toFixed(2);
                const ls = settingsPanel.querySelector('#sp-ls');
                ls.value = String(p.letterSpacing);
                settingsPanel.querySelector('#sp-ls-val').textContent = p.letterSpacing.toFixed(1) + 'px';
                settingsPanel.querySelector('#sp-blink').checked = p.cursorBlink;
                settingsPanel.querySelectorAll('.sp-seg').forEach(seg => {
                    const val = String(p[seg.dataset.pref]);
                    seg.querySelectorAll('button').forEach(b => {
                        b.classList.toggle('active', b.dataset.val === val);
                    });
                });
            }
            function onSettingsOutside(e) {
                if (!settingsPanel) return;
                if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target)) return;
                closeSettings(false);   // the click picks its own focus target
            }
            function onSettingsKey(e) {
                if (e.key !== 'Escape') return;
                e.stopPropagation();
                closeSettings(true);    // Escape = dismissal → terminal refocus
            }
            function closeSettings(refocus) {
                if (!settingsPanel) return;
                const el = settingsPanel;
                settingsPanel = null;
                settingsBtn.setAttribute('aria-expanded', 'false');
                document.removeEventListener('pointerdown', onSettingsOutside, true);
                document.removeEventListener('keydown', onSettingsKey, true);
                if (refocus) closeOverlay(el);   // remove + focus return (Task 2.3)
                else el.remove();
            }
            function openSettings() {
                const panel = document.createElement('div');
                panel.className = 'settings-panel';
                panel.id = 'settings-panel';
                const title = document.createElement('div');
                title.className = 'sp-title';
                title.textContent = 'Terminal settings';
                panel.appendChild(title);

                function row(labelText) {
                    const d = document.createElement('div');
                    d.className = 'sp-row';
                    const l = document.createElement('label');
                    l.textContent = labelText;
                    d.appendChild(l);
                    panel.appendChild(d);
                    return d;
                }
                function rangeCtl(row_, id, key, min, max, step) {
                    const input = document.createElement('input');
                    input.type = 'range';
                    input.id = id;
                    input.min = String(min); input.max = String(max); input.step = String(step);
                    input.addEventListener('input', () => setPrefs({ [key]: Number(input.value) }));
                    const val = document.createElement('span');
                    val.className = 'sp-val';
                    val.id = id + '-val';
                    row_.appendChild(input);
                    row_.appendChild(val);
                }
                function segCtl(row_, key, values, labels) {
                    const seg = document.createElement('div');
                    seg.className = 'sp-seg';
                    seg.dataset.pref = key;
                    values.forEach((v, i) => {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.dataset.val = v;
                        b.textContent = labels[i];
                        b.addEventListener('click', () => setPrefs({ [key]: v }));
                        seg.appendChild(b);
                    });
                    row_.appendChild(seg);
                }

                // Font size — the same store the A−/A+ steppers use.
                const fs = row('Font size');
                const step = document.createElement('div');
                step.className = 'sp-step';
                const dec = document.createElement('button');
                dec.type = 'button'; dec.textContent = 'A−';
                dec.title = 'Smaller terminal font (min ' + FONT_SIZE_MIN + ')';
                dec.addEventListener('click', () => stepFontSize(-1));
                const fval = document.createElement('span');
                fval.className = 'sp-val'; fval.id = 'sp-font-val';
                const inc = document.createElement('button');
                inc.type = 'button'; inc.textContent = 'A+';
                inc.title = 'Larger terminal font (max ' + FONT_SIZE_MAX + ')';
                inc.addEventListener('click', () => stepFontSize(1));
                step.appendChild(dec); step.appendChild(fval); step.appendChild(inc);
                fs.appendChild(step);

                rangeCtl(row('Line height'), 'sp-lh', 'lineHeight', 1, 1.4, 0.05);
                rangeCtl(row('Letter spacing'), 'sp-ls', 'letterSpacing', 0, 1, 0.5);
                segCtl(row('Cursor'), 'cursorStyle',
                       ['block', 'bar', 'underline'], ['Block', 'Bar', 'Under']);
                const blinkRow = row('Cursor blink');
                const blink = document.createElement('input');
                blink.type = 'checkbox';
                blink.id = 'sp-blink';
                blink.addEventListener('change', () => setPrefs({ cursorBlink: blink.checked }));
                blinkRow.appendChild(blink);
                segCtl(row('Bold weight'), 'fontWeightBold', ['600', '700'], ['600', '700']);

                document.body.appendChild(panel);
                settingsPanel = panel;
                paintSettingsPanel();
                // Anchor above the gear (it sits at the sidebar bottom);
                // flip below when the button is near the top (<720px
                // stacked layout puts the sidebar first).
                const r = settingsBtn.getBoundingClientRect();
                panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - panel.offsetWidth - 8)) + 'px';
                if (r.top > panel.offsetHeight + 14) {
                    panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
                } else {
                    panel.style.top = Math.min(r.bottom + 6, window.innerHeight - panel.offsetHeight - 8) + 'px';
                }
                settingsBtn.setAttribute('aria-expanded', 'true');
                // The opening click's pointerdown already happened, so
                // registering now cannot self-dismiss (no rAF guard needed).
                document.addEventListener('pointerdown', onSettingsOutside, true);
                document.addEventListener('keydown', onSettingsKey, true);
            }
            settingsBtn.addEventListener('click', () => {
                if (settingsPanel) closeSettings(false);
                else openSettings();
            });

            // Drops on the terminal are handled inside the iframe. If one lands
            // on the lobby chrome (sidebar) instead, suppress the browser's
            // default file-open and forward the files to the active session's
            // iframe (it uploads them and types the paths in). preventDefault is
            // unconditional — gating it caused Chrome to open the file instead.
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
                if (!files.length) return;
                if (currentActive && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ type: 'tl-drop-files', files }, location.origin);
                    showToast('Sent ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' to ' + currentActive, 'success', 3000);
                } else {
                    showToast('Open a session first, then drop files', 'error', 3500);
                }
            });

            renderLobby();
            setInterval(renderLobby, 5000);

            const initialHash = location.hash.slice(1);
            if (initialHash && NAME_RE.test(initialHash)) {
                activateSession(initialHash);
            }
            return;
        }

        // ============================================================
        // TERMINAL MODE — valid ?arg=<session>, attach via ttyd
        // ============================================================

        // ttyd binary protocol (server → client: '0' OUTPUT,
        // '1' SET_WINDOW_TITLE, '2' SET_PREFERENCES)
        const MSG_OUTPUT    = 0x30; // '0' - terminal output
        const MSG_SET_TITLE = 0x31; // '1' - window title
        const MSG_SET_PREFS = 0x32; // '2' - JSON preferences
        const MSG_INPUT     = '0';  // client → server: input data
        const MSG_RESIZE    = '1';  // client → server: {columns, rows}

        let ws = null;
        let hasConnectedOnce = false;
        // Armed per connection: the page's initial size reaches ttyd via
        // the JSON handshake, which carries NO pixel fields, and ttyd drops
        // RESIZE messages that arrive before the process is spawned — so
        // the pty's pixel size (which tmux needs for sixel) only starts
        // flowing once we push one explicit resize after the process
        // provably exists. See the MSG_OUTPUT handler.
        let needsPixelResizeKick = false;
        const textEncoder = new TextEncoder();
        const textDecoder = new TextDecoder();

        // Fonts-ready boot gate: give the JetBrains Mono webfont up to 2s to
        // arrive before xterm measures cell metrics — measuring an OS fallback
        // first bakes wrong glyph metrics into the renderer until a refit.
        // Race-capped so a dead CDN can never hold the terminal hostage; the
        // loadingdone listener below repairs the late-arrival case.
        try {
            await Promise.race([
                document.fonts.load('15px "JetBrains Mono"'),
                new Promise(r => setTimeout(r, 2000))
            ]);
        } catch (e) { /* face unavailable → OS mono fallback, still functional */ }

        // Boot values for the user-tunable options (Task 2.6): validated
        // tl:prefs:v1 (roamed via /prefs), every field defaulting to the
        // historical constructor value when unset. fontSize keeps riding
        // the Task 1.8 key underneath.
        const bootPrefs = getPrefs();
        const term = new Terminal({
            cursorBlink: bootPrefs.cursorBlink,
            cursorStyle: bootPrefs.cursorStyle,
            fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
            // User-steppable via A−/A+ (Task 1.8): persisted in
            // tl-font-size, clamped 10-22, default 15 (the historical
            // hardcoded value).
            fontSize: bootPrefs.fontSize,
            lineHeight: bootPrefs.lineHeight,
            letterSpacing: bootPrefs.letterSpacing,
            // Pin both weights to the vendored JetBrains Mono faces so
            // browsers never synthesize a faux bold — or substitute a
            // different family for it — now that real webfonts are in
            // play. Bold weight is user-selectable 600/700 (plan spec);
            // NOTE with only the 400/700 faces vendored, CSS matching
            // resolves 600 upward to the Bold face — the choice only
            // renders differently on fallback stacks (or once a SemiBold
            // face is vendored). It still roams like every other pref.
            fontWeight: '400',
            fontWeightBold: bootPrefs.fontWeightBold,
            theme: readTerminalTheme(),
            // Nudge foreground colors toward WCAG AA (4.5:1) against each
            // cell's background — VS Code's default. xterm excludes box/block
            // glyphs from the adjustment (TUI borders keep exact theme colors)
            // and holds \e[2m dim text to half-ratio, so dim stays visibly
            // dim while low-contrast pairs (e.g. dark-tuned ANSI colors on
            // the light ink theme) become readable.
            minimumContrastRatio: 4.5,
            // Unfocused terminal renders a hollow outline cursor instead of
            // a solid block — the standard "keystrokes go elsewhere" cue.
            cursorInactiveStyle: 'outline',
            // Mac leg of the plain-drag selection reclaim (mousedown
            // interceptor below term.open): the synthetic clones carry
            // altKey, and only this option makes xterm treat Option-clicks
            // as force-selection — without it they leak to the app as
            // Alt-clicks. Must be set in the constructor.
            macOptionClickForcesSelection: true,
            // Off: with it on (xterm default), a real Option-drag's RELEASE
            // moves the cursor via arrow-key spam into the app and clears
            // the just-made selection (reproduced on the Mac path). We never
            // want click-to-move-cursor in tmux/Claude panes.
            altClickMovesCursor: false,
            // tmux attaches on the ALTERNATE screen, so xterm's scrollback
            // holds nothing while attached: Shift+scroll/drag never reaches
            // history, selection is limited to the visible frame, and deep
            // history is tmux copy-mode's job. This buffer is inert under
            // tmux's alt screen — it only matters if alternate-screen were
            // ever disabled.
            scrollback: 10000,
            allowProposedApi: true
        });

        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(webLinksAddon);

        try {
            const webglAddon = new WebglAddon.WebglAddon();
            webglAddon.onContextLoss(() => { webglAddon.dispose(); });
            term.loadAddon(webglAddon);
        } catch (e) {
            console.warn('WebGL addon failed:', e);
        }

        // OSC 52 clipboard: lets tmux's own copy (with `set-clipboard on`) and
        // any program write straight to the OS clipboard. NOTE: this addon's
        // UMD build exposes the class as the global `ClipboardAddon` directly,
        // NOT `ClipboardAddon.ClipboardAddon` like fit/webgl — accept both
        // shapes. Wrapped so a load hiccup can't break the terminal.
        try {
            const ClipAddon = (typeof ClipboardAddon !== 'undefined')
                && (ClipboardAddon.ClipboardAddon || ClipboardAddon);
            if (ClipAddon) {
                // Custom provider instead of the addon's default, for two
                // verified reasons:
                //   - tmux 3.4 emits OSC 52 with an EMPTY selection field
                //     (\x1b]52;;<base64>), and the default provider drops any
                //     selection that isn't exactly 'c' — so tmux copy-mode
                //     copies never reached the browser clipboard. Accept ''
                //     and 'c'.
                //   - readText deliberately refuses: answering OSC 52 '?'
                //     queries would let any program running in the PTY read
                //     the user's clipboard.
                const osc52Provider = {
                    readText: () => Promise.resolve(''),
                    writeText: (selection, text) =>
                        selection === '' || selection === 'c'
                            ? navigator.clipboard.writeText(text)
                                  .then(() => showToast('Copied', 'success', 1500))
                                  .catch(() => {})
                            : Promise.resolve()
                };
                term.loadAddon(new ClipAddon(undefined, osc52Provider));
                console.log('clipboard addon (OSC 52) loaded');
            } else {
                console.warn('ClipboardAddon global not found');
            }
        } catch (e) {
            console.warn('Clipboard addon failed:', e);
        }

        // Inline images: renders sixel (and iTerm IIP) sequences on the
        // canvas — viu, img2sixel, matplotlib backends, anything that
        // emits sixel. Loading it also amends the terminal's DA1 response
        // so tmux and the apps inside it auto-detect sixel support, and
        // answers CSI 14t/16t pixel-size reports. Default options are
        // fine. Same UMD shape caveat as the clipboard addon — accept
        // both `ImageAddon` and `ImageAddon.ImageAddon`; wrapped so a
        // load hiccup can't break the terminal.
        try {
            const ImgAddon = (typeof ImageAddon !== 'undefined')
                && (ImageAddon.ImageAddon || ImageAddon);
            if (ImgAddon) {
                term.loadAddon(new ImgAddon());
                console.log('image addon (sixel) loaded');
            } else {
                console.warn('ImageAddon global not found');
            }
        } catch (e) {
            console.warn('Image addon failed:', e);
        }

        // Unicode 11 width tables: xterm's built-in tables are Unicode 6,
        // which counts most emoji as width 1 while tmux measures them as 2
        // — everything after an emoji then drifts one cell (misaligned
        // `├──` trees under Claude Code's emoji output). Version 11 matches
        // tmux's wcwidth. Activated before open() so the first frame is
        // already measured with the right tables. Same UMD shape caveat as
        // the clipboard addon — accept both `Unicode11Addon` and
        // `Unicode11Addon.Unicode11Addon`; wrapped so a load hiccup can't
        // break the terminal (falls back to the built-in version 6).
        try {
            const U11Addon = (typeof Unicode11Addon !== 'undefined')
                && (Unicode11Addon.Unicode11Addon || Unicode11Addon);
            if (U11Addon) {
                term.loadAddon(new U11Addon());
                term.unicode.activeVersion = '11';
                console.log('unicode11 addon loaded (active version ' + term.unicode.activeVersion + ')');
            } else {
                console.warn('Unicode11Addon global not found');
            }
        } catch (e) {
            console.warn('Unicode11 addon failed:', e);
        }

        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        // Nothing else focuses the terminal on load — without this,
        // keystrokes on desktop are dead until the user clicks.
        term.focus();

        // Late-arriving faces (a CDN slower than the 2s boot gate; TL Symbols
        // below): refit and rebuild the WebGL glyph atlas so rendering uses
        // the real font, not whatever fallback got measured first.
        document.fonts.addEventListener('loadingdone', () => {
            fitAddon.fit();
            term.clearTextureAtlas?.();
        });

        // Returning from OS sleep or a long-backgrounded tab can leave the
        // WebGL glyph atlas corrupted (GPU texture invalidated without a
        // context-loss event, so onContextLoss never fires). Rebuild it on
        // every return to visibility — near-free when nothing was lost.
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) term.clearTextureAtlas?.();
        });

        // ---- attention signals (Task 2.1) --------------------------------
        // This page normally renders inside the lobby's iframe, and the
        // TAB's favicon/title belong to the parent document — so attention
        // is signalled upward over the existing postMessage channel and the
        // lobby decides what to badge. Two signals, neither parses output:
        //   bell   — xterm's parser saw BEL (term.onBell);
        //   output — the fact THAT pty bytes arrived while the tab was
        //            hidden (latched once per hidden period, re-armed on
        //            return to visibility, so the hot output path pays one
        //            boolean check per chunk).
        // A direct top-level /?arg= tab has no lobby to tell: fall back to
        // prefixing its own title, cleared on return to visibility.
        const isFramed = window.parent !== window;
        let hiddenOutputSignaled = false;
        function signalAttention(kind) {
            if (isFramed) {
                try {
                    window.parent.postMessage(
                        { type: 'tl-attention', kind: kind, session: validArg },
                        location.origin);
                } catch (e) {}
            } else if (document.hidden && !document.title.startsWith('● ')) {
                document.title = '● ' + document.title;
            }
        }
        term.onBell(() => signalAttention('bell'));
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            hiddenOutputSignaled = false;
            if (!isFramed && document.title.startsWith('● ')) {
                document.title = document.title.slice(2);
            }
        });

        // Reclaim plain left-drag for NATIVE selection. tmux — and Claude Code
        // inside it — keep the terminal in mouse-report mode, so xterm.js only
        // selects while a force-modifier is held (Shift here; Option on Mac via
        // macOptionClickForcesSelection). Intercept unmodified left presses over
        // the screen before xterm sees them and re-dispatch a clone carrying
        // that modifier: xterm's own SelectionService takes over (drag growth,
        // double-click words, persistence) while wheel / right-click / modifier
        // chords still reach the app. xterm registers its mouse reporters only
        // for presses it processes itself, so nothing leaks to the PTY during a
        // hijacked drag. The bottom row is the tmux status line — real clicks
        // (window switching) matter more there than selection, so it passes.
        // SELECTION LIFECYCLE (Viktor, 2026-07-08): a selection clears ONLY
        // on scroll, Escape, or a replacing drag — never on a plain click or
        // pointer motion. This is both the wanted UX and the only design
        // that is immune to trackpad ghost clicks: macOS trackpads emit
        // spurious trusted mousedown/up pairs after a drag lift (sometimes
        // deferred until the finger next touches to MOVE the pointer), so
        // any click-clears rule eventually eats a fresh selection. Presses
        // while a selection exists are therefore held back: only actual
        // pointer travel (>DRAG_PX) commits them as a replacing drag; a
        // press that releases without travel keeps the selection. detail>1
        // (double/triple click) is an explicit new-selection gesture and
        // goes through immediately — except within the ghost window of the
        // last drag lift, where browsers may stamp the ghost with detail=2.
        // REPLACE_PX is deliberately larger than a typical trackpad jitter:
        // macOS tap-drag continuations and micro-slips move a few px; an
        // intentional replacing drag travels. WHEEL_CLEAR_PX/WINDOW gate the
        // scroll trigger — trackpads emit micro-wheel events during plain
        // pointer movement (resting finger, inertia crumbs), which must not
        // count as 'scroll' (that regression: selection died on pointer move).
        const GHOST_MS = 400, GHOST_PX = 8, REPLACE_PX = 10;
        const WHEEL_CLEAR_PX = 40, WHEEL_WINDOW_MS = 500;
        // Opt-in diagnostics: add ?seldebug=1 to the session URL and every
        // selection clear announces its trigger in a toast + console.
        const selDebug = params.get('seldebug') === '1';
        // ---- selection telemetry (DEFAULT ON; ?seldebug=0 opts this tab out).
        // Ships selection lifecycle events + a ring buffer of raw INPUT
        // events to /clipboard/telemetry (JSONL per user on the devvm), so a
        // clear caused by a specific physical trackpad can be diagnosed
        // server-side. Captures ONLY mouse/wheel geometry and the chord keys
        // (Escape, mod+C/V) — never general typing.
        const telemetryOn = params.get('seldebug') !== '0';
        const evRing = [];
        function ring(rec) {
            rec.t = Math.round(performance.now());
            evRing.push(rec);
            if (evRing.length > 30) evRing.shift();
        }
        let telBatch = [], telTimer = null;
        function flushTel() {
            clearTimeout(telTimer); telTimer = null;
            if (!telBatch.length) return;
            const payload = JSON.stringify({ events: telBatch });
            telBatch = [];
            try {
                navigator.sendBeacon('/clipboard/telemetry',
                    new Blob([payload], { type: 'application/json' }));
            } catch (e) {}
        }
        function tel(type, data) {
            if (!telemetryOn) return;
            telBatch.push(Object.assign({ type: type, t: Math.round(performance.now()),
                build: TL_BUILD, session: validArg, plat: navigator.platform }, data));
            if (telBatch.length >= 6) flushTel();
            else if (!telTimer) telTimer = setTimeout(flushTel, 3000);
        }
        window.addEventListener('pagehide', flushTel);
        const modBits = e => (e.shiftKey?1:0)|(e.altKey?2:0)|(e.ctrlKey?4:0)|(e.metaKey?8:0);
        document.addEventListener('mousedown', (e) => ring({ k: 'md', x: e.clientX|0,
            y: e.clientY|0, b: e.buttons, d: e.detail, tr: e.isTrusted?1:0, m: modBits(e) }), true);
        document.addEventListener('mouseup', (e) => ring({ k: 'mu', x: e.clientX|0,
            y: e.clientY|0, b: e.buttons, tr: e.isTrusted?1:0 }), true);
        let lastRingMM = 0;
        document.addEventListener('mousemove', (e) => {
            const now = performance.now();
            if (e.buttons === 0 && now - lastRingMM < 60) return; // sample idle motion
            lastRingMM = now;
            ring({ k: 'mm', x: e.clientX|0, y: e.clientY|0, b: e.buttons, tr: e.isTrusted?1:0 });
        }, true);
        document.addEventListener('wheel', (e) => ring({ k: 'wh', x: e.clientX|0, y: e.clientY|0,
            dy: Math.round(e.deltaY*10)/10, dx: Math.round(e.deltaX*10)/10, mode: e.deltaMode }),
            { capture: true, passive: true });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || ((e.ctrlKey || e.metaKey) && (e.code === 'KeyC' || e.code === 'KeyV')))
                ring({ k: 'kd', key: e.key === 'Escape' ? 'Esc' : e.code, m: modBits(e) });
        }, true);
        let lastExplainedClear = { why: null, t: 0 };
        let selStash = null;
        function clearSelectionBecause(why) {
            if (!term.hasSelection()) return;
            selStash = null;                     // deliberate dismiss kills the fallback
            lastExplainedClear = { why: why, t: performance.now() };
            tel('sel-cleared', { reason: why, ring: evRing.slice() });
            term.clearSelection();
            if (selDebug) {
                console.log('[seldebug] cleared by:', why);
                showToast('selection cleared: ' + why + ' [' + TL_BUILD + ']', 'error', 2500);
            }
        }
        let lastHijackUp = null;
        // Live clone-drag state, for healing drags whose mouseup never
        // arrives. Two real-world ways that happens:
        //   (a) the button is released OUTSIDE this document — past the
        //       window edge, or over the lobby sidebar when this page runs
        //       in the lobby iframe — so xterm stays in drag-state and every
        //       later pointer move keeps re-extending the "selection";
        //   (b) macOS three-finger-drag / tap-drag-lock: lifting the fingers
        //       does NOT release the button; the OS keeps the drag alive and
        //       the user's next pointer move CONTINUES it (the button is
        //       genuinely still down), silently dragging the selection away.
        // Healing: watch motion during a clone-drag. Motion with the button
        // up finalizes at the last dragged point (case a). On Macs, motion
        // resuming after >=STALL_MS stationary — while the button is still
        // held — finalizes at the stationary point first (case b): a lift
        // pause then travel is drag-lock, not deliberate selection growth.
        const STALL_MS = 500;
        let cloneDrag = null;
        function finalizeCloneDrag(x, y, tgt) {
            const t = (cloneDrag && cloneDrag.target) || tgt || document.querySelector('.xterm-screen');
            cloneDrag = null;
            if (!t) return;
            t.dispatchEvent(new MouseEvent('mouseup', {
                bubbles: true, cancelable: true, composed: true, view: window,
                clientX: x, clientY: y, button: 0, buttons: 0
            }));
            lastHijackUp = { t: Date.now(), x: x, y: y };
        }
        document.addEventListener('mousemove', (m) => {
            if (!m.isTrusted || !cloneDrag) return;
            const now = Date.now();
            if ((m.buttons & 1) === 0) {                     // lost mouseup (a)
                finalizeCloneDrag(cloneDrag.x, cloneDrag.y);
                return;
            }
            if (isMacLike && now - cloneDrag.at >= STALL_MS) {
                finalizeCloneDrag(cloneDrag.x, cloneDrag.y); // drag-lock resume (b)
                return;
            }
            cloneDrag.x = m.clientX; cloneDrag.y = m.clientY; cloneDrag.at = now;
        }, true);
        function dispatchSelectionClone(e) {
            const init = {
                bubbles: true, cancelable: true, composed: true, view: window,
                detail: e.detail, screenX: e.screenX, screenY: e.screenY,
                clientX: e.clientX, clientY: e.clientY, button: 0, buttons: 1
            };
            if (isMacLike) init.altKey = true; else init.shiftKey = true;
            cloneDrag = { x: e.clientX, y: e.clientY, at: Date.now(), target: e.target };
            e.target.dispatchEvent(new MouseEvent('mousedown', init));
            document.addEventListener('mouseup', (up) => {
                cloneDrag = null;                            // clean release
                lastHijackUp = { t: Date.now(), x: up.clientX, y: up.clientY };
            }, { capture: true, once: true });
        }
        document.addEventListener('mousedown', (e) => {
            if (!e.isTrusted || e.button !== 0) return;      // clones + non-left pass
            if (e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
            const scr = document.querySelector('.xterm-screen');
            if (!scr || !(e.target instanceof Node) || !scr.contains(e.target)) return;
            const rect = scr.getBoundingClientRect();
            const onStatusRow = term.rows > 1 &&
                e.clientY - rect.top >= rect.height * (term.rows - 1) / term.rows;
            e.stopImmediatePropagation();
            e.preventDefault();
            if (onStatusRow) {
                // Bottom row = tmux status line, but it is ALSO where drags
                // start when selecting the last lines of output upward (the
                // Claude input box lives at the bottom). Disambiguate by
                // travel: >REPLACE_PX becomes a selection drag; releasing
                // without travel replays the click to the app (window tabs).
                const start0 = e;
                const onMove0 = (m) => {
                    if (Math.abs(m.clientX - start0.clientX) < REPLACE_PX
                            && Math.abs(m.clientY - start0.clientY) < REPLACE_PX) return;
                    cleanup0();
                    if (term.hasSelection()) clearSelectionBecause('replacing drag (bottom row)');
                    dispatchSelectionClone(start0);
                };
                const onUp0 = (u) => {
                    cleanup0();
                    // Replay the click to the app as a raw SGR mouse report —
                    // deterministic (no re-entrant DOM dispatch), and only
                    // when the app actually has mouse tracking on (otherwise
                    // the bytes would land as typed garbage — and a status
                    // line click needs tmux mouse mode anyway).
                    if (term.modes.mouseTrackingMode === 'none') return;
                    const col = Math.min(term.cols, Math.max(1,
                        Math.floor((start0.clientX - rect.left) / (rect.width / term.cols)) + 1));
                    const row = Math.min(term.rows, Math.max(1,
                        Math.floor((start0.clientY - rect.top) / (rect.height / term.rows)) + 1));
                    sendInput('\x1b[<0;' + col + ';' + row + 'M');
                    sendInput('\x1b[<0;' + col + ';' + row + 'm');
                };
                function cleanup0() {
                    document.removeEventListener('mousemove', onMove0, true);
                    document.removeEventListener('mouseup', onUp0, true);
                }
                document.addEventListener('mousemove', onMove0, true);
                document.addEventListener('mouseup', onUp0, true);
                return;
            }
            const ghost = lastHijackUp
                    && Date.now() - lastHijackUp.t < GHOST_MS
                    && Math.abs(e.clientX - lastHijackUp.x) <= GHOST_PX
                    && Math.abs(e.clientY - lastHijackUp.y) <= GHOST_PX;
            if (ghost && term.hasSelection()) return;        // lift ghost: keep the selection
            if (!term.hasSelection() || e.detail > 1) {
                if (e.detail > 1) clearSelectionBecause('double-click replace');
                dispatchSelectionClone(e);
                term.focus();
                return;
            }
            // Selection exists + single press: hold it back until it proves
            // to be a drag. Release without travel = keep the selection.
            const start = e;
            const onMove = (m) => {
                if (Math.abs(m.clientX - start.clientX) < REPLACE_PX
                        && Math.abs(m.clientY - start.clientY) < REPLACE_PX) return;
                cleanup();
                clearSelectionBecause('replacing drag (' +
                    Math.abs(m.clientX - start.clientX) + ',' +
                    Math.abs(m.clientY - start.clientY) + 'px)');
                dispatchSelectionClone(start);
            };
            const onUp = () => { cleanup(); };
            function cleanup() {
                document.removeEventListener('mousemove', onMove, true);
                document.removeEventListener('mouseup', onUp, true);
            }
            document.addEventListener('mousemove', onMove, true);
            document.addEventListener('mouseup', onUp, true);
            term.focus();                                    // we swallowed xterm's focus click
        }, true);
        // Mode-1003 panes (Claude Code, t3) get EVERY pointer motion
        // reported; the TUI hover-repaints in response and that output
        // clears xterm's selection — field telemetry showed every clear
        // riding the FIRST post-release pointer move (Mac trackpad and
        // Windows mouse alike; bob's 1px release-jitter killed his within
        // 3ms). While a selection exists and no button is down, swallow
        // motion over the screen at document-capture: xterm never sees it,
        // nothing is reported, nothing repaints, the highlight lives. The
        // first click/drag/wheel/Escape clears per contract and motion
        // flows again. (Our telemetry ring listener registered earlier on
        // this node, so forensics keep recording these swallowed moves.)
        document.addEventListener('mousemove', (m) => {
            if (!m.isTrusted || (m.buttons & 1) !== 0) return;
            if (!term.hasSelection() || cloneDrag) return;
            const scr = document.querySelector('.xterm-screen');
            if (!scr || !(m.target instanceof Node) || !scr.contains(m.target)) return;
            m.stopImmediatePropagation();
        }, true);

        // The other two clear triggers of the contract:
        let wheelAccum = 0, wheelAccumAt = 0;
        document.getElementById('terminal').addEventListener('wheel', (w) => {
            if (!term.hasSelection()) return;
            const now = Date.now();
            if (now - wheelAccumAt > WHEEL_WINDOW_MS) wheelAccum = 0;
            wheelAccumAt = now;
            wheelAccum += Math.abs(w.deltaY) + Math.abs(w.deltaX);
            if (wheelAccum >= WHEEL_CLEAR_PX) {
                const total = Math.round(wheelAccum);
                wheelAccum = 0;
                clearSelectionBecause('scroll (' + total + 'px)');
            }
        }, { passive: true, capture: true });

        // Selection lifecycle watcher: every clear that did NOT route
        // through clearSelectionBecause within 200ms is UNEXPLAINED — the
        // interesting kind — and ships with the raw input ring buffer.
        let telHadSelection = false;
        term.onSelectionChange(() => {
            const has = term.hasSelection();
            if (has) {
                const txt = term.getSelection();
                // Stash for the copy chord: pane OUTPUT (a streaming turn)
                // can repaint-clear the highlight before Ctrl+C lands; the
                // chord falls back to this for 15s unless the user
                // explicitly dismissed (wheel/Escape/replace null it).
                if (txt) selStash = { text: txt, t: performance.now() };
            }
            if (has && !telHadSelection) {
                tel('sel-created', { len: term.getSelection().length });
            } else if (!has && telHadSelection) {
                const dt = performance.now() - lastExplainedClear.t;
                if (!(lastExplainedClear.why && dt < 200)) {
                    tel('sel-cleared', { reason: 'UNEXPLAINED', ring: evRing.slice() });
                    if (selDebug) showToast('selection cleared: UNEXPLAINED [' + TL_BUILD + ']', 'error', 2500);
                }
            }
            telHadSelection = has;
        });

        document.title = 'tmux: ' + whoami.osUser + '/' + validArg;

        // ------------------------------------------------------------------
        // Mobile / touch UI — soft keyboard, modifier toolbar, resize plumbing
        // ------------------------------------------------------------------

        // xterm.js mounts an offscreen <textarea> as its input proxy. On touch
        // devices the soft keyboard targets that textarea, so we harden it:
        //   - autocorrect/spellcheck/etc off (no inline suggestions)
        //   - type=password suppresses Gboard predictive text (xterm.js #2403),
        //     which would otherwise inject duplicate/spurious keystrokes
        //   - font-size 16px prevents iOS Safari auto-zoom on focus
        const helperTextarea = document.querySelector('.xterm-helper-textarea');
        if (helperTextarea) {
            helperTextarea.setAttribute('autocorrect', 'off');
            helperTextarea.setAttribute('autocapitalize', 'off');
            helperTextarea.setAttribute('autocomplete', 'off');
            helperTextarea.setAttribute('spellcheck', 'false');
            helperTextarea.setAttribute('type', 'password');
            helperTextarea.setAttribute('aria-label', 'terminal input');
            helperTextarea.style.fontSize = '16px';
        }

        const isCoarsePointer = matchMedia('(pointer: coarse)').matches;
        const terminalEl = document.getElementById('terminal');

        // Shared modifier state for the soft-key toolbar (only populated on
        // touch devices). Reads in the term.onData wrapper below.
        let softMods = null;
        let consumeSoftMods = () => {};

        if (isCoarsePointer) {
            // Touch behaviour on the terminal canvas:
            //   tap  → focus helper textarea → soft keyboard appears
            //   swipe → dispatch synthetic wheel events on the xterm root.
            //           xterm forwards them to the PTY (tmux has `mouse on`
            //           globally) which scrolls copy-mode. Without this,
            //           there's no way to see scrollback on touch.
            //
            // We defer the focus call to touchend with a movement-threshold
            // check so a swipe never accidentally summons the keyboard.
            (() => {
                let startY = null, lastY = null, moved = false;
                const SWIPE_THRESHOLD = 6;  // px — tap vs. swipe
                terminalEl.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) { startY = lastY = null; return; }
                    startY = lastY = e.touches[0].clientY;
                    moved = false;
