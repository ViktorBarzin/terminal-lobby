    <script>
    /* Pre-paint theme boot — body's FIRST child, executed before any content
       exists to paint, so the very first frame already carries the right
       palette and the browser-chrome color (<meta name=theme-color>) is in
       sync. It cannot live in <head>: every theme selector is body.theme-*
       and document.body does not exist during <head> parsing. 'system'
       follows the OS scheme as t3-dark/t3-light (kept live by the change
       listener); an UNSET choice keeps the historical default (slate) so
       users who never picked a theme see zero change. The main app script
       reuses these globals (__tlThemes / __tlApplyTheme). */
    (function () {
        var FALLBACK = 'slate';
        window.__tlThemes = ['carbon', 'slate', 'mono', 'ink', 't3-dark',
            't3-light', 'catppuccin-mocha', 'catppuccin-latte', 'system'];
        window.__tlApplyTheme = function (t) {
            if (window.__tlThemes.indexOf(t) === -1) t = FALLBACK;
            if (t === 'system') {
                t = matchMedia('(prefers-color-scheme: dark)').matches
                    ? 't3-dark' : 't3-light';
            }
            var b = document.body;
            Array.prototype.slice.call(b.classList).forEach(function (c) {
                if (c.indexOf('theme-') === 0) b.classList.remove(c);
            });
            b.classList.add('theme-' + t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.content = getComputedStyle(b)
                    .getPropertyValue('--bg-page').trim() || '#0d1117';
            }
        };
        function stored() {
            try { return localStorage.getItem('tmux-theme'); }
            catch (e) { return null; }
        }
        window.__tlApplyTheme(stored() || FALLBACK);
        try {
            matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', function () {
                    if (stored() !== 'system') return;
                    window.__tlApplyTheme('system');
                    // xterm bakes its colors at boot: terminal-mode pages
                    // (valid ?arg=) reload to re-read them — same effect as
                    // the picker's iframe reload. Task 1.7's live switch
                    // hooks in via __tlThemeLive and replaces the reload.
                    if (typeof window.__tlThemeLive === 'function') {
                        window.__tlThemeLive('system');
                    } else if (/[?&]arg=/.test(location.search)) {
                        location.reload();
                    }
                });
        } catch (e) { /* no matchMedia listener — auto-follow stays off */ }
    })();
    </script>
    <div id="terminal"></div>
    <div id="lobby">
        <button id="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">‹</button>
        <div id="lobby-shell">
            <aside id="lobby-sidebar">
                <h1 class="lobby-header">tmux sessions</h1>
                <p class="lobby-sub">Pick a session or create one. Sessions persist after you close the tab.</p>
                <div class="new-row">
                    <input id="new-name" type="text" placeholder="new session name" maxlength="32" autocomplete="off">
                    <button id="new-btn">Create &amp; Open</button>
                </div>
                <div id="session-list" class="session-list"></div>
                <button id="new-project-btn" class="new-project-btn" type="button"
                        title="Create an empty project folder to group sessions into">+ Project</button>
                <button id="restore-btn" class="restore-btn" type="button"
                        title="Recreate your saved sessions that aren't currently running (e.g. after an OOM), resuming each Claude conversation">&#8635; Restore saved sessions</button>
                <div id="theme-picker" class="theme-picker">
                    <span class="theme-picker-label">Theme</span>
                    <div class="theme-options">
                        <button type="button" data-theme="carbon">Carbon</button>
                        <button type="button" data-theme="slate">Slate</button>
                        <button type="button" data-theme="mono">Mono</button>
                        <button type="button" data-theme="ink">Ink</button>
                        <button type="button" data-theme="t3-dark">T3 Dark</button>
                        <button type="button" data-theme="t3-light">T3 Light</button>
                        <button type="button" data-theme="catppuccin-mocha">Mocha</button>
                        <button type="button" data-theme="catppuccin-latte">Latte</button>
                        <button type="button" data-theme="system"
                                title="Follow the OS light/dark setting (T3 Light / T3 Dark)">System</button>
                    </div>
                </div>
            </aside>
            <main id="lobby-content">
                <div id="lobby-empty">Pick a session, or create one above.</div>
                <iframe id="session-frame" class="hidden" referrerpolicy="same-origin" allow="clipboard-read; clipboard-write" title="terminal session"></iframe>
            </main>
        </div>
    </div>
    <div id="toast"></div>
    <button id="gallery-btn" title="Session images">&#128444;&#65039;</button>
    <button id="img-btn" title="Upload image">&#128247;</button>
    <button id="paste-btn" title="Paste from clipboard">&#128203;</button>
    <input type="file" id="img-input" accept="image/*">

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-clipboard@0.1.0/lib/addon-clipboard.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-image@0.9.0/lib/addon-image.min.js"></script>
    <!-- Deliberately the published non-.min path: jsdelivr-generated .min
         files are SRI-unsafe; the .min tags above migrate at the SRI task. -->
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.js"></script>
    <script>
    (async function() {
        // Stamped by deploy.sh at install time; 'dev' when served from a checkout.
        const TL_BUILD = '__TL_BUILD__';
        console.log('terminal-lobby build:', TL_BUILD);
        try { document.documentElement.dataset.tlBuild = TL_BUILD; } catch (e) {}
        const NAME_RE = /^[a-zA-Z0-9_-]{1,32}$/;
        const SESSIONS_API = '/api/sessions/sessions';
        const RESTORE_API  = '/api/sessions/restore';
        const WHOAMI_API   = '/api/sessions/whoami';
        const LAYOUT_API   = '/api/sessions/layout';
        const params = new URLSearchParams(location.search);
        const rawArg = params.get('arg');
        const validArg = rawArg && NAME_RE.test(rawArg) ? rawArg : null;

        // Theme — shared by lobby + terminal-mode iframe (same-origin
        // localStorage). The canonical name list ('system' included) and the
        // class+meta applier live in the pre-paint boot script at the top of
        // <body>, which already painted the first frame before this ran.
        const THEMES = window.__tlThemes;
        const THEME_KEY = 'tmux-theme';
        function getTheme() {
            try {
                const t = localStorage.getItem(THEME_KEY);
                return THEMES.includes(t) ? t : 'slate';
            } catch (e) { return 'slate'; }
        }
        const applyTheme = window.__tlApplyTheme;
        function readTerminalTheme() {
            const cs = getComputedStyle(document.body);
            const v = k => cs.getPropertyValue(k).trim();
            // Full ITheme: the original four keys keep their hard fallbacks
            // (slate), cursorAccent inverts to the theme bg, and the 16 ANSI
            // slots come from the per-theme --terminal-ansi-* vars (fallbacks
            // = the T3-seeded dark set, matching the slate default).
            return {
                background: v('--terminal-bg') || '#0d1117',
                foreground: v('--terminal-fg') || '#e6e8eb',
                cursor: v('--terminal-cursor') || '#4493f8',
                cursorAccent: v('--terminal-cursor-accent') || v('--terminal-bg') || '#0d1117',
                selectionBackground: v('--terminal-selection') || 'rgba(68,147,248,0.22)',
                black: v('--terminal-ansi-black') || '#161b22',
                red: v('--terminal-ansi-red') || '#ff7a8e',
                green: v('--terminal-ansi-green') || '#86e795',
                yellow: v('--terminal-ansi-yellow') || '#f4cd72',
                blue: v('--terminal-ansi-blue') || '#89beff',
                magenta: v('--terminal-ansi-magenta') || '#d0b0ff',
                cyan: v('--terminal-ansi-cyan') || '#7ce8ed',
                white: v('--terminal-ansi-white') || '#d2dae6',
                brightBlack: v('--terminal-ansi-bright-black') || '#6e7888',
                brightRed: v('--terminal-ansi-bright-red') || '#ffa8b4',
                brightGreen: v('--terminal-ansi-bright-green') || '#b0f5ba',
                brightYellow: v('--terminal-ansi-bright-yellow') || '#ffe095',
                brightBlue: v('--terminal-ansi-bright-blue') || '#aed2ff',
                brightMagenta: v('--terminal-ansi-bright-magenta') || '#e5cbff',
                brightCyan: v('--terminal-ansi-bright-cyan') || '#a7f4f7',
                brightWhite: v('--terminal-ansi-bright-white') || '#f4f7fc'
            };
        }
        applyTheme(getTheme());

        function showToast(msg, type, duration) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'visible' + (type ? ' ' + type : '');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => { el.className = ''; }, duration || 3000);
        }

        function clearChildren(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function emptyState(text) {
            const e = document.createElement('div');
            e.className = 'empty';
            e.textContent = text;
            return e;
        }

        function showAccessDenied(detail) {
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            const lobby = document.getElementById('lobby');
            clearChildren(lobby);
            const h = document.createElement('h1');
            h.className = 'lobby-header';
            h.textContent = 'Access denied';
            lobby.appendChild(h);
            const p = document.createElement('p');
            p.className = 'lobby-sub';
            p.textContent = detail || 'You do not have a terminal account on this server.';
            lobby.appendChild(p);
            const p2 = document.createElement('p');
            p2.className = 'lobby-sub';
            p2.textContent = 'Authentik logs you in; access here requires an OS-user mapping in /etc/ttyd-user-map. Ask Viktor to add one.';
            lobby.appendChild(p2);
            lobby.classList.add('visible', 'access-denied');
            document.title = 'access denied';
        }

        // Preflight: ask tmux-api who we are. 403 = unmapped Authentik user → deny.
        let whoami = null;
        try {
            const resp = await fetch(WHOAMI_API, { credentials: 'same-origin' });
            if (resp.status === 401 || resp.status === 403) {
                showAccessDenied((await resp.text()).trim());
                return;
            }
            if (!resp.ok) {
                showAccessDenied('Preflight failed: HTTP ' + resp.status);
                return;
            }
            whoami = await resp.json();
        } catch (err) {
            showAccessDenied('Preflight failed: ' + err.message);
            return;
        }

        if (!validArg) {
            // ============================================================
            // LOBBY MODE — no valid ?arg=, render sidebar + iframe shell
            // ============================================================
            document.getElementById('terminal').classList.add('hidden');
            document.getElementById('paste-btn').classList.add('hidden');
            document.getElementById('img-btn').classList.add('hidden');
            document.getElementById('gallery-btn').classList.add('hidden');
            document.getElementById('lobby').classList.add('visible');
            const baseTitle = 'tmux sessions (' + whoami.osUser + ')';
            document.title = baseTitle;
            document.querySelector('#lobby .lobby-sub').textContent =
                'Logged in as ' + whoami.osUser + ' (' + whoami.authentik + '). Sessions are kernel-isolated per Unix user; you only see your own.';

            const listEl    = document.getElementById('session-list');
            const newNameEl = document.getElementById('new-name');
            const newBtnEl  = document.getElementById('new-btn');
            const newProjectBtnEl = document.getElementById('new-project-btn');
            const restoreBtnEl = document.getElementById('restore-btn');
            const frameEl   = document.getElementById('session-frame');
            const emptyEl   = document.getElementById('lobby-empty');

            let currentActive = null;
            // A session is "confirmed" once a /sessions poll has actually listed
            // it. Only a confirmed-then-vanished session means it was killed
            // elsewhere (→ deactivate). A freshly-activated session that has
            // never appeared yet is still being CREATED — its tmux session is
            // born only after the iframe's WebSocket reaches ttyd (whoami →
            // token → ws). Tearing the iframe down before then aborts that very
            // chain ("Token fetch failed: TypeError: Failed to fetch"), so the
            // session never gets created. Gate deactivation on this flag.
            let activeConfirmed = false;
            let dragSrcCard = null;
            // Dragging a project header reorders whole groups; mutually
            // exclusive with dragSrcCard (a drag is one or the other).
            let dragSrcGroup = null;
            let isDragging = false;
            // Legacy per-browser drag-order; used once to seed the server-side
            // layout, then left alone.
            const ORDER_KEY = 'tmux-session-order-' + whoami.osUser;

            // The user's sidebar layout: ordered projects (may reference dead
            // sessions — kept so restores regroup, see ADR-0002) + ungrouped
            // order. Server-side so it roams across devices.
            let layout = { version: 1, projects: [], ungrouped: [], ungroupedIndex: 0 };
            let layoutLoaded = false;
            // Last /sessions payload — lets layout mutations repaint instantly
            // without waiting for the next poll.
            let lastSessions = [];

            function relativeTime(epochSec) {
                if (!epochSec) return '';
                const diff = Math.floor(Date.now() / 1000) - epochSec;
                if (diff < 60)    return diff + 's ago';
                if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            }

            function getSavedOrder() {
                try {
                    const raw = localStorage.getItem(ORDER_KEY);
                    if (!raw) return [];
                    const arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string') : [];
                } catch (e) { return []; }
            }

            // --- layout store client -----------------------------------------

            async function fetchLayout() {
                const resp = await fetch(LAYOUT_API, { credentials: 'same-origin' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const l = await resp.json();
                l.projects  = Array.isArray(l.projects)  ? l.projects  : [];
                l.ungrouped = Array.isArray(l.ungrouped) ? l.ungrouped : [];
                l.ungroupedIndex = Number.isInteger(l.ungroupedIndex)
                    ? Math.max(0, Math.min(l.ungroupedIndex, l.projects.length))
                    : 0;
                return l;
            }

            // The sidebar is one ordered sequence of groups: the Ungrouped
            // section (sentinel) sitting at ungroupedIndex among the projects.
            // All reordering goes through this sequence so moving anything
            // past anything else — including Ungrouped itself — is one code
            // path.
            function groupSeq() {
                const seq = layout.projects.slice();
                seq.splice(Math.min(layout.ungroupedIndex, seq.length), 0, UNGROUPED_COLLAPSE_ID);
                return seq;
            }
            function applyGroupSeq(seq) {
                layout.ungroupedIndex = seq.indexOf(UNGROUPED_COLLAPSE_ID);
                layout.projects = seq.filter(x => x !== UNGROUPED_COLLAPSE_ID);
            }

            async function putLayout() {
                const resp = await fetch(LAYOUT_API, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(layout)
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
            }

            // Mutate-then-save: repaint optimistically, then persist; on failure
            // re-fetch so the sidebar snaps back to the server's truth.
            async function saveLayout() {
                paint();
                try {
                    await putLayout();
                } catch (err) {
                    showToast('Saving layout failed: ' + err.message, 'error', 4000);
                    try { layout = await fetchLayout(); } catch (e) { /* next poll */ }
                    paint();
                }
            }

            function projectOfSession(name) {
                for (const p of layout.projects) {
                    if (p.sessions.includes(name)) return p.name;
                }
                return '';
            }

            // Remove a session from every layout list (before re-inserting it
            // somewhere else). Returns true when something was removed.
            function pullFromLayout(name) {
                let removed = false;
                for (const p of layout.projects) {
                    const i = p.sessions.indexOf(name);
                    if (i >= 0) { p.sessions.splice(i, 1); removed = true; }
                }
                const i = layout.ungrouped.indexOf(name);
                if (i >= 0) { layout.ungrouped.splice(i, 1); removed = true; }
                return removed;
            }

            function moveSessionTo(name, projectName) {
                pullFromLayout(name);
                if (projectName === '') {
                    layout.ungrouped.push(name);
                } else {
                    const p = layout.projects.find(p => p.name === projectName);
                    if (!p) return;
                    p.sessions.push(name);
                }
                saveLayout();
            }

            // Rebuild ordering from the rendered cards after a drag. Live-card
            // order comes from the DOM; dead members (not rendered) are
            // re-appended to their project so a drag never drops the
            // assignments that make OOM restores regroup.
            function captureLayoutFromDom() {
                const deadByProject = new Map();
                const liveNames = new Set(lastSessions.map(s => s.name));
                for (const p of layout.projects) {
                    deadByProject.set(p.name, p.sessions.filter(n => !liveNames.has(n)));
                }
                const deadUngrouped = layout.ungrouped.filter(n => !liveNames.has(n));

                const projects = [];
                let ungrouped = [];
                let ungroupedIndex = -1;
                listEl.querySelectorAll('.project-group').forEach(group => {
                    const name = group.dataset.project;
                    const members = Array.from(group.querySelectorAll('.session-card')).map(c => c.dataset.name);
                    if (name === '') {
                        ungrouped = members.concat(deadUngrouped);
                        ungroupedIndex = projects.length;
                    } else {
                        projects.push({ name, sessions: members.concat(deadByProject.get(name) || []) });
                    }
                });
                // The ungrouped group isn't rendered while empty — keep its
                // dead entries and its stored slot anyway.
                if (ungroupedIndex < 0) {
                    ungrouped = deadUngrouped;
                    ungroupedIndex = Math.min(layout.ungroupedIndex, projects.length);
                }
                layout = { version: 1, projects, ungrouped, ungroupedIndex };
            }

            // --- collapse state (per-browser view preference) ----------------

            const COLLAPSE_KEY = 'tmux-collapsed-' + whoami.osUser;
            const UNGROUPED_COLLAPSE_ID = '__ungrouped__';
            function getCollapsed() {
                try {
                    const raw = localStorage.getItem(COLLAPSE_KEY);
                    const obj = raw ? JSON.parse(raw) : {};
                    return (obj && typeof obj === 'object') ? obj : {};
                } catch (e) { return {}; }
            }
            function setCollapsed(id, collapsed) {
                const all = getCollapsed();
                if (collapsed) all[id] = 1; else delete all[id];
                try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(all)); } catch (e) {}
            }
            // Activating a session hidden inside a collapsed project would
            // highlight nothing — auto-expand its group.
            function ensureSessionVisible(name) {
                const proj = projectOfSession(name);
                const id = proj === '' ? UNGROUPED_COLLAPSE_ID : proj;
                if (getCollapsed()[id]) {
                    setCollapsed(id, false);
                    paint();
                }
            }

            function updateActiveCard() {
                listEl.querySelectorAll('.session-card').forEach(c => {
                    if (c.dataset.name === currentActive) c.classList.add('active');
                    else c.classList.remove('active');
                });
            }

            // On touch + small screen, the first session activation collapses
            // the sidebar so the terminal gets the full viewport. We stamp a
            // localStorage flag so we don't fight users who manually re-open it.
            const MOBILE_AUTO_COLLAPSE_KEY = 'tmux-mobile-auto-collapsed';
            const mobileQuery = matchMedia('(pointer: coarse) and (max-width: 720px)');
            function maybeAutoCollapseSidebar() {
                if (!mobileQuery.matches) return;
                try {
                    if (localStorage.getItem(MOBILE_AUTO_COLLAPSE_KEY) === 'done') return;
                    localStorage.setItem(MOBILE_AUTO_COLLAPSE_KEY, 'done');
                } catch (e) { /* localStorage disabled — best-effort */ }
                setSidebarCollapsed(true);
            }

            // Tab title carries an attention badge while any session awaits
            // input, so a backgrounded lobby tab still signals.
            function updateTitle() {
                const awaiting = lastSessions.filter(s => s.state === 'awaiting').length;
                const badge = awaiting > 0 ? '(' + awaiting + '●) ' : '';
                document.title = badge +
                    (currentActive ? 'tmux: ' + whoami.osUser + '/' + currentActive : baseTitle);
            }

            function activateSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (currentActive === name) { updateActiveCard(); return; }
                currentActive = name;
                activeConfirmed = false;
                emptyEl.classList.add('hidden');
                frameEl.classList.remove('hidden');
                frameEl.src = '/?arg=' + encodeURIComponent(name);
                if (location.hash.slice(1) !== name) {
                    history.replaceState(null, '', '#' + name);
                }
                updateTitle();
                ensureSessionVisible(name);
                updateActiveCard();
                maybeAutoCollapseSidebar();
            }

            function deactivateSession() {
                if (!currentActive && frameEl.classList.contains('hidden')) return;
                currentActive = null;
                activeConfirmed = false;
                frameEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                frameEl.src = 'about:blank';
                if (location.hash) {
                    history.replaceState(null, '', location.pathname + location.search);
                }
                updateTitle();
                updateActiveCard();
            }

            async function killSession(name) {
                if (!NAME_RE.test(name)) { showToast('Invalid name', 'error'); return; }
                if (!confirm('Kill tmux session "' + name + '"? Any running processes inside it will be terminated.')) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(name), {
                        method: 'DELETE', credentials: 'same-origin'
                    });
                    if (resp.ok) {
                        showToast('Killed ' + name, 'success');
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else {
                        showToast('Kill failed: HTTP ' + resp.status, 'error');
                    }
                    if (currentActive === name) deactivateSession();
                    renderLobby();
                } catch (err) {
                    showToast('Kill error: ' + err.message, 'error');
                }
            }

            // Restore the current user's saved-but-dead sessions (tmux-persist
            // manifest) on demand. Non-destructive: tmux-persist skips sessions
            // that are already live, so this only recreates missing ones and
            // resumes their Claude conversations. Useful after an OOM kills the
            // tmux server without a reboot (the boot-only restore never fires).
            async function restoreSessions(btn) {
                if (btn) btn.disabled = true;
                try {
                    const resp = await fetch(RESTORE_API, { method: 'POST', credentials: 'same-origin' });
                    if (resp.ok) {
                        showToast('Restoring your saved sessions…', 'success', 3500);
                        quickRefreshAfterCreate();
                    } else if (resp.status === 401 || resp.status === 403) {
                        showToast('Not authorized to restore', 'error', 4000);
                    } else {
                        showToast('Restore failed: HTTP ' + resp.status, 'error', 4000);
                    }
                } catch (err) {
                    showToast('Restore error: ' + err.message, 'error', 4000);
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            async function renameSession(oldName) {
                if (!NAME_RE.test(oldName)) { showToast('Invalid name', 'error'); return; }
                const input = prompt('Rename "' + oldName + '" to:', oldName);
                if (input === null) return;
                const newName = input.trim();
                if (!NAME_RE.test(newName)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                if (newName === oldName) return;
                try {
                    const resp = await fetch(SESSIONS_API + '/' + encodeURIComponent(oldName) + '/rename', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    if (resp.status === 204) {
                        // The server renames the layout entry too — the next
                        // fetch reflects it; mirror locally for the instant
                        // repaint.
                        for (const p of layout.projects) {
                            const i = p.sessions.indexOf(oldName);
                            if (i >= 0) p.sessions[i] = newName;
                        }
                        const ui = layout.ungrouped.indexOf(oldName);
                        if (ui >= 0) layout.ungrouped[ui] = newName;
                        showToast('Renamed to ' + newName, 'success');
                        if (currentActive === oldName) {
                            currentActive = newName;
                            frameEl.src = '/?arg=' + encodeURIComponent(newName);
                            history.replaceState(null, '', '#' + newName);
                            updateTitle();
                        }
                        renderLobby();
                    } else if (resp.status === 404) {
                        showToast('Session not found', 'error');
                    } else if (resp.status === 409) {
                        showToast('Name "' + newName + '" already taken', 'error', 4000);
                    } else if (resp.status === 400) {
                        showToast('Invalid name', 'error');
                    } else {
                        showToast('Rename failed: HTTP ' + resp.status, 'error');
                    }
                } catch (err) {
                    showToast('Rename error: ' + err.message, 'error');
                }
            }

            // --- popup menu (session ⋯ and project ⋯) -------------------------

            let openMenuEl = null;
            function closeMenu() {
                if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
            }
            // items: {label, onClick, danger?, disabled?} or {labelHeading}
            function openMenu(anchor, items) {
                closeMenu();
                const menu = document.createElement('div');
                menu.className = 'popup-menu';
                for (const it of items) {
                    if (it.labelHeading) {
                        const l = document.createElement('div');
                        l.className = 'menu-label';
                        l.textContent = it.labelHeading;
                        menu.appendChild(l);
                        continue;
                    }
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = it.label;
                    if (it.danger) b.classList.add('danger');
                    if (it.disabled) b.disabled = true;
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        closeMenu();
                        it.onClick();
                    });
                    menu.appendChild(b);
                }
                document.body.appendChild(menu);
                const r = anchor.getBoundingClientRect();
                const mw = menu.offsetWidth, mh = menu.offsetHeight;
                let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
                let top  = r.bottom + 4;
                if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
                menu.style.left = Math.max(8, left) + 'px';
                menu.style.top  = top + 'px';
                openMenuEl = menu;
            }
            document.addEventListener('pointerdown', (e) => {
                if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });

            // --- project CRUD --------------------------------------------------

            function promptProjectName(promptText, initial) {
                const input = prompt(promptText, initial || '');
                if (input === null) return null;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Project name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return null;
                }
                if (layout.projects.some(p => p.name === name)) {
                    showToast('Project "' + name + '" already exists', 'error', 4000);
                    return null;
                }
                return name;
            }

            function createProject() {
                const name = promptProjectName('New project name:');
                if (!name) return;
                layout.projects.push({ name, sessions: [] });
                saveLayout();
            }

            function renameProject(oldName) {
                const name = promptProjectName('Rename project "' + oldName + '" to:', oldName);
                if (!name || name === oldName) return;
                const p = layout.projects.find(p => p.name === oldName);
                if (!p) return;
                p.name = name;
                // Carry the per-browser collapse flag to the new name.
                const collapsed = getCollapsed()[oldName];
                setCollapsed(oldName, false);
                if (collapsed) setCollapsed(name, true);
                saveLayout();
            }

            // Deleting a project never touches tmux — members drop back to
            // Ungrouped.
            function deleteProject(name) {
                const p = layout.projects.find(p => p.name === name);
                if (!p) return;
                const liveNames = new Set(lastSessions.map(s => s.name));
                const liveMembers = p.sessions.filter(n => liveNames.has(n));
                const suffix = liveMembers.length
                    ? ' Its ' + liveMembers.length + ' session' + (liveMembers.length > 1 ? 's' : '') + ' move to Ungrouped.'
                    : '';
                if (!confirm('Delete project "' + name + '"?' + suffix + ' (Sessions are never killed by this.)')) return;
                layout.ungrouped.push(...p.sessions);
                layout.projects = layout.projects.filter(x => x !== p);
                layout.ungroupedIndex = Math.min(layout.ungroupedIndex, layout.projects.length);
                setCollapsed(name, false);
                saveLayout();
            }

            // Move a group one visual slot up/down — the touch-friendly
            // counterpart of dragging its header. Works on the combined
            // sequence, so projects and the Ungrouped section move past each
            // other symmetrically. groupId '' = Ungrouped.
            function moveGroup(groupId, delta) {
                const seq = groupSeq();
                const i = groupId === ''
                    ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                    : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === groupId);
                const j = i + delta;
                if (i < 0 || j < 0 || j >= seq.length) return;
                const [g] = seq.splice(i, 1);
                seq.splice(j, 0, g);
                applyGroupSeq(seq);
                saveLayout();
            }

            // Header "+" — create a session directly inside the project. The
            // assignment is recorded BEFORE the iframe spawn so the card never
            // flickers through Ungrouped.
            function createSessionInProject(projectName) {
                const input = prompt('New session in "' + projectName + '":');
                if (input === null) return;
                const name = input.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                moveSessionTo(name, projectName);
                activateSession(name);
                quickRefreshAfterCreate();
            }

            function moveMenuItems(sessionName) {
                const current = projectOfSession(sessionName);
                const items = [{ labelHeading: 'Move to' }];
                if (current !== '') {
                    items.push({ label: 'Ungrouped', onClick: () => moveSessionTo(sessionName, '') });
                }
                for (const p of layout.projects) {
                    if (p.name === current) continue;
                    items.push({ label: p.name, onClick: () => moveSessionTo(sessionName, p.name) });
                }
                if (items.length === 1) {
                    items.push({ label: 'No projects yet', onClick: () => {}, disabled: true });
                }
                return items;
            }

            // --- rendering -----------------------------------------------------

            function stateDot(state, extraClass) {
                if (!state) return null;
                const dot = document.createElement('span');
                dot.className = 'state-dot ' + state + (extraClass ? ' ' + extraClass : '');
                dot.title = 'Claude: ' + (state === 'done' ? 'completed' :
                    state === 'awaiting' ? 'awaiting your input' : 'running');
                return dot;
            }

            function renderCard(s) {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.dataset.name = s.name;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', 'Activate session ' + s.name);
                card.draggable = true;
                if (s.name === currentActive) card.classList.add('active');

                const meta = document.createElement('div');
                meta.className = 'session-meta';
                const titleRow = document.createElement('div');
                titleRow.className = 'session-title-row';
                const dot = stateDot(s.state);
                if (dot) titleRow.appendChild(dot);
                const name = document.createElement('div');
                name.className = 'session-name';
                name.textContent = s.name;
                titleRow.appendChild(name);
                meta.appendChild(titleRow);
                const detail = document.createElement('div');
                detail.className = 'session-detail' + (s.attached > 0 ? ' attached' : '');
                const attachedText = s.attached > 0 ? (s.attached + ' attached') : 'idle';
                detail.textContent = attachedText + ' · ' + relativeTime(s.lastActivity);
                meta.appendChild(detail);
                card.appendChild(meta);

                const actions = document.createElement('div');
                actions.className = 'session-actions';
                const menuBtn = document.createElement('button');
                menuBtn.textContent = '⋯';
                menuBtn.title = 'Session actions';
                menuBtn.setAttribute('aria-label', 'Actions for session ' + s.name);
                menuBtn.draggable = false;
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMenu(menuBtn, [
                        ...moveMenuItems(s.name),
                        { labelHeading: 'Session' },
                        { label: 'Rename', onClick: () => renameSession(s.name) },
                        { label: 'Kill', danger: true, onClick: () => killSession(s.name) }
                    ]);
                });
                actions.appendChild(menuBtn);
                card.appendChild(actions);

                card.addEventListener('click', () => activateSession(s.name));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateSession(s.name);
                    }
                });

                card.addEventListener('dragstart', (e) => {
                    dragSrcCard = card;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', s.name);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    if (dragSrcCard === card) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcCard = null;
                    isDragging = false;
                });
                // Dropping on a card positions before/after it — including
                // cards in ANOTHER project, which reassigns on dragend.
                card.addEventListener('dragover', (e) => {
                    if (!dragSrcCard || dragSrcCard === card) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = card.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) card.after(dragSrcCard);
                    else card.before(dragSrcCard);
                });

                return card;
            }

            // One collapsible section: the Ungrouped area (projectName '') or a
            // project. `members` are live sessions in layout order.
            function renderGroup(projectName, members) {
                const isUngrouped = projectName === '';
                const collapseId = isUngrouped ? UNGROUPED_COLLAPSE_ID : projectName;
                const collapsed = !!getCollapsed()[collapseId];

                const group = document.createElement('div');
                group.className = 'project-group' + (collapsed ? ' collapsed' : '');
                group.dataset.project = projectName;

                const header = document.createElement('div');
                header.className = 'project-header';
                header.setAttribute('role', 'button');
                header.setAttribute('tabindex', '0');
                header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                header.setAttribute('aria-label',
                    (collapsed ? 'Expand ' : 'Collapse ') + (isUngrouped ? 'ungrouped sessions' : 'project ' + projectName));

                const chev = document.createElement('span');
                chev.className = 'chev';
                chev.textContent = '▾';
                header.appendChild(chev);

                const title = document.createElement('span');
                title.className = 'project-title';
                title.textContent = isUngrouped ? 'Ungrouped' : projectName;
                header.appendChild(title);

                const badges = document.createElement('span');
                badges.className = 'project-badges';
                const count = document.createElement('span');
                count.textContent = String(members.length);
                badges.appendChild(count);
                // Collapsed headers aggregate member states so a folded
                // project still shows when something inside needs you.
                if (collapsed) {
                    for (const state of ['running', 'awaiting', 'done']) {
                        const n = members.filter(s => s.state === state).length;
                        if (!n) continue;
                        const chip = document.createElement('span');
                        chip.className = 'state-chip';
                        chip.appendChild(stateDot(state));
                        const num = document.createElement('span');
                        num.textContent = String(n);
                        chip.appendChild(num);
                        badges.appendChild(chip);
                    }
                }
                header.appendChild(badges);

                const actions = document.createElement('span');
                actions.className = 'project-actions';
                if (!isUngrouped) {
                    const addBtn = document.createElement('button');
                    addBtn.textContent = '+';
                    addBtn.title = 'New session in ' + projectName;
                    addBtn.setAttribute('aria-label', 'New session in project ' + projectName);
                    addBtn.draggable = false;
                    addBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        createSessionInProject(projectName);
                    });
                    actions.appendChild(addBtn);
                }
                const pMenuBtn = document.createElement('button');
                pMenuBtn.textContent = '⋯';
                pMenuBtn.title = isUngrouped ? 'Ungrouped actions' : 'Project actions';
                pMenuBtn.setAttribute('aria-label',
                    isUngrouped ? 'Actions for ungrouped sessions' : 'Actions for project ' + projectName);
                pMenuBtn.draggable = false;
                pMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Touch parity for header drag-reorder (HTML5 DnD is
                    // mouse-only), mirroring the card Move-to menu. Positions
                    // are on the combined sequence, so Ungrouped and projects
                    // move past each other.
                    const seq = groupSeq();
                    const idx = isUngrouped
                        ? seq.indexOf(UNGROUPED_COLLAPSE_ID)
                        : seq.findIndex(x => x !== UNGROUPED_COLLAPSE_ID && x.name === projectName);
                    const items = [
                        { label: 'Move up', disabled: idx <= 0,
                          onClick: () => moveGroup(projectName, -1) },
                        { label: 'Move down', disabled: idx < 0 || idx >= seq.length - 1,
                          onClick: () => moveGroup(projectName, 1) }
                    ];
                    if (!isUngrouped) {
                        items.push(
                            { label: 'Rename project', onClick: () => renameProject(projectName) },
                            { label: 'Delete project', danger: true, onClick: () => deleteProject(projectName) }
                        );
                    }
                    openMenu(pMenuBtn, items);
                });
                actions.appendChild(pMenuBtn);
                header.appendChild(actions);

                // Drag the header to reorder whole groups — projects AND the
                // Ungrouped section. Order persists via the same
                // captureLayoutFromDom as card drags — it rebuilds
                // layout.projects (+ ungroupedIndex) in DOM order.
                header.draggable = true;
                header.addEventListener('dragstart', (e) => {
                    dragSrcGroup = group;
                    isDragging = true;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', projectName);
                    group.classList.add('dragging');
                });
                header.addEventListener('dragend', () => {
                    group.classList.remove('dragging');
                    if (dragSrcGroup === group) {
                        captureLayoutFromDom();
                        saveLayout();
                    }
                    dragSrcGroup = null;
                    isDragging = false;
                });
                group.addEventListener('dragover', (e) => {
                    if (!dragSrcGroup || dragSrcGroup === group) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = group.getBoundingClientRect();
                    const after = (e.clientY - rect.top) > rect.height / 2;
                    if (after) group.after(dragSrcGroup);
                    else group.before(dragSrcGroup);
                });

                function toggleCollapse() {
                    setCollapsed(collapseId, !getCollapsed()[collapseId]);
                    paint();
                }
                header.addEventListener('click', toggleCollapse);
                header.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleCollapse();
                    }
                });

                // Header as a drop target: drop = append to this project.
                header.addEventListener('dragover', (e) => {
                    if (!dragSrcCard) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    header.classList.add('drag-over');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
                header.addEventListener('drop', (e) => {
                    if (!dragSrcCard) return;
                    e.preventDefault();
                    header.classList.remove('drag-over');
                    group.querySelector('.project-sessions').appendChild(dragSrcCard);
                    // If the group was collapsed the card is now hidden —
                    // dragend's captureLayoutFromDom still finds it in the DOM.
                });

                group.appendChild(header);

                const body = document.createElement('div');
                body.className = 'project-sessions';
                for (const s of members) body.appendChild(renderCard(s));
                if (!members.length && !isUngrouped) {
                    const hint = document.createElement('div');
                    hint.className = 'project-empty-hint';
                    hint.textContent = 'empty — drag a session here, or +';
                    body.appendChild(hint);
                }
                group.appendChild(body);
                return group;
            }

            // paint renders the sidebar from lastSessions + layout. Pure view —
            // no fetching — so layout mutations repaint instantly.
            function paint() {
                if (isDragging || openMenuEl) return;
                clearChildren(listEl);
                const liveByName = new Map(lastSessions.map(s => [s.name, s]));
                const referenced = new Set();
                for (const p of layout.projects) p.sessions.forEach(n => referenced.add(n));
                layout.ungrouped.forEach(n => referenced.add(n));

                // Ungrouped members: explicit order first, then any live
                // session the layout has never seen (fresh creations), in
                // tmux order. The section renders at its slot in the combined
                // sequence (ungroupedIndex) and is skipped while empty.
                const ungrouped = layout.ungrouped
                    .map(n => liveByName.get(n)).filter(Boolean)
                    .concat(lastSessions.filter(s => !referenced.has(s.name)));
                for (const g of groupSeq()) {
                    if (g === UNGROUPED_COLLAPSE_ID) {
                        if (ungrouped.length) listEl.appendChild(renderGroup('', ungrouped));
                        continue;
                    }
                    const members = g.sessions.map(n => liveByName.get(n)).filter(Boolean);
                    listEl.appendChild(renderGroup(g.name, members));
                }
                if (!ungrouped.length && !layout.projects.length) {
                    listEl.appendChild(emptyState('No sessions yet.'));
                }
                updateTitle();
            }

            async function renderLobby() {
                if (isDragging || openMenuEl) return;
                try {
                    const [sessResp, layoutResult] = await Promise.all([
                        fetch(SESSIONS_API, { credentials: 'same-origin' }),
                        fetchLayout().catch(err => err)
                    ]);
                    if (!sessResp.ok) {
                        clearChildren(listEl);
                        listEl.appendChild(emptyState('Failed to load sessions: HTTP ' + sessResp.status));
                        return;
                    }
                    const sessions = await sessResp.json();
                    if (layoutResult instanceof Error) {
                        // Grouping degrades gracefully: keep the last-known
                        // layout, sessions still render.
                        if (!layoutLoaded) console.warn('layout fetch failed:', layoutResult);
                    } else {
                        layout = layoutResult;
                        if (!layoutLoaded) {
                            layoutLoaded = true;
                            seedLayoutFromLegacyOrder();
                        }
                    }
                    const activeListed = sessions.some(s => s.name === currentActive);
                    if (currentActive && activeListed) activeConfirmed = true;
                    // Only deactivate a session we've SEEN before and that is now
                    // gone (killed elsewhere). Never tear down one that has yet to
                    // appear — it's still being created (see activeConfirmed note).
                    if (currentActive && !activeListed && activeConfirmed) {
                        deactivateSession();
                    }
                    lastSessions = sessions;
                    paint();
                } catch (err) {
                    clearChildren(listEl);
                    listEl.appendChild(emptyState('Error: ' + err.message));
                }
            }

            // One-time migration: an untouched server layout + a legacy
            // localStorage drag-order → carry the old order into Ungrouped.
            function seedLayoutFromLegacyOrder() {
                if (layout.projects.length || layout.ungrouped.length) return;
                const old = getSavedOrder().filter(n => NAME_RE.test(n));
                if (!old.length) return;
                layout.ungrouped = old;
                putLayout().catch(() => {});
            }

            // A newly-created session is spawned by the iframe's WebSocket a
            // beat after it loads, so the regular 5s poll can miss it and the
            // per-user API cache can briefly hold a pre-spawn empty list. Poll a
            // few times in the first seconds so the new card appears within ~1-2s.
            function quickRefreshAfterCreate() {
                [700, 1600, 3000, 4500].forEach((ms) => setTimeout(renderLobby, ms));
            }
            newBtnEl.addEventListener('click', () => {
                const name = newNameEl.value.trim();
                if (!NAME_RE.test(name)) {
                    showToast('Name must match ^[a-zA-Z0-9_-]{1,32}$', 'error', 4000);
                    return;
                }
                newNameEl.value = '';
                activateSession(name);
                quickRefreshAfterCreate();
            });
            newNameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') newBtnEl.click();
            });
            restoreBtnEl.addEventListener('click', () => restoreSessions(restoreBtnEl));
            newProjectBtnEl.addEventListener('click', createProject);

            window.addEventListener('hashchange', () => {
                const hash = location.hash.slice(1);
                if (hash && NAME_RE.test(hash)) {
                    if (hash !== currentActive) activateSession(hash);
                } else if (currentActive) {
                    deactivateSession();
                }
            });

            // Sidebar collapse — toggle a class on #lobby + persist in localStorage.
            // The grid-template-columns transition handles the slide; xterm in the
            // iframe re-fits on its own window resize event.
            const SIDEBAR_KEY = 'tmux-sidebar-collapsed';
            const lobbyEl    = document.getElementById('lobby');
            const toggleEl   = document.getElementById('sidebar-toggle');
            function getSidebarCollapsed() {
                try { return localStorage.getItem(SIDEBAR_KEY) === '1'; }
                catch (e) { return false; }
            }
            function setSidebarCollapsed(collapsed) {
                lobbyEl.classList.toggle('sidebar-collapsed', collapsed);
                toggleEl.textContent = collapsed ? '›' : '‹';
                toggleEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggleEl.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
                try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
            }
            toggleEl.addEventListener('click', () => {
                setSidebarCollapsed(!lobbyEl.classList.contains('sidebar-collapsed'));
            });
            setSidebarCollapsed(getSidebarCollapsed());

            // Theme picker — clicking a swatch swaps body class, persists,
            // and live-rethemes the inner terminal via postMessage (tl-theme,
            // same channel as tl-drop-files). The iframe ACKs back; no ACK
            // within 1s means it runs a stale pre-live-switch build, so fall
            // back to the old iframe reload (a reload re-reads the theme from
            // localStorage at boot anyway).
            const themePickerEl = document.getElementById('theme-picker');
            let themeAckTimer = null;
            window.addEventListener('message', (e) => {
                if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-theme-ack') return;
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            // A frame that was still LOADING when tl-theme was posted never
            // saw the message — but its boot paints from localStorage, which
            // already holds the new theme. Cancel the pending fallback so a
            // fresh frame isn't pointlessly reloaded a second time.
            frameEl.addEventListener('load', () => {
                clearTimeout(themeAckTimer);
                themeAckTimer = null;
            });
            function paintThemeButtons() {
                const active = getTheme();
                themePickerEl.querySelectorAll('button[data-theme]').forEach(b => {
                    b.classList.toggle('active', b.dataset.theme === active);
                });
            }
            themePickerEl.querySelectorAll('button[data-theme]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.theme;
                    if (!THEMES.includes(t)) return;
                    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
                    applyTheme(t);
                    paintThemeButtons();
                    if (currentActive && frameEl.src && frameEl.contentWindow) {
                        clearTimeout(themeAckTimer);
                        themeAckTimer = setTimeout(() => {
                            themeAckTimer = null;
                            // No ACK: reload iframe so xterm picks up the new
                            // theme (re-read src — the session may have
                            // changed during the wait).
                            const url = frameEl.src;
                            if (!url || url === 'about:blank') return;
                            frameEl.src = 'about:blank';
                            setTimeout(() => { frameEl.src = url; }, 0);
                        }, 1000);
                        frameEl.contentWindow.postMessage({ type: 'tl-theme', name: t }, location.origin);
                    }
                });
            });
            paintThemeButtons();

            // Drops on the terminal are handled inside the iframe. If one lands
            // on the lobby chrome (sidebar) instead, suppress the browser's
            // default file-open and forward the files to the active session's
            // iframe (it uploads them and types the paths in). preventDefault is
            // unconditional — gating it caused Chrome to open the file instead.
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer ? Array.from(e.dataTransfer.files || []) : [];
                if (!files.length) return;
                if (currentActive && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ type: 'tl-drop-files', files }, location.origin);
                    showToast('Sent ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' to ' + currentActive, 'success', 3000);
                } else {
                    showToast('Open a session first, then drop files', 'error', 3500);
                }
            });

            renderLobby();
            setInterval(renderLobby, 5000);

            const initialHash = location.hash.slice(1);
            if (initialHash && NAME_RE.test(initialHash)) {
                activateSession(initialHash);
            }
            return;
        }

        // ============================================================
        // TERMINAL MODE — valid ?arg=<session>, attach via ttyd
        // ============================================================

        // ttyd binary protocol (server → client: '0' OUTPUT,
        // '1' SET_WINDOW_TITLE, '2' SET_PREFERENCES)
        const MSG_OUTPUT    = 0x30; // '0' - terminal output
        const MSG_SET_TITLE = 0x31; // '1' - window title
        const MSG_SET_PREFS = 0x32; // '2' - JSON preferences
        const MSG_INPUT     = '0';  // client → server: input data
        const MSG_RESIZE    = '1';  // client → server: {columns, rows}

        let ws = null;
        let hasConnectedOnce = false;
        // Armed per connection: the page's initial size reaches ttyd via
        // the JSON handshake, which carries NO pixel fields, and ttyd drops
        // RESIZE messages that arrive before the process is spawned — so
        // the pty's pixel size (which tmux needs for sixel) only starts
        // flowing once we push one explicit resize after the process
        // provably exists. See the MSG_OUTPUT handler.
        let needsPixelResizeKick = false;
        const textEncoder = new TextEncoder();
        const textDecoder = new TextDecoder();

        // Fonts-ready boot gate: give the JetBrains Mono webfont up to 2s to
        // arrive before xterm measures cell metrics — measuring an OS fallback
        // first bakes wrong glyph metrics into the renderer until a refit.
        // Race-capped so a dead CDN can never hold the terminal hostage; the
        // loadingdone listener below repairs the late-arrival case.
        try {
            await Promise.race([
                document.fonts.load('15px "JetBrains Mono"'),
                new Promise(r => setTimeout(r, 2000))
            ]);
        } catch (e) { /* face unavailable → OS mono fallback, still functional */ }

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
            fontSize: 15,
            // Pin both weights to the vendored JetBrains Mono faces (400/700)
            // so browsers never synthesize a faux bold — or substitute a
            // different family for it — now that real webfonts are in play.
            fontWeight: '400',
            fontWeightBold: '700',
            theme: readTerminalTheme(),
            // Nudge foreground colors toward WCAG AA (4.5:1) against each
            // cell's background — VS Code's default. xterm excludes box/block
            // glyphs from the adjustment (TUI borders keep exact theme colors)
            // and holds \e[2m dim text to half-ratio, so dim stays visibly
            // dim while low-contrast pairs (e.g. dark-tuned ANSI colors on
            // the light ink theme) become readable.
            minimumContrastRatio: 4.5,
            // Unfocused terminal renders a hollow outline cursor instead of
            // a solid block — the standard "keystrokes go elsewhere" cue.
            cursorInactiveStyle: 'outline',
            // Mac leg of the plain-drag selection reclaim (mousedown
            // interceptor below term.open): the synthetic clones carry
            // altKey, and only this option makes xterm treat Option-clicks
            // as force-selection — without it they leak to the app as
            // Alt-clicks. Must be set in the constructor.
            macOptionClickForcesSelection: true,
            // Off: with it on (xterm default), a real Option-drag's RELEASE
            // moves the cursor via arrow-key spam into the app and clears
            // the just-made selection (reproduced on the Mac path). We never
            // want click-to-move-cursor in tmux/Claude panes.
            altClickMovesCursor: false,
            // tmux attaches on the ALTERNATE screen, so xterm's scrollback
            // holds nothing while attached: Shift+scroll/drag never reaches
            // history, selection is limited to the visible frame, and deep
            // history is tmux copy-mode's job. This buffer is inert under
            // tmux's alt screen — it only matters if alternate-screen were
            // ever disabled.
            scrollback: 10000,
            allowProposedApi: true
        });

        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(webLinksAddon);

        try {
            const webglAddon = new WebglAddon.WebglAddon();
            webglAddon.onContextLoss(() => { webglAddon.dispose(); });
            term.loadAddon(webglAddon);
        } catch (e) {
            console.warn('WebGL addon failed:', e);
        }

        // OSC 52 clipboard: lets tmux's own copy (with `set-clipboard on`) and
        // any program write straight to the OS clipboard. NOTE: this addon's
        // UMD build exposes the class as the global `ClipboardAddon` directly,
        // NOT `ClipboardAddon.ClipboardAddon` like fit/webgl — accept both
        // shapes. Wrapped so a load hiccup can't break the terminal.
        try {
            const ClipAddon = (typeof ClipboardAddon !== 'undefined')
                && (ClipboardAddon.ClipboardAddon || ClipboardAddon);
            if (ClipAddon) {
                // Custom provider instead of the addon's default, for two
                // verified reasons:
                //   - tmux 3.4 emits OSC 52 with an EMPTY selection field
                //     (\x1b]52;;<base64>), and the default provider drops any
                //     selection that isn't exactly 'c' — so tmux copy-mode
                //     copies never reached the browser clipboard. Accept ''
                //     and 'c'.
                //   - readText deliberately refuses: answering OSC 52 '?'
                //     queries would let any program running in the PTY read
                //     the user's clipboard.
                const osc52Provider = {
                    readText: () => Promise.resolve(''),
                    writeText: (selection, text) =>
                        selection === '' || selection === 'c'
                            ? navigator.clipboard.writeText(text)
                                  .then(() => showToast('Copied', 'success', 1500))
                                  .catch(() => {})
                            : Promise.resolve()
                };
                term.loadAddon(new ClipAddon(undefined, osc52Provider));
                console.log('clipboard addon (OSC 52) loaded');
            } else {
                console.warn('ClipboardAddon global not found');
            }
        } catch (e) {
            console.warn('Clipboard addon failed:', e);
        }

        // Inline images: renders sixel (and iTerm IIP) sequences on the
        // canvas — viu, img2sixel, matplotlib backends, anything that
        // emits sixel. Loading it also amends the terminal's DA1 response
        // so tmux and the apps inside it auto-detect sixel support, and
        // answers CSI 14t/16t pixel-size reports. Default options are
        // fine. Same UMD shape caveat as the clipboard addon — accept
        // both `ImageAddon` and `ImageAddon.ImageAddon`; wrapped so a
        // load hiccup can't break the terminal.
        try {
            const ImgAddon = (typeof ImageAddon !== 'undefined')
                && (ImageAddon.ImageAddon || ImageAddon);
            if (ImgAddon) {
                term.loadAddon(new ImgAddon());
                console.log('image addon (sixel) loaded');
            } else {
                console.warn('ImageAddon global not found');
            }
        } catch (e) {
            console.warn('Image addon failed:', e);
        }

        // Unicode 11 width tables: xterm's built-in tables are Unicode 6,
        // which counts most emoji as width 1 while tmux measures them as 2
        // — everything after an emoji then drifts one cell (misaligned
        // `├──` trees under Claude Code's emoji output). Version 11 matches
        // tmux's wcwidth. Activated before open() so the first frame is
        // already measured with the right tables. Same UMD shape caveat as
        // the clipboard addon — accept both `Unicode11Addon` and
        // `Unicode11Addon.Unicode11Addon`; wrapped so a load hiccup can't
        // break the terminal (falls back to the built-in version 6).
        try {
            const U11Addon = (typeof Unicode11Addon !== 'undefined')
                && (Unicode11Addon.Unicode11Addon || Unicode11Addon);
            if (U11Addon) {
                term.loadAddon(new U11Addon());
                term.unicode.activeVersion = '11';
                console.log('unicode11 addon loaded (active version ' + term.unicode.activeVersion + ')');
            } else {
                console.warn('Unicode11Addon global not found');
            }
        } catch (e) {
            console.warn('Unicode11 addon failed:', e);
        }

        fitAddon.fit();
        // Nothing else focuses the terminal on load — without this,
        // keystrokes on desktop are dead until the user clicks.
        term.focus();

        // below): refit and rebuild the WebGL glyph atlas so rendering uses
        // the real font, not whatever fallback got measured first.

            fitAddon.fit();
            term.clearTextureAtlas?.();

        // context-loss event, so onContextLoss never fires). Rebuild it on
