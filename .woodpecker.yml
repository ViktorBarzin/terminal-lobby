# Build + deploy terminal-lobby to the DevVM (192.0.2.10).
#
# Two stages:
#  1. build-binaries  — cross-compile the two Go services for linux/amd64.
#  2. deploy          — SSH to the DevVM and run scripts/deploy.sh, which
#                       installs the full artifact set + restarts services +
#                       smoke-tests. deploy.sh is the single source of truth so
#                       the install list cannot drift from the manual path.
#
# Secrets (Woodpecker repo-secrets, also mirrored in Vault for recovery):
#   - devvm_ssh_key  : ed25519 private key. Public is in
#                      wizard@192.0.2.10:~/.ssh/authorized_keys with the
#                      "woodpecker-terminal-lobby" comment. Mirror at
#                      secret/woodpecker/devvm_ssh_key.

when:
  event: [push, manual]
  branch: master

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      attempts: 5
      backoff: 10s

steps:
  - name: build-binaries
    image: golang:1.23-alpine
    commands:
      - apk add --no-cache git
      - mkdir -p out
      - (cd tmux-api          && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../out/tmux-api          .)
      - (cd clipboard-upload  && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../out/clipboard-upload  .)
      - ls -la out/

  - name: deploy
    image: alpine:3.20
    depends_on: [build-binaries]
    environment:
      DEVVM_SSH_KEY:
        from_secret: devvm_ssh_key
    commands:
      - apk add --no-cache openssh-client bash
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$DEVVM_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      # Pin host key. CI's known_hosts is ephemeral, so accept-new on first pull is safe enough.
      - ssh-keyscan -t ed25519 192.0.2.10 >> ~/.ssh/known_hosts 2>/dev/null
      # Single source of truth: deploy.sh installs the FULL artifact set
      # (binaries + index.html + manifest + icons + tmux-attach + tmux-user-attach
      # + units), restarts the services, and smoke-tests /whoami + /health.
      # Binaries were already built in build-binaries, so skip the rebuild.
      # Calling the script (vs an inline copy) is what stops the install list
      # from drifting — past drift silently dropped the mobile UI and the
      # session-persistence wrapper on deploy.
      - SKIP_BUILD=1 DEVVM=192.0.2.10 bash scripts/deploy.sh
