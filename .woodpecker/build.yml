# Starts this repo's GitHub workflows: each step asks the infra pipeline
# ci-route to pick GitHub's runners, or the homelab's when the private GitHub
# minutes are used up (infra
# docs/architecture/ci-cd.md, "Routing builds through Woodpecker").
# Each step keeps the push trigger its workflow had: generated by infra
# ci/route/migrate.py. A new workflow gets a step here, not an on.push.
when:
  - event: [push, tag]

skip_clone: true

steps:
  - name: container.yml
    # clipboard-upload replaces terminal-lobby/clipstore, the store's naming
    # and write rules it shares with agent-api.
    # session-events writes the spend store and tmux-api reads it, so a
    # change to either side has to rebuild the image.
    # skills-api replaces terminal-lobby/skillscan, tmux-api replaces
    # terminal-lobby/slug — both are bundled, so a fix there must rebuild.
    # tmux-api replaces terminal-lobby/t3client, which reads each user's T3
    # threads into the session list.
    image: ghcr.io/viktorbarzin/infra-ci:latest
    pull: true
    environment:
      WOODPECKER_TOKEN:
        from_secret: woodpecker_api_token
    commands:
      - ci-route --request container.yml
    when:
      - event: "push"
        branch: ["master"]
        path: {"include": ["Dockerfile", "docker/**", "frontend/**", "frontend-v2/**", "tmux-api/**", "file-api/**", "session-events/**", "skills-api/**", "clipboard-upload/**", "clipstore/**", "authuser/**", "sessionio/**", "spendstore/**", "skillscan/**", "slug/**", "t3client/**", "telemetry/**", "devvm/tmux-attach.sh", "devvm/tmux-user-attach", ".github/workflows/container.yml"]}

  - name: release.yml
    # Skipping paths that cannot change the artefact avoids releasing a version
    # for a typo fix. Anything that reaches this workflow is a code change and
    # gets a version, since the version step passes --always.
    # The container image is built by container.yml out of its own inputs,
    # and packaging/build-deb.sh reads none of them. A push touching only
    # these was cutting a .deb version whose contents had not moved.
    image: ghcr.io/viktorbarzin/infra-ci:latest
    pull: true
    environment:
      WOODPECKER_TOKEN:
        from_secret: woodpecker_api_token
    commands:
      - ci-route --request release.yml
    when:
      - event: "push"
        branch: ["master"]
        path: {"exclude": ["docs/**", "**/*.md", ".github/workflows/ttyd.yml", ".github/workflows/viu.yml", "Dockerfile", "docker/**", ".github/workflows/container.yml", "scripts/devserve/**"]}

  - name: ttyd.yml
    image: ghcr.io/viktorbarzin/infra-ci:latest
    pull: true
    environment:
      WOODPECKER_TOKEN:
        from_secret: woodpecker_api_token
    commands:
      - ci-route --request ttyd.yml
    when:
      - event: "push"
        branch: ["master"]
        path: {"include": ["devvm/ttyd-local.patch", "scripts/build-ttyd.sh", ".github/workflows/ttyd.yml"]}
