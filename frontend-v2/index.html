<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*); interactive-widget=
         resizes-content shrinks the layout viewport for the soft keyboard
         (Chromium) so bottom UI is not overlaid; no maximum-scale so native
         pinch-zoom stays available (red-line: pinch reaches the compositor). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark light" />
    <!-- The UPDATE IDENTITY (ADR-0007): a fingerprint of this frontend's own
         content, stamped by deploy-v2.sh. A running page compares it against the
         served one to decide whether a real update exists — which is why a
         backend-only deploy (same frontend bytes, new git SHA) is silent. Vite
         copies the head through verbatim, so the placeholder survives the build
         and the deploy script substitutes it. -->
    <meta name="tl-asset" content="__TL_ASSET__" />
    <!-- The TERMINAL page's fingerprint, stamped by deploy-v2.sh alongside this
         page's own. It lets the terminal iframe go straight to the immutable
         copy (/assets/term-<asset>.html, cached forever) with no request to
         discover the name: both files ship in the same deploy, so the stamp is
         correct by construction. Absent or unsubstituted -> /term.html. -->
    <meta name="tl-term-asset" content="__TL_TERM_ASSET__" />
    <!-- Client diagnostics (docs/adr/0008-client-diagnostics.md). The same
         frontend/diag.js the two vanilla surfaces inline, substituted by
         deploy-v2.sh into the built page — one measurement core across all
         three, so the quiet-gate state machine cannot drift between them. It
         sits in <head> so its global error handlers and its fetch and
         WebSocket wrappers are installed before the SPA boots. Defining
         tlDiag has no side effects; src/telemetry/diag.ts calls bind(). -->
    <script>
      __TL_DIAG__
    </script>
    <!-- PWA install metadata (inventory Cat.9). display:standalone lives in the
         manifest; these metas + icons make the lobby installable and give iOS its
         Home-Screen identity. status-bar-style='default' (opaque, app laid out
         BELOW the bar) NOT 'black-translucent' — translucent would draw terminal
         scrollback under the clock. iOS BAKES these at Add-to-Home-Screen time, so
         an existing install must be removed + re-added to pick up a change. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terminal" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Webfont preload, as the vanilla page does: the two faces the chrome
         actually paints first (mono Regular/Bold). @font-face itself lives in
         the theme token layer (src/theme/theme.css). crossorigin is mandatory
         even same-origin — font fetches are always CORS-anonymous, and a
         mismatch double-downloads. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/JetBrainsMono-Regular.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/JetBrainsMono-Bold.woff2"
    />
    <!-- Tab icon; the attention system swaps this href to a canvas-rendered
         data: URL (icon + a state-colored dot/tick) while a session awaits input
         or finishes, and restores it on clear (src/notify/favicon.ts). Served as
         a separate static asset from public/ (never inlined into the singlefile
         bundle). -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>terminal-lobby</title>
    <script>
      /* Seed --app-vh before first paint: the phone layout pins the shell to it,
         and a first frame computed against a CSS viewport unit would be the
         wrong height in an iOS standalone PWA (vh/svh/dvh resolve to the LARGE
         viewport there). mobile/viewport.ts keeps it current afterwards. */
      try {
        document.documentElement.style.setProperty(
          "--app-vh", window.innerHeight + "px");
      } catch (e) { /* pre-paint seed is best-effort */ }
    </script>
    <style>
      /* The shell paints before any chunk arrives, so its CSS is inline. Values
         come from the same theme variables the pre-paint script sets, with hard
         fallbacks for the first frame of a first-ever visit. */
      #tl-shell {
        position: fixed;
        inset: 0;
        display: flex;
        background: var(--bg-page, #0d1117);
        pointer-events: none;
      }
      #tl-shell .tl-shell-sidebar {
        width: 260px;
        max-width: 38vw;
        padding: 14px 10px;
        border-right: 1px solid var(--border, #21262d);
        background: var(--bg-sidebar, #131a22);
      }
      #tl-shell .tl-shell-main { flex: 1; padding: 14px 16px; }
      #tl-shell .tl-shell-head,
      #tl-shell .tl-shell-row,
      #tl-shell .tl-shell-bar {
        border-radius: 8px;
        background: var(--bg-card, #1b2430);
        opacity: 0.55;
      }
      #tl-shell .tl-shell-head { height: 26px; margin-bottom: 16px; }
      #tl-shell .tl-shell-row { height: 40px; margin-bottom: 10px; }
      #tl-shell .tl-shell-bar { height: 34px; }
      @media (max-width: 640px) {
        #tl-shell .tl-shell-sidebar { width: 100%; max-width: none; }
        #tl-shell .tl-shell-main { display: none; }
      }
    </style>
  </head>
  <body>
    <script>
      /* Pre-paint theme boot — ported verbatim (logic) from the vanilla
         frontend/index.html. Runs as body's FIRST child so the very first frame
         already carries the right palette and the browser-chrome color
         (<meta name=theme-color>) is in sync. It cannot live in <head>: every
         theme selector is body.theme-* and document.body does not exist during
         <head> parsing. 'system' follows the OS scheme as t3-dark/t3-light. The
         main app (src/theme/theme.ts) reuses these globals. */
      (function () {
        var FALLBACK = "slate";
        window.__tlThemes = [
          "carbon", "slate", "mono", "ink", "t3-dark",
          "t3-light", "catppuccin-mocha", "catppuccin-latte", "system",
        ];
        window.__tlApplyTheme = function (t) {
          if (window.__tlThemes.indexOf(t) === -1) t = FALLBACK;
          if (t === "system") {
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "t3-dark"
              : "t3-light";
          }
          var b = document.body;
          Array.prototype.slice.call(b.classList).forEach(function (c) {
            if (c.indexOf("theme-") === 0) b.classList.remove(c);
          });
          b.classList.add("theme-" + t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.content =
              getComputedStyle(b).getPropertyValue("--bg-page").trim() ||
              "#0d1117";
          }
        };
        function stored() {
          try {
            return localStorage.getItem("tmux-theme");
          } catch (e) {
            return null;
          }
        }
        window.__tlApplyTheme(stored() || FALLBACK);
        try {
          matchMedia("(prefers-color-scheme: dark)").addEventListener(
            "change",
            function () {
              if (stored() !== "system") return;
              window.__tlApplyTheme("system");
              if (typeof window.__tlThemeLive === "function") {
                window.__tlThemeLive("system");
              }
            }
          );
        } catch (e) {
          /* no matchMedia listener — auto-follow stays off */
        }
      })();
    </script>
    <!-- FIRST PAINT, before a byte of application code.
         The app used to be one 4.7 MB document whose only mount point sat at
         byte 4,740,657 — 99.92% in — so first paint landed 0.07 s AFTER the last
         byte: 24.5 s of blank page under throttling. The bundle is split now, but
         a shell still matters, because first paint should cost one packet rather
         than one 158 KB chunk. The skeleton mirrors the real chrome (sidebar
         frame, header bar) so the app replacing it is a fill-in rather than a
         jump, and it is REMOVED by the app on mount, not merely covered. Themed
         via the same body.theme-* variables the script above just applied, so it
         is never the wrong palette. -->
    <div id="tl-shell" aria-hidden="true">
      <div class="tl-shell-sidebar">
        <div class="tl-shell-head"></div>
        <div class="tl-shell-row"></div>
        <div class="tl-shell-row"></div>
        <div class="tl-shell-row"></div>
      </div>
      <div class="tl-shell-main">
        <div class="tl-shell-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
