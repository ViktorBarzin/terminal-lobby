# The ceiling on ONE session browser (ADR-0035), installed as
# /usr/lib/systemd/user/tl-browser-.scope.d/60-tl-browser-cap.conf so it
# applies to every scope tl-browser starts (tl-browser-<session>-<pid>.scope).
#
# tl-browser already asks for these values on the systemd-run command line.
# They are repeated here because on the devvm that request does not survive:
# /etc/systemd/user/scope.d/50-devvm-pane-cap.conf sets MemoryMax=6G on every
# user scope, and a drop-in outranks a transient unit's own properties. Drop-ins
# apply in filename order across every directory that holds one, so this file
# is named 60- to come after the pane cap. Measured 2026-10-01: without it, a
# browser scope came up with memory.max at 6G instead of 1.5G.
#
# MemoryHigh makes the kernel reclaim the browser's own pages first; MemoryMax
# is where it OOM-kills inside this scope. The pane cap's OOMPolicy=continue
# still applies, so a killed renderer does not take the host down with it.
#
# The values must match tl-browser/spawn.go; release/browser_test.go checks.
[Scope]
MemoryHigh=1G
MemoryMax=1536M
